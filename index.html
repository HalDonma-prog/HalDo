<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalDo AI OS</title>
    <style>
        /* Basis-Design für alle Geräte */
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* Das Cosmisches Interface (Fenster & Module) */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .module { 
            pointer-events: auto; 
            background: rgba(10, 25, 50, 0.7); 
            border: 1px solid #00aaff; 
            border-radius: 15px; 
            padding: 15px; 
            box-shadow: 0 0 30px rgba(0,170,255,0.4); 
            margin: 10px; 
            backdrop-filter: blur(10px);
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Initiale Positionen der Module */
        #chat-mod { position: absolute; bottom: 20px; left: 20px; width: 320px; }
        #data-mod { position: absolute; top: 20px; left: 20px; }
        #system-mod { position: absolute; top: 20px; right: 20px; }
        #apps-mod { position: absolute; bottom: 20px; right: 20px; }
        #upload-mod { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }

        h3 { margin-top: 0; color: #00aaff; font-size: 16px; }
        p { font-size: 14px; line-height: 1.5; }
        button { background: #00aaff; border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; }
        input { width: 90%; padding: 10px; background: #111; border: 1px solid #00aaff; border-radius: 5px; color: white; margin: 5px 0; }
        
        /* Navigation für mobile Geräte */
        #nav-bar { position: fixed; bottom: 0; width: 100%; z-index: 20; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #00aaff; }
        .nav-btn { background: transparent; width: auto; font-size: 14px; color: #fff; }

        @media (max-width: 768px) {
            .module { width: calc(100% - 40px); }
            #chat-mod { bottom: 80px; }
            #system-mod, #data-mod { top: 10px; width: calc(50% - 30px); }
        }
    </style>
</head>
<body>

<canvas id="universe"></canvas>

<div id="ui-layer">
    <div id="chat-mod" class="module">
        <h3>💬 HalDo AI Chat</h3>
        <p id="chat-output">Willkommen Bruder!</p>
        <input id="chat-input" placeholder="Sag was..." onkeydown="if(event.key==='Enter') sendMsg()">
    </div>

    <div id="data-mod" class="module">
        <h3>🗂️ Daten</h3>
        <button onclick="alert('Dokumente werden geladen...')">📁 Dokumente</button>
        <button onclick="alert('Musik wird gestartet...')">🎵 Musik</button>
    </div>

    <div id="system-mod" class="module">
        <h3>⚙️ System Update</h3>
        <p>Version 6.0</p>
        <button onclick="alert('Suche nach Updates...')">🔄 Update</button>
    </div>

    <div id="apps-mod" class="module">
        <h3>📲 Apps</h3>
        <button onclick="toggleModule('upload-mod')">⬆️ Upload</button>
        <button onclick="alert('Datei-Explorer geöffnet')">📂 Dateien</button>
    </div>

    <div id="upload-mod" class="module">
        <h3>⬆️ Uploads</h3>
        <input type="file">
        <button>Hochladen</button>
    </div>
</div>

<!-- Navigation -->
<div id="nav-bar">
    <button class="nav-btn" onclick="toggleModule('chat-mod')">💬 Chat</button>
    <button class="nav-btn" onclick="toggleModule('data-mod')">🗂️ Daten</button>
    <button class="nav-btn" onclick="toggleModule('system-mod')">⚙️ System</button>
    <button class="nav-btn" onclick="toggleModule('apps-mod')">📲 Apps</button>
</div>

<script>
    // Fenster & Module Verwaltung
    function toggleModule(id) {
        var el = document.getElementById(id);
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }

    // Sprache & Mikrofon
    function sendMsg() {
        var input = document.getElementById('chat-input').value;
        if (!input) return;
        var output = document.getElementById('chat-output');
        output.innerHTML += "<br><b>Bruder:</b> " + input;
        input = "";
        setTimeout(() => { output.innerHTML += "<br><b>HalDo:</b> Befehl erhalten!"; }, 1000);
    }
    
    function startSpeaker() {
        var u = new SpeechSynthesisUtterance('System bereit.');
        u.lang = 'de-DE';
        speechSynthesis.speak(u);
    }

    // Das Universum
    const canvas = document.getElementById('universe');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let planets = [];
    
    function initUniverse() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;

        stars = [];
        for (let i = 0; i < 500; i++) {
            stars.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2, a: Math.random() });
        }

        planets = [
            { r: 30, size: 6, color: "#b0b0b0", speed: 0.002, offset: 0 },
            { r: 55, size: 10, color: "#FFD700", speed: 0.0018, offset: 1.5 },
            { r: 80, size: 12, color: "#4B90C2", speed: 0.0015, offset: 2.8 },
            { r: 110, size: 9, color: "#C1440E", speed: 0.0013, offset: 4.0 },
            { r: 150, size: 25, color: "#D8CA9D", speed: 0.001, offset: 5.2 },
            { r: 190, size: 22, color: "#EEDC82", speed: 0.0008, offset: 6.4, ring: true },
            { r: 230, size: 14, color: "#00FFFF", speed: 0.0007, offset: 7.6 },
            { r: 270, size: 14, color: "#4169E1", speed: 0.0006, offset: 8.8 },
            { r: 310, size: 5, color: "#F5F5DC", speed: 0.0005, offset: 10.0 },
            { r: 350, size: 5, color: "#8A2BE2", speed: 0.0004, offset: 11.2 }
        ];
    }

    function draw() {
        ctx.fillStyle = '#020208';
        ctx.fillRect(0, 0, width, height);

        // Sterne
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${s.a})`;
            ctx.fill();
        });

        // Sonne (Pulsierend)
        let sunX = width / 2, sunY = height / 2;
        let time = Date.now() * 0.002;
        let pulse = 1 + Math.sin(time) * 0.1;
        
        let grad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 150 * pulse);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.4, '#ffaa00');
        grad.addColorStop(1, '#ff3300');
        ctx.beginPath();
        ctx.arc(sunX, sunY, 100 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Planeten (bewegen sich langsam)
        planets.forEach(p => {
            let angle = time * p.speed + p.offset;
            let x = sunX + Math.cos(angle) * p.r * 3.5;
            let y = sunY + Math.sin(angle) * p.r * 1.5;
            
            // Orbit Linie
            ctx.beginPath();
            ctx.ellipse(sunX, sunY, p.r * 3.5, p.r * 1.5, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,170,255,0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        requestAnimationFrame(draw);
    }

    initUniverse();
    draw();

    window.addEventListener('resize', initUniverse);
</script>
</body>
</html>
