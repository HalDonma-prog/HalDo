                document.getElementById(
                    "haldo-cyborg"
                ) ||
                document.querySelector(
                    ".haldo-cyborg"
                );

            if (!cyborg) {
                return;
            }

            cyborg.dataset.aiState =
                living.state;

            living.presence.bindGestures(
                cyborg
            );
        };

    living.presence.bindGestures =
        function bindGestures(
            cyborg
        ) {

            const gestureTargets =
                cyborg.querySelectorAll(
                    "[data-cyborg-gesture]"
                );

            gestureTargets.forEach(
                target => {

                    target.addEventListener(
                        "click",
                        () => {

                            const gesture =
                                target.dataset
                                    .cyborgGesture;

                            HD.events?.emit(
                                "living-ai:gesture",
                                {
                                    gesture
                                }
                            );
                        }
                    );
                }
            );
        };

    /* ============================================================
       AI PRESENCE ANIMATION ENGINE
       ============================================================ */

    living.animation =
        living.animation || {};

    living.animation.frame =
        null;

    living.animation.time =
        0;

    living.animation.start =
        function startAnimation() {

            if (
                living.animation.frame
            ) {
                return;
            }

            const reduced =
                HD.utils?.isReducedMotion?.();

            if (reduced) {
                return;
            }

            const tick =
                timestamp => {

                    living.animation.time =
                        timestamp;

                    living.animation.update(
                        timestamp
                    );

                    living.animation.frame =
                        requestAnimationFrame(
                            tick
                        );
                };

            living.animation.frame =
                requestAnimationFrame(
                    tick
                );
        };

    living.animation.update =
        function updateAnimation(
            timestamp
        ) {

            const cyborg =
                document.getElementById(
                    "haldo-cyborg"
                ) ||
                document.querySelector(
                    ".haldo-cyborg"
                );

            if (!cyborg) {
                return;
            }

            const t =
                timestamp / 1000;

            const breathing =
                Math.sin(t * 1.7) * 0.8;

            const body =
                cyborg.querySelector(
                    ".cyborg-body"
                ) ||
                cyborg.querySelector(
                    "[data-cyborg-body]"
                );

            if (body) {

                body.style.setProperty(
                    "--haldo-breath",
                    `${breathing}px`
                );
            }

            const head =
                cyborg.querySelector(
                    ".cyborg-head"
                ) ||
                cyborg.querySelector(
                    "[data-cyborg-head]"
                );

            if (head) {

                const headMove =
                    Math.sin(t * 0.8) * 1.5;

                head.style.transform =
                    `translateY(${headMove}px)`;
            }

            const eyes =
                cyborg.querySelectorAll(
                    ".cyborg-eye"
                );

            eyes.forEach(
                (eye, index) => {

                    const eyeMove =
                        Math.sin(
                            t * 0.65 +
                            index * 0.2
                        ) * 1.2;

                    eye.style.transform =
                        `translateY(${eyeMove}px)`;
                }
            );

            const leftArm =
                cyborg.querySelector(
                    ".cyborg-arm-left"
                );

            const rightArm =
                cyborg.querySelector(
                    ".cyborg-arm-right"
                );

            if (
                living.state === "speaking" ||
                living.state === "answering"
            ) {

                if (leftArm) {
                    leftArm.style.transform =
                        `rotate(${
                            Math.sin(t * 3) * 4
                        }deg)`;
                }

                if (rightArm) {
                    rightArm.style.transform =
                        `rotate(${
                            Math.cos(t * 2.7) * 5
                        }deg)`;
                }
            }

            if (
                living.state === "thinking"
            ) {

                if (head) {
                    head.style.transform =
                        `translateY(${
                            Math.sin(t * 1.2) * 2
                        }px)
                         rotate(${
                            Math.sin(t * .7) * 2
                         }deg)`;
                }
            }
        };

    /* ============================================================
       INITIALIZE LIVING PRESENCE
       ============================================================ */

    living.presence.init();

    living.animation.start();

    /* ============================================================
       GLOBAL WINDOW API
       ============================================================ */

    window.HalDoWindowManager =
        windows;

    window.HalDoLivingAI =
        living;

    if (window.HalDoOS) {

        window.HalDoOS.windows =
            windows;

        window.HalDoOS.livingAI =
            living;
    }

    HD.events?.emit(
        "window-system:ready",
        {
            windows
        }
    );

    HD.events?.emit(
        "living-ai:ready",
        {
            living
        }
    );

    console.info(
        "[HalDo AI OS] Window System + Living AI foundation ready."
    );

})();
</script>
    </script>
</body>
</html>
<script>
(() => {
    "use strict";

    const HD =
        window.HalDo ||
        window.HalDoOS?.shell;

    if (!HD) {
        console.error(
            "[HalDo AI OS] HalDo core namespace missing."
        );
        return;
    }

    /* ============================================================
       HALDO AI COMMUNICATION CORE
       Chat + Voice + Microphone + Speaker
       ============================================================ */

    HD.ai = HD.ai || {};
    HD.voice = HD.voice || {};
    HD.speech = HD.speech || {};

    const AI = HD.ai;
    const Voice = HD.voice;
    const Speech = HD.speech;

    AI.config = AI.config || {
        language: "de-DE",
        voiceEnabled: true,
        microphoneEnabled: true,
        autoSpeak: true,
        continuousListening: false
    };

    AI.conversation = AI.conversation || {
        id:
            HD.utils?.uid?.("conversation") ||
            `conversation-${Date.now()}`,

        messages: [],

        startedAt: Date.now(),

        updatedAt: Date.now()
    };

    /* ============================================================
       VOICE OUTPUT
       ============================================================ */

    Voice.state =
        Voice.state || "idle";

    Voice.enabled =
        AI.config.voiceEnabled !== false;

    Voice.currentUtterance =
        null;

    Voice.speak =
        function speak(
            text,
            options = {}
        ) {

            if (
                !Voice.enabled ||
                typeof window.speechSynthesis ===
                    "undefined"
            ) {
                return false;
            }

            const cleanText =
                String(text || "").trim();

            if (!cleanText) {
                return false;
            }

            try {

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(
                        cleanText
                    );

                utterance.lang =
                    options.language ||
                    AI.config.language ||
                    "de-DE";

                utterance.rate =
                    Number.isFinite(
                        options.rate
                    )
                        ? options.rate
                        : 1;

                utterance.pitch =
                    Number.isFinite(
                        options.pitch
                    )
                        ? options.pitch
                        : 1;

                utterance.volume =
                    Number.isFinite(
                        options.volume
                    )
                        ? options.volume
                        : 1;

                const voices =
                    window.speechSynthesis
                        .getVoices();

                if (options.voiceName) {

                    const selected =
                        voices.find(
                            voice =>
                                voice.name ===
                                options.voiceName
                        );

                    if (selected) {
                        utterance.voice =
                            selected;
                    }
                }

                utterance.onstart =
                    () => {

                        Voice.state =
                            "speaking";

                        HD.livingAI?.setState?.(
                            "speaking"
                        );

                        HD.events?.emit(
                            "voice:start",
                            {
                                text:
                                    cleanText
                            }
                        );
                    };

                utterance.onend =
                    () => {

                        Voice.state =
                            "idle";

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        HD.events?.emit(
                            "voice:end",
                            {
                                text:
                                    cleanText
                            }
                        );
                    };

                utterance.onerror =
                    event => {

                        Voice.state =
                            "error";

                        HD.events?.emit(
                            "voice:error",
                            event
                        );

                        setTimeout(
                            () => {
                                Voice.state =
                                    "idle";
                            },
                            500
                        );
                    };

                Voice.currentUtterance =
                    utterance;

                window.speechSynthesis
                    .speak(utterance);

                return true;

            } catch (error) {

                console.error(
                    "[HalDo AI] Speech output failed.",
                    error
                );

                HD.events?.emit(
                    "voice:error",
                    error
                );

                return false;
            }
        };

    Voice.stop =
        function stop() {

            if (
                typeof window.speechSynthesis !==
                "undefined"
            ) {
                window.speechSynthesis.cancel();
            }

            Voice.currentUtterance =
                null;

            Voice.state =
                "idle";

            HD.livingAI?.setState?.(
                "idle"
            );

            HD.events?.emit(
                "voice:stopped"
            );
        };

    Voice.pause =
        function pause() {

            if (
                typeof window.speechSynthesis !==
                "undefined"
            ) {
                window.speechSynthesis.pause();
            }
        };

    Voice.resume =
        function resume() {

            if (
                typeof window.speechSynthesis !==
                "undefined"
            ) {
                window.speechSynthesis.resume();
            }
        };

    Voice.getVoices =
        function getVoices() {

            if (
                typeof window.speechSynthesis ===
                    "undefined"
            ) {
                return [];
            }

            return window.speechSynthesis
                .getVoices();
        };

    Voice.test =
        function test() {

            Voice.speak(
                "Hallo. Hier ist HalDo AI. Die Sprachausgabe funktioniert."
            );
        };

    if (
        typeof window.speechSynthesis !==
        "undefined"
    ) {

        window.speechSynthesis
            .addEventListener(
                "voiceschanged",
                () => {

                    HD.events?.emit(
                        "voice:voices-changed",
                        Voice.getVoices()
                    );
                }
            );
    }

    /* ============================================================
       MICROPHONE / SPEECH RECOGNITION
       ============================================================ */

    Speech.supported =
        Boolean(
            window.SpeechRecognition ||
            window.webkitSpeechRecognition
        );

    Speech.state =
        "idle";

    Speech.recognition =
        null;

    Speech.interim =
        "";

    Speech.finalText =
        "";

    Speech.init =
        function initSpeech() {

            if (!Speech.supported) {

                Speech.state =
                    "unsupported";

                HD.events?.emit(
                    "speech:unsupported"
                );

                return false;
            }

            const Recognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            const recognition =
                new Recognition();

            recognition.lang =
                AI.config.language ||
                "de-DE";

            recognition.continuous =
                Boolean(
                    AI.config.continuousListening
                );

            recognition.interimResults =
                true;

            recognition.maxAlternatives =
                3;

            recognition.onstart =
                () => {

                    Speech.state =
                        "listening";

                    HD.livingAI?.listen?.();

                    HD.events?.emit(
                        "speech:start"
                    );
                };

            recognition.onresult =
                event => {

                    let interim =
                        "";

                    let finalText =
                        "";

                    for (
                        let i =
                            event.resultIndex;
                        i <
                            event.results.length;
                        i++
                    ) {

                        const result =
                            event.results[i];

                        const transcript =
                            result[0]
                                ?.transcript ||
                            "";

                        if (
                            result.isFinal
                        ) {

                            finalText +=
                                transcript;

                        } else {

                            interim +=
                                transcript;
                        }
                    }

                    Speech.interim =
                        interim;

                    if (finalText) {

                        Speech.finalText =
                            finalText.trim();

                        HD.events?.emit(
                            "speech:final",
                            {
                                text:
                                    Speech.finalText
                            }
                        );
                    }

                    HD.events?.emit(
                        "speech:interim",
                        {
                            text:
                                interim
                        }
                    );
                };

            recognition.onerror =
                event => {

                    Speech.state =
                        "error";

                    HD.events?.emit(
                        "speech:error",
                        event
                    );

                    setTimeout(
                        () => {

                            if (
                                Speech.state ===
                                "error"
                            ) {
                                Speech.state =
                                    "idle";
                            }

                        },
                        500
                    );
                };

            recognition.onend =
                () => {

                    Speech.state =
                        "idle";

                    HD.events?.emit(
                        "speech:end"
                    );

                    if (
                        AI.config
                            .continuousListening &&
                        Speech.shouldContinue
                    ) {

                        setTimeout(
                            () => {

                                Speech.start();

                            },
                            250
                        );
                    }
                };

            Speech.recognition =
                recognition;

            return true;
        };

    Speech.shouldContinue =
        false;

    Speech.start =
        function startSpeech() {

            if (!Speech.supported) {

                Speech.state =
                    "unsupported";

                HD.livingAI?.setState?.(
                    "concerned"
                );

                return false;
            }

            if (!Speech.recognition) {

                Speech.init();
            }

            if (
                !Speech.recognition
            ) {
                return false;
            }

            try {

                Speech.shouldContinue =
                    Boolean(
                        AI.config
                            .continuousListening
                    );

                Speech.recognition.start();

                return true;

            } catch (error) {

                /*
                 * Browsers throw when start()
                 * is called while recognition
                 * is already active.
                 */

                Speech.state =
                    "listening";

                return true;
            }
        };

    Speech.stop =
        function stopSpeech() {

            Speech.shouldContinue =
                false;

            if (
                Speech.recognition
            ) {

                try {

                    Speech.recognition.stop();

                } catch (_) {
                    /* already stopped */
                }
            }

            Speech.state =
                "idle";

            HD.livingAI?.setState?.(
                "idle"
            );
        };

    Speech.toggle =
        function toggleSpeech() {

            if (
                Speech.state ===
                "listening"
            ) {

                Speech.stop();

                return false;
            }

            Speech.start();

            return true;
        };

    Speech.clear =
        function clearSpeech() {

            Speech.interim =
                "";

            Speech.finalText =
                "";
        };

    Speech.init();

    /* ============================================================
       CHAT ENGINE
       ============================================================ */

    AI.chat =
        AI.chat || {};

    AI.chat.isOpen =
        false;

    AI.chat.windowId =
        "haldo-ai-chat-window";

    AI.chat.open =
        function openChat() {

            let existing =
                HD.windows?.get?.(
                    AI.chat.windowId
                );

            if (existing) {

                HD.windows.restore(
                    AI.chat.windowId
                );

                HD.windows.focus(
                    AI.chat.windowId
                );

                AI.chat.isOpen =
                    true;

                return existing;
            }

            const content = `
                <div class="haldo-ai-chat">

                    <div
                        class="haldo-ai-chat-presence"
                        data-chat-presence
                    >

                        <div
                            class="haldo-ai-chat-avatar"
                            aria-hidden="true"
                        >
                            <img
                                src="logo.png"
                                alt=""
                            >
                        </div>

                        <div
                            class="haldo-ai-chat-status"
                        >
                            <strong>
                                HalDo AI
                            </strong>

                            <span
                                data-chat-status
                            >
                                Bereit
                            </span>
                        </div>

                    </div>

                    <div
                        class="haldo-ai-chat-messages"
                        data-chat-messages
                        aria-live="polite"
                    ></div>

                    <form
                        class="haldo-ai-chat-input-row"
                        data-chat-form
                    >

                        <button
                            type="button"
                            class="haldo-chat-icon-button"
                            data-chat-mic
                            aria-label="Mikrofon"
                            title="Mikrofon"
                        >
                            🎙
                        </button>

                        <textarea
                            data-chat-input
                            rows="1"
                            placeholder="Sprich oder schreibe mit HalDo AI …"
                            aria-label="Nachricht an HalDo AI"
                        ></textarea>

                        <button
                            type="button"
                            class="haldo-chat-icon-button"
                            data-chat-speak
                            aria-label="Sprachausgabe"
                            title="Sprachausgabe"
                        >
                            🔊
                        </button>

                        <button
                            type="submit"
                            class="haldo-chat-send-button"
                            aria-label="Senden"
                        >
                            ➤
                        </button>

                    </form>

                </div>
            `;

            const record =
                HD.windows.create({
                    id:
                        AI.chat.windowId,

                    title:
                        "HalDo AI",

                    icon:
                        "logo.png",

                    width:
                        Math.min(
                            780,
                            window.innerWidth - 30
                        ),

                    height:
                        Math.min(
                            650,
                            window.innerHeight - 100
                        ),

                    minWidth:
                        320,

                    minHeight:
                        360,

                    content
                });

            if (!record) {
                return null;
            }

            AI.chat.isOpen =
                true;

            AI.chat.bind(
                record
            );

            AI.chat.renderHistory(
                record
            );

            HD.livingAI?.setState?.(
                "happy"
            );

            HD.events?.emit(
                "ai-chat:opened",
                record
            );

            return record;
        };

    AI.chat.close =
        function closeChat() {

            if (HD.windows) {

                HD.windows.close(
                    AI.chat.windowId
                );
            }

            AI.chat.isOpen =
                false;

            HD.events?.emit(
                "ai-chat:closed"
            );
        };

    AI.chat.bind =
        function bindChat(
            record
        ) {

            const content =
                record.contentElement;

            const form =
                content.querySelector(
                    "[data-chat-form]"
                );

            const input =
                content.querySelector(
                    "[data-chat-input]"
                );

            const mic =
                content.querySelector(
                    "[data-chat-mic]"
                );

            const speak =
                content.querySelector(
                    "[data-chat-speak]"
                );

            if (form) {

                form.addEventListener(
                    "submit",
                    event => {

                        event.preventDefault();

                        const text =
                            input?.value
                                ?.trim() ||
                            "";

                        if (!text) {
                            return;
                        }

                        input.value =
                            "";

                        AI.chat.send(
                            text,
                            record
                        );
                    }
                );
            }

            if (input) {

                input.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                                "Enter" &&
                            !event.shiftKey
                        ) {

                            event.preventDefault();

                            form?.requestSubmit();
                        }
                    }
                );
            }

            if (mic) {

                mic.addEventListener(
                    "click",
                    () => {

                        Speech.toggle();

                        mic.classList.toggle(
                            "is-active",
                            Speech.state ===
                                "listening"
                        );
                    }
                );
            }

            if (speak) {

                speak.addEventListener(
                    "click",
                    () => {

                        const last =
                            AI.conversation
                                .messages
                                .filter(
                                    message =>
                                        message.role ===
                                        "assistant"
                                )
                                .at(-1);

                        if (last?.content) {

                            Voice.speak(
                                last.content
                            );
                        }
                    }
                );
            }

            HD.events?.on?.(
                "speech:final",
                payload => {

                    if (
                        !payload?.text
                    ) {
                        return;
                    }

                    if (input) {

                        input.value =
                            payload.text;

                        form?.requestSubmit();
                    }
                }
            );

            HD.events?.on?.(
                "voice:start",
                () => {

                    const status =
                        content.querySelector(
                            "[data-chat-status]"
                        );

                    if (status) {
                        status.textContent =
                            "HalDo spricht …";
                    }
                }
            );

            HD.events?.on?.(
                "voice:end",
                () => {

                    const status =
                        content.querySelector(
                            "[data-chat-status]"
                        );

                    if (status) {
                        status.textContent =
                            "Bereit";
                    }
                }
            );

            HD.events?.on?.(
                "living-ai:state",
                payload => {

                    const status =
                        content.querySelector(
                            "[data-chat-status]"
                        );

                    if (!status) {
                        return;
                    }

                    const labels = {
                        idle:
                            "Bereit",

                        listening:
                            "Ich höre zu …",

                        thinking:
                            "Ich denke nach …",

                        speaking:
                            "Ich spreche …",

                        answering:
                            "Ich antworte …",

                        writing:
                            "Ich schreibe …",

                        reading:
                            "Ich lese …",

                        opening:
                            "Ich öffne …",

                        working:
                            "Ich arbeite …",

                        happy:
                            "Bereit",

                        concerned:
                            "Ich prüfe das …"
                    };

                    status.textContent =
                        labels[
                            payload?.state
                        ] ||
                        "Bereit";
                }
            );
        };

    /* ============================================================
       CHAT MESSAGE STORAGE / RENDERING
       ============================================================ */

    AI.chat.addMessage =
        function addMessage(
            role,
            content,
            meta = {}
        ) {

            const message = {
                id:
                    HD.utils?.uid?.(
                        "message"
                    ) ||
                    `message-${Date.now()}-${Math.random()
                        .toString(36)
                        .slice(2)}`,

                role,

                content:
                    String(
                        content || ""
                    ),

                timestamp:
                    Date.now(),

                ...meta
            };

            AI.conversation
                .messages
                .push(message);

            AI.conversation.updatedAt =
                Date.now();

            AI.chat.persist();

            HD.events?.emit(
                "ai-chat:message",
                message
            );

            return message;
        };

    AI.chat.persist =
        function persistChat() {

            try {

                HD.storage?.set?.(
                    "conversation",
                    AI.conversation
                );

            } catch (error) {

                console.warn(
                    "[HalDo AI] Conversation persistence failed.",
                    error
                );
            }
        };

    AI.chat.restore =
        function restoreChat() {

            try {

                const stored =
                    HD.storage?.get?.(
                        "conversation"
                    );

                if (
                    stored &&
                    Array.isArray(
                        stored.messages
                    )
                ) {

                    AI.conversation =
                        stored;
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Conversation restore failed.",
                    error
                );
            }
        };

    AI.chat.restore();

    AI.chat.renderHistory =
        function renderHistory(
            record
        ) {

            const container =
                record?.contentElement
                    ?.querySelector(
                        "[data-chat-messages]"
                    );

            if (!container) {
                return;
            }

            container.innerHTML =
                "";

            for (
                const message of
                    AI.conversation.messages
            ) {

                AI.chat.renderMessage(
                    message,
                    container
                );
            }

            container.scrollTop =
                container.scrollHeight;
        };

    AI.chat.renderMessage =
        function renderMessage(
            message,
            container
        ) {

            if (
                !message ||
                !container
            ) {
                return;
            }

            const article =
                document.createElement(
                    "article"
                );

            article.className =
                `haldo-chat-message message-${message.role}`;

            const label =
                message.role ===
                "user"
                    ? "Du"
                    : "HalDo AI";

            article.innerHTML = `
                <div class="haldo-chat-message-label">
                    ${HD.utils?.escapeHTML
                        ? HD.utils.escapeHTML(label)
                        : label}
                </div>

                <div class="haldo-chat-message-body">
                    ${
                        HD.utils?.escapeHTML
                            ? HD.utils.escapeHTML(
                                message.content
                              )
                            : message.content
                    }
                </div>
            `;

            container.appendChild(
                article
            );

            container.scrollTop =
                container.scrollHeight;
        };

    /* ============================================================
       BASIC LOCAL AI RESPONSE ROUTER
       ============================================================ */

    AI.chat.generateResponse =
        async function generateResponse(
            text
        ) {

            const normalized =
                String(text || "")
                    .trim()
                    .toLowerCase();

            if (!normalized) {
                return "";
            }

            if (
                /^(hallo|hi|hey|guten morgen|guten tag|guten abend)/
                    .test(normalized)
            ) {

                return (
                    "Hallo! Ich bin HalDo AI. " +
                    "Ich bin bereit, dir zu helfen."
                );
            }

            if (
                normalized.includes(
                    "wer bist du"
                )
            ) {

                return (
                    "Ich bin HalDo AI, die " +
                    "intelligente Assistenzebene " +
                    "von HalDo AI OS."
                );
            }

            if (
                normalized.includes(
                    "zeit"
                )
            ) {

                return (
                    `Aktuell ist es ${new Date()
                        .toLocaleTimeString(
                            "de-DE"
                        )}.`
                );
            }

            if (
                normalized.includes(
                    "datum"
                )
            ) {

                return (
                    `Heute ist ${new Date()
                        .toLocaleDateString(
                            "de-DE",
                            {
                                weekday:
                                    "long",
                                day:
                                    "2-digit",
                                month:
                                    "long",
                                year:
                                    "numeric"
                            }
                        )}.`
                );
            }

            if (
                normalized.includes(
                    "musik"
                )
            ) {

                return (
                    "Ich kann dich mit dem " +
                    "Music Studio verbinden und " +
                    "bei Songideen, Texten, " +
                    "Strukturen und Musikprojekten helfen."
                );
            }

            if (
                normalized.includes(
                    "video"
                )
            ) {

                return (
                    "Ich kann das Video Studio " +
                    "öffnen und dich bei Skript, " +
                    "Storyboard, Szenen, Audio " +
                    "und Videoprojekten unterstützen."
                );
            }

            if (
                normalized.includes(
                    "hilfe"
                )
            ) {

                return (
                    "Natürlich. Du kannst mich fragen, " +
                    "Apps öffnen lassen, Texte erstellen, " +
                    "Dateien analysieren oder dich durch " +
                    "HalDo AI OS führen lassen."
                );
            }

            return (
                "Ich habe deine Anfrage erhalten. " +
                "Die zentrale HalDo-AI-Schnittstelle " +
                "ist aktiv. Für komplexe Aufgaben " +
                "kann ich später die jeweiligen " +
                "AI-, App- und Systemmodule verwenden."
            );
        };

    /* ============================================================
       SEND MESSAGE
       ============================================================ */

    AI.chat.send =
        async function sendMessage(
            text,
            record = null
        ) {

            const cleanText =
                String(text || "")
                    .trim();

            if (!cleanText) {
                return null;
            }

            const activeRecord =
                record ||
                HD.windows?.get?.(
                    AI.chat.windowId
                );

            if (
                !activeRecord
            ) {
                AI.chat.open();

                record =
                    HD.windows?.get?.(
                        AI.chat.windowId
                    );
            }

            const container =
                record?.contentElement
                    ?.querySelector(
                        "[data-chat-messages]"
                    );

            const userMessage =
                AI.chat.addMessage(
                    "user",
                    cleanText
                );

            if (container) {

                AI.chat.renderMessage(
                    userMessage,
                    container
                );
            }

            HD.livingAI?.think?.();

            const response =
                await AI.chat.generateResponse(
                    cleanText
                );

            const assistantMessage =
                AI.chat.addMessage(
                    "assistant",
                    response
                );

            if (container) {

                AI.chat.renderMessage(
                    assistantMessage,
                    container
                );
            }

            HD.livingAI?.setState?.(
                "answering"
            );

            if (
                AI.config.autoSpeak &&
                Voice.enabled
            ) {

                Voice.speak(
                    response
                );
            }

            setTimeout(
                () => {

                    if (
                        HD.livingAI?.state ===
                        "answering"
                    ) {

                        HD.livingAI.setState(
                            "idle"
                        );
                    }

                },
                700
            );

            HD.events?.emit(
                "ai-chat:response",
                {
                    request:
                        cleanText,

                    response
                }
            );

            return assistantMessage;
        };

    /* ============================================================
       CHAT SYSTEM CSS
       ============================================================ */

    if (
        !document.getElementById(
            "haldo-ai-chat-style"
        )
    ) {

        const style =
            document.createElement(

        style.id =
            "haldo-ai-chat-style";

        style.textContent = `

                display: flex;

                border-bottom:
                    1px solid

            }

            .haldo-ai-chat-avatar {

            }

            .haldo-ai-chat-avatar img {

            .haldo-ai-chat-status {

            .haldo-ai-chat-messages {

            }

            .haldo-chat-message {
                max-width: 86%;
                padding: 12px 14px;
                border-radius: 16px;
                line-height: 1.5;
                animation:
                    haldoChatMessageIn
                    .22s ease both;
            }

            .haldo-chat-message.message-user {
                align-self: flex-end;
                background:
                    linear-gradient(
                        135deg,
                        rgba(80,140,255,.34),

                    );
                border:
                    1px solid
                    rgba(120,190,255,.20);
            }

            .haldo-chat-message.message-assistant {

            .haldo-chat-message-label {
                font-size: 11px;

            .haldo-chat-message-body {

            .haldo-chat-input-row {

            @keyframes haldoChatMessageIn {

            @media (max-width: 600px) {

<script>
(() => {
    "use strict";

    const HD =
        window.HalDo ||
        window.HalDoOS?.shell;

    if (!HD) {
        console.error(
            "[HalDo AI OS] AI command bridge: HalDo core namespace missing."
        );
        return;
    }

    /* ============================================================
       HALDO AI COMMAND & SYSTEM BRIDGE
       Teil 4 / 16

       Verbindet:
       - HalDo AI
       - Chat
       - App Manager
       - App Registry
       - App Router
       - Window Manager
       - Launcher
       - Storage
       - System
       - Events
       - Living AI

       Bestehende APIs werden NICHT entfernt.
       ============================================================ */

    HD.ai = HD.ai || {};
    HD.commands = HD.commands || {};
    HD.apps = HD.apps || {};

    const AI = HD.ai;
    const Commands = HD.commands;
    const Apps = HD.apps;

    /* ============================================================
       COMMAND REGISTRY
       ============================================================ */

    Commands.registry =
        Commands.registry ||
        new Map();

    Commands.aliases =
        Commands.aliases ||
        new Map();

    Commands.history =
        Commands.history ||
        [];

    Commands.register =
        function registerCommand(
            definition = {}
        ) {

            const name =
                String(
                    definition.name || ""
                )
                    .trim()
                    .toLowerCase();

            if (!name) {
                return false;
            }

            const command = {
                name,

                aliases:
                    Array.isArray(
                        definition.aliases
                    )
                        ? definition.aliases
                        : [],

                description:
                    String(
                        definition.description ||
                        ""
                    ),

                category:
                    definition.category ||
                    "system",

                handler:
                    typeof definition.handler ===
                    "function"
                        ? definition.handler
                        : null,

                requiresConfirmation:
                    Boolean(
                        definition.requiresConfirmation
                    ),

                createdAt:
                    Date.now()
            };

            Commands.registry.set(
                name,
                command
            );

            command.aliases.forEach(
                alias => {

                    const normalized =
                        String(alias)
                            .trim()
                            .toLowerCase();

                    if (normalized) {

                        Commands.aliases.set(
                            normalized,
                            name
                        );
                    }
                }
            );

            HD.events?.emit?.(
                "command:registered",
                command
            );

            return command;
        };

    Commands.unregister =
        function unregisterCommand(
            name
        ) {

            const normalized =
                String(name || "")
                    .trim()
                    .toLowerCase();

            const command =
                Commands.registry.get(
                    normalized
                );

            if (!command) {
                return false;
            }

            Commands.registry.delete(
                normalized
            );

            command.aliases.forEach(
                alias => {

                    Commands.aliases.delete(
                        String(alias)
                            .trim()
                            .toLowerCase()
                    );
                }
            );

            return true;
        };

    Commands.resolve =
        function resolveCommand(
            name
        ) {

            const normalized =
                String(name || "")
                    .trim()
                    .toLowerCase();

            if (
                Commands.registry.has(
                    normalized
                )
            ) {

                return Commands.registry.get(
                    normalized
                );
            }

            const target =
                Commands.aliases.get(
                    normalized
                );

            if (target) {

                return Commands.registry.get(
                    target
                );
            }

            return null;
        };

    Commands.list =
        function listCommands() {

            return Array.from(
                Commands.registry.values()
            );
        };

    /* ============================================================
       COMMAND EXECUTION
       ============================================================ */

    Commands.execute =
        async function executeCommand(
            name,
            payload = {},
            context = {}
        ) {

            const command =
                Commands.resolve(
                    name
                );

            if (!command) {

                HD.events?.emit?.(
                    "command:not-found",
                    {
                        name,
                        payload
                    }
                );

                return {
                    ok: false,
                    error:
                        "command-not-found",
                    command:
                        name
                };
            }

            if (
                typeof command.handler !==
                "function"
            ) {

                return {
                    ok: false,
                    error:
                        "command-handler-missing",
                    command:
                        command.name
                };
            }

            const startedAt =
                Date.now();

            Commands.history.push({
                command:
                    command.name,

                payload,

                timestamp:
                    startedAt
            });

            if (
                Commands.history.length >
                200
            ) {

                Commands.history =
                    Commands.history.slice(
                        -200
                    );
            }

            HD.livingAI?.setState?.(
                "working"
            );

            HD.events?.emit?.(
                "command:start",
                {
                    command:
                        command.name,

                    payload
                }
            );

            try {

                const result =
                    await command.handler(
                        payload,
                        {
                            ...context,
                            command
                        }
                    );

                HD.events?.emit?.(
                    "command:complete",
                    {
                        command:
                            command.name,

                        payload,

                        result,

                        duration:
                            Date.now() -
                            startedAt
                    }
                );

                HD.livingAI?.setState?.(
                    "idle"
                );

                return {
                    ok: true,

                    command:
                        command.name,

                    result
                };

            } catch (error) {

                console.error(
                    "[HalDo AI] Command failed:",
                    command.name,
                    error
                );

                HD.events?.emit?.(
                    "command:error",
                    {
                        command:
                            command.name,

                        error
                    }
                );

                HD.livingAI?.setState?.(
                    "concerned"
                );

                return {
                    ok: false,

                    command:
                        command.name,

                    error
                };
            }
        };

    /* ============================================================
       APP RESOLUTION
       ============================================================ */

    Apps.resolve =
        function resolveApp(
            query
        ) {

            const value =
                String(
                    query || ""
                )
                    .trim()
                    .toLowerCase();

            if (!value) {
                return null;
            }

            const managers = [
                HD.appManager,
                HD.apps?.manager,
                window.HalDoAppManager,
                window.HalDoOS?.appManager
            ];

            for (
                const manager of
                    managers
            ) {

                if (!manager) {
                    continue;
                }

                try {

                    if (
                        typeof manager.get ===
                        "function"
                    ) {

                        const direct =
                            manager.get(
                                value
                            );

                        if (direct) {
                            return direct;
                        }
                    }

                    if (
                        typeof manager.find ===
                        "function"
                    ) {

                        const found =
                            manager.find(
                                value
                            );

                        if (found) {
                            return found;
                        }
                    }

                    if (
                        typeof manager.resolve ===
                        "function"
                    ) {

                        const resolved =
                            manager.resolve(
                                value
                            );

                        if (resolved) {
                            return resolved;
                        }
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] App resolution warning:",
                        error
                    );
                }
            }

            const registry =
                HD.appRegistry ||
                window.HalDoAppRegistry ||
                window.HalDoOS?.appRegistry;

            if (registry) {

                try {

                    if (
                        typeof registry.get ===
                        "function"
                    ) {

                        const app =
                            registry.get(
                                value
                            );

                        if (app) {
                            return app;
                        }
                    }

                    if (
                        typeof registry.find ===
                        "function"
                    ) {

                        const app =
                            registry.find(
                                value
                            );

                        if (app) {
                            return app;
                        }
                    }

                } catch (_) {
                    /* Registry optional */
                }
            }

            return null;
        };

    /* ============================================================
       OPEN APP BRIDGE
       ============================================================ */

    Apps.open =
        async function openApp(
            query,
            options = {}
        ) {

            const name =
                String(
                    query || ""
                ).trim();

            if (!name) {

                return {
                    ok: false,
                    error:
                        "missing-app-name"
                };
            }

            HD.livingAI?.setState?.(
                "opening"
            );

            HD.events?.emit?.(
                "ai:app-open-request",
                {
                    query:
                        name,

                    options
                }
            );

            const app =
                Apps.resolve(
                    name
                );

            const routers = [
                HD.appRouter,
                HD.router,
                window.HalDoAppRouter,
                window.HalDoOS?.appRouter,
                window.HalDoOS?.router
            ];

            for (
                const router of
                    routers
            ) {

                if (!router) {
                    continue;
                }

                try {

                    if (
                        typeof router.open ===
                        "function"
                    ) {

                        const result =
                            await router.open(
                                app?.id ||
                                app?.appId ||
                                name,
                                options
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            app:
                                app || {
                                    id: name
                                },
                            result
                        };
                    }

                    if (
                        typeof router.navigate ===
                        "function"
                    ) {

                        const result =
                            await router.navigate(
                                app?.id ||
                                app?.appId ||
                                name
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            app:
                                app || {
                                    id: name
                                },
                            result
                        };
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] Router open failed:",
                        error
                    );
                }
            }

            const launcher =
                HD.launcher ||
                window.HalDoLauncher ||
                window.HalDoOS?.launcher;

            if (launcher) {

                try {

                    if (
                        typeof launcher.launch ===
                        "function"
                    ) {

                        const result =
                            await launcher.launch(
                                app?.id ||
                                app?.appId ||
                                name,
                                options
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            app:
                                app || {
                                    id: name
                                },
                            result
                        };
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] Launcher failed:",
                        error
                    );
                }
            }

            HD.livingAI?.setState?.(
                "concerned"
            );

            return {
                ok: false,

                error:
                    "app-open-not-supported",

                app:
                    app || {
                        id: name
                    }
            };
        };

    /* ============================================================
       WINDOW COMMANDS
       ============================================================ */

    Commands.register({
        name:
            "open",

        aliases: [
            "öffne",
            "oeffne",
            "starte",
            "start",
            "launch"
        ],

        category:
            "apps",

        description:
            "Öffnet eine HalDo-App.",

        handler:
            async payload => {

                return Apps.open(
                    payload?.app ||
                    payload?.name ||
                    payload?.query
                );
            }
    });

    Commands.register({
        name:
            "close",

        aliases: [
            "schließe",
            "schliesse",
            "beenden",
            "stop"
        ],

        category:
            "windows",

        description:
            "Schließt ein Fenster.",

        handler:
            async payload => {

                const id =
                    payload?.id ||
                    payload?.windowId ||
                    payload?.app;

                if (!id) {
                    return false;
                }

                const windows =
                    HD.windows ||
                    window.HalDoWindowManager ||
                    window.HalDoOS?.windows;

                if (
                    windows &&
                    typeof windows.close ===
                    "function"
                ) {

                    return windows.close(
                        id
                    );
                }

                return false;
            }
    });

    Commands.register({
        name:
            "minimize",

        aliases: [
            "minimieren",
            "minimiere"
        ],

        category:
            "windows",

        description:
            "Minimiert ein Fenster.",

        handler:
            async payload => {

                const id =
                    payload?.id ||
                    payload?.windowId ||
                    payload?.app;

                const windows =
                    HD.windows ||
                    window.HalDoWindowManager ||
                    window.HalDoOS?.windows;

                if (
                    windows &&
                    typeof windows.minimize ===
                    "function"
                ) {

                    return windows.minimize(
                        id
                    );
                }

                return false;
            }
    });

    Commands.register({
        name:
            "focus",

        aliases: [
            "fokussieren",
            "fokus",
            "aktivieren"
        ],

        category:
            "windows",

        description:
            "Fokussiert ein Fenster.",

        handler:
            async payload => {

                const id =
                    payload?.id ||
                    payload?.windowId ||
                    payload?.app;

                const windows =
                    HD.windows ||
                    window.HalDoWindowManager ||
                    window.HalDoOS?.windows;

                if (
                    windows &&
                    typeof windows.focus ===
                    "function"
                ) {

                    return windows.focus(
                        id
                    );
                }

                return false;
            }
    });

    /* ============================================================
       VOICE COMMANDS
       ============================================================ */

    Commands.register({
        name:
            "speak",

        aliases: [
            "sprich",
            "vorlesen",
            "lies vor"
        ],

        category:
            "voice",

        description:
            "Lässt HalDo AI Text sprechen.",

        handler:
            async payload => {

                const voice =
                    HD.voice ||
                    window.HalDoVoice;

                const text =
                    payload?.text ||
                    payload?.message ||
                    "";

                if (
                    voice &&
                    typeof voice.speak ===
                    "function"
                ) {

                    return voice.speak(
                        text
                    );
                }

                return false;
            }
    });

    Commands.register({
        name:
            "listen",

        aliases: [
            "zuhören",
            "zuhoeren",
            "höre zu",
            "hoere zu",
            "mikrofon"
        ],

        category:
            "voice",

        description:
            "Startet die Spracheingabe.",

        handler:
            async () => {

                const speech =
                    HD.speech ||
                    window.HalDoSpeech;

                if (
                    speech &&
                    typeof speech.start ===
                    "function"
                ) {

                    return speech.start();
                }

                return false;
            }
    });

    Commands.register({
        name:
            "stop-speaking",

        aliases: [
            "sprache stoppen",
            "stopp sprechen",
            "stoppe sprache"
        ],

        category:
            "voice",

        description:
            "Stoppt die Sprachausgabe.",

        handler:
            async () => {

                const voice =
                    HD.voice ||
                    window.HalDoVoice;

                if (
                    voice &&
                    typeof voice.stop ===
                    "function"
                ) {

                    voice.stop();

                    return true;
                }

                return false;
            }
    });

    /* ============================================================
       SYSTEM INFORMATION COMMANDS
       ============================================================ */

    Commands.register({
        name:
            "system-info",

        aliases: [
            "systeminfo",
            "system information",
            "systemstatus",
            "status"
        ],

        category:
            "system",

        description:
            "Liefert grundlegende Systeminformationen.",

        handler:
            async () => {

                const system =
                    HD.system ||
                    window.HalDoSystem ||
                    window.HalDoOS?.system;

                if (!system) {

                    return {
                        name:
                            "HalDo AI OS",

                        version:
                            "20.0.0",

                        status:
                            "unknown"
                    };
                }

                return {
                    name:
                        system.name ||
                        "HalDo AI OS",

                    version:
                        system.version ||
                        system.info?.version ||
                        "20.0.0",

                    status:
                        system.status ||
                        system.bootStatus ||
                        "ready"
                };
            }
    });

    /* ============================================================
       AI COMMAND PARSER
       ============================================================ */

    AI.parseCommand =
        function parseCommand(
            text
        ) {

            const original =
                String(
                    text || ""
                ).trim();

            const normalized =
                original
                    .toLowerCase()
                    .replace(
                        /\s+/g,
                        " "
                    );

            if (!normalized) {
                return null;
            }

            const patterns = [
                {
                    regex:
                        /^(?:öffne|oeffne|starte|start|launch)\s+(.+)$/i,

                    command:
                        "open",

                    key:
                        "app"
                },

                {
                    regex:
                        /^(?:schließe|schliesse|beende|stoppe|stop)\s+(.+)$/i,

                    command:
                        "close",

                    key:
                        "id"
                },

                {
                    regex:
                        /^(?:minimiere|minimieren)\s+(.+)$/i,

                    command:
                        "minimize",

                    key:
                        "id"
                },

                {
                    regex:
                        /^(?:fokussiere|fokus|aktiviere)\s+(.+)$/i,

                    command:
                        "focus",

                    key:
                        "id"
                },

                {
                    regex:
                        /^(?:sprich|sage|lies vor)\s+(.+)$/i,

                    command:
                        "speak",

                    key:
                        "text"
                },

                {
                    regex:
                        /^(?:systeminfo|system information|systemstatus|status)$/i,

                    command:
                        "system-info",

                    key:
                        null
                }
            ];

            for (
                const pattern of
                    patterns
            ) {

                const match =
                    normalized.match(
                        pattern.regex
                    );

                if (!match) {
                    continue;
                }

                const payload = {};

                if (
                    pattern.key &&
                    match[1]
                ) {

                    payload[
                        pattern.key
                    ] =
                        original
                            .slice(
                                original
                                    .toLowerCase()
                                    .indexOf(
                                        match[1]
                                    )
                            )
                            .trim();
                }

                return {
                    command:
                        pattern.command,

                    payload,

                    original
                };
            }

            return null;
        };

    /* ============================================================
       NATURAL LANGUAGE COMMAND EXECUTOR
       ============================================================ */

    AI.executeCommand =
        async function executeAICommand(
            text,
            context = {}
        ) {

            const parsed =
                AI.parseCommand(
                    text
                );

            if (!parsed) {

                return {
                    ok: false,

                    matched: false,

                    text
                };
            }

            const result =
                await Commands.execute(
                    parsed.command,
                    parsed.payload,
                    context
                );

            return {
                ...result,

                matched: true,

                parsed
            };
        };

    /* ============================================================
       CHAT → COMMAND BRIDGE
       ============================================================ */

    if (
        AI.chat &&
        !AI.chat.originalSendWithCommandBridge
    ) {

        AI.chat.originalSendWithCommandBridge =
            AI.chat.send;

        AI.chat.send =
            async function bridgedSend(
                text,
                record = null
            ) {

                const command =
                    AI.parseCommand(
                        text
                    );

                if (command) {

                    const result =
                        await AI.executeCommand(
                            text,
                            {
                                source:
                                    "ai-chat"
                            }
                        );

                    if (
                        result.ok &&
                        result.result !==
                        undefined
                    ) {

                        let response = "";

                        if (
                            typeof result.result ===
                            "string"
                        ) {

                            response =
                                result.result;

                        } else if (
                            result.command ===
                            "system-info"
                        ) {

                            response =
                                "HalDo AI OS ist aktiv. " +
                                `Version: ${
                                    result.result
                                        ?.version ||
                                    "unbekannt"
                                }.`;
                        } else {

                            response =
                                "Erledigt. " +
                                "Der Befehl wurde ausgeführt.";
                        }

                        const message =
                            AI.chat.addMessage(
                                "assistant",
                                response,
                                {
                                    command:
                                        command.command
                                }
                            );

                        const activeRecord =
                            record ||
                            HD.windows?.get?.(
                                AI.chat.windowId
                            );

                        const container =
                            activeRecord
                                ?.contentElement
                                ?.querySelector(
                                    "[data-chat-messages]"
                                );

                        if (container) {

                            AI.chat.renderMessage(
                                message,
                                container
                            );
                        }

                        if (
                            AI.config
                                ?.autoSpeak &&
                            HD.voice?.enabled
                        ) {

                            HD.voice.speak(
                                response
                            );
                        }

                        return message;
                    }
                }

                return AI.chat
                    .originalSendWithCommandBridge(
                        text,
                        record
                    );
            };
    }

    /* ============================================================
       PUBLIC API
       ============================================================ */

    AI.commands =
        Commands;

    AI.apps =
        Apps;

    window.HalDoCommands =
        Commands;

    if (window.HalDoOS) {

        window.HalDoOS.commands =
            Commands;

        window.HalDoOS.aiCommands =
            Commands;

        window.HalDoOS.aiApps =
            Apps;
    }

    HD.events?.emit?.(
        "ai-command-bridge:ready",
        {
            commands:
                Commands.list().length,

            apps:
                Apps
        }
    );

    console.info(
        "[HalDo AI OS] Teil 4/16 — AI Command & System Bridge ready."
    );

})();
</script>
<script>
(() => {
    "use strict";

    const HD =
        window.HalDo ||
        window.HalDoOS?.shell;

    if (!HD) {
        console.error(
            "[HalDo AI OS] Teil 5/16: HalDo core namespace missing."
        );
        return;
    }

    /* ============================================================
       HALDO AI — APP / SEARCH / NAVIGATION ACTION LAYER
       Teil 5 / 16

       Dieser Layer erweitert Teil 4 und verbindet HalDo AI mit:
       - App Registry
       - App Manager
       - App Router
       - Launcher
       - Window Manager
       - Desktop
       - System
       - Storage
       - Event Bus

       Bestehende APIs bleiben erhalten.
       ============================================================ */

    HD.ai = HD.ai || {};
    HD.apps = HD.apps || {};
    HD.navigation = HD.navigation || {};
    HD.search = HD.search || {};
    HD.actions = HD.actions || {};

    const AI = HD.ai;
    const Apps = HD.apps;
    const Navigation = HD.navigation;
    const Search = HD.search;
    const Actions = HD.actions;

    /* ============================================================
       GENERISCHE HILFSFUNKTIONEN
       ============================================================ */

    const normalize =
        value =>
            String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");

    const getAppManager =
        () =>
            HD.appManager ||
            HD.apps?.manager ||
            window.HalDoAppManager ||
            window.HalDoOS?.appManager ||
            null;

    const getRegistry =
        () =>
            HD.appRegistry ||
            window.HalDoAppRegistry ||
            window.HalDoOS?.appRegistry ||
            null;

    const getRouter =
        () =>
            HD.appRouter ||
            HD.router ||
            window.HalDoAppRouter ||
            window.HalDoOS?.appRouter ||
            window.HalDoOS?.router ||
            null;

    const getLauncher =
        () =>
            HD.launcher ||
            window.HalDoLauncher ||
            window.HalDoOS?.launcher ||
            null;

    const getWindows =
        () =>
            HD.windows ||
            window.HalDoWindowManager ||
            window.HalDoOS?.windows ||
            null;

    /* ============================================================
       APP-KATALOG
       ============================================================ */

    Search.apps =
        function searchApps(
            query = ""
        ) {

            const normalizedQuery =
                normalize(query);

            const results = [];

            const seen =
                new Set();

            const addResult =
                (app, source = "unknown") => {
