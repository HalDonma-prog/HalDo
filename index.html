<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <meta name="description" content="HalDo AI OS – Phase 2: Cosmic World">
  <meta name="application-name" content="HalDo AI OS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>HalDo AI OS – Phase 2</title>
  <link rel="icon" type="image/png" href="assets/logo/logo.png">
  <link rel="apple-touch-icon" href="assets/logo/logo.png">

  <style>
    /* ============================================================
       PHASE 2 – COSMIC WORLD
       ============================================================ */
    :root {
      --haldo-bg: #02030a;
      --haldo-bg-deep: #000107;
      --haldo-panel: rgba(7, 10, 25, 0.86);
      --haldo-text: #ffffff;
      --haldo-text-soft: rgba(255, 255, 255, 0.72);
      --haldo-text-muted: rgba(255, 255, 255, 0.48);
      --haldo-border: rgba(255, 255, 255, 0.14);
      --haldo-blue: #72a9ff;
      --haldo-cyan: #76eaff;
      --haldo-violet: #b68cff;
      --haldo-gold: #ffd76a;
      --haldo-orange: #ff9b55;
      --haldo-green: #75e7a4;
      --sun-core-size: clamp(130px, 18vw, 260px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --cosmic-ui-radius: 22px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--haldo-bg); color: var(--haldo-text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { position: relative; isolation: isolate; user-select: none; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; outline: 0; color: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }

    #haldo-os { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #02030a; }

    /* ============================================================
       BOOT-SCREEN (von Phase 1)
       ============================================================ */
    #boot-screen {
      position: absolute; z-index: 2000; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: calc(30px + var(--safe-top)) calc(24px + var(--safe-right)) calc(30px + var(--safe-bottom)) calc(24px + var(--safe-left));
      background: radial-gradient(circle at center, rgba(65,88,190,.18), rgba(3,5,16,.96) 52%, #000107 100%);
      transition: opacity 700ms ease, visibility 700ms ease;
    }
    #boot-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #boot-content { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
    #boot-logo { width: clamp(80px, 18vw, 140px); height: clamp(80px, 18vw, 140px); object-fit: contain; filter: drop-shadow(0 0 15px rgba(117,220,255,.5)) drop-shadow(0 0 38px rgba(174,110,255,.25)); animation: bootLogoFloat 3.8s ease-in-out infinite; }
    #boot-title { margin: 0; font-size: clamp(24px, 5vw, 48px); font-weight: 800; letter-spacing: .08em; background: linear-gradient(90deg, #fff, #ffd56b, #fff, #83eaff, #c79aff, #fff); background-size: 240% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: titleLight 7s linear infinite; }
    #boot-message { max-width: 600px; margin: 0; color: rgba(255,255,255,.66); font-size: clamp(12px, 1.8vw, 16px); line-height: 1.55; }
    #boot-loader { width: min(280px, 70vw); height: 3px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
    #boot-loader-bar { width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, #7eeaff, #d29bff, #ffd86a, transparent); box-shadow: 0 0 14px rgba(117,210,255,.65); animation: bootLoader 1.7s ease-in-out infinite; }
    @keyframes bootLogoFloat { 0%,100% { transform: translateY(0) scale(.98); } 50% { transform: translateY(-8px) scale(1.03); } }
    @keyframes bootLoader { from { transform: translateX(-130%); } to { transform: translateX(390%); } }
    @keyframes titleLight { from { background-position: 0% 50%; } to { background-position: 240% 50%; } }

    /* ============================================================
       COSMIC WORLD – HINTERGRUND
       ============================================================ */
    #cosmic-world {
      position: absolute; inset: 0; overflow: hidden;
      background: radial-gradient(ellipse at center, rgba(33,42,105,0.34) 0%, rgba(9,13,39,0.48) 30%, rgba(2,3,12,0.88) 68%, #000107 100%);
      transition: opacity 700ms ease, transform 1000ms cubic-bezier(.2,.75,.2,1), filter 700ms ease;
    }
    #cosmic-world.is-transitioning { opacity: 0; transform: scale(1.08); filter: brightness(1.8) blur(3px); }
    #cosmic-world::before, #cosmic-world::after { content: ""; position: absolute; inset: -20%; pointer-events: none; }
    #cosmic-world::before {
      background: radial-gradient(ellipse at 25% 35%, rgba(94,76,196,0.16), transparent 30%), radial-gradient(ellipse at 72% 25%, rgba(40,137,255,0.13), transparent 28%), radial-gradient(ellipse at 58% 80%, rgba(198,75,177,0.10), transparent 32%);
      filter: blur(45px);
      animation: nebulaDrift 28s ease-in-out infinite alternate;
    }
    #cosmic-world::after {
      background: radial-gradient(circle at 50% 50%, transparent 0 23%, rgba(117,169,255,0.045) 30%, transparent 48%);
      animation: cosmicPulse 9s ease-in-out infinite;
    }
    @keyframes nebulaDrift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 2%, 0) scale(1.05); } }
    @keyframes cosmicPulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }

    /* ============================================================
       STERNE – 365 + 30 SPECIAL
       ============================================================ */
    #star-field, #special-star-field { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 4px rgba(255,255,255,.85), 0 0 10px rgba(140,190,255,.45);
      opacity: .65;
      animation: starTwinkle var(--twinkle-duration, 4s) ease-in-out var(--twinkle-delay, 0s) infinite alternate;
    }
    .star.large { width: 3px; height: 3px; box-shadow: 0 0 5px rgba(255,255,255,.95), 0 0 14px rgba(117,190,255,.7); }
    .star.soft { filter: blur(.25px); opacity: .4; }
    @keyframes starTwinkle { from { transform: scale(.72); opacity: .3; } to { transform: scale(1.35); opacity: 1; } }
    .special-star {
      position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 7px rgba(255,255,255,1), 0 0 18px rgba(117,200,255,.9), 0 0 34px rgba(170,120,255,.5);
      animation: specialStarPulse var(--special-duration, 3.4s) ease-in-out var(--special-delay, 0s) infinite alternate;
    }
    .special-star::before, .special-star::after { content: ""; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,.7); transform: translate(-50%, -50%); }
    .special-star::before { width: 28px; height: 1px; }
    .special-star::after { width: 1px; height: 28px; }
    @keyframes specialStarPulse { from { transform: scale(.55); opacity: .55; } to { transform: scale(1.15); opacity: 1; } }

    /* ============================================================
       SYSTEM-BAR
       ============================================================ */
    #system-bar {
      position: absolute; z-index: 900; top: var(--safe-top); left: 0; right: 0; min-height: 54px;
      padding: 8px max(12px, var(--safe-right)) 8px max(12px, var(--safe-left));
      display: flex; align-items: center; justify-content: space-between; pointer-events: none;
    }
    .system-bar-side { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
    .system-pill {
      min-height: 38px; padding: 7px 12px; border: 1px solid var(--haldo-border); border-radius: 999px;
      background: rgba(4,7,18,.62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.06);
      color: var(--haldo-text-soft); font-size: 12px; letter-spacing: .02em;
    }
    .system-button {
      width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,.14); border-radius: 50%;
      background: rgba(5,8,20,.68); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 25px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }
    .system-button:hover, .system-button:focus-visible { transform: translateY(-1px) scale(1.03); background: rgba(20,28,58,.82); border-color: rgba(255,255,255,.26); }
    .system-button:active { transform: scale(.95); }

    /* ============================================================
       COSMIC TITLE
       ============================================================ */
    #cosmic-title {
      position: absolute; z-index: 120; top: clamp(66px, 9vh, 100px); left: 50%; transform: translateX(-50%);
      width: min(94vw, 900px); text-align: center; pointer-events: none;
    }
    #cosmic-title-main {
      margin: 0; font-size: clamp(25px, 4vw, 58px); line-height: 1; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      background: linear-gradient(90deg, #fff4b0 0%, #ffd76a 18%, #fff 34%, #7beaff 53%, #c092ff 72%, #ff9bdc 88%, #ffe58a 100%);
      background-size: 240% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 8px rgba(255,215,106,.38)) drop-shadow(0 0 22px rgba(117,190,255,.2));
      animation: titleLight 9s linear infinite;
    }
    #cosmic-title-subtitle { margin-top: 9px; font-size: clamp(11px, 1.4vw, 16px); font-weight: 500; letter-spacing: .24em; color: rgba(255,255,255,.72); text-transform: uppercase; text-shadow: 0 0 10px rgba(255,255,255,.18), 0 0 24px rgba(117,190,255,.16); }

    /* ============================================================
       SOLAR STAGE – DAS HALDO-SONNENSYSTEM
       ============================================================ */
    #solar-stage {
      position: absolute; z-index: 100; left: 50%; top: 52%; width: min(92vw, 900px); height: min(78vh, 760px);
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #solar-system {
      position: absolute; left: 50%; top: 50%; width: min(84vw, 760px); height: min(84vw, 760px);
      max-width: 760px; max-height: 760px; transform: translate(-50%, -50%); pointer-events: none;
    }

    /* Orbits */
    .orbit {
      position: absolute; left: 50%; top: 50%; width: var(--orbit-size); height: var(--orbit-size);
      transform: translate(-50%, -50%); border: 1px solid rgba(132,180,255,.14); border-radius: 50%;
      pointer-events: none; box-shadow: 0 0 14px rgba(100,150,255,.035), inset 0 0 14px rgba(100,150,255,.025);
    }
    .orbit::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px dashed rgba(255,255,255,.025); transform: rotate(18deg); }

    /* 12 Himmelskörper – 8 Planeten + 4 Zwergplaneten */
    .planet-system {
      position: absolute; left: 50%; top: 50%; width: var(--orbit-size); height: var(--orbit-size);
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      animation: orbitRotation var(--orbit-duration) linear infinite;
    }
    .planet-holder { position: absolute; left: 50%; top: 0; width: 1px; height: 50%; transform-origin: bottom center; }
    .planet {
      position: absolute; left: 50%; top: 0; width: var(--planet-size, 12px); height: var(--planet-size, 12px);
      transform: translate(-50%, -50%) rotate(calc(var(--orbit-direction, 1) * -1 * var(--planet-angle, 0deg)));
      border-radius: 50%; pointer-events: auto; cursor: pointer;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.8), var(--planet-light, #8fd5ff) 18%, var(--planet-main, #4070c8) 54%, var(--planet-dark, #172454) 100%);
      box-shadow: 0 0 7px var(--planet-glow, rgba(110,180,255,.75)), 0 0 18px var(--planet-glow, rgba(110,180,255,.35));
      transition: transform 0.3s ease;
    }
    .planet:hover { transform: translate(-50%, -50%) rotate(calc(var(--orbit-direction, 1) * -1 * var(--planet-angle, 0deg))) scale(1.4); z-index: 50; }
    .planet::after { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 1px solid rgba(255,255,255,.15); opacity: .55; }
    .planet.has-ring::before {
      content: ""; position: absolute; left: 50%; top: 50%; width: 180%; height: 55%;
      transform: translate(-50%, -50%) rotate(-18deg);
      border: 2px solid rgba(225,220,255,.44); border-left-color: rgba(255,255,255,.12); border-right-color: rgba(255,255,255,.18); border-radius: 50%;
      box-shadow: 0 0 15px rgba(200,180,255,0.2);
    }
    .planet .moon {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #ccc;
      box-shadow: 0 0 6px rgba(200,200,200,0.5);
      top: -8px;
      right: -8px;
    }
    .planet-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    /* Zeit-Planeten mit ⏱-Markierung */
    .planet.time-planet::before {
      content: "⏱";
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255,255,255,0.9);
      z-index: 10;
      font-weight: bold;
    }
    @keyframes orbitRotation { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ============================================================
       SONNE – ULTIMATIVE MAXIMUM EDITION
       ============================================================ */
    #sun {
      position: absolute; z-index: 200; left: 50%; top: 50%; width: var(--sun-core-size); height: var(--sun-core-size);
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: auto; cursor: pointer; border: 0; padding: 0;
      background: transparent;
      filter: drop-shadow(0 0 18px rgba(255,198,75,.8)) drop-shadow(0 0 45px rgba(255,164,45,.5)) drop-shadow(0 0 90px rgba(255,120,30,.24));
      transition: transform 350ms cubic-bezier(.2,.8,.2,1), filter 350ms ease;
    }
    #sun:hover, #sun:focus-visible { transform: translate(-50%, -50%) scale(1.045); filter: drop-shadow(0 0 22px rgba(255,220,100,.95)) drop-shadow(0 0 55px rgba(255,170,45,.72)) drop-shadow(0 0 110px rgba(255,120,30,.34)); outline: none; }
    #sun:active { transform: translate(-50%, -50%) scale(.97); }

    #sun-glow, #sun-core, #sun-corona, #sun-rays {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    }

    #sun-glow {
      inset: -38%;
      background: radial-gradient(circle, rgba(255,247,178,.82) 0%, rgba(255,206,77,.42) 28%, rgba(255,152,42,.16) 52%, transparent 72%);
      filter: blur(10px); animation: sunGlow 4.8s ease-in-out infinite;
    }

    #sun-corona {
      inset: -14%;
      background: conic-gradient(from 0deg, transparent, rgba(255,236,130,.42), transparent 12%, rgba(255,173,53,.36), transparent 24%, rgba(255,245,175,.44), transparent 38%, rgba(255,148,45,.30), transparent 52%, rgba(255,238,135,.42), transparent 68%, rgba(255,165,50,.32), transparent 84%, rgba(255,240,150,.42), transparent);
      filter: blur(2px); animation: sunCorona 11s linear infinite; opacity: .88;
    }

    #sun-core {
      overflow: hidden;
      background: radial-gradient(circle at 38% 34%, #fffbe3 0%, #fff2a3 11%, #ffd44e 30%, #ff9e32 58%, #ed641e 78%, #a92c16 100%);
      box-shadow: inset -16px -20px 32px rgba(133,32,10,.28), inset 18px 12px 28px rgba(255,255,255,.42);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
    }

    #sun-logo {
      width: 45%;
      height: 45%;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255,200,100,.8)) drop-shadow(0 0 30px rgba(255,200,100,.4));
      z-index: 10;
      pointer-events: none;
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    #sun-text {
      position: absolute;
      bottom: 8%;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255,200,100,.9), 0 0 40px rgba(255,200,100,.4);
      background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 3s linear infinite;
    }
    #sun-text.main { font-size: clamp(10px, 1.2vw, 16px); letter-spacing: .1em; }
    #sun-text.sub { font-size: clamp(6px, 0.7vw, 10px); bottom: 2%; opacity: .8; }

    @keyframes textShine { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }

    #inner-sun-stars {
      position: absolute; z-index: 5; left: 50%; top: 50%;
      width: calc(var(--sun-core-size) * .72); height: calc(var(--sun-core-size) * .72);
      transform: translate(-50%, -50%); pointer-events: none; border-radius: 50%; overflow: hidden;
    }
    .inner-spark {
      position: absolute;
      width: 3px; height: 3px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 5px #fff, 0 0 12px rgba(255,240,150,.9);
      animation: innerSpark 2.8s ease-in-out infinite alternate;
    }
    @keyframes innerSpark { from { transform: scale(.5); opacity: .45; } to { transform: scale(1.25); opacity: 1; } }

    #sun-stars-orbital {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      z-index: 150;
    }
    .sun-orbital-star {
      position: absolute;
      width: 4px; height: 4px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,.9), 0 0 20px rgba(255,200,100,.6);
      animation: orbitalStarGlow 2s ease-in-out infinite alternate;
    }
    @keyframes orbitalStarGlow { from { transform: scale(.7); opacity: .4; } to { transform: scale(1.3); opacity: 1; } }

    #sun-rays {
      inset: -65%;
      background: repeating-conic-gradient(from 0deg, rgba(255,222,115,.13) 0deg 2deg, transparent 2deg 10deg);
      mask-image: radial-gradient(circle, black 0 29%, transparent 58%);
      -webkit-mask-image: radial-gradient(circle, black 0 29%, transparent 58%);
      animation: sunRays 25s linear infinite; opacity: .85;
    }
    @keyframes sunGlow { 0%,100% { transform: scale(.96); opacity: .76; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes sunCorona { to { transform: rotate(360deg); } }
    @keyframes sunRays { to { transform: rotate(360deg); } }

    /* ============================================================
       AI-IDENTITY UNTERHALB DER SONNE
       ============================================================ */
    #ai-identity {
      position: absolute; z-index: 310; left: 50%; top: calc(50% + var(--sun-core-size) * .72); transform: translateX(-50%);
      width: min(90vw, 620px); text-align: center; pointer-events: none;
    }
    #ai-identity-name {
      margin: 0; font-size: clamp(16px, 2vw, 26px); font-weight: 700; letter-spacing: .055em;
      background: linear-gradient(90deg, #fff, #ffd873, #fff, #8beeff, #fff, #c89cff);
      background-size: 250% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: identityGlow 8s linear infinite;
      filter: drop-shadow(0 0 9px rgba(255,210,100,.24)) drop-shadow(0 0 16px rgba(120,190,255,.18));
    }
    #ai-identity-role { margin-top: 7px; font-size: clamp(10px, 1.25vw, 14px); color: rgba(255,255,255,.62); letter-spacing: .17em; text-transform: uppercase; }
    @keyframes identityGlow { from { background-position: 0% 50%; } to { background-position: 250% 50%; } }

    /* ============================================================
       HALDO LOGO
       ============================================================ */
    .haldo-logo { width: 42px; height: 42px; object-fit: contain; object-position: center; filter: drop-shadow(0 0 8px rgba(117,220,255,.35)) drop-shadow(0 0 16px rgba(190,120,255,.16)); }

    /* ============================================================
       HAUPT-DOCK
       ============================================================ */
    #main-dock {
      position: absolute; z-index: 700; left: 50%; bottom: calc(14px + var(--safe-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; gap: 9px; padding: 8px; max-width: calc(100vw - 24px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 24px;
      background: rgba(3,6,17,.62); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 42px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .dock-button {
      position: relative; width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 16px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.045);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }
    .dock-button:hover, .dock-button:focus-visible { transform: translateY(-3px); background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.2); outline: none; }
    .dock-button:active { transform: translateY(0) scale(.94); }
    .dock-button img { width: 25px; height: 25px; object-fit: contain; }
    .dock-button.ai { width: 58px; height: 58px; margin: 0 3px; border-radius: 20px; background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.15), rgba(103,159,255,.08) 45%, rgba(180,100,255,.06)); box-shadow: 0 0 24px rgba(117,190,255,.12); }
    .dock-button.ai img { width: 36px; height: 36px; }

    /* ============================================================
       TOAST
       ============================================================ */
    #toast-container { position: fixed; z-index: 3000; top: calc(70px + var(--safe-top)); right: calc(16px + var(--safe-right)); display: flex; flex-direction: column; gap: 8px; max-width: 380px; pointer-events: none; }
    .toast {
      padding: 10px 16px; border-radius: 14px; background: rgba(5,9,28,0.88); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      pointer-events: auto; animation: toastIn 300ms ease; font-size: 13px; display: flex; align-items: center; gap: 10px;
    }
    .toast.toast-out { animation: toastOut 280ms ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(30px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(30px) scale(0.96); } }
    .toast .toast-icon { font-size: 18px; flex-shrink: 0; }
    .toast .toast-body { flex: 1; }
    .toast .toast-title { font-weight: 600; }
    .toast .toast-message { color: var(--haldo-text-muted); font-size: 12px; }

    /* ============================================================
       ARIA & RESPONSIVE
       ============================================================ */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    @media (max-width: 800px) {
      .planet-label { font-size: 6px; bottom: -14px; }
    }
    @media (max-width: 500px) {

      .planet-label { font-size: 5px; bottom: -12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>

  <script>
    // ============================================================
    // PHASE 2 – COSMIC WORLD
    // ============================================================

    (function() {
      'use strict';

      // ============================================================
      // 1. KERNEL & KONFIGURATION (von Phase 1 erweitert)
      // ============================================================

      const HALDO = {
        version: '2.0.0',
        name: 'HalDo AI OS',
        build: '2026-09-08',
        phase: 'Phase 2 – Cosmic World',
        state: 'BOOTING',
        config: {
          cosmicWorld: true,
          cosmicEffects: true,
          systemSounds: true,
          animations: true,
          aiEnabled: true,
          aiAppControl: true,
          memoryEnabled: true,
          speechInput: true,
          speechOutput: true,
          voiceLanguage: 'de-DE',
          voiceRate: 1,
          voiceVolume: 1,
          displayScale: 1,
          notifications: true,
          secureStorage: true,
        },
        storage: { db: null },
        registry: {},
        windows: {},
        windowCounter: 0,
        activeWindow: null,
        ai: null,
        voice: null,
        memory: [],
        notifications: [],
        eventBus: {}
      };

      // ============================================================
      // 2. EVENT BUS
      // ============================================================

      HALDO.eventBus = {
        on(event, callback) { if (!this[event]) this[event] = []; this[event].push(callback); },
        emit(event, data) { if (this[event]) { this[event].forEach(cb => cb(data)); } },
        off(event, callback) { if (this[event]) { this[event] = this[event].filter(cb => cb !== callback); } }
      };

      // ============================================================
      // 3. STORAGE (von Phase 1)
      // ============================================================

      HALDO.storage = {
        init() {
          return new Promise((resolve) => {
            try {
              const req = indexedDB.open('HalDoOS', 2);
              req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('memory')) db.createObjectStore('memory', { keyPath: 'key' });
                if (!db.objectStoreNames.contains('notifications')) db.createObjectStore('notifications', { keyPath: 'id', autoIncrement: true });
                if (!db.objectStoreNames.contains('registry')) db.createObjectStore('registry', { keyPath: 'id' });
              };
              req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
              req.onerror = () => { this.db = null; resolve(); };
            } catch { this.db = null; resolve(); }
          });
        },
        async get(store, key) {
          if (this.db) {
            try {
              const tx = this.db.transaction(store, 'readonly');
              const req = tx.objectStore(store).get(key);
              return new Promise((resolve) => { req.onsuccess = () => resolve(req.result); req.onerror = () => resolve(null); });
            } catch { return null; }
          }
          const data = localStorage.getItem(`haldo_${store}_${key}`);
          return data ? JSON.parse(data) : null;
        },
        async set(store, key, value) {
          if (this.db) {
            try {
              const tx = this.db.transaction(store, 'readwrite');
              const req = tx.objectStore(store).put({ ...value, key, id: key });
              return new Promise((resolve) => { req.onsuccess = () => resolve(); req.onerror = () => resolve(); });
            } catch { return; }
          }
          localStorage.setItem(`haldo_${store}_${key}`, JSON.stringify(value));
        },
        async delete(store, key) {
          if (this.db) {
            try {
              const tx = this.db.transaction(store, 'readwrite');
              const req = tx.objectStore(store).delete(key);
              return new Promise((resolve) => { req.onsuccess = () => resolve(); req.onerror = () => resolve(); });
            } catch { return; }
          }
          localStorage.removeItem(`haldo_${store}_${key}`);
        },
        async getAll(store) {
          if (this.db) {
            try {
              const tx = this.db.transaction(store, 'readonly');
              const req = tx.objectStore(store).getAll();
              return new Promise((resolve) => { req.onsuccess = () => resolve(req.result); req.onerror = () => resolve([]); });
            } catch { return []; }
          }
          return [];
        },
        async clear(store) {
          if (this.db) {
            try {
              const tx = this.db.transaction(store, 'readwrite');
              const req = tx.objectStore(store).clear();
              return new Promise((resolve) => { req.onsuccess = () => resolve(); req.onerror = () => resolve(); });
            } catch { return; }
          }
          return;
        }
      };

      // ============================================================
      // 4. TOAST
      // ============================================================

      function showToast(icon, title, message) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `
          <span class="toast-icon">${icon}</span>
          <div class="toast-body">
            <div class="toast-title">${title}</div>
            <div class="toast-message">${message}</div>
          </div>
        `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      // ============================================================
      // 5. SYSTEM STATUS
      // ============================================================

      function updateSystemStatus(text) {
        const status = document.getElementById('system-status');
        if (status) status.textContent = text;
      }

      // ============================================================
      // 6. STERNE GENERIEREN
      // ============================================================

      function generateStars() {
        const container = document.getElementById('star-field');
        if (!container) return;
        container.innerHTML = '';
        const count = 365;
        for (let i = 0; i < count; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          if (i % 5 === 0) star.classList.add('large');
          if (i % 7 === 0) star.classList.add('soft');
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          star.style.left = x + '%';
          star.style.top = y + '%';
          star.style.setProperty('--twinkle-duration', (3 + Math.random() * 4) + 's');
          star.style.setProperty('--twinkle-delay', (Math.random() * 4) + 's');
          container.appendChild(star);
        }
      }

      function generateSpecialStars() {
        const container = document.getElementById('special-star-field');
        if (!container) return;
        container.innerHTML = '';
        const count = 30;
        for (let i = 0; i < count; i++) {
          const star = document.createElement('div');
          star.className = 'special-star';
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          star.style.left = x + '%';
          star.style.top = y + '%';
          star.style.setProperty('--special-duration', (2.5 + Math.random() * 2.5) + 's');
          star.style.setProperty('--special-delay', (Math.random() * 3) + 's');
          container.appendChild(star);
        }
      }

      function generateInnerSunStars() {
        const container = document.getElementById('inner-sun-stars');
        if (!container) return;
        container.innerHTML = '';
        const count = 24;
        for (let i = 0; i < count; i++) {
          const spark = document.createElement('div');
          spark.className = 'inner-spark';
          const angle = Math.random() * 2 * Math.PI;
          const radius = 30 + Math.random() * 60;
          const x = 50 + (radius * Math.cos(angle));
          const y = 50 + (radius * Math.sin(angle));
          spark.style.left = x + '%';
          spark.style.top = y + '%';
          spark.style.animationDelay = (Math.random() * 2) + 's';
          container.appendChild(spark);
        }
      }

      function generateOrbitalSunStars() {
        const container = document.getElementById('sun-stars-orbital');
        if (!container) return;
        container.innerHTML = '';
        const count = 30;
        for (let i = 0; i < count; i++) {
          const star = document.createElement('div');
          star.className = 'sun-orbital-star';
          const angle = (i / count) * 2 * Math.PI;
          const radius = 45 + Math.random() * 10;
          const x = 50 + radius * Math.cos(angle);
          const y = 50 + radius * Math.sin(angle);
          star.style.left = x + '%';
          star.style.top = y + '%';
          star.style.animationDelay = (i * 0.1) + 's';
          container.appendChild(star);
        }
      }

      // ============================================================
      // 7. EVENT LISTENER
      // ============================================================

      function initEventListeners() {
        // Sonne – öffnet AI (vorbereitet für Phase 3)
        document.getElementById('sun')?.addEventListener('click', () => {
          showToast('☀️', 'HalDo AI', 'Die Sonne wurde geklickt! HalDo AI wird in Phase 3 aktiviert.');
        });

        // Dock-Buttons
        document.getElementById('dock-apps')?.addEventListener('click', () => {
          showToast('📱', 'App-Menü', 'Wird in Phase 6 implementiert.');
        });
        document.getElementById('dock-search')?.addEventListener('click', () => {
          showToast('🔍', 'Suche', 'Wird in Phase 6 implementiert.');
        });
        document.getElementById('dock-ai')?.addEventListener('click', () => {
          showToast('🤖', 'HalDo AI', 'Wird in Phase 3 implementiert.');
        });
        document.getElementById('dock-notifications')?.addEventListener('click', () => {
          showToast('🔔', 'Benachrichtigungen', 'Wird in Phase 6 implementiert.');
        });
        document.getElementById('dock-settings')?.addEventListener('click', () => {
          showToast('⚙️', 'Einstellungen', 'Wird in Phase 7 implementiert.');
        });
        document.getElementById('app-menu-button')?.addEventListener('click', () => {
          showToast('📱', 'App-Menü', 'Wird in Phase 6 implementiert.');
        });
        document.getElementById('settings-button')?.addEventListener('click', () => {
          showToast('⚙️', 'Einstellungen', 'Wird in Phase 7 implementiert.');
        });
        document.getElementById('notification-button')?.addEventListener('click', () => {
          showToast('🔔', 'Benachrichtigungen', 'Wird in Phase 6 implementiert.');
        });

        // Planeten – Klick (Vorbereitung für spätere Interaktion)
        document.querySelectorAll('.planet').forEach(planet => {
          planet.addEventListener('click', () => {
            const name = planet.title || 'Unbekannter Himmelskörper';
            showToast('🪐', name, 'Planeten-Informationen werden in Phase 6 implementiert.');
          });
        });

        console.log('✅ Event-Listener für Phase 2 initialisiert.');
      }

      // ============================================================
      // 8. BOOT
      // ============================================================

      async function boot() {
        const bootScreen = document.getElementById('boot-screen');
        const bootLoader = document.getElementById('boot-loader-bar');
        const cosmicWorld = document.getElementById('cosmic-world');

        // Storage initialisieren
        await HALDO.storage.init();

        // Gespeicherte Konfiguration laden
        const savedConfig = await HALDO.storage.get('settings', 'config');
        if (savedConfig) {
          HALDO.config = { ...HALDO.config, ...savedConfig };
        }

        // Memory laden
        const savedMemory = await HALDO.storage.get('memory', 'conversation');
        if (savedMemory && savedMemory.data) {
          HALDO.memory = savedMemory.data;
        }

        // Boot-Fortschritt
        let progress = 0;
        const steps = [
          'Lade Kernsystem …',
          'Verbinde Speicher …',
          'Generiere Sterne …',
          'Erstelle Sonnensystem …',
          'Aktiviere Cosmic World …',
          'System bereit.'
        ];

        for (let i = 0; i < steps.length; i++) {
          progress = ((i + 1) / steps.length) * 100;
          if (bootLoader) bootLoader.style.width = progress + '%';
          await new Promise(r => setTimeout(r, 150 + Math.random() * 120));
        }

        // Sterne generieren
        generateStars();
        generateSpecialStars();
        generateInnerSunStars();
        generateOrbitalSunStars();

        // Boot-Screen ausblenden
        if (bootScreen) {
          bootScreen.classList.add('hidden');
          setTimeout(() => { bootScreen.style.display = 'none'; }, 800);
        }

        if (cosmicWorld) {
          cosmicWorld.classList.remove('is-transitioning');
        }

        // System-Status aktualisieren
        HALDO.state = 'READY';
        updateSystemStatus('HalDo AI OS • Phase 2 • Cosmic World aktiv');

        // Event-Listener initialisieren
        initEventListeners();

        // Willkommens-Toast
        setTimeout(() => {
          showToast('🌌', 'HalDo AI OS Phase 2', 'Cosmic World erfolgreich geladen! ☀️🪐');
        }, 600);

        console.log('🚀 HalDo AI OS Phase 2 – Cosmic World gestartet.');
        console.log('📦 Version:', HALDO.version);
        console.log('📌 Status:', HALDO.state);

        HALDO.eventBus.emit('boot:ready');
      }

      // ============================================================
      // 9. START
      // ============================================================

      boot();

      // Globales HALDO-Objekt für Debugging
      window.HALDO = HALDO;
      window.showToast = showToast;

    })();
  </script>
</body>
</html>
