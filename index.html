<script>
/* ============================================================
   HALDO RUNTIME — CONTINUATION
   ============================================================ */

HD.runtime.start = async function (appId, options) {
    options = options || {};

    var normalizedId = String(appId || '').trim();

    if (!normalizedId) {
        throw new Error('Keine App-ID angegeben.');
    }

    var entry = HD.registry.get(normalizedId);

    if (!entry) {
        /*
         * Falls die Registry noch nicht geladen ist, versuchen wir,
         * die zentrale App-Registry bzw. vorhandene globale Registry
         * zu verwenden.
         */
        if (
            window.HalDoAppRegistry &&
            typeof window.HalDoAppRegistry.get === 'function'
        ) {
            try {
                entry = window.HalDoAppRegistry.get(normalizedId);
            } catch (registryError) {
                HD.log.warn(
                    'Externe App-Registry konnte nicht abgefragt werden.',
                    registryError
                );
            }
        }
    }

    if (!entry) {
        throw new Error(
            'App "' + normalizedId + '" wurde nicht in der App-Registry gefunden.'
        );
    }

    var module = entry.module;

    try {
        if (module && typeof module.init === 'function') {
            await Promise.resolve(
                module.init({
                    appId: normalizedId,
                    options: options,
                    kernel: HD.kernel,
                    system: HD.system,
                    events: HD.events,
                    storage: HD.storage,
                    files: HD.files,
                    ai: HD.ai,
                    voice: HD.voice,
                    language: HD.language,
                    memory: HD.memory,
                    security: HD.security,
                    notifications: HD.notifications,
                    windowManager: HD.windows,
                    display: HD.display
                })
            );
        }

        entry.status = 'running';
        entry.startedAt = Date.now();

        HD.registry.setStatus(normalizedId, 'running');

        HD.events.emit('app:started', {
            appId: normalizedId,
            options: options,
            timestamp: Date.now()
        });

        return entry;
    } catch (error) {
        entry.status = 'error';
        entry.error = error;

        HD.registry.setStatus(normalizedId, 'error');

        HD.log.error(
            'Fehler beim Starten der App "' + normalizedId + '".',
            error
        );

        HD.events.emit('app:error', {
            appId: normalizedId,
            error: error,
            timestamp: Date.now()
        });

        throw error;
    }
};


/* ============================================================
   RUNTIME — STOP
   ============================================================ */

HD.runtime.stop = async function (appId, options) {
    options = options || {};

    var normalizedId = String(appId || '').trim();

    if (!normalizedId) {
        return false;
    }

    var entry = HD.registry.get(normalizedId);

    if (!entry) {
        return false;
    }

    var module = entry.module;

    try {
        if (module && typeof module.destroy === 'function') {
            await Promise.resolve(
                module.destroy({
                    appId: normalizedId,
                    options: options,
                    kernel: HD.kernel,
                    system: HD.system,
                    events: HD.events,
                    storage: HD.storage,
                    files: HD.files,
                    ai: HD.ai,
                    voice: HD.voice,
                    language: HD.language,
                    memory: HD.memory,
                    security: HD.security,
                    notifications: HD.notifications,
                    windowManager: HD.windows,
                    display: HD.display
                })
            );
        }

        entry.status = 'stopped';
        HD.registry.setStatus(normalizedId, 'stopped');

        HD.events.emit('app:stopped', {
            appId: normalizedId,
            timestamp: Date.now()
        });

        return true;
    } catch (error) {
        HD.log.error(
            'Fehler beim Beenden der App "' + normalizedId + '".',
            error
        );

        HD.events.emit('app:error', {
            appId: normalizedId,
            phase: 'stop',
            error: error,
            timestamp: Date.now()
        });

        return false;
    }
};


/* ============================================================
   RUNTIME — RESTART
   ============================================================ */

HD.runtime.restart = async function (appId, options) {
    await HD.runtime.stop(appId, options);
    return HD.runtime.start(appId, options);
};


/* ============================================================
   RUNTIME — OPEN
   ============================================================ */

HD.runtime.open = async function (appId, options) {
    options = options || {};

    var normalizedId = String(appId || '').trim();

    if (!normalizedId) {
        throw new Error('Keine App-ID angegeben.');
    }

    HD.events.emit('app:opening', {
        appId: normalizedId,
        options: options,
        timestamp: Date.now()
    });

    /*
     * App Router zuerst verwenden.
     */
    if (
        HD.router &&
        typeof HD.router.open === 'function'
    ) {
        try {
            var routed = await Promise.resolve(
                HD.router.open(normalizedId, options)
            );

            if (routed !== false) {
                return routed;
            }
        } catch (routerError) {
            HD.log.warn(
                'Router konnte App "' + normalizedId + '" nicht öffnen.',
                routerError
            );
        }
    }

    /*
     * Falls kein Router vorhanden ist, Runtime direkt starten.
     */
    return HD.runtime.start(normalizedId, options);
};


/* ============================================================

HD.runtime.close = async function (appId, options) {

    var normalizedId = String(appId || '').trim();

    if (!normalizedId) {

    if (

            HD.log.warn(

/* ============================================================

   ============================================================ */

HD.runtime.register = function (definition) {
    if (!definition || typeof definition !== 'object') {
        throw new TypeError('Ungültige App-Definition.');
    }

    var id = String(
        definition.id ||
        definition.appId ||
        ''
    ).trim();

    if (!id) {
        throw new Error('App-Definition benötigt eine ID.');
    }

    return HD.registry.register({
        id: id,
        name: definition.name || id,
        category: definition.category || 'system',
        module: definition.module || null,
        manifest: definition.manifest || definition,
        permissions: definition.permissions || [],
        settings: definition.settings || {},
        status: 'registered'
    });

HD.runtime.isRunning = function (appId) {

    return !!(
        entry &&
        (
            entry.status === 'running' ||
            entry.status === 'active'
        )
    );

/* ============================================================
   RUNTIME — BULK START
   ============================================================ */

HD.runtime.startAll = async function () {
    var entries = HD.registry.getAll();

    if (!Array.isArray(entries)) {
        return [];
    }

    var results = [];

    for (var i = 0; i < entries.length; i += 1) {
        var entry = entries[i];

        if (!entry || !entry.id) {
            continue;
        }

        /*
         * System-Apps dürfen beim Boot automatisch gestartet werden.
         */
        if (
            entry.autoStart === true ||
            (
                entry.manifest &&
                entry.manifest.autoStart === true
            )
        ) {
            try {
                var result = await HD.runtime.start(entry.id);
                results.push({
                    id: entry.id,
                    success: true,
                    result: result
                });
            } catch (error) {
                results.push({
                    id: entry.id,
                    success: false,
                    error: error
                });
            }
        }
    }

    return results;
};


/* ============================================================
   APP REGISTRY
   ============================================================ */

HD.registry = HD.registry || {};


HD.registry._apps = HD.registry._apps || Object.create(null);


HD.registry.register = HD.registry.register || function (definition) {
    if (!definition || typeof definition !== 'object') {
        throw new TypeError('App-Definition ist ungültig.');
    }

    var id = String(
        definition.id ||
        definition.appId ||
        ''
    ).trim();

    if (!id) {
        throw new Error('Eine App benötigt eine eindeutige ID.');
    }

    var existing = HD.registry._apps[id];

    if (existing) {
        /*
         * Bestehende App nicht blind überschreiben.
         * Nur neue Daten ergänzen.
         */
        existing.name = definition.name || existing.name || id;
        existing.category =
            definition.category ||
            existing.category ||
            'system';

        if (definition.module) {
            existing.module = definition.module;
        }

        if (definition.manifest) {
            existing.manifest = Object.assign(
                {},
                existing.manifest || {},
                definition.manifest
            );
        }

        if (Array.isArray(definition.permissions)) {
            existing.permissions = definition.permissions.slice();
        }

        if (definition.settings) {
            existing.settings = Object.assign(
                {},
                existing.settings || {},
                definition.settings
            );
        }

        if (!existing.status) {
            existing.status = 'registered';
        }

        return existing;
    }

    var entry = {
        id: id,
        name: definition.name || id,
        category: definition.category || 'system',
        module: definition.module || null,
        manifest: definition.manifest || {},
        permissions: Array.isArray(definition.permissions)
            ? definition.permissions.slice()
            : [],
        settings: definition.settings || {},
        status: definition.status || 'registered',
        autoStart: definition.autoStart === true,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        error: null,
        startedAt: null
    };

    HD.registry._apps[id] = entry;

    HD.events.emit('registry:registered', {
        appId: id,
        entry: entry,
        timestamp: Date.now()
    });

    return entry;
};


HD.registry.get = HD.registry.get || function (id) {
    if (!id) {
        return null;
    }

    return HD.registry._apps[String(id).trim()] || null;
};


HD.registry.getAll = HD.registry.getAll || function () {
    return Object.keys(HD.registry._apps).map(function (id) {
        return HD.registry._apps[id];
    });
};


HD.registry.has = HD.registry.has || function (id) {
    return !!HD.registry.get(id);
};


HD.registry.unregister = HD.registry.unregister || function (id) {
    var normalizedId = String(id || '').trim();

    if (!normalizedId) {
        return false;
    }

    var existing = HD.registry._apps[normalizedId];

    if (!existing) {
        return false;
    }

    delete HD.registry._apps[normalizedId];

    HD.events.emit('registry:unregistered', {
        appId: normalizedId,
        timestamp: Date.now()
    });

    return true;
};


HD.registry.setStatus = HD.registry.setStatus || function (id, status) {
    var entry = HD.registry.get(id);

    if (!entry) {
        return false;
    }

    entry.status = status;
    entry.updatedAt = Date.now();

    HD.events.emit('registry:status', {
        appId: entry.id,
        status: status,
        timestamp: Date.now()
    });

    return true;
};

/* ============================================================

   ============================================================ */

HD.system.detectDeviceClass = function () {
    var width = window.innerWidth || 1024;

    var deviceClass = 'desktop';

    if (width < 600) {
        deviceClass = 'phone';
    } else if (width < 1024) {
        deviceClass = 'tablet';
    } else if (width < 1600) {
        deviceClass = 'laptop';
    }

    HD.system.state.deviceClass = deviceClass;

    document.documentElement.dataset.haldoDevice = deviceClass;

    HD.events.emit('system:device-class', {
        deviceClass: deviceClass,

        timestamp: Date.now()
    });

    return deviceClass;

   ============================================================ */

HD.storage = HD.storage || {};


HD.storage.prefix = HD.storage.prefix || 'haldo-ai-os:';


HD.storage.makeKey = function (key) {
    return HD.storage.prefix + String(key || '');
};


HD.storage.set = function (key, value) {
    try {
        var serialized = JSON.stringify(value);

        localStorage.setItem(
            HD.storage.makeKey(key),
            serialized
        );

        HD.events.emit('storage:set', {
            key: key,
            value: value,
            timestamp: Date.now()
        });

        return true;
    } catch (error) {
        HD.log.error(
            'Storage-Fehler beim Speichern von "' + key + '".',
            error
        );

        return false;
    }
};


HD.storage.get = function (key, fallback) {
    try {
        var raw = localStorage.getItem(
            HD.storage.makeKey(key)
        );

        if (raw === null) {
            return fallback;
        }

        return JSON.parse(raw);
    } catch (error) {
        HD.log.warn(
            'Storage-Fehler beim Lesen von "' + key + '".',
            error
        );

        return fallback;
    }
};


HD.storage.remove = function (key) {
    try {
        localStorage.removeItem(
            HD.storage.makeKey(key)
        );

        HD.events.emit('storage:remove', {
            key: key,
            timestamp: Date.now()
        });

        return true;
    } catch (error) {
        HD.log.error(
            'Storage-Fehler beim Entfernen von "' + key + '".',
            error
        );

        return false;
    }
};


HD.storage.clearNamespace = function () {
    try {
        var prefix = HD.storage.prefix;

        var keys = [];

        for (var i = 0; i < localStorage.length; i += 1) {
            var key = localStorage.key(i);

            if (key && key.indexOf(prefix) === 0) {
                keys.push(key);
            }
        }

        keys.forEach(function (key) {
            localStorage.removeItem(key);
        });

        HD.events.emit('storage:namespace-cleared', {
            timestamp: Date.now()
        });

        return true;
    } catch (error) {
        HD.log.error(
            'Storage-Namespace konnte nicht gelöscht werden.',
            error
        );

        return false;
    }
};


/* ============================================================
   FILE SERVICE

HD.files = HD.files || {};


HD.files.readText = async function (file) {
    if (!file) {
        throw new Error('Keine Datei angegeben.');
    }

    if (typeof file.text === 'function') {
        return file.text();
    }

    throw new Error('Datei unterstützt keine Textausgabe.');
};


HD.files.readJSON = async function (file) {
    var text = await HD.files.readText(file);

    try {
        return JSON.parse(text);
    } catch (error) {
        throw new Error(
            'Die Datei enthält kein gültiges JSON.'
        );
    }
};


HD.files.downloadText = function (
    filename,
    text,
    mimeType
) {
    var blob = new Blob(
        [String(text || '')],
        {
            type: mimeType || 'text/plain;charset=utf-8'
        }
    );

    var url = URL.createObjectURL(blob);

    var anchor = document.createElement('a');

    anchor.href = url;
    anchor.download = filename || 'haldo-export.txt';

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    setTimeout(function () {
        URL.revokeObjectURL(url);
    }, 1000);
};


HD.files.exportJSON = function (filename, data) {
    HD.files.downloadText(
        filename || 'haldo-export.json',
        JSON.stringify(data, null, 2),
        'application/json;charset=utf-8'
    );
};

/* ============================================================
   AI LOCAL FALLBACK
   ============================================================ */

HD.ai.localResponse = function (message) {
    var text = String(message || '').trim();

    if (!text) {
        return 'Ich bin bereit. Was möchtest du mich fragen?';
    }

    var lower = text.toLowerCase();

    if (
        lower.indexOf('hallo') !== -1 ||
        lower.indexOf('hey') !== -1 ||
        lower.indexOf('hi') !== -1
    ) {
        return 'Hallo! Ich bin HalDo AI. Schön, dass du da bist. Was möchtest du machen?';
    }

    if (
        lower.indexOf('wer bist du') !== -1 ||
        lower.indexOf('was bist du') !== -1
    ) {
        return 'Ich bin HalDo AI, die zentrale intelligente Assistenz des HalDo AI OS.';
    }

    if (
        lower.indexOf('öffne') !== -1 ||
        lower.indexOf('starte') !== -1
    ) {
        return 'Ich kann dir helfen, die gewünschte HalDo-App zu öffnen.';
    }

    return (
        'Ich habe deine Nachricht erhalten. ' +
        'Die lokale HalDo-AI-Schicht ist aktiv. ' +
        'Für erweiterte KI-Funktionen kann später ein lokales oder externes AI-Modell angebunden werden.'
    );
};


/* ============================================================
   AI CHAT
   ============================================================ */

HD.ai.chat = async function (message, options) {
    options = options || {};

    var text = String(message || '').trim();

    if (!text) {
        return {
            text: 'Was möchtest du mich fragen?',
            provider: 'local',
            local: true
        };
    }

    HD.ai.state.thinking = true;

    HD.events.emit('ai:thinking', {
        message: text,
        timestamp: Date.now()
    });

    try {
        /*
         * Externe Provider werden hier später über eine sichere
         * Backend-/Provider-Schicht eingebunden.
         *
         * Es werden keine Provider-Geheimnisse fest in index.html
         * hinterlegt.
         */

        var response = HD.ai.localResponse(text);

        /*
         * Kleine natürliche Verzögerung für den sichtbaren
         * Thinking-Zustand des Living-AI-Avatars.
         */
        if (options.simulatedThinking !== false) {
            await new Promise(function (resolve) {
                setTimeout(resolve, 180);
            });
        }

        HD.events.emit('ai:response', {
            input: text,
            response: response,
            provider: 'local',
            timestamp: Date.now()
        });

        return {
            text: response,
            provider: 'local',
            local: true
        };
    } finally {
        HD.ai.state.thinking = false;

        HD.events.emit('ai:thinking-end', {
            timestamp: Date.now()
        });
    }
};


/* ============================================================
   VOICE SERVICE
   ============================================================ */

HD.voice = HD.voice || {};


HD.voice.state = HD.voice.state || {
    supported: false,
    listening: false,
    speaking: false,
    language: 'de-DE'
};


HD.voice.detectSupport = function () {
    var recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    var synthesis =
        'speechSynthesis' in window;

    HD.voice.state.supported = !!(
        recognition ||
        synthesis
    );

    return HD.voice.state.supported;
};


HD.voice.speak = function (text, options) {
    options = options || {};

    var value = String(text || '').trim();

    if (!value) {
        return false;
    }

    if (!('speechSynthesis' in window)) {
        return false;
    }

    try {
        window.speechSynthesis.cancel();

        var utterance =
            new SpeechSynthesisUtterance(value);

        utterance.lang =
            options.language ||
            HD.voice.state.language ||
            'de-DE';

        utterance.rate =
            typeof options.rate === 'number'
                ? options.rate
                : 1;

        utterance.pitch =
            typeof options.pitch === 'number'
                ? options.pitch
                : 1;

        utterance.volume =
            typeof options.volume === 'number'
                ? options.volume
                : 1;

        utterance.onstart = function () {
            HD.voice.state.speaking = true;

            HD.events.emit('voice:start', {
                text: value,
                timestamp: Date.now()
            });
        };

        utterance.onend = function () {
            HD.voice.state.speaking = false;

            HD.events.emit('voice:end', {
                text: value,
                timestamp: Date.now()
            });
        };

        utterance.onerror = function (event) {
            HD.voice.state.speaking = false;

            HD.events.emit('voice:error', {
                event: event,
                timestamp: Date.now()
            });
        };

        window.speechSynthesis.speak(utterance);

        return true;
    } catch (error) {
        HD.log.warn(
            'Sprachausgabe konnte nicht gestartet werden.',
            error
        );

        return false;
    }
};


/* ============================================================
   VOICE INPUT
   ============================================================ */

HD.voice.listen = function (options) {
    options = options || {};

    var Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        HD.events.emit('voice:unsupported', {
            timestamp: Date.now()
        });

        return null;
    }

    var recognition = new Recognition();

    recognition.lang =
        options.language ||
        HD.voice.state.language ||
        'de-DE';

    recognition.continuous =
        options.continuous === true;

    recognition.interimResults =
        options.interimResults !== false;

    recognition.maxAlternatives = 3;

    recognition.onstart = function () {
        HD.voice.state.listening = true;

        HD.events.emit('voice:listening', {
            timestamp: Date.now()
        });
    };

    recognition.onresult = function (event) {
        var transcript = '';

        for (
            var i = event.resultIndex;
            i < event.results.length;
            i += 1
        ) {
            transcript +=
                event.results[i][0].transcript;
        }

        HD.events.emit('voice:result', {
            transcript: transcript.trim(),
            final: event.results[
                event.results.length - 1
            ].isFinal,
            timestamp: Date.now()
        });
    };

    recognition.onerror = function (event) {
        HD.voice.state.listening = false;

        HD.events.emit('voice:error', {
            event: event,
            timestamp: Date.now()
        });
    };

    recognition.onend = function () {
        HD.voice.state.listening = false;

        HD.events.emit('voice:end', {
            timestamp: Date.now()
        });
    };

    recognition.start();

    return recognition;
};

    value.id =

HD.windows = HD.windows || {};

HD.windows.register = function (windowDefinition) {
    if (!windowDefinition) {
        return null;
    }

    var id = String(
        windowDefinition.id ||
        (
            'window-' +
            Date.now() +
            '-' +
            Math.random()
                .toString(36)
                .slice(2, 7)
        )
    );

    var item = {
        id: id,
        appId: windowDefinition.appId || null,
        title: windowDefinition.title || 'HalDo',
        element: windowDefinition.element || null,
        minimized: false,
        maximized: false,
        closed: false,
        zIndex: 10,
        createdAt: Date.now()
    };

    HD.windows.items[id] = item;
    HD.windows.activeId = id;

    HD.events.emit('window:registered', item);

    return item;
};


HD.windows.get = function (id) {
    return HD.windows.items[id] || null;
};


HD.windows.focus = function (id) {
    var item = HD.windows.get(id);

    if (!item) {
        return false;
    }

    HD.windows.activeId = id;

    Object.keys(HD.windows.items).forEach(
        function (windowId) {
            HD.windows.items[windowId].zIndex = 10;
        }
    );

    item.zIndex = 1000;
    item.minimized = false;
    item.closed = false;

    if (item.element) {
        item.element.style.zIndex =
            String(item.zIndex);

        item.element.classList.add(
            'haldo-window-active'
        );
    }

    HD.events.emit('window:focus', {
        windowId: id,
        appId: item.appId,
        timestamp: Date.now()
    });

    return true;
};


HD.windows.minimize = function (id) {
    var item = HD.windows.get(id);

    if (!item) {
        return false;
    }

    item.minimized = true;

    if (item.element) {
        item.element.classList.add(
            'haldo-window-minimized'
        );
    }

    HD.events.emit('window:minimize', {
        windowId: id,
        appId: item.appId,
        timestamp: Date.now()
    });

    return true;
};


HD.windows.maximize = function (id) {
    var item = HD.windows.get(id);

    if (!item) {
        return false;
    }

    item.maximized =
        !item.maximized;

    if (item.element) {
        item.element.classList.toggle(
            'haldo-window-maximized',
            item.maximized
        );
    }

    HD.events.emit('window:maximize', {
        windowId: id,
        appId: item.appId,
        maximized: item.maximized,
        timestamp: Date.now()
    });

    return true;
};


HD.windows.close = function (id) {
    var item = HD.windows.get(id);

    if (!item) {
        return false;
    }

    item.closed = true;

    if (item.element) {
        item.element.remove();
    }

    delete HD.windows.items[id];

    if (HD.windows.activeId === id) {
        HD.windows.activeId = null;
    }

    HD.events.emit('window:close', {
        windowId: id,
        appId: item.appId,
        timestamp: Date.now()
    });

    return true;
};


/* ============================================================
   BOOT DIAGNOSTICS
   ============================================================ */

HD.diagnostics = HD.diagnostics || {};


HD.diagnostics.results =
    HD.diagnostics.results || [];


HD.diagnostics.test = function (
    name,
    testFunction
) {
    var result = {
        name: name,
        success: false,
        error: null,
        duration: 0
    };

    var started =
        performance.now();

    try {
        var output =
            testFunction();

        result.success = output !== false;
    } catch (error) {
        result.success = false;
        result.error = error;
    }

    result.duration =
        performance.now() - started;

    HD.diagnostics.results.push(
        result
    );

    return result;
};


HD.diagnostics.runBasic = function () {
    var results = [];

    results.push(
        HD.diagnostics.test(
            'DOM',
            function () {
                return !!document.body;
            }
        )
    );

    results.push(
        HD.diagnostics.test(
            'LocalStorage',
            function () {
                var key =
                    HD.storage.makeKey(
                        'diagnostic'
                    );

                localStorage.setItem(
                    key,
                    'ok'
                );

                var value =
                    localStorage.getItem(
                        key
                    );

                localStorage.removeItem(
                    key
                );

                return value === 'ok';
            }
        )
    );

    results.push(
        HD.diagnostics.test(
            'Speech Synthesis',
            function () {
                return (
                    'speechSynthesis' in window
                );
            }
        )
    );

    results.push(
        HD.diagnostics.test(
            'App Registry',
            function () {
                return (
                    HD.registry &&
                    typeof HD.registry.register ===
                        'function'
                );
            }
        )
    );

    return results;
};

            {
                width: window.innerWidth,
                height: window.innerHeight,
                timestamp: Date.now()
            }
        );
    }
);


/* ============================================================
   INITIAL SERVICE STATE
   ============================================================ */

HD.system.detectDeviceClass();
HD.voice.detectSupport();
HD.memory.load();
HD.language.set(
    HD.storage.get(
        'system.language',
        HD.system.state.language
    )
);

HD.display.setTheme(
    HD.storage.get(
        'display.theme',
        HD.display.state.theme
    )
);

HD.display.setAnimations(
    HD.storage.get(
        'display.animations',
        true
    )
);

HD.display.setReducedMotion(
    HD.storage.get(
        'display.reducedMotion',
        false
    )
);


/* ============================================================
   CENTRAL APP OPEN BRIDGE
   ============================================================ */

window.HalDoOpenApp = async function (
    appId,
    options
) {
    options = options || {};

    try {
        var result =
            await HD.runtime.open(
                appId,
                options
            );

        HD.events.emit(
            'haldo:app-opened',
            {
                appId: appId,
                result: result,
                timestamp: Date.now()
            }
        );

        return result;
    } catch (error) {
        HD.log.error(
            'HalDoOpenApp fehlgeschlagen.',
            error
        );

        HD.notifications.show(
            'Die App "' +
            appId +
            '" konnte nicht geöffnet werden.',
            {
                type: 'error'
            }
        );

        return null;
    }
};


/* ============================================================
   CENTRAL AI OPEN BRIDGE
   ============================================================ */

window.HalDoOpenAI = function (
    context
) {
    context = context || {};

    HD.events.emit(
        'ai:open',
        {
            context: context,
            timestamp: Date.now()
        }
    );

    /*
     * Der tatsächliche AI-Fensteraufbau wird später durch
     * Living HalDo AI + Window Manager übernommen.
     */
    if (
        typeof window.HalDoOpenAIWindow ===
        'function'
    ) {
        return window.HalDoOpenAIWindow(
            context
        );
    }

    return true;
};


/* ============================================================
   GLOBAL USER ACTION BRIDGE
   ============================================================ */

document.addEventListener(
    'click',
    function (event) {
        var target =
            event.target &&
            event.target.closest
                ? event.target.closest(
                    '[data-haldo-app]'
                )
                : null;

        if (!target) {
            return;
        }

        var appId =
            target.getAttribute(
                'data-haldo-app'
            );

        if (!appId) {
            return;
        }

        event.preventDefault();

        window.HalDoOpenApp(
            appId
        );
    }
);


/* ============================================================
   CENTRAL SETTINGS BRIDGE
   ============================================================ */

window.HalDoOpenSettings = function (
    section
) {
    HD.events.emit(
        'settings:open',
        {
            section: section || 'general',
            timestamp: Date.now()
        }
    );

    if (
        typeof window.HalDoOpenSettingsWindow ===
        'function'
    ) {
        return window.HalDoOpenSettingsWindow(
            section || 'general'
        );
    }

    return true;
};


/* ============================================================
   CENTRAL FILES BRIDGE
   ============================================================ */

window.HalDoOpenFiles = function () {
    HD.events.emit(
        'files:open',
        {
            timestamp: Date.now()
        }
    );

    return window.HalDoOpenApp(
        'files'
    );
};


/* ============================================================
   CENTRAL SYSTEM MENU BRIDGE
   ============================================================ */

window.HalDoToggleSystemMenu = function () {
    HD.events.emit(
        'menu:system-toggle',
        {
            timestamp: Date.now()
        }
    );

    var menu =
        document.getElementById(
            'haldo-system-menu'
        );

    if (menu) {
        menu.classList.toggle(
            'haldo-menu-visible'
        );

        menu.setAttribute(
            'aria-hidden',
            menu.classList.contains(
                'haldo-menu-visible'
            )
                ? 'false'
                : 'true'
        );

        return true;
    }

    return false;
};


/* ============================================================
   CENTRAL A–Z MENU BRIDGE
   ============================================================ */

window.HalDoToggleAppsMenu = function () {
    HD.events.emit(
        'menu:apps-toggle',
        {
            timestamp: Date.now()
        }
    );

    var menu =
        document.getElementById(
            'haldo-apps-menu'
        );

    if (menu) {
        menu.classList.toggle(
            'haldo-menu-visible'
        );

        menu.setAttribute(
            'aria-hidden',
            menu.classList.contains(
                'haldo-menu-visible'
            )
                ? 'false'
                : 'true'
        );

        return true;
    }

    return false;
};


/* ============================================================
   SAFE GLOBAL ERROR HANDLING
   ============================================================ */

window.addEventListener(
    'error',
    function (event) {
        HD.log.error(
            'Globaler JavaScript-Fehler.',
            event.error ||
            event.message
        );

        HD.events.emit(
            'system:error',
            {
                type: 'error',
                event: event,
                timestamp: Date.now()
            }
        );
    }
);


window.addEventListener(
    'unhandledrejection',
    function (event) {
        HD.log.error(
            'Unhandled Promise Rejection.',
            event.reason
        );

        HD.events.emit(
            'system:error',
            {
                type: 'unhandledrejection',
                reason: event.reason,
                timestamp: Date.now()
            }
        );
    }
);


/* ============================================================
   KERNEL CONNECTION
   ============================================================ */

if (
    window.HalDoKernel &&
    typeof window.HalDoKernel.on ===
        'function'
) {
    try {
        window.HalDoKernel.on(
            'kernel:ready',
            function () {
                HD.system.state.ready = true;

                HD.events.emit(
                    'kernel:ready',
                    {
                        timestamp: Date.now()
                    }
                );
            }
        );
    } catch (error) {
        HD.log.warn(
            'Kernel Event-Verbindung konnte nicht hergestellt werden.',
            error
        );
    }
}


/* ============================================================
   EXISTING GLOBAL HALDO OBJECT CONNECTION
   ============================================================ */

if (
    window.HalDo &&
    typeof window.HalDo === 'object'
) {
    /*
     * Bereits vorhandene APIs bleiben erhalten.
     * Nur fehlende zentrale Dienste werden ergänzt.
     */
    window.HalDo.runtime =
        HD.runtime;

    window.HalDo.registry =
        HD.registry;

    window.HalDo.system =
        HD.system;

    window.HalDo.storage =
        HD.storage;

    window.HalDo.ai =
        HD.ai;

    window.HalDo.voice =
        HD.voice;

    window.HalDo.language =
        HD.language;

    window.HalDo.memory =
        HD.memory;

    window.HalDo.security =
        HD.security;

    window.HalDo.notifications =
        HD.notifications;

    window.HalDo.display =
        HD.display;

    window.HalDo.windows =
        HD.windows;
}


/* ============================================================
   HALDO OS GLOBAL OBJECT
   ============================================================ */

window.HalDoOS =
    window.HalDoOS ||
    {};

window.HalDoOS.runtime =
    HD.runtime;

window.HalDoOS.registry =
    HD.registry;

window.HalDoOS.system =
    HD.system;

window.HalDoOS.storage =
    HD.storage;

window.HalDoOS.ai =
    HD.ai;

window.HalDoOS.voice =
    HD.voice;

window.HalDoOS.language =
    HD.language;

window.HalDoOS.memory =
    HD.memory;

window.HalDoOS.security =
    HD.security;

window.HalDoOS.notifications =
    HD.notifications;

window.HalDoOS.display =
    HD.display;

window.HalDoOS.windows =
    HD.windows;


/* ============================================================
   BOOT MARKER
   ============================================================ */

HD.system.state.booted = true;

HD.events.emit(
    'shell:services-ready',
    {
        version:
            HD.system.state.version,

        build:
            HD.system.state.build,

        timestamp:
            Date.now()
    }
);

</script>
  );

})();
</script>
