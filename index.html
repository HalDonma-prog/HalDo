        error:
          error
      };
    }
  }

  /* ============================================================
     9. APP ACTION AUSFÜHREN
     ============================================================ */

  async function executeAppAction(
    name,
    payload,
    options
  ) {
    const action =
      getAction(name);

    if (!action) {
      return {
        success: false,
        error:
          "App-Aktion nicht gefunden.",
        action:
          name
      };
    }

    if (!action.enabled) {
      return {
        success: false,
        error:
          "App-Aktion ist deaktiviert.",
        action:
          name
      };
    }

    try {
      let result;

      if (
        action.handler
      ) {
        result =
          await Promise.resolve(
            action.handler(
              payload || {},
              options || {}
            )
          );
      } else {
        const app =
          getApp(
            action.app
          );

        if (
          app &&
          HD.apps &&
          typeof HD.apps.executeAction ===
            "function"
        ) {
          result =
            await Promise.resolve(
              HD.apps.executeAction(
                action.name,
                payload || {}
              )
            );
        } else if (
          app &&
          HD.apps &&
          typeof HD.apps.launch ===
            "function"
        ) {
          result =
            await Promise.resolve(
              HD.apps.launch(
                app.id,
                {
                  action:
                    action.name,
                  payload:
                    payload || {}
                }
              )
            );
        }
      }

      emit(
        "ai:app-action-executed",
        {
          action:
            sanitizeAction(
              action
            ),
          result:
            result,
          timestamp:
            Date.now()
        }
      );

      return {
        success: true,
        action:
          action.name,
        app:
          action.app,
        result:
          result
      };
    } catch (error) {
      emit(
        "ai:app-action-error",
        {
          action:
            action.name,
          app:
            action.app,
          error:
            error,
          timestamp:
            Date.now()
        }
      );

      return {
        success: false,
        action:
          action.name,
        app:
          action.app,
        error:
          error
      };
    }
  }

  /* ============================================================
     10. APP CAPABILITY SUMMARY
     ============================================================ */

  function getAppCapabilities(
    appId
  ) {
    const id =
      normalizeKey(appId);

    const app =
      getApp(id);

    if (!app) {
      return {
        app: null,
        capabilities: [],
        commands: [],
        actions: []
      };
    }

    let capabilities = [];

    try {
      if (
        AI.capabilities &&
        typeof AI.capabilities.list ===
          "function"
      ) {
        capabilities =
          AI.capabilities
            .list()
            .filter(
              function (capability) {
                return (
                  normalizeKey(
                    capability.app
                  ) === id
                );
              }
            );
      }
    } catch (error) {
      console.warn(
        "[HalDo AI OS] Capability Summary Fehler:",
        error
      );
    }

    return {
      app:
        sanitizeApp(app),
      capabilities:
        capabilities,
      commands:
        listCommands({
          app: id
        }),
      actions:
        listActions({
          app: id
        })
    };
  }

  /* ============================================================
     11. APP ÖFFNEN ÜBER AI
     ============================================================ */

  async function openApp(
    query,
    options
  ) {
    const matches =
      searchApps(
        query,
        {
          installed: true,
          enabled: true,
          limit: 5
        }
      );

    if (!matches.length) {
      return {
        success: false,
        error:
          "Keine passende App gefunden.",
        query:
          query
      };
    }

    const selected =
      matches[0].app;

    let result = null;

    try {
      if (
        HD.apps &&
        typeof HD.apps.launch ===
          "function"
      ) {
        result =
          await Promise.resolve(
            HD.apps.launch(
              selected.id,
              options || {}
            )
          );
      } else if (
        HD.apps &&
        typeof HD.apps.open ===
          "function"
      ) {
        result =
          await Promise.resolve(
            HD.apps.open(
              selected.id,
              options || {}
            )
          );
      }
    } catch (error) {
      return {
        success: false,
        app:
          selected,
        error:
          error
      };
    }

    emit(
      "ai:app-opened",
      {
        app:
          selected,
        result:
          result,
        timestamp:
          Date.now()
      }
    );

    return {
      success: true,
      app:
        selected,
      result:
        result
    };
  }

  /* ============================================================
     12. AI APP REGISTRY API
     ============================================================ */

  const api = {
    version:
      "1.0.0",

    register:
      registerApp,

    unregister:
      unregisterApp,

    get:
      getApp,

    list:
      listApps,

    search:
      searchApps,

    open:
      openApp,

    capabilities:
      getAppCapabilities,

    commands: {
      register:
        registerAppCommands,

      get:
        getCommand,

      list:
        listCommands,

      execute:
        executeAppCommand
    },

    actions: {
      register:
        registerAppActions,

      get:
        getAction,

      list:
        listActions,

      execute:
        executeAppAction
    },

    diagnostics:
      function () {
        return {
          ready: true,
          version:
            api.version,
          apps:
            appRegistry.size,
          commands:
            commandRegistry.size,
          actions:
            actionRegistry.size,
          timestamp:
            Date.now()
        };
      }
  };

  /* ============================================================
     13. GLOBALE VERKNÜPFUNGEN
     ============================================================ */

  AI.appRegistry =
    api;

  AI.apps =
    api;

  AI.openApp =
    openApp;

  AI.executeAppCommand =
    executeAppCommand;

  AI.executeAppAction =
    executeAppAction;

  window.HalDoAIAppRegistry =
    api;

  /* ============================================================
     14. BESTEHENDE APP-REGISTRY ÜBERNEHMEN
     ============================================================ */

  function importExistingApps() {
    const candidates = [
      window.HalDoAppRegistry,
      window.HalDoOS?.appRegistry,
      HD.appRegistry
    ];

    candidates.forEach(
      function (candidate) {
        if (!candidate) {
          return;
        }

        let list = null;

        try {
          if (
            typeof candidate.list ===
            "function"
          ) {
            list =
              candidate.list();
          } else if (
            typeof candidate.getAll ===
            "function"
          ) {
            list =
              candidate.getAll();
          } else if (
            Array.isArray(
              candidate.apps
            )
          ) {
            list =
              candidate.apps;
          }
        } catch (error) {
          console.warn(
            "[HalDo AI OS] Vorhandene App Registry konnte nicht gelesen werden:",
            error
          );
        }

        if (
          !Array.isArray(list)
        ) {
          return;
        }

        list.forEach(
          function (app) {
            try {
              registerApp(
                app
              );
            } catch (error) {
              console.warn(
                "[HalDo AI OS] Bestehende App konnte nicht übernommen werden:",
                error
              );
            }
          }
        );
      }
    );
  }

  importExistingApps();

  /* ============================================================
     15. KERNEL APP EVENTS
     ============================================================ */

  try {
    const kernel =
      window.HalDoKernel ||
      window.HalDoOS?.kernel;

    if (
      kernel &&
      typeof kernel.on ===
        "function"
    ) {
      kernel.on(
        "app:registered",
        function (app) {
          try {
            registerApp(
              app
            );
          } catch (error) {
            console.warn(
              "[HalDo AI OS] App Event Import Fehler:",
              error
            );
          }
        }
      );

      kernel.on(
        "app:ready",
        function (app) {
          try {
            const registered =
              registerApp(
                app,
                {
                  ready:
                    true
                }
              );

            emit(
              "ai:app-ready",
              {
                app:
                  sanitizeApp(
                    registered
                  ),
                timestamp:
                  Date.now()
              }
            );
          } catch (error) {
            console.warn(
              "[HalDo AI OS] App Ready Fehler:",
              error
            );
          }
        }
      );

      kernel.on(
        "app:unregistered",
        function (app) {
          try {
            const id =
              typeof app ===
              "string"
                ? app
                : app &&
                  (
                    app.id ||
                    app.appId ||
                    app.name
                  );

            if (id) {
              unregisterApp(
                id
              );
            }
          } catch (error) {
            console.warn(
              "[HalDo AI OS] App Unregister Event Fehler:",
              error
            );
          }
        }
      );
    }
  } catch (error) {
    console.warn(
      "[HalDo AI OS] Kernel App Bridge Fehler:",
      error
    );
  }

  /* ============================================================
     16. AI COMMAND / ACTION BRIDGE
     ============================================================ */

  if (
    typeof AI.registerCommand !==
    "function"
  ) {
    AI.registerCommand =
      function (
        name,
        handler,
        metadata
      ) {
        return registerAppCommands({
          id:
            "ai-core",
          name:
            "HalDo AI",
          commands: [
            {
              name:
                name,
              handler:
                handler,
              ...(metadata || {})
            }
          ]
        });
      };
  }

  if (
    typeof AI.registerAction !==
    "function"
  ) {
    AI.registerAction =
      function (
        name,
        handler,
        metadata
      ) {
        return registerAppActions({
          id:
            "ai-core",
          name:
            "HalDo AI",
          actions: [
            {
              name:
                name,
              handler:
                handler,
              ...(metadata || {})
            }
          ]
        });
      };
  }

  /* ============================================================
     17. DIAGNOSE
     ============================================================ */

  const diagnostics =
    api.diagnostics();

  emit(
    "ai:app-registry-ready",
    {
      version:
        api.version,
      diagnostics:
        diagnostics,
      timestamp:
        Date.now()
    }
  );

  console.log(
    "[HalDo AI OS] Teil 10/16 — AI App Registry & Manifest Bridge ready."
  );

})();

<script>
(function () {
    'use strict';

    const root = window.HalDo || (window.HalDo = {});
    const OS = window.HalDoOS || (window.HalDoOS = {});
    const AI = root.ai || root.AI || (root.ai = {});

    const events = root.events || {};
    const services = AI.services || root.services || {};
    const capabilities = AI.capabilities || {};
    const appRegistry = AI.appRegistry || AI.apps || {};

    const existingRouter = AI.router || {};

    const state = {
        ready: false,
        executing: false,
        lastRequest: null,
        lastPlan: null,
        lastResult: null,
        history: [],
        maxHistory: 100
    };

    const router = existingRouter;

    /* ------------------------------------------------------------
       UTILITIES
       ------------------------------------------------------------ */

    function emit(name, detail) {
        try {
            if (events && typeof events.emit === 'function') {
                events.emit(name, detail);
            }
        } catch (_) {}

        try {
            document.dispatchEvent(
                new CustomEvent('haldo:' + name, {
                    detail: detail || {}
                })
            );
        } catch (_) {}
    }

    function safeString(value, fallback) {
        if (value === undefined || value === null) {
            return fallback || '';
        }

        return String(value).trim();
    }

    function normalizeText(value) {
        return safeString(value)
            .toLowerCase()
            .replace(/[„“”«»]/g, '"')
            .replace(/[’‘]/g, "'")
            .replace(/\s+/g, ' ')
            .trim();
    }

    function unique(values) {
        return Array.from(
            new Set(
                (Array.isArray(values) ? values : [])
                    .filter(Boolean)
                    .map(value => safeString(value))
            )
        );
    }

    function clone(value) {
        try {
            return JSON.parse(JSON.stringify(value));
        } catch (_) {
            return value;
        }
    }

    function getAIIntent(text, options) {
        try {
            if (AI.intent && typeof AI.intent.classify === 'function') {
                return AI.intent.classify(text, options || {});
            }
        } catch (error) {
            emit('ai:router-intent-error', {
                text,
                error: error && error.message
                    ? error.message
                    : String(error)
            });
        }

        return {
            type: 'unknown',
            confidence: 0,
            text: safeString(text)
        };
    }

    /* ------------------------------------------------------------
       LANGUAGE / PARAMETER EXTRACTION
       ------------------------------------------------------------ */

    function stripCommandPrefix(text) {
        let value = safeString(text);

        const prefixes = [
            /^bitte\s+/i,
            /^kannst du\s+/i,
            /^kannst du bitte\s+/i,
            /^könntest du\s+/i,
            /^öffne bitte\s+/i,
            /^starte bitte\s+/i,
            /^schließe bitte\s+/i,
            /^zeige mir\s+/i,
            /^zeig mir\s+/i,
            /^mach bitte\s+/i
        ];

        prefixes.forEach(pattern => {
            value = value.replace(pattern, '');
        });

        return value.trim();
    }

    function extractQuotedValues(text) {
        const source = safeString(text);
        const values = [];

        const patterns = [
            /"([^"]+)"/g,
            /„([^“]+)“/g,
            /«([^»]+)»/g,
            /'([^']+)'/g
        ];

        patterns.forEach(pattern => {
            let match;

            while ((match = pattern.exec(source)) !== null) {
                if (match[1]) {
                    values.push(match[1].trim());
                }
            }
        });

        return unique(values);
    }

    function extractSearchQuery(text) {
        const source = safeString(text);

        const patterns = [
            /(?:suche|suchen|such)\s+(?:nach\s+)?(.+)$/i,
            /(?:search)\s+(?:for\s+)?(.+)$/i,
            /(?:finde|finden)\s+(.+)$/i,
            /(?:google)\s+(.+)$/i,
            /(?:im\s+internet\s+)?nach\s+(.+)\s+suchen$/i
        ];

        for (const pattern of patterns) {
            const match = source.match(pattern);

            if (match && match[1]) {
                return match[1]
                    .replace(/[?.!]+$/, '')
                    .trim();
            }
        }

        return '';
    }

    function extractAppName(text) {
        const source = stripCommandPrefix(text);

        const patterns = [
            /^(?:öffne|öffnen|starte|starten|launch|open)\s+(.+)$/i,
            /^(?:schließe|schliessen|beende|beenden|close)\s+(.+)$/i,
            /^(?:zeige|zeigen)\s+(.+)$/i
        ];

        for (const pattern of patterns) {
            const match = source.match(pattern);

            if (match && match[1]) {
                return match[1]
                    .replace(/[?.!]+$/, '')
                    .trim();
            }
        }

        return '';
    }

    function extractSpeechText(text) {
        const source = safeString(text);

        const patterns = [
            /^(?:sag|sage|sprich|sprich bitte)\s+(.+)$/i,
            /^(?:lies|lese)\s+(.+)$/i,
            /^(?:sprich aus)\s+(.+)$/i
        ];

        for (const pattern of patterns) {
            const match = source.match(pattern);

            if (match && match[1]) {
                return match[1]
                    .replace(/^["']|["']$/g, '')
                    .trim();
            }
        }

        return '';
    }

    function extractWindowTarget(text) {
        const source = safeString(text);

        const patterns = [
            /(?:schließe|schliesse|close)\s+(?:das\s+)?(?:fenster\s+)?(.+)$/i,
            /(?:fokussiere|focus)\s+(?:das\s+)?(?:fenster\s+)?(.+)$/i
        ];

        for (const pattern of patterns) {
            const match = source.match(pattern);

            if (match && match[1]) {
                return match[1].trim();
            }
        }

        return '';
    }

    function extractParameters(text, intent) {
        const source = safeString(text);

        const params = {
            rawText: source,
            normalizedText: normalizeText(source),
            quoted: extractQuotedValues(source),
            searchQuery: extractSearchQuery(source),
            appName: extractAppName(source),
            speechText: extractSpeechText(source),
            windowTarget: extractWindowTarget(source)
        };

        if (
            intent &&
            intent.type === 'search' &&
            !params.searchQuery
        ) {
            params.searchQuery = source
                .replace(/^(suche|search|google)\s*/i, '')
                .trim();
        }

        if (
            intent &&
            intent.type === 'app' &&
            !params.appName
        ) {
            params.appName = source
                .replace(/^(öffne|starte|open|launch)\s+/i, '')
                .trim();
        }

        params.tokens = unique(
            normalizeText(source)
                .split(/\s+/)
                .filter(token => token.length > 1)
        );

        return params;
    }

    /* ------------------------------------------------------------
       APP / CAPABILITY RESOLUTION
       ------------------------------------------------------------ */

    function resolveApp(name, options) {
        const query = safeString(name);

        if (!query) {
            return null;
        }

        try {
            if (
                appRegistry &&
                typeof appRegistry.searchApps === 'function'
            ) {
                const results = appRegistry.searchApps(
                    query,
                    options || {}
                );

                if (Array.isArray(results) && results.length) {
                    return results[0];
                }
            }
        } catch (_) {}

        try {
            if (
                appRegistry &&
                typeof appRegistry.getApp === 'function'
            ) {
                return appRegistry.getApp(query);
            }
        } catch (_) {}

        return null;
    }

    function resolveCapability(query, options) {
        try {
            if (
                capabilities &&
                typeof capabilities.resolve === 'function'
            ) {
                return capabilities.resolve(query, options || {});
            }
        } catch (_) {}

        try {
            if (
                AI &&
                typeof AI.resolveCapability === 'function'
            ) {
                return AI.resolveCapability(query, options || {});
            }
        } catch (_) {}

        try {
            if (
                AI &&
                typeof AI.searchCapabilities === 'function'
            ) {
                const results = AI.searchCapabilities(
                    query,
                    options || {}
                );

                if (Array.isArray(results) && results.length) {
                    return results[0];
                }
            }
        } catch (_) {}

        return null;
    }

    function resolveBuiltInRoute(text, intent, params) {
        const normalized = normalizeText(text);

        if (
            intent.type === 'search' ||
            params.searchQuery
        ) {
            return {
                kind: 'capability',
                target: 'search.query',
                parameters: {
                    query: params.searchQuery || text
                }
            };
        }

        if (
            params.speechText
        ) {
            return {
                kind: 'capability',
                target: 'voice.speak',
                parameters: {
                    text: params.speechText
                }
            };
        }

        if (
            /(?:zeige|anzeigen|öffne|starte)\s+(?:desktop|schreibtisch)/i.test(normalized)
        ) {
            return {
                kind: 'service',
                target: 'windows.showDesktop',
                parameters: {}
            };
        }

        if (
            /(?:schließe|schliesse|beende)\s+(?:alle\s+)?fenster/i.test(normalized)
        ) {
            return {
                kind: 'service',
                target: 'windows.closeAll',
                parameters: {}
            };
        }

        if (
            /(?:zurück|zurueck|back)/i.test(normalized)
        ) {
            return {
                kind: 'service',
                target: 'navigation.back',
                parameters: {}
            };
        }

        if (
            /(?:startseite|home|nach\s+hause)/i.test(normalized)
        ) {
            return {
                kind: 'service',
                target: 'navigation.home',
                parameters: {}
            };
        }

        return null;
    }

    function resolveRoute(text, intent, params, options) {
        const builtIn = resolveBuiltInRoute(
            text,
            intent,
            params
        );

        if (builtIn) {
            return builtIn;
        }

        if (
            params.appName &&
            appRegistry
        ) {
            const app = resolveApp(
                params.appName,
                options
            );

            if (app) {
                return {
                    kind: 'app',
                    target: app.id,
                    app,
                    parameters: {
                        query: params.appName
                    }
                };
            }
        }

        const capabilityQuery =
            safeString(params.appName) ||
            safeString(text);

        const capability = resolveCapability(
            capabilityQuery,
            options
        );

        if (capability) {
            return {
                kind: 'capability',
                target:
                    capability.id ||
                    capability.name ||
                    capability.key,
                capability,
                parameters: params
            };
        }

        return {
            kind: 'none',
            target: null,
            parameters: params
        };
    }

    /* ------------------------------------------------------------
       PERMISSION / STATE GATE
       ------------------------------------------------------------ */

    function checkAppState(app) {
        if (!app) {
            return {
                allowed: true,
                reason: null
            };
        }

        if (app.enabled === false) {
            return {
                allowed: false,
                reason: 'app-disabled'
            };
        }

        if (
            app.installed === false &&
            app.installed !== undefined
        ) {
            return {
                allowed: false,
                reason: 'app-not-installed'
            };
        }

        return {
            allowed: true,
            reason: null
        };
    }

    function checkPermissions(route, options) {
        options = options || {};

        if (options.skipPermissionCheck === true) {
            return {
                allowed: true,
                reason: 'permission-check-skipped'
            };
        }

        if (
            route &&
            route.app
        ) {
            const appState = checkAppState(
                route.app
            );

            if (!appState.allowed) {
                return appState;
            }
        }

        if (
            route &&
            route.capability &&
            route.capability.enabled === false
        ) {
            return {
                allowed: false,
                reason: 'capability-disabled'
            };
        }

        return {
            allowed: true,
            reason: null
        };
    }

    /* ------------------------------------------------------------
       EXECUTION PLAN
       ------------------------------------------------------------ */

    function createPlan(text, options) {
        options = options || {};

        const intent = getAIIntent(
            text,
            options
        );

        const params = extractParameters(
            text,
            intent
        );

        const route = resolveRoute(
            text,
            intent,
            params,
            options
        );

        const permission = checkPermissions(
            route,
            options
        );

        const plan = {
            id:
                'hd-plan-' +
                Date.now().toString(36) +
                '-' +
                Math.random()
                    .toString(36)
                    .slice(2, 8),

            createdAt: new Date().toISOString(),

            text: safeString(text),

            intent: clone(intent),

            parameters: clone(params),

            route: clone({
                kind: route.kind,
                target: route.target,
                app: route.app
                    ? {
                        id: route.app.id,
                        name: route.app.name,
                        title: route.app.title,
                        enabled: route.app.enabled,
                        installed: route.app.installed,
                        ready: route.app.ready
                    }
                    : null
            }),

            permission: clone(permission),

            executable:
                permission.allowed &&
                route.kind !== 'none',

            requiresConfirmation:
                options.requireConfirmation === true,

            metadata: {
                source:
                    options.source ||
                    'haldo-ai-router',

                userInitiated:
                    options.userInitiated !== false
            }
        };

        state.lastPlan = plan;

        emit('ai:execution-plan-created', {
            plan: clone(plan)
        });

        return plan;
    }

    /* ------------------------------------------------------------
       SERVICE EXECUTION
       ------------------------------------------------------------ */

    async function executeService(route, plan) {
        const target = safeString(route.target);

        const parts = target.split('.');

        if (parts.length < 2) {
            throw new Error(
                'Ungültiger Service-Pfad: ' +
                target
            );
        }

        const serviceName = parts.shift();
        const methodName = parts.join('.');

        let service = null;

        try {
            if (
                services &&
                typeof services.getService === 'function'
            ) {
                service =
                    services.getService(
                        serviceName
                    );
            }
        } catch (_) {}

        if (!service) {
            service =
                root[serviceName] ||
                AI[serviceName] ||
                OS[serviceName] ||
                null;
        }

        if (!service) {
            throw new Error(
                'Service nicht gefunden: ' +
                serviceName
            );
        }

        const args =
            route.parameters || {};

        const method =
            methodName
                .split('.')
                .reduce(
                    (object, key) =>
                        object
                            ? object[key]
                            : undefined,
                    service
                );

        if (typeof method !== 'function') {
            throw new Error(
                'Service-Methode nicht gefunden: ' +
                target
            );
        }

        return await method.call(
            service,
            args,
            plan
        );
    }

    /* ------------------------------------------------------------
       CAPABILITY EXECUTION
       ------------------------------------------------------------ */

    async function executeCapability(route, plan) {
        const capabilityId =
            safeString(route.target);

        if (
            AI &&
            typeof AI.executeCapability === 'function'
        ) {
            return await AI.executeCapability(
                capabilityId,
                route.parameters || {},
                {
                    plan,
                    source: 'ai-router'
                }
            );
        }

        if (
            capabilities &&
            typeof capabilities.execute === 'function'
        ) {
            return await capabilities.execute(
                capabilityId,
                route.parameters || {},
                {
                    plan,
                    source: 'ai-router'
                }
            );
        }

        throw new Error(
            'Capability-Ausführung nicht verfügbar: ' +
            capabilityId
        );
    }

    /* ------------------------------------------------------------
       APP EXECUTION
       ------------------------------------------------------------ */

    async function executeApp(route, plan) {
        const appId =
            safeString(route.target);

        if (
            AI &&
            typeof AI.openApp === 'function'
        ) {
            return await AI.openApp(
                appId,
                {
                    source: 'ai-router',
                    parameters:
                        route.parameters || {},
                    plan
                }
            );
        }

        if (
            AI &&
            AI.appRegistry &&
            typeof AI.appRegistry.openApp === 'function'
        ) {
            return await AI.appRegistry.openApp(
                appId,
                {
                    source: 'ai-router',
                    parameters:
                        route.parameters || {},
                    plan
                }
            );
        }

        if (
            root.apps &&
            typeof root.apps.launch === 'function'
        ) {
            return await root.apps.launch(
                appId,
                route.parameters || {}
            );
        }

        throw new Error(
            'App-Ausführung nicht verfügbar: ' +
            appId
        );
    }

    /* ------------------------------------------------------------
       UNIVERSAL EXECUTION
       ------------------------------------------------------------ */

    async function executePlan(plan, options) {
        options = options || {};

        if (!plan) {
            throw new Error(
                'Kein Ausführungsplan vorhanden.'
            );
        }

        if (!plan.executable) {
            return {
                success: false,
                blocked: true,
                reason:
                    plan.permission &&
                    plan.permission.reason
                        ? plan.permission.reason
                        : 'not-executable',
                plan
            };
        }

        if (
            plan.requiresConfirmation &&
            options.confirmed !== true
        ) {
            return {
                success: false,
                confirmationRequired: true,
                plan
            };
        }

        state.executing = true;

        emit('ai:execution-start', {
            plan: clone(plan)
        });

        try {
            let value;

            if (plan.route.kind === 'app') {
                value = await executeApp(
                    plan.route,
                    plan
                );
            } else if (
                plan.route.kind === 'capability'
            ) {
                value = await executeCapability(
                    plan.route,
                    plan
                );
            } else if (
                plan.route.kind === 'service'
            ) {
                value = await executeService(
                    plan.route,
                    plan
                );
            } else {
                throw new Error(
                    'Keine ausführbare Route vorhanden.'
                );
            }

            const result = {
                success: true,
                value,
                plan: clone(plan),
                completedAt:
                    new Date().toISOString()
            };

            state.lastResult = result;

            state.history.push(
                clone(result)
            );

            if (
                state.history.length >
                state.maxHistory
            ) {
                state.history.shift();
            }

            emit('ai:execution-complete', {
                result: clone(result)
            });

            return result;
        } catch (error) {
            const result = {
                success: false,
                error:
                    error &&
                    error.message
                        ? error.message
                        : String(error),
                plan: clone(plan),
                completedAt:
                    new Date().toISOString()
            };

            state.lastResult = result;

            state.history.push(
                clone(result)
            );

            emit('ai:execution-error', {
                result: clone(result)
            });

            throw error;
        } finally {
            state.executing = false;
        }
    }

    /* ------------------------------------------------------------
       PUBLIC ROUTER API
       ------------------------------------------------------------ */

    router.extractParameters =
        extractParameters;

    router.resolveApp =
        resolveApp;

    router.resolveCapability =
        resolveCapability;

    router.resolveRoute =
        resolveRoute;

    router.checkPermissions =
        checkPermissions;

    router.createPlan =
        createPlan;

    router.executePlan =
        executePlan;

    router.route = async function (
        text,
        options
    ) {
        options = options || {};

        const source = safeString(text);

        if (!source) {
            return {
                success: false,
                error: 'Leere AI-Anfrage.'
            };
        }

        state.lastRequest = {
            text: source,
            options: clone(options),
            createdAt:
                new Date().toISOString()
        };

        emit('ai:route-start', {
            text: source,
            options: clone(options)
        });

        try {
            const plan =
                createPlan(
                    source,
                    options
                );

            if (
                plan.route.kind === 'none'
            ) {
                const result = {
                    success: false,
                    resolved: false,
                    plan
                };

                emit('ai:route-unresolved', {
                    result: clone(result)
                });

                return result;
            }

            if (
                plan.requiresConfirmation &&
                options.confirmed !== true
            ) {
                return {
                    success: false,
                    confirmationRequired: true,
                    plan
                };
            }

            const result =
                await executePlan(
                    plan,
                    options
                );

            emit('ai:route-complete', {
                result: clone(result)
            });

            return result;
        } catch (error) {
            const result = {
                success: false,
                error:
                    error &&
                    error.message
                        ? error.message
                        : String(error),
                request: state.lastRequest,
                plan: state.lastPlan
                    ? clone(state.lastPlan)
                    : null
            };

            emit('ai:route-error', {
                result: clone(result)
            });

            return result;
        }
    };

    router.process =
        router.route;

    router.execute =
        router.executePlan;

    router.getState =
        function () {
            return {
                ready: state.ready,
                executing:
                    state.executing,
                lastRequest:
                    clone(state.lastRequest),
                lastPlan:
                    clone(state.lastPlan),
                lastResult:
                    clone(state.lastResult),
                historyLength:
                    state.history.length
            };
        };

    router.getHistory =
        function () {
            return clone(
                state.history
            );
        };

    router.clearHistory =
        function () {
            state.history = [];

            emit(
                'ai:execution-history-cleared'
            );

            return true;
        };

    router.diagnostics =
        function () {
            return {
                ready: state.ready,
                executing:
                    state.executing,

                services:
                    services &&
                    typeof services.listServices ===
                        'function'
                        ? services.listServices()
                        : [],

                apps:
                    appRegistry &&
                    typeof appRegistry.listApps ===
                        'function'
                        ? appRegistry.listApps().length
                        : 0,

                lastRequest:
                    clone(state.lastRequest),

                lastPlan:
                    clone(state.lastPlan),

                lastResult:
                    clone(state.lastResult),

                historyLength:
                    state.history.length
            };
        };

    /* ------------------------------------------------------------
       HIGH-LEVEL AI API
       ------------------------------------------------------------ */

    if (
        typeof AI.route !== 'function'
    ) {
        AI.route =
            router.route;
    }

    if (
        typeof AI.executePlan !== 'function'
    ) {
        AI.executePlan =
            router.executePlan;
    }

    if (
        typeof AI.createExecutionPlan !==
        'function'
    ) {
        AI.createExecutionPlan =
            router.createPlan;
    }

    if (
        typeof AI.extractParameters !==
        'function'
    ) {
        AI.extractParameters =
            router.extractParameters;
    }

    /* ------------------------------------------------------------
       NATURAL LANGUAGE SHORTCUT
       ------------------------------------------------------------ */

    AI.commandRouter =
        router;

    root.aiRouter =
        router;

    OS.aiRouter =
        router;

    window.HalDoAIRouter =
        router;

    window.HalDoAIExecution =
        router;

    /* ------------------------------------------------------------
       OPTIONAL BRIDGE TO EXISTING AI PROCESSOR
       ------------------------------------------------------------ */

    if (
        AI.orchestrator &&
        typeof AI.orchestrator.processMessage ===
            'function' &&
        !AI.orchestrator.__haldoRouterBridge
    ) {
        const originalProcess =
            AI.orchestrator.processMessage;

        AI.orchestrator.processMessage =
            async function (
                text,
                options
            ) {
                options = options || {};

                if (
                    options.skipRouter === true
                ) {
                    return originalProcess.call(
                        this,
                        text,
                        options
                    );
                }

                const routeResult =
                    await router.route(
                        text,
                        {
                            ...options,
                            source:
                                options.source ||
                                'ai-orchestrator'
                        }
                    );

                if (
                    routeResult &&
                    routeResult.success
                ) {
                    return {
                        handledBy:
                            'ai-router',
                        route:
                            routeResult,
                        text:
                            safeString(text)
                    };
                }

                if (
                    routeResult &&
                    routeResult.confirmationRequired
                ) {
                    return routeResult;
                }

                return originalProcess.call(
                    this,
                    text,
                    {
                        ...options,
                        skipRouter: true
                    }
                );
            };

        AI.orchestrator
            .processMessage
            .__haldoRouterBridge = true;
    }

    /* ------------------------------------------------------------
       EVENT BRIDGES
       ------------------------------------------------------------ */

    try {
        if (
            window.HalDoKernel &&
            typeof window.HalDoKernel.on ===
                'function'
        ) {
            window.HalDoKernel.on(
                'app:registered',
                function (payload) {
                    emit(
                        'ai:router-app-updated',
                        payload
                    );
                }
            );

            window.HalDoKernel.on(
                'app:ready',
                function (payload) {
                    emit(
                        'ai:router-app-ready',
                        payload
                    );
                }
            );
        }
    } catch (_) {}

    /* ------------------------------------------------------------
       READY
       ------------------------------------------------------------ */

    state.ready = true;

    emit(
        'ai:natural-language-router-ready',
        {
            router:
                'HalDoAIRouter',
            version:
                '11.0.0',
            features: [
                'intent-routing',
                'parameter-extraction',
                'app-resolution',
                'capability-resolution',
                'permission-gateway',
                'execution-plans',
                'service-execution',
                'capability-execution',
                'app-execution',
                'execution-history',
                'diagnostics'
            ]
        }
    );

    try {
        console.info(
            '[HalDo AI OS] Teil 11/16 — AI Natural Language Router + Execution Gateway ready.'
        );
    } catch (_) {}

})();

<script>
(function () {
    'use strict';

    const root = window.HalDo || (window.HalDo = {});
    const OS = window.HalDoOS || (window.HalDoOS = {});
    const AI = root.ai || root.AI || (root.ai = {});
    const events = root.events || {};

    const existingSecurity =
        AI.security ||
        AI.permissions ||
        {};

    const security = existingSecurity;

    const state = {
        ready: false,
        policies: new Map(),
        confirmations: new Map(),
        audit: [],
        maxAudit: 250,
        lastDecision: null
    };

    /* ------------------------------------------------------------
       BASIC HELPERS
       ------------------------------------------------------------ */

    function emit(name, detail) {
        try {
            if (
                events &&
                typeof events.emit === 'function'
            ) {
                events.emit(name, detail);
            }
        } catch (_) {}

        try {
            document.dispatchEvent(
                new CustomEvent(
                    'haldo:' + name,
                    {
                        detail:
                            detail || {}
                    }
                )
            );
        } catch (_) {}
    }

    function text(value) {
        if (
            value === undefined ||
            value === null
        ) {
            return '';
        }

        return String(value).trim();
    }

    function normalize(value) {
        return text(value)
            .toLowerCase()
            .replace(/\s+/g, ' ')
            .trim();
    }

    function clone(value) {
        try {
            return JSON.parse(
                JSON.stringify(value)
            );
        } catch (_) {
            return value;
        }
    }

    function id(prefix) {
        return (
            prefix +
            '-' +
            Date.now().toString(36) +
            '-' +
            Math.random()
                .toString(36)
                .slice(2, 9)
        );
    }

    /* ------------------------------------------------------------
       DEFAULT POLICY
       ------------------------------------------------------------ */

    const defaultPolicy = {
        allowConversation: true,
        allowSearch: true,
        allowAppLaunch: true,
        allowNavigation: true,
        allowWindowControl: true,
        allowVoice: true,
        allowMemoryRead: true,
        allowMemoryWrite: true,
        allowSystemRead: true,
        allowSystemWrite: false,

        requireConfirmationFor: [
            'system.write',
            'system.reset',
            'storage.clear',
            'storage.delete',
            'memory.clear',
            'app.uninstall',
            'app.remove',
            'window.closeAll'
        ],

        blockedCapabilities: [],

        blockedApps: [],

        blockedCommands: [],

        blockedActions: []
    };

    /* ------------------------------------------------------------
       POLICY MANAGEMENT
       ------------------------------------------------------------ */

    function normalizePolicy(policy) {
        return {
            ...defaultPolicy,
            ...(policy || {}),

            requireConfirmationFor:
                Array.isArray(
                    policy &&
                    policy.requireConfirmationFor
                )
                    ? policy.requireConfirmationFor
                    : [
                        ...defaultPolicy
                            .requireConfirmationFor
                    ],

            blockedCapabilities:
                Array.isArray(
                    policy &&
                    policy.blockedCapabilities
                )
                    ? policy.blockedCapabilities
                    : [],

            blockedApps:
                Array.isArray(
                    policy &&
                    policy.blockedApps
                )
                    ? policy.blockedApps
                    : [],

            blockedCommands:
                Array.isArray(
                    policy &&
                    policy.blockedCommands
                )
                    ? policy.blockedCommands
                    : [],

            blockedActions:
                Array.isArray(
                    policy &&
                    policy.blockedActions
                )
                    ? policy.blockedActions
                    : []
        };
    }

    function setPolicy(
        name,
        policy
    ) {
        const key =
            text(name) ||
            'default';

        const normalized =
            normalizePolicy(policy);

        state.policies.set(
            key,
            normalized
        );

        emit(
            'ai:security-policy-updated',
            {
                name: key,
                policy:
                    clone(normalized)
            }
        );

        return clone(normalized);
    }

    function getPolicy(name) {
        const key =
            text(name) ||
            'default';

        if (
            state.policies.has(key)
        ) {
            return clone(
                state.policies.get(key)
            );
        }

        return clone(
            state.policies.get(
                'default'
            ) ||
            defaultPolicy
        );
    }

    function removePolicy(name) {
        const key = text(name);

        if (!key || key === 'default') {
            return false;
        }

        return state.policies.delete(
            key
        );
    }

    function listPolicies() {
        return Array.from(
            state.policies.entries()
        ).map(
            ([name, policy]) => ({
                name,
                policy:
                    clone(policy)
            })
        );
    }

    /* ------------------------------------------------------------
       AUDIT LOG
       ------------------------------------------------------------ */

    function audit(
        type,
        data
    ) {
        const entry = {
            id: id('audit'),
            timestamp:
                new Date().toISOString(),
            type:
                text(type) ||
                'unknown',
            data:
                clone(data || {})
        };

        state.audit.push(entry);

        if (
            state.audit.length >
            state.maxAudit
        ) {
            state.audit.shift();
        }

        emit(
            'ai:security-audit',
            clone(entry)
        );

        return entry;
    }

    function getAudit(limit) {
        const amount =
            Number(limit) > 0
                ? Number(limit)
                : state.audit.length;

        return clone(
            state.audit.slice(
                -amount
            )
        );
    }

    function clearAudit() {
        state.audit = [];

        emit(
            'ai:security-audit-cleared'
        );

        return true;
    }

    /* ------------------------------------------------------------
       DANGER CLASSIFICATION
       ------------------------------------------------------------ */

    function classifyRisk(input) {
        const source =
            normalize(
                typeof input === 'string'
                    ? input
                    : (
                        input &&
                        (
                            input.text ||
                            input.target ||
                            input.id ||
                            input.name
                        )
                    )
            );

        if (!source) {
            return {
                level: 'low',
                score: 0,
                reasons: []
            };
        }

        const criticalPatterns = [
            /system\.reset/i,
            /factory\s*reset/i,
            /delete\s+all/i,
            /lösche\s+alles/i,
            /alle\s+daten\s+löschen/i,
            /storage\.clear/i,
            /memory\.clear/i,
            /uninstall/i,
            /deinstall/i
        ];

        const highPatterns = [
            /passwort/i,
            /kennwort/i,
            /credential/i,
            /zugangsdaten/i,
            /löschen/i,
            /delete/i,
            /entfernen/i,
            /remove/i,
            /reset/i,
            /shutdown/i,
            /herunterfahren/i
        ];

        const mediumPatterns = [
            /schließe/i,
            /schliesse/i,
            /close/i,
            /öffne/i,
            /starte/i,
            /launch/i,
            /install/i,
            /ändern/i,
            /ändern/i,
            /write/i,
            /speicher/i
        ];

        const reasons = [];

        let score = 0;

        criticalPatterns.forEach(
            pattern => {
                if (
                    pattern.test(
                        source
                    )
                ) {
                    score += 80;
                    reasons.push(
                        'critical-pattern'
                    );
                }
            }
        );

        highPatterns.forEach(
            pattern => {
                if (
                    pattern.test(
                        source
                    )
                ) {
                    score += 35;
                    reasons.push(
                        'high-risk-pattern'
                    );
                }
            }
        );

        mediumPatterns.forEach(
            pattern => {
                if (
                    pattern.test(
                        source
                    )
                ) {
                    score += 10;
                    reasons.push(
                        'medium-risk-pattern'
                    );
                }
            }
        );

        score = Math.min(
            score,
            100
        );

        let level = 'low';

        if (score >= 80) {
            level = 'critical';
        } else if (score >= 50) {
            level = 'high';
        } else if (score >= 20) {
            level = 'medium';
        }

        return {
            level,
            score,
            reasons:
                Array.from(
                    new Set(reasons)
                )
        };
    }

    /* ------------------------------------------------------------
       TARGET IDENTIFICATION
       ------------------------------------------------------------ */

    function identifyTarget(plan) {
        if (!plan) {
            return {
                type: 'unknown',
                id: ''
            };
        }

        const route =
            plan.route || {};

        if (
            route.kind === 'app'
        ) {
            return {
                type: 'app',
                id:
                    text(
                        route.target
                    )
            };
        }

        if (
            route.kind === 'capability'
        ) {
            return {
                type: 'capability',
                id:
                    text(
                        route.target
                    )
            };
        }

        if (
            route.kind === 'service'
        ) {
            return {
                type: 'service',
                id:
                    text(
                        route.target
                    )
            };
        }

        if (
            plan.intent &&
            plan.intent.type
        ) {
            return {
                type:
                    text(
                        plan.intent.type
                    ),
                id: ''
            };
        }

        return {
            type: 'unknown',
            id: ''
        };
    }

    /* ------------------------------------------------------------
       POLICY MATCHING
       ------------------------------------------------------------ */

    function listContains(
        list,
        value
    ) {
        if (
            !Array.isArray(list)
        ) {
            return false;
        }

        const target =
            normalize(value);

        return list.some(
            item =>
                normalize(item) ===
                target
        );
    }

    function requiresConfirmation(
        plan,
        policy
    ) {
        if (!plan) {
            return false;
        }

        if (
            plan.requiresConfirmation ===
            true
        ) {
            return true;
        }

        const target =
            identifyTarget(plan);

        if (
            listContains(
                policy.requireConfirmationFor,
                target.id
            )
        ) {
            return true;
        }

        if (
            plan.intent &&
            listContains(
                policy.requireConfirmationFor,
                plan.intent.type
            )
        ) {
            return true;
        }

        const risk =
            classifyRisk(
                plan.text
            );

        return (
            risk.level === 'critical' ||
            risk.level === 'high'
        );
    }

    function evaluatePolicy(
        plan,
        options
    ) {
        options = options || {};

        const policy =
            getPolicy(
                options.policy ||
                'default'
            );

        const target =
            identifyTarget(
                plan
            );

        const risk =
            classifyRisk(
                plan
            );

        const reasons = [];

        let allowed = true;

        if (
            target.type ===
            'capability'
        ) {
            if (
                listContains(
                    policy.blockedCapabilities,
                    target.id
                )
            ) {
                allowed = false;

                reasons.push(
                    'capability-blocked'
                );
            }
        }

        if (
            target.type === 'app'
        ) {
            if (
                listContains(
                    policy.blockedApps,
                    target.id
                )
            ) {
                allowed = false;

                reasons.push(
                    'app-blocked'
                );
            }
        }

        if (
            target.type === 'service'
        ) {
            if (
                /^system\./i.test(
                    target.id
                ) &&
                /(?:write|reset|delete|clear)/i
                    .test(target.id)
            ) {
                if (
                    policy.allowSystemWrite !==
                    true
                ) {
                    allowed = false;

                    reasons.push(
                        'system-write-disabled'
                    );
                }
            }
        }

        if (
            plan.intent
        ) {
            const intent =
                normalize(
                    plan.intent.type
                );

            if (
                intent === 'search' &&
                policy.allowSearch === false
            ) {
                allowed = false;

                reasons.push(
                    'search-disabled'
                );
            }

            if (
                intent === 'app' &&
                policy.allowAppLaunch === false
            ) {
                allowed = false;

                reasons.push(
                    'app-launch-disabled'
                );
            }

            if (
                intent === 'navigation' &&
                policy.allowNavigation === false
            ) {
                allowed = false;

                reasons.push(
                    'navigation-disabled'
                );
            }

            if (
                intent === 'conversation' &&
                policy.allowConversation === false
            ) {
                allowed = false;

                reasons.push(
                    'conversation-disabled'
                );
            }
        }

        const confirmation =
            requiresConfirmation(
                plan,
                policy
            );

        const decision = {
            allowed,
            requiresConfirmation:
                confirmation,
            risk,
            reasons,
            target,
            policy: options.policy ||
                'default'
        };

        state.lastDecision =
            clone(decision);

        audit(
            allowed
                ? 'policy-allowed'
                : 'policy-blocked',
            {
                planId:
                    plan &&
                    plan.id,
                decision
            }
        );

        emit(
            'ai:security-decision',
            clone(decision)
        );

        return decision;
    }

    /* ------------------------------------------------------------
       CONFIRMATION TOKENS
       ------------------------------------------------------------ */

    function createConfirmation(
        plan,
        options
    ) {
        options = options || {};

        const token =
            id('confirm');

        const expiresIn =
            Number(
                options.expiresIn
            ) > 0
                ? Number(
                    options.expiresIn
                )
                : 120000;

        const confirmation = {
            token,
            planId:
                plan &&
                plan.id
                    ? plan.id
                    : null,

            createdAt:
                Date.now(),

            expiresAt:
                Date.now() +
                expiresIn,

            used: false
        };

        state.confirmations.set(
            token,
            confirmation
        );

        emit(
            'ai:confirmation-created',
            {
                confirmation:
                    clone(
                        confirmation
                    )
            }
        );

        return clone(
            confirmation
        );
    }

    function validateConfirmation(
        token,
        planId
    ) {
        const key =
            text(token);

        if (!key) {
            return {
                valid: false,
                reason:
                    'missing-token'
            };
        }

        const confirmation =
            state.confirmations.get(
                key
            );

        if (!confirmation) {
            return {
                valid: false,
                reason:
                    'invalid-token'
            };
        }

        if (
            confirmation.used
        ) {
            return {
                valid: false,
                reason:
                    'token-already-used'
            };
        }

        if (
            Date.now() >
            confirmation.expiresAt
        ) {
            state.confirmations.delete(
                key
            );

            return {
                valid: false,
                reason:
                    'token-expired'
            };
        }

        if (
            planId &&
            confirmation.planId &&
            confirmation.planId !==
                planId
        ) {
            return {
                valid: false,
                reason:
                    'plan-mismatch'
            };
        }

        return {
            valid: true,
            confirmation:
                clone(
                    confirmation
                )
        };
    }

    function consumeConfirmation(
        token
    ) {
        const key =
            text(token);

        const confirmation =
            state.confirmations.get(
                key
            );

        if (!confirmation) {
            return false;
        }

        confirmation.used =
            true;

        state.confirmations.set(
            key,
            confirmation
        );

        return true;
    }

    /* ------------------------------------------------------------
       SECURE PLAN GATE
       ------------------------------------------------------------ */

    function securePlan(
        plan,
        options
    ) {
        options = options || {};

        if (!plan) {
            return {
                allowed: false,
                reason:
                    'missing-plan'
            };
        }

        const decision =
            evaluatePolicy(
                plan,
                options
            );

        if (!decision.allowed) {
            return {
                allowed: false,
                blocked: true,
                reason:
                    decision.reasons[0] ||
                    'policy-blocked',
                decision,
                plan
            };
        }

        if (
            decision.requiresConfirmation
        ) {
            const validation =
                validateConfirmation(
                    options.confirmationToken,
                    plan.id
                );

            if (
                validation.valid
            ) {
                consumeConfirmation(
                    options.confirmationToken
                );

                return {
                    allowed: true,
                    confirmed: true,
                    decision,
                    plan
                };
            }

            const confirmation =
                createConfirmation(
                    plan,
                    options
                );

            return {
                allowed: false,
                confirmationRequired:
                    true,
                confirmation,
                decision,
                plan
            };
        }

        return {
            allowed: true,
            confirmed: false,
            decision,
            plan
        };
    }

    /* ------------------------------------------------------------
       SECURE ROUTER BRIDGE
       ------------------------------------------------------------ */

    const router =
        AI.router ||
        AI.commandRouter;

    if (
        router &&
        typeof router.executePlan ===
            'function' &&
        !router.__haldoSecurityBridge
    ) {
        const originalExecutePlan =
            router.executePlan;

        router.executePlan =
            async function (
                plan,
                options
            ) {
                options = options || {};

                if (
                    options.skipSecurity ===
                    true
                ) {
                    return originalExecutePlan.call(
                        this,
                        plan,
                        options
                    );
                }

                const gate =
                    securePlan(
                        plan,
                        options
                    );

                if (
                    !gate.allowed
                ) {
                    return gate;
                }

                return originalExecutePlan.call(
                    this,
                    plan,
                    {
                        ...options,
                        securityChecked:
                            true
                    }
                );
            };

        router
            .executePlan
            .__haldoSecurityBridge =
            true;
    }

    /* ------------------------------------------------------------
       PUBLIC SECURITY API
       ------------------------------------------------------------ */

    security.state =
        state;

    security.policy =
        defaultPolicy;

    security.setPolicy =
        setPolicy;

    security.getPolicy =
        getPolicy;

    security.removePolicy =
        removePolicy;

    security.listPolicies =
        listPolicies;

    security.classifyRisk =
        classifyRisk;

    security.evaluatePolicy =
        evaluatePolicy;

    security.securePlan =
        securePlan;

    security.createConfirmation =
        createConfirmation;

    security.validateConfirmation =
        validateConfirmation;

    security.consumeConfirmation =
        consumeConfirmation;

    security.getAudit =
        getAudit;

    security.clearAudit =
        clearAudit;

    security.diagnostics =
        function () {
            return {
                ready:
                    state.ready,

                policies:
                    listPolicies()
                        .length,

                pendingConfirmations:
                    state.confirmations
                        .size,

                auditEntries:
                    state.audit.length,

                lastDecision:
                    clone(
                        state.lastDecision
                    )
            };
        };

    AI.security =
        security;

    AI.permissions =
        security;

    root.aiSecurity =
        security;

    OS.aiSecurity =
        security;

    window.HalDoAISecurity =
        security;

    window.HalDoAIPermissions =
        security;

    /* ------------------------------------------------------------
       DEFAULT POLICY INITIALIZATION
       ------------------------------------------------------------ */

    if (
        !state.policies.has(
            'default'
        )
    ) {
        setPolicy(
            'default',
            defaultPolicy
        );
    }

    /* ------------------------------------------------------------
       READY EVENT
       ------------------------------------------------------------ */

    state.ready = true;

    emit(
        'ai:security-gateway-ready',
        {
            version:
                '12.0.0',

            features: [
                'permission-policy',
                'risk-classification',
                'confirmation-gateway',
                'confirmation-tokens',
                'execution-audit',
                'capability-blocking',
                'app-blocking',
                'system-write-protection',
                'router-security-bridge'
            ]
        }
    );

    try {
        console.info(
            '[HalDo AI OS] Teil 12/16 — AI Permission / Safety / Confirmation Gateway ready.'
        );
    } catch (_) {}

})();

<script>
(function () {

    /* ------------------------------------------------------------
       HELPERS
       ------------------------------------------------------------ */

    function emit(name, detail) {

    function str(value, fallback) {
        if (
            value === undefined ||
            value === null
        ) {
            return fallback || '';
        }

        return String(value).trim();
    }

    function norm(value) {
        return str(value)
            .toLowerCase()
            .replace(/[„“”«»]/g, '"')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function clone(value) {
        try {
            return JSON.parse(
                JSON.stringify(value)
            );
        } catch (_) {
            return value;
        }
    }

    function makeId(prefix) {

            Date.now().toString(36) +
            '-' +
            Math.random()
                .toString(36)
                .slice(2, 8)
        );
    }

    function unique(values) {
        return Array.from(
            new Set(
                (Array.isArray(values)
                    ? values
                    : []
                )
                    .filter(Boolean)
                    .map(v => str(v))
            )
        );
    }

    /* ------------------------------------------------------------
       CONTEXT SNAPSHOT
       ------------------------------------------------------------ */

    function getContext() {

            if (

        try {
            if (
                root.context &&

            ) {

        };

    function getSession() {

            }
