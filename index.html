<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Architect Version</title>
    <style>
        /* 1. SYSTEM-KERN: Display ohne weiße Fehler */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        
        /* 2. RENDER-EBENE: Sterne, Galaxie, Sonne */
        #deep-space-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        /* 3. OS-EBENE: Das Interface (Glassmorphism) */
        #os-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .window { 
            position: absolute; 
            background: rgba(0, 0, 20, 0.7); 
            backdrop-filter: blur(15px); 
            border: 1px solid #00aaff; 
            border-radius: 16px; 
            pointer-events: auto; 
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.3);
        }
        
        /* Chat und Dateien */
        #chat-window { bottom: 20px; right: 20px; width: 400px; height: 350px; padding: 10px; }
        #file-manager-window { top: 20px; left: 20px; width: 300px; height: 400px; padding: 15px; }
        
        /* Kontroll-Panel (Die korrigierten Punkte) */
        #status-bar { position: fixed; top: 20px; right: 50%; transform: translateX(50%); z-index: 20; background: rgba(0, 0, 0, 0.8); padding: 10px 20px; border-radius: 30px; display: flex; gap: 15px; border: 1px solid #00aaff; }
        .system-dot { width: 15px; height: 15px; border-radius: 50%; }
        #dot-red { background: #ff0000; cursor: pointer; }
        #dot-green { background: #00ff00; cursor: pointer; }
        #dot-blue { background: #00aaff; cursor: pointer; }
        
        /* Entwickler-Ansicht: Daten und Updates */
        #dev-log { position: fixed; bottom: 20px; left: 20px; z-index: 30; color: #00aaff; font-family: monospace; font-size: 12px; text-align: left; text-shadow: 0 0 10px #00aaff; }
    </style>
</head>
<body>

<!-- Ebene 2: Das Universum (Hier laufen Planeten und Sterne) -->
<canvas id="deep-space-canvas"></canvas>

<!-- Ebene 3: Das Design System -->
<div id="os-layer">
    <div id="chat-window" class="window">
        <h3 style="color:#00aaff;">HalDo AI Chat</h3>
        <textarea id="chat-log" style="background:transparent; color:#fff; border:none; width:100%; height:200px;"></textarea>
        <input id="chat-input" placeholder="Bruder, gib mir deine Befehle..." style="width:90%; padding:10px; background:#111; color:#fff; border-radius:8px;">
        <br>
        <button onclick="haldoSpeak()" style="background:#00aaff; color:#fff;">🔊 Stimme</button>
        <button onclick="haldoListen()" style="background:#00ff00; color:#000;">🎙️ Mikrofon</button>
    </div>
    
    <div id="file-manager-window" class="window">
        <h3 style="color:#00aaff;">🗂️ Daten, Dateien & Updates</h3>
        <p>📁 Kernel: <span style="color:#00ff00;">Online</span></p>
        <p>📁 Datenbank: <span style="color:#00ff00;">Verbunden</span></p>
        <p>📁 Software: <span style="color:#ffaa00;">v2.4.1</span></p>
        <button onclick="updateSystem()" style="background:#ffaa00; padding:8px;">Update ausführen</button>
    </div>
</div>

<!-- Ebene 1: Die Statusleiste mit den Punkten -->
<div id="status-bar">
    <div class="system-dot" id="dot-red" onclick="closeApp()" title="X - Schließen"></div>
    <div class="system-dot" id="dot-green" onclick="activateMic()" title="🎙️ Mikrofon"></div>
    <div class="system-dot" id="dot-blue" onclick="activateSpeaker()" title="🔊 Lautsprecher"></div>
</div>

<!-- Ebene 4: Der Live-Log für System-Updates -->
<div id="dev-log">
    ▍[System]: Kernel geladen<br>
    ▍[System]: Cosmische Engine (Planeten & Sonne) bereit<br>
    ▍[HalDo]: Warte auf Befehle, Bruder...
</div>

<script>
    // [KERNEL] - Funktionen für die Oberfläche
    function updateLog(msg) {
        const log = document.getElementById('dev-log');
        log.innerHTML += '<br>▍[System]: ' + msg;
    }

    function closeApp() {
        document.getElementById('chat-window').style.display = 'none';
        updateLog('Chatfenster geschlossen.');
    }

    // [UI] - Die gestellten Anforderungen für Mikrofon & Lautsprecher
    function activateSpeaker() {
        const say = new SpeechSynthesisUtterance('Systeme sind bereit, Bruder.');
        say.lang = 'de-DE';
        window.speechSynthesis.speak(say);
    }

    function activateMic() {
        updateLog('Mikrofon wird gestartet...');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'de-DE';
        recognition.start();
        recognition.onresult = (event) => {
            document.getElementById('chat-input').value = event.results[0][0].transcript;
            updateLog('Sprache erkannt: ' + event.results[0][0].transcript);
        };
    }

    function haldoListen() { activateMic(); }
    function haldoSpeak() { activateSpeaker(); }

    function updateSystem() {
        updateLog('Sucht nach Updates... (Version 2.4.1)');
        setTimeout(() => { updateLog('Update abgeschlossen. System stabil.'); }, 2000);
    }

    // [UNIVERSUM] - Die neue 3D-Engine (Sterne, Planeten, Galaxie)
    const canvas = document.getElementById('deep-space-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for (let i = 0; i < 500; i++) {
        stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 2, alpha: Math.random() });
    }

    function drawUniverse() {
        // Hintergrund dunkelblau (kein weiß!)
        ctx.fillStyle = '#050a15';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sterne
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + s.alpha + ')';
            ctx.fill();
        });

        // Die strahlende Sonne mit Partikeln
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 120, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, 200);
        gradient.addColorStop(0, '#fff');
        gradient.addColorStop(0.5, '#ff9900');
        gradient.addColorStop(1, '#ff0000');
        ctx.fillStyle = gradient;
        ctx.fill();

        requestAnimationFrame(drawUniverse);
    }
    drawUniverse();
</script>
</body>
</html>
