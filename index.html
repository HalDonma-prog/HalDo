<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Interaktive Systeme</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #050a15 0%, #000 100%); font-family: 'Segoe UI', sans-serif; color: #fff; }
        
        /* Universum Hintergrund */
        #universe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Der Cyborg (wie auf dem Bild) */
        #cyborg-container { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
        #cyborg-img { height: 650px; filter: drop-shadow(0 0 30px #00aaff); pointer-events: auto; }

        /* Stil der leuchtenden Fenster (Hologramm-Look) */
        .os-window {
            position: absolute;
            background: rgba(5, 20, 50, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid #00aaff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.5), inset 0 0 20px rgba(0, 170, 255, 0.2);
            z-index: 50;
            cursor: grab;
            user-select: none;
            color: #fff;
        }

        .os-window:active { cursor: grabbing; }

        #chat-window { bottom: 30px; right: 30px; width: 380px; height: 300px; }
        #chat-header { background: #002244; padding: 10px; border-radius: 10px 10px 0 0; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00aaff; }
        #chat-body { padding: 15px; height: 180px; overflow-y: auto; }
        
        #file-window { top: 20px; left: 20px; width: 280px; padding: 10px; }
        #file-header { background: #002244; padding: 10px; margin: -10px -10px 10px -10px; border-radius: 10px 10px 0 0; cursor: move; border-bottom: 1px solid #00aaff; }
        .file-item { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
        .file-item:hover { background: rgba(0,170,255,0.2); }

        #sun-window { top: 100px; left: 40%; width: 300px; height: 200px; display: none; }

        #status-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; gap: 12px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 30px; border: 1px solid #00aaff; }
        .dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; transition: transform 0.2s; }
        .dot:hover { transform: scale(1.2); }

        /* Design der Statuspunkte (wie dein Bild) */
        #btn-close { background: #ff0000; }
        #btn-mic { background: #00ff00; }
        #btn-spk { background: #00aaff; }
        #btn-sun { background: #ffaa00; }
        #btn-files { background: #ff00ff; }
        
        #dev-log { position: absolute; bottom: 10px; left: 20px; color: #00ff00; font-family: monospace; font-size: 12px; z-index: 200; text-shadow: 0 0 5px #00ff00; }

        .window-controls { display: flex; gap: 5px; }
        .control-btn { width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer; font-size: 10px; line-height: 20px; color: white; background: gray; }
        .btn-close-window { background: red; }
        .btn-min-window { background: yellow; }
    </style>
</head>
<body>

<canvas id="universe"></canvas>

<!-- Dein Cyborg Bild hier einfügen -->
<div id="cyborg-container">
    <!-- ÄNDERE HIER: src="cyborg.png" (Datei muss im selben Ordner liegen) -->
    <img id="cyborg-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Android_robot_%28no_shadow%29.svg/1024px-Android_robot_%28no_shadow%29.svg.png" alt="HalDo Cyborg">
</div>

<div id="status-bar">
    <div class="dot" id="btn-close" onclick="closeAllWindows()"></div>
    <div class="dot" id="btn-mic" onclick="activateMic()"></div>
    <div class="dot" id="btn-spk" onclick="activateSpeaker()"></div>
    <div class="dot" id="btn-sun" onclick="toggleSunWindow()" title="Sonne öffnen"></div>
    <div class="dot" id="btn-files" onclick="toggleFileWindow()" title="Dateien öffnen"></div>
</div>

<!-- Fenster 1: Chat -->
<div id="chat-window" class="os-window">
    <div id="chat-header" class="drag-handle">
        <span>💬 HalDo AI Chat</span>
        <div class="window-controls">
            <button class="control-btn btn-min-window" onclick="minimizeWindow('chat-window')">–</button>
            <button class="control-btn btn-close-window" onclick="closeWindow('chat-window')">X</button>
        </div>
    </div>
    <div id="chat-body">Willkommen Bruder. Die Systeme sind verbunden.</div>
    <input id="chat-input" type="text" placeholder="Befehl eingeben..." style="width:90%; margin:10px; padding:8px; background:#111; color:#fff; border-radius:5px; border:1px solid #00aaff;" onkeydown="if(event.key==='Enter') sendMessage()">
</div>

<!-- Fenster 2: Dateien & Daten -->
<div id="file-window" class="os-window">
    <div id="file-header" class="drag-handle">
        <span>🗂️ Innere Systeme & Daten</span>
        <div class="window-controls">
            <button class="control-btn btn-min-window" onclick="minimizeWindow('file-window')">–</button>
            <button class="control-btn btn-close-window" onclick="closeWindow('file-window')">X</button>
        </div>
    </div>
    <div class="file-item">📁 Dokumente</div>
    <div class="file-item">📁 Musik</div>
    <div class="file-item">📁 Videos</div>
    <div class="file-item">📁 System-Datenbank</div>
    <div class="file-item">📁 HalDo AI Logs</div>
</div>

<!-- Fenster 3: Sonne (wird per Klick geöffnet) -->
<div id="sun-window" class="os-window">
    <div id="file-header" class="drag-handle">
        <span>☀️ Sonnenkern</span>
        <div class="window-controls">
            <button class="control-btn btn-min-window" onclick="minimizeWindow('sun-window')">–</button>
            <button class="control-btn btn-close-window" onclick="closeWindow('sun-window')">X</button>
        </div>
    </div>
    <div style="padding: 20px; text-align: center;">
        <p style="color: #ffaa00; font-size: 20px; font-weight: bold;">Energiequelle Aktiv</p>
        <p>Temperatur: 5.500 °C</p>
        <p>Status: Stabil</p>
        <button onclick="alert('Sonnen-Energie wird geladen...')" style="background:#ffaa00; border:none; padding:10px; color:#000; border-radius:5px; cursor:pointer;">Energie freisetzen</button>
    </div>
</div>

<div id="dev-log">
    > Systeme geladen...<br>
    > Dateien verbunden...<br>
    > Warte auf Befehle...
</div>

<script>
    // --- DRAG & DROP SYSTEM (Fenster bewegen) ---
    document.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
            const windowEl = handle.parentElement;
            let offsetX = e.clientX - windowEl.getBoundingClientRect().left;
            let offsetY = e.clientY - windowEl.getBoundingClientRect().top;

            function mouseMoveHandler(e) {
                windowEl.style.left = (e.clientX - offsetX) + 'px';
                windowEl.style.top = (e.clientY - offsetY) + 'px';
            }

            function mouseUpHandler() {
                document.removeEventListener('mousemove', mouseMoveHandler);
                document.removeEventListener('mouseup', mouseUpHandler);
            }

            document.addEventListener('mousemove', mouseMoveHandler);
            document.addEventListener('mouseup', mouseUpHandler);
        });
    });

    // --- INNERE SYSTEME & APP-FUNKTIONEN ---
    function closeWindow(id) { document.getElementById(id).style.display = 'none'; }
    function minimizeWindow(id) { document.getElementById(id).style.transform = 'scale(0.1)'; document.getElementById(id).style.opacity = '0'; setTimeout(() => { document.getElementById(id).style.transform = 'scale(1)'; document.getElementById(id).style.opacity = '1'; document.getElementById(id).style.display = 'none'; }, 300); }
    function closeAllWindows() { closeWindow('chat-window'); closeWindow('file-window'); closeWindow('sun-window'); }
    function toggleSunWindow() { const w = document.getElementById('sun-window'); w.style.display = (w.style.display === 'none') ? 'block' : 'none'; }
    function toggleFileWindow() { const w = document.getElementById('file-window'); w.style.display = (w.style.display === 'none') ? 'block' : 'none'; }
    
    // --- AUDIO & CHAT ---
    function activateSpeaker() {
        const u = new SpeechSynthesisUtterance('Systeme sind bereit, Bruder. Dateien und Sonne sind aktiv.');
        u.lang = 'de-DE';
        speechSynthesis.speak(u);
    }
    function activateMic() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'de-DE';
        rec.start();
        rec.onresult = (e) => {
            document.getElementById('chat-input').value = e.results[0][0].transcript;
            sendMessage(e.results[0][0].transcript);
        };
    }
    function sendMessage(text = null) {
        const input = document.getElementById('chat-input');
        const msg = text || input.value;
        if (!msg) return;
        const body = document.getElementById('chat-body');
        body.innerHTML += `<br><b>Bruder:</b> ${msg}`;
        input.value = "";
        setTimeout(() => { body.innerHTML += `<br><b>HalDo:</b> System antwortet...`; }, 800);
    }

    // --- DAS SONNEN- & PLANETENSYSTEM (KORRIGIERT) ---
    // Planeten drehen sich langsam um die Sonne
    const canvas = document.getElementById('universe');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for (let i = 0; i < 1000; i++) {
        stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, a: Math.random() });
    }

    const sun = { x: canvas.width / 2, y: canvas.height / 2 };

    // 12 Planeten (Geschwindigkeiten extrem langsam & flüssig)
    const planets = [
        { r: 30, size: 6, color: "#b0b0b0", speed: 0.0005, offset: 0 },
        { r: 50, size: 10, color: "#FFD700", speed: 0.0004, offset: 1.5 },
        { r: 70, size: 12, color: "#4B90C2", speed: 0.00035, offset: 2.8 },
        { r: 90, size: 9, color: "#C1440E", speed: 0.0003, offset: 4.0 },
        { r: 120, size: 25, color: "#D8CA9D", speed: 0.00025, offset: 5.2 },
        { r: 150, size: 22, color: "#EEDC82", speed: 0.0002, offset: 6.4, ring: true },
        { r: 180, size: 14, color: "#00FFFF", speed: 0.00018, offset: 7.6 },
        { r: 210, size: 14, color: "#4169E1", speed: 0.00015, offset: 8.8 },
        { r: 240, size: 5, color: "#F5F5DC", speed: 0.00012, offset: 10.0 },
        { r: 270, size: 5, color: "#8A2BE2", speed: 0.0001, offset: 11.2 },
        { r: 300, size: 4, color: "#FFFFFF", speed: 0.00008, offset: 12.4 },
        { r: 330, size: 6, color: "#FFB6C1", speed: 0.00006, offset: 13.6 }
    ];

    let t = 0;
    function drawUniverse() {
        ctx.fillStyle = '#050a15';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Sterne zeichnen
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${s.a})`;
            ctx.fill();
        });

        // Sonne (Sanftes Leuchten, KEIN ständiges Drehen im Inneren)
        let gradient = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 150);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.4, '#ffaa00');
        gradient.addColorStop(1, '#ff3300');
        ctx.beginPath();
        ctx.arc(sun.x, sun.y, 100, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Planeten (Umlaufbahn, KEINE schnelle Eigenrotation)
        planets.forEach(p => {
            let angle = (t * p.speed) + p.offset;
            let x = sun.x + Math.cos(angle) * p.r;
            let y = sun.y + Math.sin(angle) * p.r;

            // Bahn zeichnen
            ctx.beginPath();
            ctx.ellipse(sun.x, sun.y, p.r, p.r, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,170,255,0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Planetenkörper
            ctx.beginPath();
            ctx.arc(x, y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (p.ring) {
                ctx.beginPath();
                ctx.ellipse(x, y, p.size * 2, p.size * 0.5, 0.3, 0, Math.PI * 2);
                ctx.strokeStyle = '#EEDC82';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        });

        t += 1;
        requestAnimationFrame(drawUniverse);
    }

    // Sonne klickbar machen (Öffnet das Fenster)
    canvas.addEventListener('click', (e) => {
        const dist = Math.sqrt(Math.pow(e.clientX - sun.x, 2) + Math.pow(e.clientY - sun.y, 2));
        if (dist < 100) { // Wenn man auf die Sonne klickt
            toggleSunWindow();
        }
    });

    // Größe anpassen
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        sun.x = canvas.width / 2;
        sun.y = canvas.height / 2;
    });

    drawUniverse();
</script>
</body>
</html>
