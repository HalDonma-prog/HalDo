<script>
(function () {
    "use strict";

    const root =
        window.HalDo ||
        window.HalDoOS ||
        (window.HalDo = {});

    const OS =
        window.HalDoOS ||
        (window.HalDoOS = root);

    const AI =
        root.ai ||
        root.AI ||
        OS.ai ||
        OS.AI ||
        window.HalDoAI ||
        (window.HalDoAI = {});

    root.ai = AI;
    root.AI = AI;
    OS.ai = AI;
    OS.AI = AI;

    /* =========================================================
       BASIS
       ========================================================= */

    const VERSION = "1.0.0";

    const state = {
        ready: false,
        booted: false,
        connected: false,
        online:
            typeof navigator !== "undefined"
                ? navigator.onLine
                : true,

        startedAt: null,
        lastRequestId: null,
        lastResponse: null,
        lastError: null,

        requestCount: 0,
        successCount: 0,
        errorCount: 0,

        components: {},

        eventHistory: [],
        maxEventHistory: 150
    };

    const now = () => Date.now();

    const uid = (prefix) =>
        String(prefix || "haldo") +
        "-" +
        now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .slice(2, 9);

    const safeString = (
        value,
        fallback = ""
    ) => {

        if (
            value === null ||
            value === undefined
        ) {
            return fallback;
        }

        try {
            return String(value);
        } catch (error) {
            return fallback;
        }
    };

    const clone = (value) => {

        if (
            value === undefined
        ) {
            return undefined;
        }

        try {
            return JSON.parse(
                JSON.stringify(value)
            );
        } catch (error) {
            return value;
        }
    };

    const isObject = (value) =>
        value &&
        typeof value === "object" &&
        !Array.isArray(value);

    /* =========================================================
       EVENT BRIDGE
       ========================================================= */

    const emit = (
        eventName,
        payload = {}
    ) => {

        const entry = {
            event:
                eventName,

            timestamp:
                now(),

            payload:
                clone(payload)
        };

        state.eventHistory.unshift(
            entry
        );

        if (
            state.eventHistory.length >
            state.maxEventHistory
        ) {
            state.eventHistory =
                state.eventHistory.slice(
                    0,
                    state.maxEventHistory
                );
        }

        try {

            if (
                root.events &&
                typeof root.events.emit ===
                "function"
            ) {

                root.events.emit(
                    eventName,
                    payload
                );
            }

        } catch (error) {}

        try {

            if (
                AI.events &&
                typeof AI.events.emit ===
                "function"
            ) {

                AI.events.emit(
                    eventName,
                    payload
                );
            }

        } catch (error) {}

        try {

            window.dispatchEvent(
                new CustomEvent(
                    eventName,
                    {
                        detail:
                            payload
                    }
                )
            );

        } catch (error) {}
    };

    /* =========================================================
       COMPONENT DISCOVERY
       ========================================================= */

    const detect = (
        name,
        value
    ) => {

        state.components[name] =
            Boolean(value);

        return value;
    };

    const discoverComponents = () => {

        detect(
            "kernel",
            window.HalDoKernel ||
            OS.kernel
        );

        detect(
            "system",
            window.HalDoSystem ||
            OS.system
        );

        detect(
            "storage",
            root.storage ||
            OS.storage ||
            window.HalDoStorage
        );

        detect(
            "apps",
            root.apps ||
            OS.apps ||
            AI.apps
        );

        detect(
            "windows",
            root.windows ||
            OS.windows ||
            window.HalDoWindowManager
        );

        detect(
            "navigation",
            root.navigation ||
            OS.navigation
        );

        detect(
            "search",
            root.search ||
            OS.search
        );

        detect(
            "memory",
            AI.memory ||
            root.memory ||
            OS.memory
        );

        detect(
            "context",
            AI.context ||
            root.context ||
            OS.context
        );

        detect(
            "session",
            AI.session ||
            root.session ||
            OS.session
        );

        detect(
            "orchestrator",
            AI.orchestrator
        );

        detect(
            "services",
            AI.services
        );

        detect(
            "capabilities",
            AI.capabilities
        );

        detect(
            "appRegistry",
            AI.appRegistry
        );

        detect(
            "router",
            AI.router
        );

        detect(
            "security",
            AI.security
        );

        detect(
            "planner",
            AI.planner
        );

        detect(
            "learning",
            AI.learning
        );

        detect(
            "workflow",
            AI.workflow ||
            AI.taskEngine ||
            AI.automation
        );

        detect(
            "voice",
            AI.voice ||
            root.voice
        );

        detect(
            "speech",
            AI.speech ||
            root.speech
        );

        return clone(
            state.components
        );
    };

    /* =========================================================
       UNIFIED AI RUNTIME
       ========================================================= */

    const runtime = {

        version:
            VERSION,

        state,

        /* -----------------------------------------------------
           Komponenten
           ----------------------------------------------------- */

        discover() {

            return discoverComponents();
        },

        getComponent(
            name
        ) {

            const key =
                safeString(name)
                    .trim();

            const map = {

                kernel:
                    window.HalDoKernel ||
                    OS.kernel,

                system:
                    window.HalDoSystem ||
                    OS.system,

                storage:
                    root.storage ||
                    OS.storage,

                apps:
                    root.apps ||
                    OS.apps ||
                    AI.apps,

                windows:
                    root.windows ||
                    OS.windows,

                navigation:
                    root.navigation ||
                    OS.navigation,

                search:
                    root.search ||
                    OS.search,

                memory:
                    AI.memory,

                context:
                    AI.context,

                session:
                    AI.session,

                orchestrator:
                    AI.orchestrator,

                services:
                    AI.services,

                capabilities:
                    AI.capabilities,

                appRegistry:
                    AI.appRegistry,

                router:
                    AI.router,

                security:
                    AI.security,

                planner:
                    AI.planner,

                learning:
                    AI.learning,

                workflow:
                    AI.workflow ||
                    AI.taskEngine ||
                    AI.automation,

                voice:
                    AI.voice ||
                    root.voice,

                speech:
                    AI.speech ||
                    root.speech
            };

            return (
                map[key] ||
                null
            );
        },

        /* -----------------------------------------------------
           System Context
           ----------------------------------------------------- */

        getSystemContext() {

            const system =
                runtime.getComponent(
                    "system"
                );

            const kernel =
                runtime.getComponent(
                    "kernel"
                );

            let systemInfo = null;
            let kernelInfo = null;

            try {

                if (
                    system &&
                    typeof system.getInfo ===
                    "function"
                ) {

                    systemInfo =
                        system.getInfo();
                }

            } catch (error) {}

            try {

                if (
                    kernel &&
                    typeof kernel.getState ===
                    "function"
                ) {

                    kernelInfo =
                        kernel.getState();
                }

            } catch (error) {}

            return {

                timestamp:
                    now(),

                online:
                    state.online,

                system:
                    clone(systemInfo),

                kernel:
                    clone(kernelInfo),

                components:
                    clone(
                        state.components
                    ),

                runtimeVersion:
                    VERSION
            };
        },

        /* -----------------------------------------------------
           AI Context
           ----------------------------------------------------- */

        getAIContext() {

            let context = null;
            let session = null;
            let memory = null;

            try {

                if (
                    AI.context &&
                    typeof AI.context.snapshot ===
                    "function"
                ) {

                    context =
                        AI.context.snapshot();
                }

            } catch (error) {}

            try {

                if (
                    AI.session &&
                    typeof AI.session.snapshot ===
                    "function"
                ) {

                    session =
                        AI.session.snapshot();
                }

            } catch (error) {}

            try {

                if (
                    AI.memory &&
                    typeof AI.memory.getState ===
                    "function"
                ) {

                    memory =
                        AI.memory.getState();
                }

            } catch (error) {}

            return {

                context:
                    clone(context),

                session:
                    clone(session),

                memory:
                    clone(memory)
            };
        },

        /* -----------------------------------------------------
           Unified Request
           ----------------------------------------------------- */

        async request(
            text,
            options = {}
        ) {

            const input =
                safeString(text)
                    .trim();

            const requestId =
                uid("ai-request");

            state.lastRequestId =
                requestId;

            state.requestCount++;

            const startedAt =
                now();

            emit(
                "ai:runtime-request-start",
                {
                    requestId,
                    text: input,
                    options:
                        clone(options)
                }
            );

            if (!input) {

                const result = {

                    success:
                        false,

                    requestId,

                    error:
                        "Leere AI-Anfrage."
                };

                state.errorCount++;
                state.lastError =
                    result.error;

                emit(
                    "ai:runtime-request-error",
                    result
                );

                return result;
            }

            try {

                discoverComponents();

                let result = null;

                /* ------------------------------------------------
                   1. Workflow / Automation
                   ------------------------------------------------ */

                if (
                    options.workflow === true ||
                    options.automation === true
                ) {

                    const engine =
                        AI.workflow ||
                        AI.taskEngine ||
                        AI.automation;

                    if (
                        engine &&
                        typeof engine.runText ===
                        "function"
                    ) {

                        result =
                            await engine.runText(
                                input,
                                options
                            );
                    }
                }

                /* ------------------------------------------------
                   2. Planner
                   ------------------------------------------------ */

                if (
                    !result &&
                    options.plan === true &&
                    AI.planner &&
                    typeof AI.planner.run ===
                    "function"
                ) {

                    result =
                        await AI.planner.run(
                            input,
                            options
                        );
                }

                /* ------------------------------------------------
                   3. Orchestrator
                   ------------------------------------------------ */

                if (
                    !result &&
                    AI.orchestrator &&
                    typeof AI.orchestrator.processMessage ===
                    "function"
                ) {

                    result =
                        await AI.orchestrator.processMessage(
                            input,
                            options
                        );
                }

                /* ------------------------------------------------
                   4. Router
                   ------------------------------------------------ */

                if (
                    !result &&
                    AI.router &&
                    typeof AI.router.process ===
                    "function"
                ) {

                    result =
                        await AI.router.process(
                            input,
                            options
                        );
                }

                /* ------------------------------------------------
                   5. Chat
                   ------------------------------------------------ */

                if (
                    !result &&
                    AI.chat &&
                    typeof AI.chat.process ===
                    "function"
                ) {

                    result =
                        await AI.chat.process(
                            input,
                            options
                        );
                }

                /* ------------------------------------------------
                   6. Legacy Chat
                   ------------------------------------------------ */

                if (
                    !result &&
                    AI.chat &&
                    typeof AI.chat.send ===
                    "function"
                ) {

                    result =
                        await AI.chat.send(
                            input
                        );
                }

                /* ------------------------------------------------
                   Kein Backend
                   ------------------------------------------------ */

                if (!result) {

                    result = {

                        success:
                            true,

                        text:
                            input,

                        message:
                            "HalDo AI hat die Anfrage empfangen.",

                        source:
                            "runtime-fallback"
                    };
                }

                const response = {

                    success:
                        result.success !== false,

                    requestId,

                    input,

                    result:
                        clone(result),

                    duration:
                        now() - startedAt,

                    timestamp:
                        now()
                };

                state.lastResponse =
                    clone(response);

                if (
                    response.success
                ) {
                    state.successCount++;
                } else {
                    state.errorCount++;
                }

                emit(
                    "ai:runtime-request-complete",
                    response
                );

                return response;

            } catch (error) {

                const result = {

                    success:
                        false,

                    requestId,

                    input,

                    error:
                        safeString(
                            error &&
                            error.message,
                            error
                        ),

                    duration:
                        now() - startedAt
                };

                state.errorCount++;

                state.lastError =
                    result.error;

                emit(
                    "ai:runtime-request-error",
                    result
                );

                return result;
            }
        },

        ask(
            text,
            options = {}
        ) {

            return runtime.request(
                text,
                options
            );
        },

        process(
            text,
            options = {}
        ) {

            return runtime.request(
                text,
                options
            );
        },

        respond(
            text,
            options = {}
        ) {

            return runtime.request(
                text,
                options
            );
        },

        /* -----------------------------------------------------
           Workflow Shortcuts
           ----------------------------------------------------- */

        createWorkflow(
            definition
        ) {

            const engine =
                AI.workflow ||
                AI.taskEngine ||
                AI.automation;

            if (
                engine &&
                typeof engine.createWorkflow ===
                "function"
            ) {

                return engine.createWorkflow(
                    definition
                );
            }

            return null;
        },

        runWorkflow(
            definition,

        ) {

            const engine =
                AI.workflow ||
                AI.taskEngine ||

            if (

            ) {

        automate(

        },

        /* -----------------------------------------------------
           Capability
           ----------------------------------------------------- */

        async executeCapability(
            capability,
            params = {}
        ) {

            if (
                typeof AI.executeCapability ===
                "function"
            ) {

                return AI.executeCapability(
                    capability,
                    params
                );
            }

            if (
                AI.capabilities &&
                typeof AI.capabilities.execute ===
                "function"
            ) {

                return AI.capabilities.execute(
                    capability,
                    params
                );
            }

            throw new Error(
                "AI Capability Engine nicht verfügbar."
            );
        },

        /* -----------------------------------------------------
           App
           ----------------------------------------------------- */

        async openApp(
            app,
            params = {}
        ) {

            if (
                typeof AI.openApp ===
                "function"
            ) {

                return AI.openApp(
                    app,
                    params
                );
            }

            if (
                AI.appRegistry &&
                typeof AI.appRegistry.openApp ===
                "function"
            ) {

                return AI.appRegistry.openApp(
                    app,
                    params
                );
            }

            const apps =
                root.apps ||
                OS.apps;

            if (
                apps &&
                typeof apps.launch ===
                "function"
            ) {

                return apps.launch(
                    app,
                    params
                );
            }

            throw new Error(
                "App-System nicht verfügbar."
            );
        },

        /* -----------------------------------------------------
           Navigation
           ----------------------------------------------------- */

        navigate(
            action,
            value
        ) {

            const navigation =
                root.navigation ||
                OS.navigation;

            if (
                navigation &&
                typeof navigation[action] ===
                "function"
            ) {

                return navigation[action](
                    value
                );
            }

            if (
                AI.router &&
                typeof AI.router.route ===
                "function"
            ) {

                return AI.router.route(
                    action +
                    (
                        value
                            ? " " + value
                            : ""
                    )
                );
            }

            return false;
        },

        /* -----------------------------------------------------
           Voice
           ----------------------------------------------------- */

        speak(
            text,
            options = {}
        ) {

            const voice =
                AI.voice ||
                root.voice ||
                AI.speech ||
                root.speech;

            if (
                voice &&
                typeof voice.speak ===
                "function"
            ) {

                return voice.speak(
                    text,
                    options
                );
            }

            if (
                typeof window !==
                "undefined" &&
                window.speechSynthesis
            ) {

                const utterance =
                    new SpeechSynthesisUtterance(
                        safeString(text)
                    );

                window.speechSynthesis.speak(
                    utterance
                );

                return true;
            }

            return false;
        },

        /* -----------------------------------------------------
           Suche
           ----------------------------------------------------- */

        search(
            query,
            options = {}
        ) {

            if (
                AI.search &&
                typeof AI.search ===
                "function"
            ) {

                return AI.search(
                    query,
                    options
                );
            }

            if (
                root.search &&
                typeof root.search.query ===
                "function"
            ) {

                return root.search.query(
                    query,
                    options
                );
            }

            if (
                AI.router &&
                typeof AI.router.route ===
                "function"
            ) {

                return AI.router.route(
                    "search " +
                    safeString(query),
                    options
                );
            }

            return null;
        },

        /* =====================================================
           Zentrale App-Daten-Schnittstelle
           ===================================================== */

        async getAppData(
            appId,
            options = {}
        ) {

            const id =
                safeString(appId)
                    .trim();

            const result = {

                appId:
                    id,

                timestamp:
                    now(),

                manifest:
                    null,

                capabilities:
                    [],

                commands:
                    [],

                actions:
                    [],

                state:
                    null
            };

            try {

                if (
                    AI.appRegistry &&
                    typeof AI.appRegistry.getApp ===
                    "function"
                ) {

                    result.manifest =
                        AI.appRegistry.getApp(
                            id
                        );
                }

            } catch (error) {}

            try {

                if (
                    AI.appRegistry &&
                    typeof AI.appRegistry.getAppCapabilities ===
                    "function"
                ) {

                    result.capabilities =
                        AI.appRegistry
                            .getAppCapabilities(
                                id
                            ) ||
                        [];
                }

            } catch (error) {}

            try {

                if (
                    AI.appRegistry &&
                    typeof AI.appRegistry.listCommands ===
                    "function"
                ) {

                    result.commands =
                        AI.appRegistry
                            .listCommands(
                                id
                            ) ||
                        [];
                }

            } catch (error) {}

            try {

                if (
                    AI.appRegistry &&
                    typeof AI.appRegistry.listActions ===
                    "function"
                ) {

                    result.actions =
                        AI.appRegistry
                            .listActions(
                                id
                            ) ||
                        [];
                }

            } catch (error) {}

            /* App-spezifischen State suchen */

            try {

                const apps =
                    root.apps ||
                    OS.apps;

                if (
                    apps &&
                    typeof apps.getState ===
                    "function"
                ) {

                    result.state =
                        await apps.getState(
                            id,
                            options
                        );
                }

            } catch (error) {}

            return result;
        },

        /* =====================================================
           Universeller App Command
           ===================================================== */

        async executeAppCommand(
            appId,
            command,
            params = {}
        ) {

            if (
                AI.executeAppCommand &&
                typeof AI.executeAppCommand ===
                "function"
            ) {

                return AI.executeAppCommand(
                    appId,
                    command,
                    params
                );
            }

            if (
                AI.appRegistry &&
                typeof AI.appRegistry.executeAppCommand ===
                "function"
            ) {

                return AI.appRegistry.executeAppCommand(
                    appId,
                    command,
                    params
                );
            }

            throw new Error(
                "App Command Engine nicht verfügbar."
            );
        },

        /* =====================================================
           Universeller App Action
           ===================================================== */

        async executeAppAction(
            appId,
            action,
            params = {}
        ) {

            if (
                AI.executeAppAction &&
                typeof AI.executeAppAction ===
                "function"
            ) {

                return AI.executeAppAction(
                    appId,
                    action,
                    params
                );
            }

            if (
                AI.appRegistry &&
                typeof AI.appRegistry.executeAppAction ===
                "function"
            ) {

                return AI.appRegistry.executeAppAction(
                    appId,
                    action,
                    params
                );
            }

            throw new Error(
                "App Action Engine nicht verfügbar."
            );
        },

        /* =====================================================
           Security
           ===================================================== */

        async secure(
            plan,
            options = {}
        ) {

            const security =
                AI.security ||
                AI.permissions;

            if (
                security &&
                typeof security.securePlan ===
                "function"
            ) {

                return security.securePlan(
                    plan,
                    options
                );
            }

            if (
                security &&
                typeof security.evaluate ===
                "function"
            ) {

                return security.evaluate(
                    plan,
                    options
                );
            }

            return {
                allowed:
                    true,

                plan:
                    clone(plan)
            };
        },

        /* =====================================================
           Learning
           ===================================================== */

        learn(
            data
        ) {

            const learning =
                AI.learning ||
                AI.adaptive ||
                AI.feedback;

            if (
                learning &&
                typeof learning.recordInteraction ===
                "function"
            ) {

                return learning.recordInteraction(
                    data
                );
            }

            return false;
        },

        /* =====================================================
           Gesamtstatus
           ===================================================== */

        getStatus() {

            discoverComponents();

            const available =
                Object.keys(
                    state.components
                ).filter(
                    (key) =>
                        state.components[key]
                );

            const unavailable =
                Object.keys(
                    state.components
                ).filter(
                    (key) =>
                        !state.components[key]
                );

            return {

                runtime: {

                    version:
                        VERSION,

                    ready:
                        state.ready,

                    booted:
                        state.booted,

                    connected:
                        state.connected,

                    online:
                        state.online,

                    startedAt:
                        state.startedAt
                },

                requests: {

                    total:
                        state.requestCount,

                    successful:
                        state.successCount,

                    errors:
                        state.errorCount,

                    successRate:
                        state.requestCount
                            ? (
                                state.successCount /
                                state.requestCount
                            ) * 100
                            : 0
                },

                components:
                    clone(
                        state.components
                    ),

                available,

                unavailable,

                lastRequestId:
                    state.lastRequestId,

                lastError:
                    state.lastError
            };
        },

        /* =====================================================
           Diagnostics
           ===================================================== */

        diagnostics() {

            discoverComponents();

            const status =
                runtime.getStatus();

            const checks = {

                kernel:
                    Boolean(
                        state.components.kernel
                    ),

                system:
                    Boolean(
                        state.components.system
                    ),

                orchestrator:
                    Boolean(
                        state.components.orchestrator
                    ),

                router:
                    Boolean(
                        state.components.router
                    ),

                security:
                    Boolean(
                        state.components.security
                    ),

                planner:
                    Boolean(
                        state.components.planner
                    ),

                learning:
                    Boolean(
                        state.components.learning
                    ),

                workflow:
                    Boolean(
                        state.components.workflow
                    ),

                appRegistry:
                    Boolean(
                        state.components.appRegistry
                    ),

                capabilities:
                    Boolean(
                        state.components.capabilities
                    ),

                storage:
                    Boolean(
                        state.components.storage
                    )
            };

            const available =
                Object.keys(checks)
                    .filter(
                        (key) =>
                            checks[key]
                    )
                    .length;

            const total =
                Object.keys(
                    checks
                ).length;

            return {

                ok:
                    available > 0,

                version:
                    VERSION,

                timestamp:
                    now(),

                checks,

                available,

                total,

                percentage:
                    total
                        ? (
                            available /
                            total
                        ) * 100
                        : 0,

                status:
                    status
            };
        },

        /* =====================================================
           Events
           ===================================================== */

        getEventHistory(
            limit = 50
        ) {

            return state.eventHistory
                .slice(
                    0,
                    Math.max(
                        0,
                        Number(limit) ||
                        50
                    )
                )
                .map(clone);
        },

        clearEventHistory() {

            state.eventHistory =
                [];

            return true;
        },

        /* =====================================================
           Runtime Reset
           ===================================================== */

        resetRuntimeState() {

            state.lastRequestId =
                null;

            state.lastResponse =
                null;

            state.lastError =
                null;

            state.requestCount =
                0;

            state.successCount =
                0;

            state.errorCount =
                0;

            state.eventHistory =
                [];

            discoverComponents();

            emit(
                "ai:runtime-reset",
                {
                    timestamp:
                        now()
                }
            );

            return true;
        }
    };

    /* =========================================================
       Öffentliche Runtime APIs
       ========================================================= */

    AI.runtime =
        runtime;

    AI.unifiedRuntime =
        runtime;

    AI.coreRuntime =
        runtime;

    root.aiRuntime =
        runtime;

    OS.aiRuntime =
        runtime;

    root.unifiedAI =
        runtime;

    OS.unifiedAI =
        runtime;

    window.HalDoAIRuntime =
        runtime;

    window.HalDoUnifiedAI =
        runtime;

    /* =========================================================
       Convenience APIs
       ========================================================= */

    if (
        typeof AI.request !==
        "function"
    ) {

        AI.request =
            function (
                text,
                options
            ) {

                return runtime.request(
                    text,
                    options
                );
            };
    }

    if (
        typeof AI.askUnified !==
        "function"
    ) {

        AI.askUnified =
            function (
                text,
                options
            ) {

                return runtime.ask(
                    text,
                    options
                );
            };
    }

    if (
        typeof AI.runAutomation !==
        "function"
    ) {

        AI.runAutomation =
            function (
                definition,
                options
            ) {

                return runtime.automate(
                    definition,
                    options
                );
            };
    }

    if (
        typeof AI.getSystemContext !==
        "function"
    ) {

        AI.getSystemContext =
            function () {

                return runtime.getSystemContext();
            };
    }

    /* =========================================================
       ONLINE / OFFLINE
       ========================================================= */

    try {

        window.addEventListener(
            "online",
            function () {

                state.online =
                    true;

                emit(
                    "ai:runtime-online",
                    {
                        online:
                            true
                    }
                );
            }
        );

        window.addEventListener(
            "offline",
            function () {

                state.online =
                    false;

                emit(
                    "ai:runtime-offline",
                    {
                        online:
                            false
                    }
                );
            }
        );

    } catch (error) {}

    /* =========================================================
       Bestehende AI-Systeme beobachten
       ========================================================= */

    const watchedEvents = [

        "ai:orchestrator-ready",
        "ai:service-bridge-ready",
        "ai:capability-system-ready",
        "ai:app-registry-ready",
        "ai:natural-language-router-ready",
        "ai:security-gateway-ready",
        "ai:context-planner-ready",
        "ai:adaptive-learning-ready",
        "ai:workflow-engine-ready",

        "kernel:ready",
        "system:ready",

        "app:registered",
        "app:ready",
        "app:unregistered"
    ];

    try {

        watchedEvents.forEach(
            (eventName) => {

                window.addEventListener(
                    eventName,
                    function (event) {

                        emit(
                            "ai:runtime-component-event",
                            {
                                source:
                                    eventName,

                                detail:
                                    clone(
                                        event.detail ||
                                        {}
                                    )
                            }
                        );

                        discoverComponents();
                    }
                );

            }
        );

    } catch (error) {}

    /* =========================================================
       SYSTEM / KERNEL VERBINDUNG
       ========================================================= */

    const connectToCore =
        function () {

            discoverComponents();

            state.connected =
                Boolean(
                    state.components.kernel ||
                    state.components.system
                );

            if (
                state.connected
            ) {

                emit(
                    "ai:runtime-core-connected",
                    {
                        kernel:
                            state.components.kernel,

                        system:
                            state.components.system
                    }
                );
            }
        };

    /* =========================================================
       BOOT
       ========================================================= */

    const boot =
        function () {

            if (
                state.booted
            ) {
                return;
            }

            state.booted =
                true;

            state.startedAt =
                now();

            discoverComponents();

            connectToCore();

            emit(
                "ai:runtime-boot",
                {
                    version:
                        VERSION,

                    components:
                        clone(
                            state.components
                        )
                }
            );

            /* -----------------------------------------------
               Optional Kernel-Verbindung
               ----------------------------------------------- */

            try {

                const kernel =
                    window.HalDoKernel ||
                    OS.kernel;

                if (
                    kernel &&
                    typeof kernel.on ===
                    "function"
                ) {

                    kernel.on(
                        "kernel:ready",
                        connectToCore
                    );

                    kernel.on(
                        "app:registered",
                        discoverComponents
                    );

                    kernel.on(
                        "app:ready",
                        discoverComponents
                    );
                }

            } catch (error) {}

            /* -----------------------------------------------
               Optional System-Verbindung
               ----------------------------------------------- */

            try {

                const system =
                    window.HalDoSystem ||
                    OS.system;

                if (
                    system &&
                    typeof system.on ===
                    "function"
                ) {

                    system.on(
                        "system:ready",
                        connectToCore
                    );

                    system.on(
                        "system:boot-complete",
                        connectToCore
                    );
                }

            } catch (error) {}

            state.ready =
                true;

            emit(
                "ai:runtime-ready",
                {
                    version:
                        VERSION,

                    status:
                        runtime.getStatus(),

                    diagnostics:
                        runtime.diagnostics()
                }
            );

            console.log(
                "[HalDo AI OS] Teil 16/16 — Unified AI Runtime ready."
            );
        };

    /* =========================================================
       DOM READY
       ========================================================= */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            boot,
            {
                once: true
            }
        );

    } else {

        boot();
    }

    /* =========================================================
       FINALE GLOBALE INTEGRATION
       ========================================================= */

    try {

        window.HalDoAI =
            window.HalDoAI ||
            AI;

        window.HalDoAI.runtime =
            runtime;

        window.HalDoAI.workflow =
            AI.workflow ||
            AI.taskEngine ||
            AI.automation;

        window.HalDoAI.router =
            AI.router ||
            AI.commandRouter;

        window.HalDoAI.planner =
            AI.planner ||
            AI.executionPlanner;

        window.HalDoAI.security =
            AI.security ||
            AI.permissions;

        window.HalDoAI.learning =
            AI.learning ||
            AI.adaptive;

        window.HalDoAI.appRegistry =
            AI.appRegistry;

        window.HalDoAI.capabilities =
            AI.capabilities;

        window.HalDoAI.services =
            AI.services;

    } catch (error) {}

    /* =========================================================
       GLOBAL HALDO API
       ========================================================= */

    root.HalDoAI =
        root.HalDoAI ||
        AI;

    root.HalDoAI.runtime =
        runtime;

    OS.HalDoAI =
        root.HalDoAI;

})();
</script>
