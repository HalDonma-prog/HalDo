<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Cosmisches System</title>
    <style>
        /* Tiefblauer, strahlender Kosmos */
        body { background: radial-gradient(circle at center, #0a0f2e 0%, #000000 100%); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        
        /* Futuristisches Gitter */
        #grid { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 50px 50px; z-index: 1; }
        
        /* Die strahlende, runde Sonne */
        #sun { width: 180px; height: 180px; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff 0%, #fffc00 30%, #ff9a00 60%, #ff0000 100%); box-shadow: 0 0 100px #ff9a00, 0 0 250px #ff3300, 0 0 400px #ff0000; animation: pulse 5s infinite; z-index: 5; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* Echte Planetenfarben */
        .planet { position: absolute; z-index: 3; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        
        /* Die 12 Planeten (echte, professionelle Farben und Größen) */
        #p1 { width: 25px; height: 25px; background: radial-gradient(circle at 30% 30%, #A0A0A0, #444); }  /* Merkur */
        #p2 { width: 35px; height: 35px; background: radial-gradient(circle at 30% 30%, #FFD700, #B8860B); } /* Venus */
        #p3 { width: 40px; height: 40px; background: radial-gradient(circle at 30% 30%, #4B90C2, #1b3f5e, #6B8E23); } /* Erde */
        #p4 { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #ff8844, #C1440E); } /* Mars */
        #p5 { width: 80px; height: 80px; background: linear-gradient(90deg, #D8CA9D 20%, #A67B5B 40%, #D8CA9D 60%, #C49A6C 80%); } /* Jupiter */
        #p6 { width: 70px; height: 70px; background: radial-gradient(circle at 30% 30%, #EEDC82, #B8860B); box-shadow: 0 0 0 15px rgba(210,180,140,0.3); } /* Saturn mit Ring */
        #p7 { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #00FFFF, #008B8B); } /* Uranus */
        #p8 { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #0000FF, #00008B); } /* Neptun */
        #p9 { width: 15px; height: 15px; background: radial-gradient(circle at 30% 30%, #FFE4E1, #A9A9A9); } /* Pluto */
        #p10 { width: 15px; height: 15px; background: radial-gradient(circle at 30% 30%, #8A2BE2, #4B0082); } /* Ceres */
        #p11 { width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #FFFFFF, #D3D3D3); } /* Eris */
        #p12 { width: 18px; height: 18px; background: radial-gradient(circle at 30% 30%, #FFB6C1, #8B4513); } /* Haumea */

        /* Die drei Zeit-Orbs (Sekunde, Minute, Stunde) */
        .time-orb { position: absolute; z-index: 4; border-radius: 50%; box-shadow: 0 0 15px currentColor; }
        #sec-orb { width: 10px; height: 10px; background: #00ff00; color: #00ff00; } /* Sekunde - Grün */
        #min-orb { width: 14px; height: 14px; background: #00aaff; color: #00aaff; } /* Minute - Blau */
        #hr-orb { width: 18px; height: 18px; background: #ffaa00; color: #ffaa00; } /* Stunde - Orange */

        /* Der Cyborg */
        #cyborg { position: absolute; bottom: 20px; left: 40px; font-size: 90px; z-index: 10; filter: drop-shadow(0 0 15px #00aaff); }

        /* Chat Interface */
        #chat { position: absolute; bottom: 20px; right: 20px; width: 350px; background: rgba(10, 20, 40, 0.8); border: 1px solid #00aaff; border-radius: 8px; z-index: 20; }
        #chat-header { padding: 10px; background: #001a33; border-radius: 8px 8px 0 0; color: #00aaff; }
        #chat-body { padding: 15px; height: 120px; font-size: 14px; }
        #chat-input { width: 90%; margin: 10px; padding: 8px; background: #111; border: 1px solid #00aaff; color: #fff; }

        /* Kontrollleiste */
        #controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 30; }
        .dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; }
        #btn-close { background: #ff0000; } /* X */
        #btn-mic { background: #00ff00; }  /* Mikrofon */
        #btn-spk { background: #00aaff; }  /* Lautsprecher */
    </style>
</head>
<body>

<div id="grid"></div>
<div id="sun"></div>

<!-- 12 Planeten (werden per JavaScript bewegt) -->
<div id="p1" class="planet"></div>
<div id="p2" class="planet"></div>
<div id="p3" class="planet"></div>
<div id="p4" class="planet"></div>
<div id="p5" class="planet"></div>
<div id="p6" class="planet"></div>
<div id="p7" class="planet"></div>
<div id="p8" class="planet"></div>
<div id="p9" class="planet"></div>
<div id="p10" class="planet"></div>
<div id="p11" class="planet"></div>
<div id="p12" class="planet"></div>

<!-- Zeit-Orbs -->
<div id="sec-orb" class="time-orb"></div>
<div id="min-orb" class="time-orb"></div>
<div id="hr-orb" class="time-orb"></div>

<div id="cyborg">🤖</div>

<div id="controls">
    <div class="dot" id="btn-close" title="Schließen"></div>
    <div class="dot" id="btn-mic" title="Mikrofon"></div>
    <div class="dot" id="btn-spk" title="Lautsprecher"></div>
</div>

<div id="chat">
    <div id="chat-header">HalDo AI Chat</div>
    <div id="chat-body">Willkommen, Bruder. Das 12-Planeten-System ist aktiv.</div>
    <input id="chat-input" type="text" placeholder="Nachricht an HalDo...">
</div>

<script>
    // Buttons funktionieren
    document.getElementById('btn-close').onclick = () => document.getElementById('chat').style.display = 'none';

    document.getElementById('btn-spk').onclick = () => {
        const u = new SpeechSynthesisUtterance("Willkommen bei HalDo AI OS, Bruder. 12 Planeten kreisen um die Sonne.");
        u.lang = 'de-DE';
        speechSynthesis.speak(u);
    };

    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'de-DE';
    document.getElementById('btn-mic').onclick = () => rec.start();
    rec.onresult = (e) => {
        document.getElementById('chat-input').value = e.results[0][0].transcript;
        document.getElementById('chat-body').innerHTML += "<br>Du: " + e.results[0][0].transcript;
        document.getElementById('chat-body').innerHTML += "<br>HalDo: Verstanden.";
    };

    // PHYSIKALISCHE UMLAUFBAHNEN (Von links nach rechts, wie eine echte Bahn)
    const planets = [
        { el: document.getElementById('p1'), speed: 0.8, radius: 15, offset: 0 },   // Merkur
        { el: document.getElementById('p2'), speed: 0.7, radius: 20, offset: 20 },  // Venus
        { el: document.getElementById('p3'), speed: 0.6, radius: 25, offset: 40 },  // Erde
        { el: document.getElementById('p4'), speed: 0.5, radius: 30, offset: 60 },  // Mars
        { el: document.getElementById('p5'), speed: 0.4, radius: 35, offset: 80 },  // Jupiter
        { el: document.getElementById('p6'), speed: 0.35, radius: 40, offset: 100 }, // Saturn
        { el: document.getElementById('p7'), speed: 0.3, radius: 45, offset: 120 }, // Uranus
        { el: document.getElementById('p8'), speed: 0.25, radius: 50, offset: 140 }, // Neptun
        { el: document.getElementById('p9'), speed: 0.2, radius: 55, offset: 160 },  // Pluto
        { el: document.getElementById('p10'), speed: 0.18, radius: 60, offset: 180 },// Ceres
        { el: document.getElementById('p11'), speed: 0.15, radius: 65, offset: 200 },// Eris
        { el: document.getElementById('p12'), speed: 0.12, radius: 70, offset: 220 } // Haumea
    ];

    // ECHTE ZEIT-UHR (Sekunde, Minute, Stunde)
    const secOrb = document.getElementById('sec-orb');
    const minOrb = document.getElementById('min-orb');
    const hrOrb = document.getElementById('hr-orb');

    function animate() {
        let time = Date.now() / 1000; // Echte Zeit in Sekunden

        // 1. Planeten in physikalischer Bewegung (links nach rechts, wie eine große Welle)
        planets.forEach(p => {
            // "progress" erhöht sich ständig, dadurch bewegen sie sich von links nach rechts und wieder zurück (Kreisbahn).
            let t = time * p.speed + p.offset; 
            let x = 50 + p.radius * Math.cos(t * 0.05); // X-Position (Mitte 50%)
            let y = 50 + p.radius * Math.sin(t * 0.05); // Y-Position (Mitte 50%)
            
            p.el.style.left = x + '%';
            p.el.style.top = y + '%';
        });

        // 2. Die Zeit-Orbs (Sekunde, Minute, Stunde) drehen sich wie echte Zeiger
        // Sekunde (schnell, 60 Sekunden pro Umdrehung)
        let secAngle = time * (Math.PI * 2 / 60); 
        secOrb.style.left = (50 + 30 * Math.cos(secAngle)) + '%';
        secOrb.style.top = (50 + 30 * Math.sin(secAngle)) + '%';

        // Minute (langsam, 3600 Sekunden pro Umdrehung)
        let minAngle = time * (Math.PI * 2 / 3600);
        minOrb.style.left = (50 + 40 * Math.cos(minAngle)) + '%';
        minOrb.style.top = (50 + 40 * Math.sin(minAngle)) + '%';

        // Stunde (sehr langsam, 43200 Sekunden pro Umdrehung)
        let hrAngle = time * (Math.PI * 2 / 43200);
        hrOrb.style.left = (50 + 50 * Math.cos(hrAngle)) + '%';
        hrOrb.style.top = (50 + 50 * Math.sin(hrAngle)) + '%';

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
