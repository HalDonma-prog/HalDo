<script>
(function () {
    "use strict";

    const root =
        window.HalDo ||
        window.HalDoOS ||
        (window.HalDo = {});

    const OS = window.HalDoOS || (window.HalDoOS = root);

    const AI =
        root.ai ||
        root.AI ||
        OS.ai ||
        OS.AI ||
        window.HalDoAI ||
        (window.HalDoAI = {});

    root.ai = AI;
    root.AI = AI;
    OS.ai = AI;
    OS.AI = AI;

    /* ------------------------------------------------------------
       Hilfsfunktionen
       ------------------------------------------------------------ */

    const now = () => Date.now();

    const uid = (prefix) => {
        return (
            String(prefix || "workflow") +
            "-" +
            now().toString(36) +
            "-" +
            Math.random().toString(36).slice(2, 9)
        );
    };

    const safeString = (value, fallback = "") => {
        if (value === null || value === undefined) {
            return fallback;
        }

        try {
            return String(value);
        } catch (error) {
            return fallback;
        }
    };

    const clone = (value) => {
        if (value === undefined) {
            return undefined;
        }

        try {
            return JSON.parse(JSON.stringify(value));
        } catch (error) {
            return value;
        }
    };

    const isObject = (value) => {
        return value &&
            typeof value === "object" &&
            !Array.isArray(value);
    };

    const delay = (ms) => {
        const timeout = Math.max(0, Number(ms) || 0);

        return new Promise((resolve) => {
            setTimeout(resolve, timeout);
        });
    };

    const emit = (eventName, payload) => {
        try {
            if (root.events && typeof root.events.emit === "function") {
                root.events.emit(eventName, payload);
            }
        } catch (error) {}

        try {
            if (AI.events && typeof AI.events.emit === "function") {
                AI.events.emit(eventName, payload);
            }
        } catch (error) {}

        try {
            window.dispatchEvent(
                new CustomEvent(eventName, {
                    detail: payload
                })
            );
        } catch (error) {}
    };

    const getStorage = () => {
        return (
            root.storage ||
            OS.storage ||
            AI.storage ||
            window.HalDoStorage ||
            null
        );
    };

    const storageRead = async (key, fallback = null) => {
        const storage = getStorage();

        try {
            if (storage) {
                if (typeof storage.get === "function") {
                    const result = await storage.get(key);
                    return result === undefined ? fallback : result;
                }

                if (typeof storage.read === "function") {
                    const result = await storage.read(key);
                    return result === undefined ? fallback : result;
                }

                if (typeof storage.load === "function") {
                    const result = await storage.load(key);
                    return result === undefined ? fallback : result;
                }
            }
        } catch (error) {}

        try {
            const raw = localStorage.getItem(key);

            if (!raw) {
                return fallback;
            }

            return JSON.parse(raw);
        } catch (error) {
            return fallback;
        }
    };

    const storageWrite = async (key, value) => {
        const storage = getStorage();

        try {
            if (storage) {
                if (typeof storage.set === "function") {
                    await storage.set(key, value);
                    return true;
                }

                if (typeof storage.write === "function") {
                    await storage.write(key, value);
                    return true;
                }

                if (typeof storage.save === "function") {
                    await storage.save(key, value);
                    return true;
                }
            }
        } catch (error) {}

        try {
            localStorage.setItem(
                key,
                JSON.stringify(value)
            );

            return true;
        } catch (error) {
            return false;
        }
    };

    /* ------------------------------------------------------------
       Workflow Engine
       ------------------------------------------------------------ */

    const workflow = {

        version: "1.0.0",

        state: {
            workflows: new Map(),
            executions: new Map(),
            history: [],
            activeExecutionId: null,
            maxHistory: 100,
            defaultTimeout: 30000,
            defaultRetries: 0
        },

        /* --------------------------------------------------------
           Workflow normalisieren
           -------------------------------------------------------- */

        normalizeStep(step, index = 0) {

            step = isObject(step) ? step : {};

            const type =
                safeString(
                    step.type ||
                    step.kind ||
                    "action"
                ).toLowerCase();

            return {

                id:
                    safeString(step.id) ||
                    uid("step"),

                index,

                name:
                    safeString(
                        step.name ||
                        step.title ||
                        "Step " + (index + 1)
                    ),

                type,

                text:
                    safeString(
                        step.text ||
                        step.prompt ||
                        step.command ||
                        ""
                    ),

                action:
                    step.action || null,

                route:
                    step.route || null,

                capability:
                    step.capability || null,

                app:
                    step.app || null,

                params:
                    isObject(step.params)
                        ? clone(step.params)
                        : {},

                condition:
                    step.condition || null,

                dependsOn:
                    Array.isArray(step.dependsOn)
                        ? step.dependsOn.slice()
                        : [],

                retries:
                    Number.isFinite(Number(step.retries))
                        ? Math.max(0, Number(step.retries))
                        : workflow.state.defaultRetries,

                timeout:
                    Number.isFinite(Number(step.timeout))
                        ? Math.max(0, Number(step.timeout))
                        : workflow.state.defaultTimeout,

                continueOnError:
                    Boolean(step.continueOnError),

                enabled:
                    step.enabled !== false,

                metadata:
                    isObject(step.metadata)
                        ? clone(step.metadata)
                        : {}
            };
        },

        normalizeWorkflow(definition = {}) {

            const source =
                isObject(definition)
                    ? definition
                    : {};

            const rawSteps =
                Array.isArray(source.steps)
                    ? source.steps
                    : [];

            return {

                id:
                    safeString(source.id) ||
                    uid("workflow"),

                name:
                    safeString(
                        source.name ||
                        source.title ||
                        "HalDo AI Workflow"
                    ),

                description:
                    safeString(source.description),

                version:
                    safeString(source.version) ||
                    "1.0.0",

                enabled:
                    source.enabled !== false,

                autoRun:
                    Boolean(source.autoRun),

                mode:
                    safeString(source.mode) ||
                    "sequential",

                variables:
                    isObject(source.variables)
                        ? clone(source.variables)
                        : {},

                steps:
                    rawSteps.map((step, index) =>
                        workflow.normalizeStep(step, index)
                    ),

                metadata:
                    isObject(source.metadata)
                        ? clone(source.metadata)
                        : {},

                createdAt:
                    source.createdAt || now(),

                updatedAt:
                    now()
            };
        },

        /* --------------------------------------------------------
           Workflow erstellen
           -------------------------------------------------------- */

        createWorkflow(definition = {}) {

            const item =
                workflow.normalizeWorkflow(definition);

            workflow.state.workflows.set(
                item.id,
                item
            );

            emit(
                "ai:workflow-created",
                {
                    workflow: clone(item)
                }
            );

            workflow.persist().catch(() => {});

            return clone(item);
        },

        registerWorkflow(definition = {}) {
            return workflow.createWorkflow(definition);
        },

        addWorkflow(definition = {}) {
            return workflow.createWorkflow(definition);
        },

        /* --------------------------------------------------------
           Workflow abrufen
           -------------------------------------------------------- */

        getWorkflow(id) {

            const key = safeString(id);

            const item =
                workflow.state.workflows.get(key);

            return item
                ? clone(item)
                : null;
        },

        listWorkflows() {

            return Array.from(
                workflow.state.workflows.values()
            ).map(clone);
        },

        deleteWorkflow(id) {

            const key = safeString(id);

            const existed =
                workflow.state.workflows.delete(key);

            if (existed) {

                emit(
                    "ai:workflow-deleted",
                    {
                        workflowId: key
                    }
                );

                workflow.persist().catch(() => {});
            }

            return existed;
        },

        clearWorkflows() {

            workflow.state.workflows.clear();

            workflow.persist().catch(() => {});

            emit(
                "ai:workflows-cleared",
                {}
            );

            return true;
        },

        /* --------------------------------------------------------
           Steps
           -------------------------------------------------------- */

        addStep(workflowId, step) {

            const item =
                workflow.state.workflows.get(
                    safeString(workflowId)
                );

            if (!item) {
                return null;
            }

            const normalized =
                workflow.normalizeStep(
                    step,
                    item.steps.length
                );

            item.steps.push(normalized);
            item.updatedAt = now();

            workflow.persist().catch(() => {});

            emit(
                "ai:workflow-step-added",
                {
                    workflowId: item.id,
                    step: clone(normalized)
                }
            );

            return clone(normalized);
        },

        removeStep(workflowId, stepId) {

            const item =
                workflow.state.workflows.get(
                    safeString(workflowId)
                );

            if (!item) {
                return false;
            }

            const index =
                item.steps.findIndex(
                    (step) =>
                        step.id === safeString(stepId)
                );

            if (index < 0) {
                return false;
            }

            item.steps.splice(index, 1);

            item.steps.forEach(
                (step, position) => {
                    step.index = position;
                }
            );

            item.updatedAt = now();

            workflow.persist().catch(() => {});

            emit(
                "ai:workflow-step-removed",
                {
                    workflowId: item.id,
                    stepId: safeString(stepId)
                }
            );

            return true;
        },

        updateStep(workflowId, stepId, updates = {}) {

            const item =
                workflow.state.workflows.get(
                    safeString(workflowId)
                );

            if (!item) {
                return null;
            }

            const step =
                item.steps.find(
                    (entry) =>
                        entry.id === safeString(stepId)
                );

            if (!step) {
                return null;
            }

            Object.keys(updates || {}).forEach(
                (key) => {

                    if (
                        key === "id" ||
                        key === "index"
                    ) {
                        return;
                    }

                    step[key] =
                        clone(updates[key]);
                }
            );

            item.updatedAt = now();

            workflow.persist().catch(() => {});

            return clone(step);
        },

        /* --------------------------------------------------------
           Validierung
           -------------------------------------------------------- */

        validate(definitionOrId) {

            const item =
                typeof definitionOrId === "string"
                    ? workflow.getWorkflow(definitionOrId)
                    : workflow.normalizeWorkflow(
                        definitionOrId || {}
                    );

            const errors = [];
            const warnings = [];

            if (!item.id) {
                errors.push(
                    "Workflow besitzt keine ID."
                );
            }

            if (!item.steps.length) {
                warnings.push(
                    "Workflow enthält keine Schritte."
                );
            }

            const ids = new Set();

            item.steps.forEach(
                (step, index) => {

                    if (ids.has(step.id)) {
                        errors.push(
                            "Doppelte Step-ID: " +
                            step.id
                        );
                    }

                    ids.add(step.id);

                    if (!step.enabled) {
                        warnings.push(
                            "Step deaktiviert: " +
                            step.id
                        );
                    }

                    if (
                        step.type === "action" &&
                        !step.text &&
                        !step.action &&
                        !step.route &&
                        !step.capability &&
                        !step.app
                    ) {
                        warnings.push(
                            "Action-Step ohne ausführbare Aktion: " +
                            step.id
                        );
                    }

                    if (
                        step.timeout < 0
                    ) {
                        errors.push(
                            "Ungültiger Timeout in Step " +
                            step.id
                        );
                    }

                    if (
                        step.retries < 0
                    ) {
                        errors.push(
                            "Ungültige Retry-Anzahl in Step " +
                            step.id
                        );
                    }

                    if (
                        Array.isArray(step.dependsOn)
                    ) {
                        step.dependsOn.forEach(
                            (dependency) => {

                                if (
                                    !item.steps.some(
                                        (candidate) =>
                                            candidate.id ===
                                            dependency
                                    )
                                ) {
                                    errors.push(
                                        "Unbekannte Abhängigkeit " +
                                        dependency +
                                        " in Step " +
                                        step.id
                                    );
                                }
                            }
                        );
                    }
                }
            );

            return {
                valid: errors.length === 0,
                errors,
                warnings,
                workflow: item
            };
        },

        /* --------------------------------------------------------
           Template / Variablen
           -------------------------------------------------------- */

        resolveTemplate(value, state) {

            if (typeof value === "string") {

                return value.replace(
                    /\{\{\s*([^}]+?)\s*\}\}/g,
                    function (_, path) {

                        const parts =
                            safeString(path)
                                .split(".")
                                .filter(Boolean);

                        let current = state;

                        for (
                            let i = 0;
                            i < parts.length;
                            i++
                        ) {

                            if (
                                current === null ||
                                current === undefined
                            ) {
                                return "";
                            }

                            current =
                                current[parts[i]];
                        }

                        return current === undefined ||
                            current === null
                            ? ""
                            : safeString(current);
                    }
                );
            }

            if (Array.isArray(value)) {
                return value.map(
                    (item) =>
                        workflow.resolveTemplate(
                            item,
                            state
                        )
                );
            }

            if (isObject(value)) {

                const output = {};

                Object.keys(value).forEach(
                    (key) => {
                        output[key] =
                            workflow.resolveTemplate(
                                value[key],
                                state
                            );
                    }
                );

                return output;
            }

            return value;
        },

        /* --------------------------------------------------------
           Bedingungsprüfung
           -------------------------------------------------------- */

        evaluateCondition(condition, state) {

            if (
                condition === null ||
                condition === undefined ||
                condition === ""
            ) {
                return true;
            }

            if (typeof condition === "boolean") {
                return condition;
            }

            if (typeof condition === "function") {

                try {
                    return Boolean(
                        condition(state)
                    );
                } catch (error) {
                    return false;
                }
            }

            if (isObject(condition)) {

                const left =
                    workflow.resolveTemplate(
                        condition.left,
                        state
                    );

                const right =
                    workflow.resolveTemplate(
                        condition.right,
                        state
                    );

                const operator =
                    safeString(
                        condition.operator ||
                        condition.op ||
                        "equals"
                    ).toLowerCase();

                switch (operator) {

                    case "equals":
                    case "==":
                    case "===":
                        return left === right ||
                            safeString(left) ===
                            safeString(right);

                    case "not":
                    case "!=":
                    case "!==":
                        return !(
                            left === right ||
                            safeString(left) ===
                            safeString(right)
                        );

                    case "contains":
                        return safeString(left)
                            .toLowerCase()
                            .includes(
                                safeString(right)
                                    .toLowerCase()
                            );

                    case "starts":
                    case "startswith":
                        return safeString(left)
                            .toLowerCase()
                            .startsWith(
                                safeString(right)
                                    .toLowerCase()
                            );

                    case "ends":
                    case "endswith":
                        return safeString(left)
                            .toLowerCase()
                            .endsWith(
                                safeString(right)
                                    .toLowerCase()
                            );

                    case "truthy":
                        return Boolean(left);

                    case "falsy":
                        return !Boolean(left);

                    case "gt":
                    case ">":
                        return Number(left) >
                            Number(right);

                    case "gte":
                    case ">=":
                        return Number(left) >=
                            Number(right);

                    case "lt":
                    case "<":
                        return Number(left) <
                            Number(right);

                    case "lte":
                    case "<=":
                        return Number(left) <=
                            Number(right);

                    default:
                        return Boolean(left);
                }
            }

            if (typeof condition === "string") {

                const value =
                    workflow.resolveTemplate(
                        condition,
                        state
                    );

                return Boolean(value);
            }

            return Boolean(condition);
        },

        /* --------------------------------------------------------
           Timeout Wrapper
           -------------------------------------------------------- */

        withTimeout(promise, timeout) {

            const duration =
                Math.max(
                    0,
                    Number(timeout) ||
                    workflow.state.defaultTimeout
                );

            if (!duration) {
                return promise;
            }

            return Promise.race([
                promise,

                new Promise(
                    (_, reject) => {

                        setTimeout(
                            () => {

                                const error =
                                    new Error(
                                        "Workflow step timeout."
                                    );

                                error.code =
                                    "WORKFLOW_TIMEOUT";

                                reject(error);

                            },
                            duration
                        );
                    }
                )
            ]);
        },

        /* --------------------------------------------------------
           Bestehende AI-Systeme auflösen
           -------------------------------------------------------- */

        resolvePlanner() {

            return (
                AI.planner ||
                AI.executionPlanner ||
                AI.contextPlanner ||
                null
            );
        },

        resolveRouter() {

            return (
                AI.router ||
                AI.commandRouter ||
                null
            );
        },

        resolveSecurity() {

            return (
                AI.security ||
                AI.permissions ||
                null
            );
        },

        /* --------------------------------------------------------
           Einzelnen Step ausführen
           -------------------------------------------------------- */

        async executeStep(
            step,
            execution
        ) {

            const state =
                execution.state;

            const resolvedParams =
                workflow.resolveTemplate(
                    step.params,
                    state
                );

            const text =
                workflow.resolveTemplate(
                    step.text,
                    state
                );

            const startedAt =
                now();

            emit(
                "ai:workflow-step-start",
                {
                    executionId:
                        execution.id,

                    workflowId:
                        execution.workflowId,

                    step:
                        clone(step)
                }
            );

            if (
                !workflow.evaluateCondition(
                    step.condition,
                    state
                )
            ) {

                const skipped = {
                    status: "skipped",
                    reason: "condition-false",
                    stepId: step.id,
                    startedAt,
                    completedAt: now()
                };

                emit(
                    "ai:workflow-step-skipped",
                    {
                        executionId:
                            execution.id,

                        workflowId:
                            execution.workflowId,

                        step:
                            clone(skipped)
                    }
                );

                return skipped;
            }

            let attempt = 0;
            let lastError = null;

            while (
                attempt <= step.retries
            ) {

                attempt++;

                try {

                    let result;

                    /* --------------------------------------------
                       TYPE: WAIT
                       -------------------------------------------- */

                    if (
                        step.type === "wait" ||
                        step.type === "delay"
                    ) {

                        const duration =
                            Number(
                                resolvedParams.duration ||
                                resolvedParams.ms ||
                                text ||
                                0
                            );

                        await delay(duration);

                        result = {
                            waited:
                                Math.max(
                                    0,
                                    duration
                                )
                        };
                    }

                    /* --------------------------------------------
                       TYPE: CONDITION
                       -------------------------------------------- */

                    else if (
                        step.type === "condition"
                    ) {

                        result = {
                            condition:
                                workflow.evaluateCondition(
                                    step.condition,
                                    state
                                )
                        };
                    }

                    /* --------------------------------------------
                       TYPE: ROUTE
                       -------------------------------------------- */

                    else if (
                        step.route
                    ) {

                        const router =
                            workflow.resolveRouter();

                        if (
                            !router
                        ) {
                            throw new Error(
                                "AI Router nicht verfügbar."
                            );
                        }

                        if (
                            typeof router.executePlan ===
                            "function" &&
                            isObject(step.route)
                        ) {

                            result =
                                await router.executePlan(
                                    clone(
                                        workflow.resolveTemplate(
                                            step.route,
                                            state
                                        )
                                    )
                                );

                        } else if (
                            typeof router.route ===
                            "function"
                        ) {

                            result =
                                await router.route(
                                    text ||
                                    step.route,
                                    {
                                        params:
                                            resolvedParams,

                                        workflow:
                                            execution
                                    }
                                );

                        } else {
                            throw new Error(
                                "AI Router besitzt keine ausführbare Methode."
                            );
                        }
                    }

                    /* --------------------------------------------
                       TYPE: CAPABILITY
                       -------------------------------------------- */

                    else if (
                        step.capability
                    ) {

                        if (
                            typeof AI.executeCapability ===
                            "function"
                        ) {

                            result =
                                await AI.executeCapability(
                                    step.capability,
                                    resolvedParams
                                );

                        } else if (
                            AI.capabilities &&
                            typeof AI.capabilities.execute ===
                            "function"
                        ) {

                            result =
                                await AI.capabilities.execute(
                                    step.capability,
                                    resolvedParams
                                );

                        } else {
                            throw new Error(
                                "AI Capability Engine nicht verfügbar."
                            );
                        }
                    }

                    /* --------------------------------------------
                       TYPE: APP
                       -------------------------------------------- */

                    else if (
                        step.app
                    ) {

                        if (
                            typeof AI.openApp ===
                            "function"
                        ) {

                            result =
                                await AI.openApp(
                                    step.app,
                                    resolvedParams
                                );

                        } else if (
                            AI.appRegistry &&
                            typeof AI.appRegistry.openApp ===
                            "function"
                        ) {

                            result =
                                await AI.appRegistry.openApp(
                                    step.app,
                                    resolvedParams
                                );

                        } else if (
                            root.apps &&
                            typeof root.apps.launch ===
                            "function"
                        ) {

                            result =
                                await root.apps.launch(
                                    step.app,
                                    resolvedParams
                                );

                        } else {
                            throw new Error(
                                "App-System nicht verfügbar."
                            );
                        }
                    }

                    /* --------------------------------------------
                       TYPE: ACTION
                       -------------------------------------------- */

                    else if (
                        step.action
                    ) {

                        if (
                            typeof AI.executeAction ===
                            "function"
                        ) {

                            result =
                                await AI.executeAction(
                                    step.action,
                                    resolvedParams
                                );

                        } else if (
                            typeof AI.executeAppAction ===
                            "function"
                        ) {

                            result =
                                await AI.executeAppAction(
                                    step.action,
                                    resolvedParams
                                );

                        } else if (
                            typeof AI.route ===
                            "function"
                        ) {

                            result =
                                await AI.route(
                                    safeString(
                                        step.action
                                    ),
                                    {
                                        params:
                                            resolvedParams
                                    }
                                );

                        } else {
                            throw new Error(
                                "AI Action Engine nicht verfügbar."
                            );
                        }
                    }

                    /* --------------------------------------------
                       TYPE: TEXT / AI
                       -------------------------------------------- */

                    else if (
                        step.type === "ai" ||
                        step.type === "chat" ||
                        step.type === "conversation" ||
                        step.text
                    ) {

                        if (
                            typeof AI.processMessage ===
                            "function"
                        ) {

                            result =
                                await AI.processMessage(
                                    text,
                                    {
                                        workflow:
                                            execution,

                                        params:
                                            resolvedParams,

                                        source:
                                            "workflow"
                                    }
                                );

                        } else if (
                            AI.chat &&
                            typeof AI.chat.process ===
                            "function"
                        ) {

                            result =
                                await AI.chat.process(
                                    text,
                                    {
                                        workflow:
                                            execution,

                                        params:
                                            resolvedParams
                                    }
                                );

                        } else if (
                            AI.chat &&
                            typeof AI.chat.send ===
                            "function"
                        ) {

                            result =
                                await AI.chat.send(
                                    text
                                );

                        } else {
                            throw new Error(
                                "AI Conversation Engine nicht verfügbar."
                            );
                        }
                    }

                    /* --------------------------------------------
                       TYPE: CUSTOM
                       -------------------------------------------- */

                    else if (
                        step.type === "custom" &&
                        typeof step.handler ===
                        "function"
                    ) {

                        result =
                            await step.handler(
                                {
                                    execution:
                                        execution,

                                    state:
                                        state,

                                    params:
                                        resolvedParams,

                                    step:
                                        step
                                }
                            );

                    }

                    /* --------------------------------------------
                       DEFAULT
                       -------------------------------------------- */

                    else {

                        if (
                            typeof AI.route ===
                            "function"
                        ) {

                            result =
                                await AI.route(
                                    text ||
                                    safeString(
                                        step.action
                                    ),
                                    {
                                        params:
                                            resolvedParams,

                                        workflow:
                                            execution
                                    }
                                );

                        } else {

                            result = {
                                success: true,
                                value: text
                            };
                        }
                    }

                    const completed = {

                        status:
                            "completed",

                        stepId:
                            step.id,

                        attempt,

                        result:
                            clone(result),

                        startedAt,

                        completedAt:
                            now(),

                        duration:
                            now() - startedAt
                    };

                    emit(
                        "ai:workflow-step-complete",
                        {
                            executionId:
                                execution.id,

                            workflowId:
                                execution.workflowId,

                            step:
                                clone(completed)
                        }
                    );

                    return completed;

                } catch (error) {

                    lastError = error;

                    emit(
                        "ai:workflow-step-error",
                        {
                            executionId:
                                execution.id,

                            workflowId:
                                execution.workflowId,

                            stepId:
                                step.id,

                            attempt,

                            error:
                                safeString(
                                    error &&
                                    error.message,
                                    error
                                )
                        }
                    );

                    if (
                        attempt <= step.retries
                    ) {

                        await delay(
                            Math.min(
                                1000 * attempt,
                                5000
                            )
                        );
                    }
                }
            }

            const failed = {

                status:
                    "failed",

                stepId:
                    step.id,

                attempt,

                error:
                    safeString(
                        lastError &&
                        lastError.message,
                        lastError
                    ),

                startedAt,

                completedAt:
                    now(),

                duration:
                    now() - startedAt
            };

            if (
                step.continueOnError
            ) {
                failed.continued = true;
            }

            return failed;
        },

        /* --------------------------------------------------------
           Execution State
           -------------------------------------------------------- */

        createExecution(
            workflowDefinition,
            options = {}
        ) {

            const definition =
                typeof workflowDefinition === "string"
                    ? workflow.getWorkflow(
                        workflowDefinition
                    )
                    : workflow.normalizeWorkflow(
                        workflowDefinition
                    );

            if (!definition) {
                return null;
            }

            const execution = {

                id:
                    uid("execution"),

                workflowId:
                    definition.id,

                status:
                    "created",

                startedAt:
                    null,

                completedAt:
                    null,

                pausedAt:
                    null,

                cancelledAt:
                    null,

                currentStepId:
                    null,

                currentIndex:
                    -1,

                options:
                    clone(options),

                state: {

                    variables:
                        clone(
                            definition.variables ||
                            {}
                        ),

                    input:
                        clone(
                            options.input ||
                            {}
                        ),

                    results:
                        {},

                    errors:
                        [],

                    completedSteps:
                        [],

                    skippedSteps:
                        [],

                    failedSteps:
                        [],

                    metadata:
                        clone(
                            options.metadata ||
                            {}
                        )
                },

                control: {

                    paused:
                        false,

                    cancelled:
                        false
                },

                createdAt:
                    now()
            };

            workflow.state.executions.set(
                execution.id,
                execution
            );

            return execution;
        },

        getExecution(id) {

            const execution =
                workflow.state.executions.get(
                    safeString(id)
                );

            return execution
                ? clone(execution)
                : null;
        },

        listExecutions() {

            return Array.from(
                workflow.state.executions.values()
            ).map(clone);
        },

        /* --------------------------------------------------------
           Pause
           -------------------------------------------------------- */

        async waitWhilePaused(
            execution
        ) {

            while (
                execution.control.paused &&
                !execution.control.cancelled
            ) {

                await delay(100);
            }
        },

        /* --------------------------------------------------------
           Einen Workflow ausführen
           -------------------------------------------------------- */

        async run(
            workflowDefinition,
            options = {}
        ) {

            let definition =
                typeof workflowDefinition === "string"
                    ? workflow.getWorkflow(
                        workflowDefinition
                    )
                    : workflow.normalizeWorkflow(
                        workflowDefinition
                    );

            if (!definition) {

                throw new Error(
                    "Workflow nicht gefunden."
                );
            }

            const validation =
                workflow.validate(
                    definition
                );

            if (
                !validation.valid
            ) {

                const error =
                    new Error(
                        "Workflow ist ungültig."
                    );

                error.validation =
                    validation;

                throw error;
            }

            if (
                definition.enabled === false
            ) {

                throw new Error(
                    "Workflow ist deaktiviert."
                );
            }

            const execution =
                workflow.createExecution(
                    definition,
                    options
                );

            if (!execution) {
                throw new Error(
                    "Workflow-Ausführung konnte nicht erstellt werden."
                );
            }

            workflow.state.activeExecutionId =
                execution.id;

            execution.status =
                "running";

            execution.startedAt =
                now();

            emit(
                "ai:workflow-start",
                {
                    executionId:
                        execution.id,

                    workflowId:
                        definition.id,

                    workflow:
                        clone(definition)
                }
            );

            let overallFailed = false;

            try {

                for (
                    let index = 0;
                    index < definition.steps.length;
                    index++
                ) {

                    if (
                        execution.control.cancelled
                    ) {

                        execution.status =
                            "cancelled";

                        execution.cancelledAt =
                            now();

                        break;
                    }

                    await workflow.waitWhilePaused(
                        execution
                    );

                    if (
                        execution.control.cancelled
                    ) {

                        execution.status =
                            "cancelled";

                        execution.cancelledAt =
                            now();

                        break;
                    }

                    const step =
                        definition.steps[index];

                    if (
                        !step.enabled
                    ) {

                        execution.state.skippedSteps
                            .push(step.id);

                        continue;
                    }

                    /* Abhängigkeiten prüfen */

                    const dependenciesSatisfied =
                        step.dependsOn.every(
                            (dependency) =>
                                execution.state
                                    .completedSteps
                                    .includes(
                                        dependency
                                    )
                        );

                    if (
                        !dependenciesSatisfied
                    ) {

                        const dependencyError =
                            new Error(
                                "Step-Abhängigkeiten wurden nicht erfüllt."
                            );

                        execution.state.errors.push(
                            {
                                stepId:
                                    step.id,

                                error:
                                    dependencyError.message
                            }
                        );

                        if (
                            !step.continueOnError
                        ) {

                            overallFailed =
                                true;

                            break;
                        }

                        continue;
                    }

                    execution.currentIndex =
                        index;

                    execution.currentStepId =
                        step.id;

                    const result =
                        await workflow.withTimeout(
                            workflow.executeStep(
                                step,
                                execution
                            ),
                            step.timeout
                        ).catch(
                            (error) => ({
                                status:
                                    "failed",

                                stepId:
                                    step.id,

                                error:
                                    safeString(
                                        error &&
                                        error.message,
                                        error
                                    )
                            })
                        );

                    execution.state.results[
                        step.id
                    ] = clone(result);

                    if (
                        result.status ===
                        "completed"
                    ) {

                        execution.state.completedSteps
                            .push(step.id);

                    } else if (
                        result.status ===
                        "skipped"
                    ) {

                        execution.state.skippedSteps
                            .push(step.id);

                    } else {

                        execution.state.failedSteps
                            .push(step.id);

                        execution.state.errors.push(
                            {
                                stepId:
                                    step.id,

                                error:
                                    result.error ||
                                    "Unknown workflow error."
                            }
                        );

                        if (
                            !step.continueOnError
                        ) {

                            overallFailed =
                                true;

                            break;
                        }
                    }
                }

                if (
                    execution.control.cancelled
                ) {

                    execution.status =
                        "cancelled";

                } else if (
                    overallFailed
                ) {

                    execution.status =
                        "failed";

                } else {

                    execution.status =
                        "completed";
                }

            } catch (error) {

                execution.status =
                    "failed";

                execution.state.errors.push(
                    {
                        workflow:
                            definition.id,

                        error:
                            safeString(
                                error &&
                                error.message,
                                error
                            )
                    }
                );

            } finally {

                execution.completedAt =
                    now();

                workflow.state.activeExecutionId =
                    null;

                workflow.addHistory(
                    execution,
                    definition
                );

                /* Learning */

                try {

                    if (
                        AI.learning &&
                        typeof AI.learning.recordInteraction ===
                        "function"
                    ) {

                        await AI.learning.recordInteraction(
                            {
                                type:
                                    "workflow",

                                workflowId:
                                    definition.id,

                                executionId:
                                    execution.id,

                                status:
                                    execution.status,

                                success:
                                    execution.status ===
                                    "completed"
                            }
                        );
                    }

                } catch (error) {}

                emit(
                    execution.status ===
                    "completed"
                        ? "ai:workflow-complete"
                        : execution.status ===
                          "cancelled"
                            ? "ai:workflow-cancelled"
                            : "ai:workflow-error",
                    {
                        executionId:
                            execution.id,

                        workflowId:
                            definition.id,

                        status:
                            execution.status,

                        execution:
                            clone(execution)
                    }
                );
            }

            workflow.persist().catch(() => {});

            return clone(execution);
        },

        execute(
            workflowDefinition,
            options = {}
        ) {
            return workflow.run(
                workflowDefinition,
                options
            );
        },

        start(
            workflowDefinition,
            options = {}
        ) {
            return workflow.run(
                workflowDefinition,
                options
            );
        },

        /* --------------------------------------------------------
           Pause / Resume / Cancel
           -------------------------------------------------------- */

        pause(executionId) {

            const execution =
                workflow.state.executions.get(
                    safeString(executionId)
                );

            if (!execution) {
                return false;
            }

            if (
                execution.status !==
                "running"
            ) {
                return false;
            }

            execution.control.paused =
                true;

            execution.pausedAt =
                now();

            execution.status =
                "paused";

            emit(
                "ai:workflow-paused",
                {
                    executionId:
                        execution.id,

                    workflowId:
                        execution.workflowId
                }
            );

            return true;
        },

        resume(executionId) {

            const execution =
                workflow.state.executions.get(
                    safeString(executionId)
                );

            if (!execution) {
                return false;
            }

            if (
                !execution.control.paused
            ) {
                return false;
            }

            execution.control.paused =
                false;

            execution.status =
                "running";

            emit(
                "ai:workflow-resumed",
                {
                    executionId:
                        execution.id,

                    workflowId:
                        execution.workflowId
                }
            );

            return true;
        },

        cancel(executionId) {

            const execution =
                workflow.state.executions.get(
                    safeString(executionId)
                );

            if (!execution) {
                return false;
            }

            if (
                execution.status ===
                    "completed" ||
                execution.status ===
                    "failed" ||
                execution.status ===
                    "cancelled"
            ) {
                return false;
            }

            execution.control.cancelled =
                true;

            execution.control.paused =
                false;

            execution.status =
                "cancelling";

            emit(
                "ai:workflow-cancel-requested",
                {
                    executionId:
                        execution.id,

                    workflowId:
                        execution.workflowId
                }
            );

            return true;
        },

        /* --------------------------------------------------------
           History
           -------------------------------------------------------- */

        addHistory(
            execution,
            definition
        ) {

            workflow.state.history.unshift({

                executionId:
                    execution.id,

                workflowId:
                    definition.id,

                workflowName:
                    definition.name,

                status:
                    execution.status,

                startedAt:
                    execution.startedAt,

                completedAt:
                    execution.completedAt,

                duration:
                    execution.completedAt &&
                    execution.startedAt
                        ? execution.completedAt -
                          execution.startedAt
                        : 0,

                completedSteps:
                    execution.state
                        .completedSteps
                        .length,

                failedSteps:
                    execution.state
                        .failedSteps
                        .length,

                errors:
                    clone(
                        execution.state.errors
                    )
            });

            if (
                workflow.state.history.length >
                workflow.state.maxHistory
            ) {

                workflow.state.history =
                    workflow.state.history.slice(
                        0,
                        workflow.state.maxHistory
                    );
            }
        },

        getHistory(limit = 50) {

            return workflow.state.history
                .slice(
                    0,
                    Math.max(
                        0,
                        Number(limit) || 50
                    )
                )
                .map(clone);
        },

        clearHistory() {

            workflow.state.history = [];

            workflow.persist().catch(() => {});

            emit(
                "ai:workflow-history-cleared",
                {}
            );

            return true;
        },

        /* --------------------------------------------------------
           Speicherung
           -------------------------------------------------------- */

        storageKey:
            "haldo.ai.workflow-engine.v1",

        async persist() {

            const payload = {

                version:
                    workflow.version,

                workflows:
                    workflow.listWorkflows(),

                history:
                    clone(
                        workflow.state.history
                    )
            };

            return storageWrite(
                workflow.storageKey,
                payload
            );
        },

        async restore() {

            const data =
                await storageRead(
                    workflow.storageKey,
                    null
                );

            if (
                !data ||
                !isObject(data)
            ) {
                return false;
            }

            if (
                Array.isArray(
                    data.workflows
                )
            ) {

                data.workflows.forEach(
                    (definition) => {

                        const normalized =
                            workflow.normalizeWorkflow(
                                definition
                            );

                        workflow.state.workflows.set(
                            normalized.id,
                            normalized
                        );
                    }
                );
            }

            if (
                Array.isArray(
                    data.history
                )
            ) {

                workflow.state.history =
                    data.history
                        .slice(
                            0,
                            workflow.state.maxHistory
                        );
            }

            emit(
                "ai:workflow-restored",
                {
                    workflows:
                        workflow.state
                            .workflows
                            .size
                }
            );

            return true;
        },

        /* --------------------------------------------------------
           AI Natural Language → Workflow
           -------------------------------------------------------- */

        async fromText(
            text,
            options = {}
        ) {

            const input =
                safeString(text).trim();

            if (!input) {
                return null;
            }

            const steps = [];

            /* Planner bevorzugen */

            try {

                const planner =
                    workflow.resolvePlanner();

                if (
                    planner &&
                    typeof planner.createPlan ===
                    "function"
                ) {

                    const plan =
                        await planner.createPlan(
                            input,
                            options
                        );

                    if (
                        plan &&
                        Array.isArray(
                            plan.steps
                        )
                    ) {

                        plan.steps.forEach(
                            (item) => {

                                steps.push(
                                    workflow.normalizeStep(
                                        {
                                            type:
                                                item.type ||
                                                "action",

                                            text:
                                                item.text ||
                                                item.command ||
                                                input,

                                            action:
                                                item.action,

                                            route:
                                                item.route,

                                            capability:
                                                item.capability,

                                            app:
                                                item.app,

                                            params:
                                                item.params
                                        },
                                        steps.length
                                    )
                                );
                            }
                        );
                    }
                }

            } catch (error) {}

            /* Falls Planner keine Mehrschritt-Struktur liefert */

            if (!steps.length) {

                const parts =
                    input
                        .split(
                            /\s*(?:\n|;|\s+und\s+dann\s+|\s+dann\s+)\s*/i
                        )
                        .filter(Boolean);

                parts.forEach(
                    (part) => {

                        steps.push(
                            workflow.normalizeStep(
                                {
                                    type:
                                        "ai",

                                    text:
                                        part
                                },
                                steps.length
                            )
                        );
                    }
                );
            }

            return workflow.createWorkflow(
                {
                    name:
                        options.name ||
                        "AI Workflow",

                    description:
                        input,

                    steps,

                    metadata:
                        {
                            source:
                                "natural-language",

                            originalText:
                                input
                        }
                }
            );
        },

        /* --------------------------------------------------------
           AI → Workflow direkt ausführen
           -------------------------------------------------------- */

        async runText(
            text,
            options = {}
        ) {

            const definition =
                await workflow.fromText(
                    text,
                    options
                );

            if (!definition) {
                return null;
            }

            return workflow.run(
                definition,
                options
            );
        },

        /* --------------------------------------------------------
           Status
           -------------------------------------------------------- */

        getState() {

            return {

                version:
                    workflow.version,

                workflowCount:
                    workflow.state
                        .workflows
                        .size,

                executionCount:
                    workflow.state
                        .executions
                        .size,

                historyCount:
                    workflow.state
                        .history
                        .length,

                activeExecutionId:
                    workflow.state
                        .activeExecutionId,

                defaultTimeout:
                    workflow.state
                        .defaultTimeout,

                defaultRetries:
                    workflow.state
                        .defaultRetries
            };
        },

        diagnostics() {

            const executions =
                workflow.listExecutions();

            return {

                ok: true,

                version:
                    workflow.version,

                workflows:
                    workflow.state
                        .workflows
                        .size,

                executions:
                    executions.length,

                running:
                    executions.filter(
                        (entry) =>
                            entry.status ===
                            "running"
                    ).length,

                paused:
                    executions.filter(
                        (entry) =>
                            entry.status ===
                            "paused"
                    ).length,

                completed:
                    executions.filter(
                        (entry) =>
                            entry.status ===
                            "completed"
                    ).length,

                failed:
                    executions.filter(
                        (entry) =>
                            entry.status ===
                            "failed"
                    ).length,

                cancelled:
                    executions.filter(
                        (entry) =>
                            entry.status ===
                            "cancelled"
                    ).length,

                history:
                    workflow.state
                        .history
                        .length
            };
        }
    };

    /* ------------------------------------------------------------
       Öffentliche AI APIs
       ------------------------------------------------------------ */

    AI.workflow =
        workflow;

    AI.taskEngine =
        workflow;

    AI.automation =
        workflow;

    AI.workflowEngine =
        workflow;

    root.workflow =
        workflow;

    OS.workflow =
        workflow;

    root.taskEngine =
        workflow;

    OS.taskEngine =
        workflow;

    root.automation =
        workflow;

    OS.automation =
        workflow;

    /* ------------------------------------------------------------
       Globale HalDo APIs
       ------------------------------------------------------------ */

    window.HalDoAIWorkflow =
        workflow;

    window.HalDoAITaskEngine =
        workflow;

    window.HalDoAIAutomation =
        workflow;

    /* ------------------------------------------------------------
       Convenience APIs
       ------------------------------------------------------------ */

    if (
        typeof AI.createWorkflow !==
        "function"
    ) {

        AI.createWorkflow =
            function (definition) {
                return workflow.createWorkflow(
                    definition
                );
            };
    }

    if (
        typeof AI.runWorkflow !==
        "function"
    ) {

        AI.runWorkflow =
            function (
                definition,
                options
            ) {
                return workflow.run(
                    definition,
                    options
                );
            };
    }

    if (
        typeof AI.runTask !==
        "function"
    ) {

        AI.runTask =
            function (
                definition,
                options
            ) {
                return workflow.run(
                    definition,
                    options
                );
            };
    }

    if (
        typeof AI.automate !==
        "function"
    ) {

        AI.automate =
            function (
                definition,
                options
            ) {
                return workflow.run(
                    definition,
                    options
                );
            };
    }

    if (
        typeof AI.runWorkflowText !==
        "function"
    ) {

        AI.runWorkflowText =
            function (
                text,
                options
            ) {
                return workflow.runText(
                    text,
                    options
                );
            };
    }

    /* ------------------------------------------------------------
       Bestehende AI Events beobachten
       ------------------------------------------------------------ */

    try {

        window.addEventListener(
            "ai:execution-complete",
            function (event) {

                const detail =
                    event.detail || {};

                emit(
                    "ai:workflow-learning-event",
                    {
                        source:
                            "ai-execution-complete",

                        detail:
                            clone(detail)
                    }
                );
            }
        );

        window.addEventListener(
            "ai:execution-error",
            function (event) {

                const detail =
                    event.detail || {};

                emit(
                    "ai:workflow-learning-event",
                    {
                        source:
                            "ai-execution-error",

                        detail:
                            clone(detail)
                    }
                );
            }
        );

    } catch (error) {}

    /* ------------------------------------------------------------
       Automatische Wiederherstellung
       ------------------------------------------------------------ */

    const restoreWorkflows =
        function () {

            workflow.restore()
                .catch(
                    () => {}
                );
        };

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            restoreWorkflows,
            {
                once: true
            }
        );

    } else {

        restoreWorkflows();
    }

    /* ------------------------------------------------------------
       Workflow Engine Ready
       ------------------------------------------------------------ */

    emit(
        "ai:workflow-engine-ready",
        {
            version:
                workflow.version,

            state:
                workflow.getState(),

            features: [
                "multi-step-workflows",
                "sequential-execution",
                "conditional-steps",
                "dependency-management",
                "retry",
                "timeout",
                "pause",
                "resume",
                "cancel",
                "state-passing",
                "planner-integration",
                "router-integration",
                "security-integration",
                "learning-integration",
                "persistent-history",
                "natural-language-workflows"
            ]
        }
    );

    console.log(
        "[HalDo AI OS] Teil 15/16 — AI Workflow / Task / Automation Engine ready."
    );

})();
