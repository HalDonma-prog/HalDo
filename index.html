                    if (!app) {
                        return;
                    }

                    const id =
                        String(
                            app.id ||
                            app.appId ||
                            app.slug ||
                            app.name ||
                            ""
                        );

                    const key =
                        normalize(id);

                    if (
                        !key ||
                        seen.has(key)
                    ) {
                        return;
                    }

                    seen.add(key);

                    const name =
                        String(
                            app.name ||
                            app.title ||
                            id
                        );

                    const description =
                        String(
                            app.description ||
                            app.subtitle ||
                            ""
                        );

                    const haystack =
                        normalize(
                            [
                                id,
                                name,
                                description,
                                app.category,
                                ...(Array.isArray(
                                    app.aliases
                                )
                                    ? app.aliases
                                    : [])
                            ].join(" ")
                        );

                    let score = 0;

                    if (!normalizedQuery) {
                        score = 1;
                    } else {

                        if (
                            normalize(id) ===
                            normalizedQuery
                        ) {
                            score += 100;
                        }

                        if (
                            normalize(name) ===
                            normalizedQuery
                        ) {
                            score += 90;
                        }

                        if (
                            normalize(name)
                                .startsWith(
                                    normalizedQuery
                                )
                        ) {
                            score += 50;
                        }

                        if (
                            haystack.includes(
                                normalizedQuery
                            )
                        ) {
                            score += 20;
                        }
                    }

                    if (
                        score > 0
                    ) {

                        results.push({
                            app,
                            id,
                            name,
                            description,
                            score,
                            source
                        });
                    }
                };

            const managers = [
                getAppManager(),
                getRegistry()
            ];

            for (
                const manager of
                    managers
            ) {

                if (!manager) {
                    continue;
                }

                try {

                    if (
                        typeof manager.list ===
                        "function"
                    ) {

                        const list =
                            manager.list();

                        if (
                            Array.isArray(list)
                        ) {

                            list.forEach(
                                app =>
                                    addResult(
                                        app,
                                        "manager"
                                    )
                            );
                        }
                    }

                    if (
                        typeof manager.getApps ===
                        "function"
                    ) {

                        const list =
                            manager.getApps();

                        if (
                            Array.isArray(list)
                        ) {

                            list.forEach(
                                app =>
                                    addResult(
                                        app,
                                        "registry"
                                    )
                            );
                        }
                    }

                    if (
                        Array.isArray(
                            manager.apps
                        )
                    ) {

                        manager.apps.forEach(
                            app =>
                                addResult(
                                    app,
                                    "apps"
                                )
                        );
                    }

                    if (
                        manager.apps instanceof Map
                    ) {

                        manager.apps.forEach(
                            app =>
                                addResult(
                                    app,
                                    "map"
                                )
                        );
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] App search warning:",
                        error
                    );
                }
            }

            return results
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );
        };

    /* ============================================================
       APP DETAILS
       ============================================================ */

    Apps.info =
        function appInfo(
            query
        ) {

            const results =
                Search.apps(
                    query
                );

            if (
                !results.length
            ) {

                return null;
            }

            const item =
                results[0];

            return {
                id:
                    item.id,

                name:
                    item.name,

                description:
                    item.description,

                app:
                    item.app
            };
        };

    /* ============================================================
       APP ÖFFNEN — ERWEITERTE VERSION
       ============================================================ */

    Apps.launch =
        async function launchApp(
            query,
            options = {}
        ) {

            const search =
                Search.apps(
                    query
                );

            const resolved =
                search[0]?.app ||
                Apps.resolve?.(
                    query
                ) ||
                null;

            const target =
                resolved?.id ||
                resolved?.appId ||
                resolved?.slug ||
                query;

            HD.livingAI?.setState?.(
                "opening"
            );

            HD.events?.emit?.(
                "ai:launch-start",
                {
                    query,
                    target,
                    app:
                        resolved
                }
            );

            const router =
                getRouter();

            if (router) {

                try {

                    if (
                        typeof router.open ===
                        "function"
                    ) {

                        const result =
                            await router.open(
                                target,
                                options
                            );

                        HD.events?.emit?.(
                            "ai:launch-complete",
                            {
                                target,
                                result
                            }
                        );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            target,
                            result
                        };
                    }

                    if (
                        typeof router.navigate ===
                        "function"
                    ) {

                        const result =
                            await router.navigate(
                                target
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            target,
                            result
                        };
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] Router launch failed:",
                        error
                    );
                }
            }

            const launcher =
                getLauncher();

            if (launcher) {

                try {

                    if (
                        typeof launcher.launch ===
                        "function"
                    ) {

                        const result =
                            await launcher.launch(
                                target,
                                options
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            target,
                            result
                        };
                    }

                    if (
                        typeof launcher.open ===
                        "function"
                    ) {

                        const result =
                            await launcher.open(
                                target,
                                options
                            );

                        HD.livingAI?.setState?.(
                            "idle"
                        );

                        return {
                            ok: true,
                            target,
                            result
                        };
                    }

                } catch (error) {

                    console.warn(
                        "[HalDo AI] Launcher launch failed:",
                        error
                    );
                }
            }

            HD.livingAI?.setState?.(
                "concerned"
            );

            return {
                ok: false,
                error:
                    "launch-failed",
                target
            };
        };

    /* ============================================================
       NAVIGATION
       ============================================================ */

    Navigation.current =
        Navigation.current ||
        "desktop";

    Navigation.history =
        Navigation.history ||
        [];

    Navigation.go =
        async function go(
            target,
            options = {}
        ) {

            const value =
                String(
                    target || ""
                ).trim();

            if (!value) {
                return false;
            }

            const previous =
                Navigation.current;

            Navigation.history.push({
                from:
                    previous,

                to:
                    value,

                timestamp:
                    Date.now()
            });

            if (
                Navigation.history.length >
                100
            ) {

                Navigation.history =
                    Navigation.history.slice(
                        -100
                    );
            }

            Navigation.current =
                value;

            const router =
                getRouter();

            try {

                if (
                    router &&
                    typeof router.navigate ===
                    "function"
                ) {

                    const result =
                        await router.navigate(
                            value,
                            options
                        );

                    HD.events?.emit?.(
                        "navigation:changed",
                        {
                            from:
                                previous,

                            to:
                                value,

                            result
                        }
                    );

                    return result;
                }

                if (
                    router &&
                    typeof router.open ===
                    "function"
                ) {

                    const result =
                        await router.open(
                            value,
                            options
                        );

                    HD.events?.emit?.(
                        "navigation:changed",
                        {
                            from:
                                previous,

                            to:
                                value,

                            result
                        }
                    );

                    return result;
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Navigation failed:",
                    error
                );
            }

            HD.events?.emit?.(
                "navigation:changed",
                {
                    from:
                        previous,

                    to:
                        value
                }
            );

            return true;
        };

    Navigation.back =
        async function back() {

            if (
                Navigation.history.length <
                2
            ) {

                return false;
            }

            Navigation.history.pop();

            const previous =
                Navigation.history.at(-1);

            if (!previous) {
                return false;
            }

            Navigation.current =
                previous.from;

            const router =
                getRouter();

            try {

                if (
                    router &&
                    typeof router.back ===
                    "function"
                ) {

                    return router.back();
                }

            } catch (_) {
                /* optional router back */
            }

            HD.events?.emit?.(
                "navigation:back",
                {
                    target:
                        Navigation.current
                }
            );

            return true;
        };

    Navigation.home =
        async function home() {

            const targets = [
                "desktop",
                "home",
                "launcher",
                "dashboard"
            ];

            for (
                const target of
                    targets
            ) {

                try {

                    const result =
                        await Navigation.go(
                            target
                        );

                    if (
                        result !== false
                    ) {
                        return result;
                    }

                } catch (_) {
                    /* try next */
                }
            }

            return false;
        };

    /* ============================================================
       FENSTER-STEUERUNG
       ============================================================ */

    Actions.closeWindow =
        function closeWindow(
            id
        ) {

            const windows =
                getWindows();

            if (
                !windows ||
                !id
            ) {
                return false;
            }

            try {

                if (
                    typeof windows.close ===
                    "function"
                ) {

                    return windows.close(
                        id
                    );
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Window close failed:",
                    error
                );
            }

            return false;
        };

    Actions.minimizeWindow =
        function minimizeWindow(
            id
        ) {

            const windows =
                getWindows();

            if (
                !windows ||
                !id
            ) {
                return false;
            }

            try {

                if (
                    typeof windows.minimize ===
                    "function"
                ) {

                    return windows.minimize(
                        id
                    );
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Window minimize failed:",
                    error
                );
            }

            return false;
        };

    Actions.maximizeWindow =
        function maximizeWindow(
            id
        ) {

            const windows =
                getWindows();

            if (
                !windows ||
                !id
            ) {
                return false;
            }

            try {

                if (
                    typeof windows.maximize ===
                    "function"
                ) {

                    return windows.maximize(
                        id
                    );
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Window maximize failed:",
                    error
                );
            }

            return false;
        };

    Actions.focusWindow =
        function focusWindow(
            id
        ) {

            const windows =
                getWindows();

            if (
                !windows ||
                !id
            ) {
                return false;
            }

            try {

                if (
                    typeof windows.focus ===
                    "function"
                ) {

                    return windows.focus(
                        id
                    );
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Window focus failed:",
                    error
                );
            }

            return false;
        };

    /* ============================================================
       SYSTEM / DESKTOP AKTIONEN
       ============================================================ */

    Actions.showDesktop =
        function showDesktop() {

            HD.events?.emit?.(
                "desktop:show"
            );

            const windows =
                getWindows();

            if (
                windows &&
                typeof windows.minimizeAll ===
                "function"
            ) {

                return windows.minimizeAll();
            }

            if (
                windows &&
                typeof windows.hideAll ===
                "function"
            ) {

                return windows.hideAll();
            }

            return true;
        };

    Actions.refresh =
        function refresh() {

            HD.events?.emit?.(
                "system:refresh"
            );

            try {

                window.dispatchEvent(
                    new Event(
                        "haldo:refresh"
                    )
                );

            } catch (_) {}

            return true;
        };

    /* ============================================================
       AI-SUCHFUNKTION
       ============================================================ */

    AI.search =
        async function aiSearch(
            query,
            options = {}
        ) {

            const value =
                String(
                    query || ""
                ).trim();

            if (!value) {

                return {
                    ok: false,
                    results: []
                };
            }

            HD.livingAI?.setState?.(
                "working"
            );

            HD.events?.emit?.(
                "ai:search-start",
                {
                    query:
                        value
                }
            );

            const appResults =
                Search.apps(
                    value
                );

            const systemResults = [];

            const systemKeywords = [
                "einstellungen",
                "settings",
                "system",
                "speicher",
                "storage",
                "sprache",
                "language",
                "tastatur",
                "keyboard",
                "theme",
                "design",
                "hilfe",
                "help"
            ];

            const normalized =
                normalize(
                    value
                );

            for (
                const keyword of
                    systemKeywords
            ) {

                if (
                    normalized.includes(
                        keyword
                    )
                ) {

                    systemResults.push({
                        type:
                            "system",

                        keyword,

                        score:
                            normalized ===
                            keyword
                                ? 100
                                : 50
                    });
                }
            }

            const results = [
                ...appResults.map(
                    item => ({
                        type:
                            "app",

                        ...item
                    })
                ),
                ...systemResults
            ];

            results.sort(
                (a, b) =>
                    (b.score || 0) -
                    (a.score || 0)
            );

            HD.livingAI?.setState?.(
                "idle"
            );

            HD.events?.emit?.(
                "ai:search-complete",
                {
                    query:
                        value,

                    results
                }
            );

            return {
                ok: true,
                query:
                    value,
                results
            };
        };

    /* ============================================================
       NATURAL LANGUAGE ACTION DETECTION
       ============================================================ */

    AI.detectAction =
        function detectAction(
            text
        ) {

            const original =
                String(
                    text || ""
                ).trim();

            const normalized =
                normalize(
                    original
                );

            if (!normalized) {
                return null;
            }

            const patterns = [

                {
                    regex:
                        /^(?:öffne|oeffne|starte|start|launch)\s+(.+)$/i,

                    type:
                        "open-app",

                    value:
                        1
                },

                {
                    regex:
                        /^(?:schließe|schliesse|beende|stoppe|stop)\s+(.+)$/i,

                    type:
                        "close-window",

                    value:
                        1
                },

                {
                    regex:
                        /^(?:minimiere|minimieren)\s+(.+)$/i,

                    type:
                        "minimize-window",

                    value:
                        1
                },

                {
                    regex:
                        /^(?:maximiere|maximieren)\s+(.+)$/i,

                    type:
                        "maximize-window",

                    value:
                        1
                },

                {
                    regex:
                        /^(?:zeige desktop|desktop anzeigen|desktop zeigen)$/i,

                    type:
                        "show-desktop"
                },

                {
                    regex:
                        /^(?:zurück|zurueck|gehe zurück|gehe zurueck)$/i,

                    type:
                        "back"
                },

                {
                    regex:
                        /^(?:startseite|home|hauptmenü|hauptmenu)$/i,

                    type:
                        "home"
                },

                {
                    regex:
                        /^(?:suche nach|suche|finde)\s+(.+)$/i,

                    type:
                        "search",

                    value:
                        1
                }
            ];

            for (
                const pattern of
                    patterns
            ) {

                const match =
                    normalized.match(
                        pattern.regex
                    );

                if (!match) {
                    continue;
                }

                return {
                    type:
                        pattern.type,

                    value:
                        pattern.value
                            ? original
                                .match(
                                    pattern.regex
                                )?.[
                                    pattern.value
                                ] ||
                                match[
                                    pattern.value
                                ]
                            : "",

                    original
                };
            }

            return null;
        };

    /* ============================================================
       ACTION EXECUTOR
       ============================================================ */

    AI.executeAction =
        async function executeAction(
            action,
            context = {}
        ) {

            if (!action) {

                return {
                    ok: false
                };
            }

            HD.events?.emit?.(
                "ai:action-start",
                {
                    action,
                    context
                }
            );

            try {

                switch (
                    action.type
                ) {

                    case "open-app":
                        return Apps.launch(
                            action.value
                        );

                    case "close-window":
                        return {
                            ok:
                                Actions.closeWindow(
                                    action.value
                                )
                        };

                    case "minimize-window":
                        return {
                            ok:
                                Actions.minimizeWindow(
                                    action.value
                                )
                        };

                    case "maximize-window":
                        return {
                            ok:
                                Actions.maximizeWindow(
                                    action.value
                                )
                        };

                    case "show-desktop":
                        return {
                            ok:
                                Actions.showDesktop()
                        };

                    case "back":
                        return {
                            ok:
                                await Navigation.back()
                        };

                    case "home":
                        return {
                            ok:
                                await Navigation.home()
                        };

                    case "search":
                        return AI.search(
                            action.value,
                            context
                        );

                    default:
                        return {
                            ok: false,
                            error:
                                "unknown-action"
                        };
                }

            } catch (error) {

                console.error(
                    "[HalDo AI] Action execution failed:",
                    error
                );

                HD.events?.emit?.(
                    "ai:action-error",
                    {
                        action,
                        error
                    }
                );

                return {
                    ok: false,
                    error
                };
            }
        };

    /* ============================================================
       CHAT-INTEGRATION
       ============================================================ */

    if (
        AI.chat &&
        !AI.chat.actionLayerAttached
    ) {

        AI.chat.actionLayerAttached =
            true;

        AI.chat.originalActionSend =
            AI.chat.send;

        AI.chat.send =
            async function actionAwareSend(
                text,
                record = null
            ) {

                const action =
                    AI.detectAction(
                        text
                    );

                if (action) {

                    const result =
                        await AI.executeAction(
                            action,
                            {
                                source:
                                    "chat"
                            }
                        );

                    let response;

                    if (
                        action.type ===
                        "open-app"
                    ) {

                        response =
                            result.ok
                                ? `Ich öffne ${action.value}.`
                                : `Ich konnte ${action.value} nicht öffnen.`;

                    } else if (
                        action.type ===
                        "search"
                    ) {

                        const count =
                            result.results
                                ?.length ||
                            0;

                        response =
                            count
                                ? `Ich habe ${count} passende Ergebnisse gefunden.`
                                : "Ich habe keine passenden Ergebnisse gefunden.";

                    } else if (
                        action.type ===
                        "show-desktop"
                    ) {

                        response =
                            result.ok
                                ? "Der Desktop ist wieder eingeblendet."
                                : "Der Desktop konnte nicht eingeblendet werden.";

                    } else if (
                        action.type ===
                        "back"
                    ) {

                        response =
                            result.ok
                                ? "Ich gehe zurück."
                                : "Zurück ist momentan nicht möglich.";

                    } else if (
                        action.type ===
                        "home"
                    ) {

                        response =
                            result.ok
                                ? "Ich öffne die Startseite."
                                : "Die Startseite konnte nicht geöffnet werden.";

                    } else {

                        response =
                            result.ok
                                ? "Erledigt."
                                : "Die Aktion konnte nicht ausgeführt werden.";
                    }

                    if (
                        AI.chat.addMessage
                    ) {

                        const message =
                            AI.chat.addMessage(
                                "assistant",
                                response,
                                {
                                    action:
                                        action.type
                                }
                            );

                        const activeRecord =
                            record ||
                            HD.windows?.get?.(
                                AI.chat.windowId
                            );

                        const container =
                            activeRecord
                                ?.contentElement
                                ?.querySelector(
                                    "[data-chat-messages]"
                                );

                        if (
                            container &&
                            AI.chat.renderMessage
                        ) {

                            AI.chat.renderMessage(
                                message,
                                container
                            );
                        }

                        if (
                            AI.config?.autoSpeak &&
                            HD.voice?.enabled
                        ) {

                            HD.voice.speak(
                                response
                            );
                        }

                        return message;
                    }

                    return response;
                }

                return AI.chat
                    .originalActionSend(
                        text,
                        record
                    );
            };
    }

    /* ============================================================
       ÖFFENTLICHE API
       ============================================================ */

    window.HalDoSearch =
        Search;

    window.HalDoNavigation =
        Navigation;

    window.HalDoActions =
        Actions;

    if (window.HalDoOS) {

        window.HalDoOS.search =
            Search;

        window.HalDoOS.navigation =
            Navigation;

        window.HalDoOS.actions =
            Actions;
    }

    AI.appSearch =
        Search.apps;

    AI.openApp =
        Apps.launch;

    AI.navigate =
        Navigation.go;

    AI.goBack =
        Navigation.back;

    AI.goHome =
        Navigation.home;

    HD.events?.emit?.(
        "ai-action-layer:ready",
        {
            search:
                true,

            navigation:
                true,

            appLaunch:
                true,

            windowActions:
                true
        }
    );

    console.info(
        "[HalDo AI OS] Teil 5/16 — App, Search & Navigation layer ready."
    );

})();
</script>
<script>
(() => {
    "use strict";

    const HD =
        window.HalDo ||
        window.HalDoOS?.shell;

    if (!HD) {
        console.error(
            "[HalDo AI OS] Teil 6/16: HalDo core namespace missing."
        );
        return;
    }

    /* ============================================================
       HALDO AI — MEMORY & CONTEXT ENGINE
       Teil 6 / 16

       Verbindet:
       - Chat
       - Conversation
       - Storage
       - AI Context
       - Memory
       - Events
       - System Session

       Bestehende Funktionen werden erweitert,
       nicht entfernt.
       ============================================================ */

    HD.ai = HD.ai || {};
    HD.memory = HD.memory || {};
    HD.context = HD.context || {};
    HD.session = HD.session || {};

    const AI = HD.ai;
    const Memory = HD.memory;
    const Context = HD.context;
    const Session = HD.session;

    /* ============================================================
       KONFIGURATION
       ============================================================ */

    Memory.config =
        Memory.config || {
            enabled: true,
            maxEntries: 500,
            maxContextMessages: 24,
            storageKey:
                "haldo-ai-memory",
            contextStorageKey:
                "haldo-ai-context"
        };

    /* ============================================================
       INTERNE HILFSFUNKTIONEN
       ============================================================ */

    const uid =
        prefix => {

            if (
                HD.utils &&
                typeof HD.utils.uid ===
                "function"
            ) {

                return HD.utils.uid(
                    prefix
                );
            }

            return (
                String(prefix || "id") +
                "-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2)
            );
        };

    const safeString =
        value =>
            String(
                value ?? ""
            ).trim();

    const now =
        () =>
            Date.now();

    /* ============================================================
       MEMORY STORE
       ============================================================ */

    Memory.entries =
        Array.isArray(
            Memory.entries
        )
            ? Memory.entries
            : [];

    Memory.add =
        function addMemory(
            content,
            metadata = {}
        ) {

            if (
                !Memory.config.enabled
            ) {
                return null;
            }

            const text =
                safeString(
                    content
                );

            if (!text) {
                return null;
            }

            const entry = {

                id:
                    uid(
                        "memory"
                    ),

                content:
                    text,

                type:
                    metadata.type ||
                    "general",

                source:
                    metadata.source ||
                    "conversation",

                importance:
                    Number.isFinite(
                        metadata.importance
                    )
                        ? metadata.importance
                        : 1,

                tags:
                    Array.isArray(
                        metadata.tags
                    )
                        ? [
                            ...new Set(
                                metadata.tags
                                    .map(
                                        tag =>
                                            safeString(
                                                tag
                                            )
                                            .toLowerCase()
                                    )
                                    .filter(
                                        Boolean
                                    )
                            )
                        ]
                        : [],

                createdAt:
                    now(),

                updatedAt:
                    now(),

                metadata:
                    {
                        ...metadata
                    }
            };

            Memory.entries.push(
                entry
            );

            Memory.trim();
            Memory.persist();

            HD.events?.emit?.(
                "ai:memory-added",
                entry
            );

            return entry;
        };

    /* ============================================================
       MEMORY UPDATE
       ============================================================ */

    Memory.update =
        function updateMemory(
            id,
            changes = {}
        ) {

            const entry =
                Memory.entries.find(
                    item =>
                        item.id ===
                        id
                );

            if (!entry) {
                return null;
            }

            if (
                changes.content !==
                undefined
            ) {

                const content =
                    safeString(
                        changes.content
                    );

                if (content) {
                    entry.content =
                        content;
                }
            }

            if (
                changes.type !==
                undefined
            ) {

                entry.type =
                    safeString(
                        changes.type
                    ) ||
                    entry.type;
            }

            if (
                changes.importance !==
                undefined &&
                Number.isFinite(
                    changes.importance
                )
            ) {

                entry.importance =
                    changes.importance;
            }

            if (
                Array.isArray(
                    changes.tags
                )
            ) {

                entry.tags =
                    [
                        ...new Set(
                            changes.tags
                                .map(
                                    tag =>
                                        safeString(
                                            tag
                                        ).toLowerCase()
                                )
                                .filter(
                                    Boolean
                                )
                        )
                    ];
            }

            entry.updatedAt =
                now();

            Memory.persist();

            HD.events?.emit?.(
                "ai:memory-updated",
                entry
            );

            return entry;
        };

    /* ============================================================
       MEMORY REMOVE
       ============================================================ */

    Memory.remove =
        function removeMemory(
            id
        ) {

            const index =
                Memory.entries.findIndex(
                    entry =>
                        entry.id ===
                        id
                );

            if (
                index === -1
            ) {

                return false;
            }

            const removed =
                Memory.entries.splice(
                    index,
                    1
                )[0];

            Memory.persist();

            HD.events?.emit?.(
                "ai:memory-removed",
                removed
            );

            return true;
        };

    /* ============================================================
       MEMORY CLEAR
       ============================================================ */

    Memory.clear =
        function clearMemory(
            type = null
        ) {

            if (!type) {

                Memory.entries =
                    [];

            } else {

                const target =
                    safeString(
                        type
                    ).toLowerCase();

                Memory.entries =
                    Memory.entries.filter(
                        entry =>
                            entry.type !==
                            target
                    );
            }

            Memory.persist();

            HD.events?.emit?.(
                "ai:memory-cleared",
                {
                    type
                }
            );

            return true;
        };

    /* ============================================================
       MEMORY TRIM
       ============================================================ */

    Memory.trim =
        function trimMemory() {

            const max =
                Math.max(
                    1,
                    Number(
                        Memory.config
                            .maxEntries
                    ) || 500
                );

            if (
                Memory.entries.length <=
                max
            ) {
                return;
            }

            Memory.entries.sort(
                (a, b) => {

                    const scoreA =
                        (a.importance || 1) *
                        1000000000000 +
                        (a.updatedAt || 0);

                    const scoreB =
                        (b.importance || 1) *
                        1000000000000 +
                        (b.updatedAt || 0);

                    return scoreB -
                        scoreA;
                }
            );

            Memory.entries =
                Memory.entries.slice(
                    0,
                    max
                );
        };

    /* ============================================================
       MEMORY SEARCH
       ============================================================ */

    Memory.search =
        function searchMemory(
            query,
            options = {}
        ) {

            const text =
                safeString(
                    query
                ).toLowerCase();

            if (!text) {
                return [];
            }

            const terms =
                text
                    .split(/\s+/)
                    .filter(
                        Boolean
                    );

            const type =
                options.type
                    ? safeString(
                        options.type
                    ).toLowerCase()
                    : null;

            const limit =
                Math.max(
                    1,
                    Number(
                        options.limit
                    ) || 20
                );

            const results =
                Memory.entries
                    .filter(
                        entry => {

                            if (
                                type &&
                                entry.type !==
                                type
                            ) {
                                return false;
                            }

                            return true;
                        }
                    )
                    .map(
                        entry => {

                            const haystack =
                                [
                                    entry.content,
                                    entry.type,
                                    entry.source,
                                    ...(entry.tags || [])
                                ]
                                    .join(" ")
                                    .toLowerCase();

                            let score = 0;

                            terms.forEach(
                                term => {

                                    if (
                                        haystack.includes(
                                            term
                                        )
                                    ) {

                                        score +=
                                            10;
                                    }

                                    if (
                                        entry.tags?.includes(
                                            term
                                        )
                                    ) {

                                        score +=
                                            20;
                                    }
                                }
                            );

                            score +=
                                Number(
                                    entry.importance ||
                                    1
                                );

                            return {
                                entry,
                                score
                            };
                        }
                    )
                    .filter(
                        result =>
                            result.score > 0
                    )
                    .sort(
                        (a, b) =>
                            b.score -
                            a.score
                    )
                    .slice(
                        0,
                        limit
                    );

            return results;
        };

    /* ============================================================
       STORAGE
       ============================================================ */

    Memory.persist =
        function persistMemory() {

            try {

                const storage =
                    HD.storage ||
                    window.HalDoStorage ||
                    window.HalDoOS?.storage;

                if (
                    storage &&
                    typeof storage.set ===
                    "function"
                ) {

                    storage.set(
                        Memory.config
                            .storageKey,
                        {
                            entries:
                                Memory.entries,

                            updatedAt:
                                now()
                        }
                    );

                    return true;
                }

                try {

                    localStorage.setItem(
                        Memory.config
                            .storageKey,
                        JSON.stringify({
                            entries:
                                Memory.entries,

                            updatedAt:
                                now()
                        })
                    );

                    return true;

                } catch (_) {

                    return false;
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Memory persistence failed:",
                    error
                );

                return false;
            }
        };

    Memory.restore =
        function restoreMemory() {

            try {

                const storage =
                    HD.storage ||
                    window.HalDoStorage ||
                    window.HalDoOS?.storage;

                let stored =
                    null;

                if (
                    storage &&
                    typeof storage.get ===
                    "function"
                ) {

                    stored =
                        storage.get(
                            Memory.config
                                .storageKey
                        );
                }

                if (
                    !stored
                ) {

                    try {

                        const raw =
                            localStorage.getItem(
                                Memory.config
                                    .storageKey
                            );

                        stored =
                            raw
                                ? JSON.parse(
                                    raw
                                )
                                : null;

                    } catch (_) {}
                }

                if (
                    stored &&
                    Array.isArray(
                        stored.entries
                    )
                ) {

                    Memory.entries =
                        stored.entries;

                    Memory.trim();

                    return true;
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Memory restore failed:",
                    error
                );
            }

            return false;
        };

    /* ============================================================
       CONVERSATION CONTEXT
       ============================================================ */

    Context.messages =
        Array.isArray(
            Context.messages
        )
            ? Context.messages
            : [];

    Context.variables =
        Context.variables ||
        {};

    Context.currentTopic =
        Context.currentTopic ||
        "";

    Context.lastUserMessage =
        Context.lastUserMessage ||
        "";

    Context.lastAssistantMessage =
        Context.lastAssistantMessage ||
        "";

    Context.updatedAt =
        Context.updatedAt ||
        now();

    /* ============================================================
       CONTEXT MESSAGE
       ============================================================ */

    Context.addMessage =
        function addContextMessage(
            role,
            content,
            metadata = {}
        ) {

            const message = {

                id:
                    uid(
                        "context-message"
                    ),

                role:
                    safeString(
                        role
                    ) || "system",

                content:
                    safeString(
                        content
                    ),

                timestamp:
                    now(),

                metadata:
                    {
                        ...metadata
                    }
            };

            Context.messages.push(
                message
            );

            const max =
                Math.max(
                    1,
                    Number(
                        Memory.config
                            .maxContextMessages
                    ) || 24
                );

            if (
                Context.messages.length >
                max
            ) {

                Context.messages =
                    Context.messages.slice(
                        -max
                    );
            }

            if (
                message.role ===
                "user"
            ) {

                Context.lastUserMessage =
                    message.content;
            }

            if (
                message.role ===
                "assistant"
            ) {

                Context.lastAssistantMessage =
                    message.content;
            }

            Context.updatedAt =
                now();

            HD.events?.emit?.(
                "ai:context-message",
                message
            );

            return message;
        };

    /* ============================================================
       CONTEXT VARIABLES
       ============================================================ */

    Context.set =
        function setContext(
            key,
            value
        ) {

            const name =
                safeString(
                    key
                );

            if (!name) {
                return false;
            }

            Context.variables[
                name
            ] = value;

            Context.updatedAt =
                now();

            HD.events?.emit?.(
                "ai:context-changed",
                {
                    key:
                        name,

                    value
                }
            );

            return true;
        };

    Context.get =
        function getContext(
            key,
            fallback = null
        ) {

            const name =
                safeString(
                    key
                );

            if (!name) {
                return fallback;
            }

            return Object.prototype
                .hasOwnProperty.call(
                    Context.variables,
                    name
                )
                    ? Context.variables[
                        name
                    ]
                    : fallback;
        };

    Context.remove =
        function removeContext(
            key
        ) {

            const name =
                safeString(
                    key
                );

            if (
                !Object.prototype
                    .hasOwnProperty.call(
                        Context.variables,
                        name
                    )
            ) {

                return false;
            }

            delete Context.variables[
                name
            ];

            Context.updatedAt =
                now();

            return true;
        };

    /* ============================================================
       TOPIC
       ============================================================ */

    Context.setTopic =
        function setTopic(
            topic
        ) {

            Context.currentTopic =
                safeString(
                    topic
                );

            Context.updatedAt =
                now();

            HD.events?.emit?.(
                "ai:topic-changed",
                {
                    topic:
                        Context.currentTopic
                }
            );

            return Context.currentTopic;
        };

    Context.getTopic =
        function getTopic() {

            return Context.currentTopic ||
                "";
        };

    /* ============================================================
       CONTEXT SNAPSHOT
       ============================================================ */

    Context.snapshot =
        function snapshot() {

            return {
                topic:
                    Context.currentTopic,

                lastUserMessage:
                    Context.lastUserMessage,

                lastAssistantMessage:
                    Context.lastAssistantMessage,

                variables:
                    {
                        ...Context.variables
                    },

                messages:
                    Context.messages.map(
                        message => ({
                            ...message
                        })
                    ),

                updatedAt:
                    Context.updatedAt
            };
        };

    /* ============================================================
       CONTEXT RESTORE
       ============================================================ */

    Context.persist =
        function persistContext() {

            try {

                const storage =
                    HD.storage ||
                    window.HalDoStorage ||
                    window.HalDoOS?.storage;

                const snapshot =
                    Context.snapshot();

                if (
                    storage &&
                    typeof storage.set ===
                    "function"
                ) {

                    storage.set(
                        Memory.config
                            .contextStorageKey,
                        snapshot
                    );

                    return true;
                }

                try {

                    localStorage.setItem(
                        Memory.config
                            .contextStorageKey,
                        JSON.stringify(
                            snapshot
                        )
                    );

                    return true;

                } catch (_) {

                    return false;
                }

            } catch (error) {

                console.warn(
                    "[HalDo AI] Context persistence failed:",
                    error
                );

                return false;
            }
        };

    Context.restore =
        function restoreContext() {

            try {

                const storage =
                    HD.storage ||
                    window.HalDoStorage ||
                    window.HalDoOS?.storage;

                let stored =
                    null;

                if (
                    storage &&
                    typeof storage.get ===
                    "function"
                ) {

                    stored =
                        storage.get(
                            Memory.config
                                .contextStorageKey
                        );
                }

                if (!stored) {

                    try {

                        const raw =
                            localStorage.getItem(
                                Memory.config
                                    .contextStorageKey
                            );

                        stored =
                            raw
                                ? JSON.parse(
                                    raw
                                )
                                : null;

                    } catch (_) {}
                }

                if (!stored) {
                    return false;
                }

                Context.currentTopic =
                    stored.topic ||
                    "";

                Context.lastUserMessage =
                    stored.lastUserMessage ||
                    "";

                Context.lastAssistantMessage =
                    stored.lastAssistantMessage ||
                    "";

                Context.variables =
                    stored.variables &&
                    typeof stored.variables ===
                    "object"
                        ? stored.variables
                        : {};

                Context.messages =
                    Array.isArray(
                        stored.messages
                    )
                        ? stored.messages
                        : [];

                Context.updatedAt =

      "generate",
      "respond",
      "ask",
      "chat"
    ];

    for (const method of methods) {

          message: request.text,
          request: request,

      );

  }

  const capabilityAPI = {

<script>

     1. HILFSFUNKTIONEN

  function normalize(value) {
    return String(value == null ? "" : value)
      .trim()
      .replace(/\s+/g, " ");
  }

  function normalizeKey(value) {
    return normalize(value).toLowerCase();
  }

  function createId(prefix) {
    return (
      String(prefix || "app") +
      "-" +
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2, 9)
    );
  }

  function emit(name, payload) {
    try {
      if (typeof HD.events.emit === "function") {
        HD.events.emit(name, payload);

      if (

        window.HalDoOS.kernel &&

      ) {
        window.HalDoOS.kernel.emit(name, payload);
      }
    } catch (error) {
      console.warn(
        "[HalDo AI OS] App Registry Event Fehler:",
        name,
        error
      );
    }
  }

  /* ============================================================
     2. APP REGISTRY
     ============================================================ */

  const appRegistry = new Map();

  function sanitizeApp(app) {
    if (!app) {
      return null;
    }

    return {
      id: app.id,
      name: app.name,
      title: app.title,
      description: app.description,
      version: app.version,
      category: app.category,
      icon: app.icon,
      aliases: Array.isArray(app.aliases)

        : [],
      keywords: Array.isArray(app.keywords)
        ? app.keywords.slice()
        : [],

        ? app.capabilities.slice()
        : [],
      commands: Array.isArray(app.commands)
        ? app.commands.slice()
        : [],
      actions: Array.isArray(app.actions)
        ? app.actions.slice()
        : [],
      permissions: Array.isArray(app.permissions)
        ? app.permissions.slice()
        : [],
      enabled: app.enabled !== false,
      installed: app.installed !== false,
      ready: app.ready === true,
      metadata: app.metadata || {},

      updatedAt: app.updatedAt

  function normalizeAppManifest(manifest) {
    if (!manifest) {
      return null;
    }

    if (typeof manifest === "string") {

    }

    const id = normalizeKey(

      manifest.package ||

        normalize(

        ),

      version:
        normalize(
          manifest.version ||

        normalize(
          manifest.category ||
          manifest.type ||

      icon:
        manifest.icon ||
        manifest.iconUrl ||

      aliases:
        Array.isArray(manifest.aliases)

          : [],

      permissions:
        Array.isArray(
          manifest.permissions

          ? manifest.permissions
              .map(normalize)
              .filter(Boolean)
          : [],

      enabled:
        manifest.enabled !== false,

      installed:
        manifest.installed !== false,

      ready:
        manifest.ready === true,

      metadata:
        manifest.metadata &&
        typeof manifest.metadata === "object"
          ? manifest.metadata
          : {},

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()
    };

    return app;
  }

  /* ============================================================
     3. APP REGISTRIEREN
     ============================================================ */

  function registerApp(manifest, options) {
    const app =
      normalizeAppManifest(
        manifest
      );

    if (!app) {
      throw new Error(
        "Ungültiges HalDo-App-Manifest."
      );

    const existing =
      appRegistry.get(app.id);

    if (existing) {
      app.createdAt =
        existing.createdAt;

      app.updatedAt =
        Date.now();

      app.metadata = {
        ...(existing.metadata || {}),
        ...(app.metadata || {})
      };
    }

    const entry = {
      ...(existing || {}),
      ...app
    };

    if (
      options &&
      typeof options === "object"
    ) {
      if (
        options.ready !== undefined
      ) {
        entry.ready =
          options.ready === true;
      }

      if (
        options.enabled !== undefined
      ) {
        entry.enabled =
          options.enabled !== false;
      }
    }

    appRegistry.set(
      entry.id,
      entry
    );

    registerAppCapabilities(
      entry
    );

    registerAppCommands(
      entry
    );

    registerAppActions(
      entry
    );

    emit(
      "ai:app-registered",
      {
        app:
          sanitizeApp(entry),
        timestamp:
          Date.now()
      }
    );

    return entry;
  }

  function unregisterApp(appId) {
    const id =
      normalizeKey(appId);

    if (!appRegistry.has(id)) {
      return false;
    }

    const app =
      appRegistry.get(id);

    appRegistry.delete(id);

    emit(
      "ai:app-unregistered",
      {
        app:
          sanitizeApp(app),
        timestamp:
          Date.now()
      }
    );

    return true;
  }

  function getApp(appId) {
    const id =
      normalizeKey(appId);

    return (
      appRegistry.get(id) ||
      null
    );
  }

  function listApps(options) {
    const opts =
      options || {};

    return Array.from(
      appRegistry.values()
    )
      .filter(
        function (app) {
          if (
            opts.enabled === true &&
            !app.enabled
          ) {
            return false;

          if (
            opts.installed === true &&
            !app.installed

          if (
            opts.category &&

  function scoreApp(app, query) {
    const q =
      normalizeKey(query);

    if (!q) {
      return 0;
    }

    let score = 0;

    const id =
      normalizeKey(app.id);

    const name =
      normalizeKey(app.name);

    const title =
      normalizeKey(app.title);

    const description =
      normalizeKey(
        app.description
      );

    if (id === q) {
      score += 100;
    }

    if (name === q) {
      score += 95;
    } else if (
      name.includes(q)
    ) {
      score += 70;
    }

    if (title === q) {
      score += 90;
    } else if (
      title.includes(q)
    ) {
      score += 60;
    }

    if (
      description.includes(q)
    ) {
      score += 20;
    }

    app.aliases.forEach(
      function (alias) {
        const value =
          normalizeKey(alias);

        if (value === q) {
          score += 80;
        } else if (
          value.includes(q) ||
          q.includes(value)
        ) {
          score += 35;
        }
      }
    );

    app.keywords.forEach(
      function (keyword) {
        const value =
          normalizeKey(keyword);

        if (value === q) {
          score += 60;
        } else if (
          value.includes(q) ||
          q.includes(value)
        ) {
          score += 25;
        }
      }
    );

    return score;
  }

  function searchApps(
    query,
    options

    const opts =
      options || {};

    const results =
      Array.from(
        appRegistry.values()

        .filter(
          function (app) {
            if (
              opts.enabled === true &&
              !app.enabled

            }

            if (
              opts.installed === true &&
              !app.installed

            return true;

                sanitizeApp(app),

  async function executeAppCommand(

    const command =
      getCommand(name);

    if (!command) {

        error:

        command:

          ) {
            result =

        }

      return {

        command:

        app:
          command.app,
        result:

    } catch (error) {
      emit(
        "ai:app-command-error",
        {
          command:
            command.name,
          app:
            command.app,
          error:

          timestamp:

        }
