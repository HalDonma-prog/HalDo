    }

    /* ------------------------------------------------------------
       INTENT RESOLUTION
       ------------------------------------------------------------ */

    function classify(text, options) {
        try {
            if (
                AI.intent &&
                typeof AI.intent.classify ===
                    'function'
            ) {
                return AI.intent.classify(
                    text,
                    options || {}
                );
            }
        } catch (_) {}

        return {
            type: 'unknown',
            confidence: 0,
            text: str(text)
        };
    }

    /* ------------------------------------------------------------
       ENTITY EXTRACTION
       ------------------------------------------------------------ */

    function extractEntities(
        text,
        intent
    ) {
        const source = str(text);
        const normalized = norm(source);

        const entities = {
            app: null,
            query: null,
            command: null,
            action: null,
            target: null,
            value: null,
            language: null,
            numbers: [],
            quoted: []
        };

        /* Quoted values */
        const quotePatterns = [
            /"([^"]+)"/g,
            /„([^“]+)“/g,
            /«([^»]+)»/g,
            /'([^']+)'/g
        ];

        quotePatterns.forEach(
            pattern => {
                let match;

                while (
                    (match =
                        pattern.exec(
                            source
                        )) !== null
                ) {
                    if (
                        match[1]
                    ) {
                        entities.quoted.push(
                            match[1].trim()
                        );
                    }
                }
            }
        );

        entities.quoted =
            unique(
                entities.quoted
            );

        /* Numbers */
        const numbers =
            source.match(
                /\b\d+(?:[.,]\d+)?\b/g
            );

        if (numbers) {
            entities.numbers =
                numbers.map(
                    value =>
                        Number(
                            value.replace(
                                ',',
                                '.'
                            )
                        )
                );
        }

        /* Search query */
        const searchPatterns = [
            /(?:suche|such|suchen)\s+(?:nach\s+)?(.+)$/i,
            /(?:search)\s+(?:for\s+)?(.+)$/i,
            /(?:google)\s+(.+)$/i
        ];

        for (
            const pattern of searchPatterns
        ) {
            const match =
                source.match(
                    pattern
                );

            if (
                match &&
                match[1]
            ) {
                entities.query =
                    match[1]
                        .replace(
                            /[?.!]+$/,
                            ''
                        )
                        .trim();

                break;
            }
        }

        /* App */
        const appPatterns = [
            /(?:öffne|öffnen|starte|starten|open|launch)\s+(.+)$/i,
            /(?:mit|in)\s+der\s+app\s+(.+)$/i,
            /(?:app)\s+(.+)$/i
        ];

        for (
            const pattern of appPatterns
        ) {
            const match =
                source.match(
                    pattern
                );

            if (
                match &&
                match[1]
            ) {
                entities.app =
                    match[1]
                        .replace(
                            /[?.!]+$/,
                            ''
                        )
                        .trim();

                break;
            }
        }

        /* Command */
        if (
            intent &&
            intent.type === 'command'
        ) {
            entities.command =
                source;
        }

        /* Action */
        if (
            intent &&
            intent.type === 'action'
        ) {
            entities.action =
                source;
        }

        /* Window target */
        const windowPatterns = [
            /(?:fenster|window)\s+(.+)$/i,
            /(?:schließe|schliesse|close)\s+(.+)$/i,
            /(?:fokussiere|focus)\s+(.+)$/i
        ];

        for (
            const pattern of windowPatterns
        ) {
            const match =
                source.match(
                    pattern
                );

            if (
                match &&
                match[1]
            ) {
                entities.target =
                    match[1]
                        .replace(
                            /[?.!]+$/,
                            ''
                        )
                        .trim();

                break;
            }
        }

        /* Language */
        const languagePatterns = [
            /(?:auf|in)\s+(deutsch|englisch|english|kurdî|kurdisch|ezidisch|êzîdî)$/i,
            /(?:sprache|language)\s+([a-zäöüîêî]+)$/i
        ];

        for (
            const pattern of languagePatterns
        ) {
            const match =
                source.match(
                    pattern
                );

            if (
                match &&
                match[1]
            ) {
                entities.language =
                    match[1];

                break;
            }
        }

        return entities;
    }

    /* ------------------------------------------------------------
       APP SEARCH
       ------------------------------------------------------------ */

    function getAppRegistry() {
        return (
            AI.appRegistry ||
            AI.apps ||
            null
        );
    }

    function searchApps(query) {
        const registry =
            getAppRegistry();

        if (!registry) {
            return [];
        }

        try {
            if (
                typeof registry.searchApps ===
                    'function'
            ) {
                const result =
                    registry.searchApps(
                        query
                    );

                return Array.isArray(
                    result
                )
                    ? result
                    : [];
            }
        } catch (_) {}

        try {
            if (
                typeof registry.listApps ===
                    'function'
            ) {
                const apps =
                    registry.listApps();

                const needle =
                    norm(query);

                return apps
                    .filter(
                        app => {
                            const haystack =
                                norm(
                                    [
                                        app.id,
                                        app.name,
                                        app.title,
                                        app.description,
                                        ...(Array.isArray(
                                            app.aliases
                                        )
                                            ? app.aliases
                                            : []),
                                        ...(Array.isArray(
                                            app.keywords
                                        )
                                            ? app.keywords
                                            : [])
                                    ].join(
                                        ' '
                                    )
                                );

                            return haystack.includes(
                                needle
                            );
                        }
                    );
            }
        } catch (_) {}

        return [];
    }

    /* ------------------------------------------------------------
       CAPABILITY SEARCH
       ------------------------------------------------------------ */

    function searchCapabilities(
        query
    ) {
        try {
            if (
                typeof AI.searchCapabilities ===
                    'function'
            ) {
                const result =
                    AI.searchCapabilities(
                        query
                    );

                return Array.isArray(
                    result
                )
                    ? result
                    : [];
            }
        } catch (_) {}

        try {
            if (
                AI.capabilities &&
                typeof AI.capabilities.search ===
                    'function'
            ) {
                const result =
                    AI.capabilities.search(
                        query
                    );

                return Array.isArray(
                    result
                )
                    ? result
                    : [];
            }
        } catch (_) {}

        return [];
    }

    /* ------------------------------------------------------------
       APP PRIORITY SCORING
       ------------------------------------------------------------ */

    function scoreApp(
        app,
        query,
        context
    ) {
        if (!app) {
            return 0;
        }

        const needle =
            norm(query);

        let score = 0;

        const id =
            norm(app.id);

        const name =
            norm(app.name);

        const title =
            norm(app.title);

        const description =
            norm(app.description);

        if (
            id === needle
        ) {
            score += 100;
        }

        if (
            name === needle
        ) {
            score += 95;
        }

        if (
            title === needle
        ) {
            score += 90;
        }

        if (
            id.includes(
                needle
            )
        ) {
            score += 50;
        }

        if (
            name.includes(
                needle
            )
        ) {
            score += 45;
        }

        if (
            title.includes(
                needle
            )
        ) {
            score += 40;
        }

        if (
            description.includes(
                needle
            )
        ) {
            score += 20;
        }

        const aliases =
            Array.isArray(
                app.aliases
            )
                ? app.aliases
                : [];

        aliases.forEach(
            alias => {
                const value =
                    norm(alias);

                if (
                    value === needle
                ) {
                    score += 80;
                } else if (
                    value.includes(
                        needle
                    )
                ) {
                    score += 30;
                }
            }
        );

        const keywords =
            Array.isArray(
                app.keywords
            )
                ? app.keywords
                : [];

        keywords.forEach(
            keyword => {
                const value =
                    norm(keyword);

                if (
                    value === needle
                ) {
                    score += 50;
                } else if (
                    value.includes(
                        needle
                    )
                ) {
                    score += 20;
                }
            }
        );

        if (
            app.enabled !== false
        ) {
            score += 5;
        }

        if (
            app.installed !== false
        ) {
            score += 5;
        }

        if (
            app.ready === true
        ) {
            score += 5;
        }

        /* Context topic bonus */
        if (
            context &&
            context.topic
        ) {
            const topic =
                norm(
                    context.topic
                );

            if (
                topic &&
                (
                    name.includes(
                        topic
                    ) ||
                    title.includes(
                        topic
                    ) ||
                    keywords.some(
                        keyword =>
                            norm(
                                keyword
                            ).includes(
                                topic
                            )
                    )
                )
            ) {
                score += 15;
            }
        }

        return score;
    }

    function rankApps(
        apps,
        query,
        context
    ) {
        return apps
            .map(
                app => ({
                    app,
                    score:
                        scoreApp(
                            app,
                            query,
                            context
                        )
                })
            )
            .sort(
                (a, b) =>
                    b.score -
                    a.score
            );
    }

    /* ------------------------------------------------------------
       CAPABILITY PRIORITY
       ------------------------------------------------------------ */

    function scoreCapability(
        capability,
        query
    ) {
        if (!capability) {
            return 0;
        }

        const needle =
            norm(query);

        const values = [
            capability.id,
            capability.name,
            capability.title,
            capability.description,
            ...(Array.isArray(
                capability.aliases
            )
                ? capability.aliases
                : []),
            ...(Array.isArray(
                capability.keywords
            )
                ? capability.keywords
                : [])
        ];

        let score = 0;

        values.forEach(
            value => {
                const item =
                    norm(value);

                if (
                    item === needle
                ) {
                    score += 100;
                } else if (
                    item.includes(
                        needle
                    )
                ) {
                    score += 30;
                }
            }
        );

        return score;
    }

    function rankCapabilities(
        capabilities,
        query
    ) {
        return capabilities
            .map(
                capability => ({
                    capability,
                    score:
                        scoreCapability(
                            capability,
                            query
                        )
                })
            )
            .sort(
                (a, b) =>
                    b.score -
                    a.score
            );
    }

    /* ------------------------------------------------------------
       ACTION INTELLIGENCE
       ------------------------------------------------------------ */

    function inferAction(
        text,
        intent,
        entities
    ) {
        const normalized =
            norm(text);

        if (
            /(?:öffne|starte|open|launch)/i
                .test(
                    normalized
                )
        ) {
            return 'open';
        }

        if (
            /(?:schließe|schliesse|close|beende)/i
                .test(
                    normalized
                )
        ) {
            return 'close';
        }

        if (
            /(?:suche|such|search|google)/i
                .test(
                    normalized
                )
        ) {
            return 'search';
        }

        if (
            /(?:zeige|anzeigen|show|view)/i
                .test(
                    normalized
                )
        ) {
            return 'show';
        }

        if (
            /(?:speichere|speichern|save)/i
                .test(
                    normalized
                )
        ) {
            return 'save';
        }

        if (
            /(?:lösche|loesche|delete)/i
                .test(
                    normalized
                )
        ) {
            return 'delete';
        }

        if (
            /(?:sprich|sage|sag|speak)/i
                .test(
                    normalized
                )
        ) {
            return 'speak';
        }

        if (
            intent &&
            intent.type === 'search'
        ) {
            return 'search';
        }

        if (
            intent &&
            intent.type === 'app'
        ) {
            return 'open';
        }

        return 'none';
    }

    /* ------------------------------------------------------------
       PLAN CREATION
       ------------------------------------------------------------ */

    function createPlan(
        text,
        options
    ) {
        options = options || {};

        const source =
            str(text);

        const context =
            getContext();

        const session =
            getSession();

        const intent =
            classify(
                source,
                options
            );

        const entities =
            extractEntities(
                source,
                intent
            );

        const action =
            inferAction(
                source,
                intent,
                entities
            );

        let query =
            entities.app ||
            entities.query ||
            entities.target ||
            source;

        let appResults = [];

        if (
            entities.app
        ) {
            appResults =
                rankApps(
                    searchApps(
                        entities.app
                    ),
                    entities.app,
                    context
                );
        }

        let capabilityResults =
            rankCapabilities(
                searchCapabilities(
                    query
                ),
                query
            );

        const bestApp =
            appResults.length
                ? appResults[0]
                : null;

        const bestCapability =
            capabilityResults.length
                ? capabilityResults[0]
                : null;

        let route = {
            kind: 'none',
            target: null,
            confidence: 0,
            source: null
        };

        /*
         * App has priority when the language
         * clearly asks to open/start an app.
         */
        if (
            action === 'open' &&
            bestApp &&
            bestApp.score >= 30
        ) {
            route = {
                kind: 'app',
                target:
                    bestApp.app.id,
                confidence:
                    Math.min(
                        1,
                        bestApp.score /
                            100
                    ),
                source:
                    'app-registry',
                app:
                    clone(
                        bestApp.app
                    )
            };
        }

        /*
         * Search route.
         */
        else if (
            action === 'search' &&
            entities.query
        ) {
            route = {
                kind: 'capability',
                target:
                    'search.query',
                confidence: 0.95,
                source:
                    'built-in-search'
            };
        }

        /*
         * Speech route.
         */
        else if (
            action === 'speak' &&
            entities.quoted.length
        ) {
            route = {
                kind: 'capability',
                target:
                    'voice.speak',
                confidence: 0.95,
                source:
                    'built-in-voice'
            };
        }

        /*
         * Best capability.
         */
        else if (
            bestCapability &&
            bestCapability.score >= 25
        ) {
            route = {
                kind: 'capability',
                target:
                    bestCapability
                        .capability
                        .id ||
                    bestCapability
                        .capability
                        .name,
                confidence:
                    Math.min(
                        1,
                        bestCapability.score /
                            100
                    ),
                source:
                    'capability-registry',
                capability:
                    clone(
                        bestCapability
                            .capability
                    )
            };
        }

        /*
         * Generic app intent fallback.
         */
        else if (
            intent &&
            intent.type === 'app' &&
            bestApp
        ) {
            route = {
                kind: 'app',
                target:
                    bestApp.app.id,
                confidence:
                    Math.min(
                        1,
                        bestApp.score /
                            100
                    ),
                source:
                    'app-registry-fallback',
                app:
                    clone(
                        bestApp.app
                    )
            };
        }

        const plan = {
            id:
                makeId(
                    'hd-context-plan'
                ),

            createdAt:
                new Date().toISOString(),

            text:
                source,

            intent:
                clone(intent),

            action,

            entities:
                clone(entities),

            context:
                clone(context),

            session:
                clone(session),

            route,

            candidates: {
                apps:
                    appResults
                        .slice(0, 10)
                        .map(
                            item => ({
                                id:
                                    item.app &&
                                    item.app.id,
                                name:
                                    item.app &&
                                    (
                                        item.app.name ||
                                        item.app.title
                                    ),
                                score:
                                    item.score
                            })
                        ),

                capabilities:
                    capabilityResults
                        .slice(0, 10)
                        .map(
                            item => ({
                                id:
                                    item.capability &&
                                    (
                                        item.capability.id ||
                                        item.capability.name
                                    ),
                                score:
                                    item.score
                            })
                        )
            },

            parameters: {
                query:
                    entities.query,
                app:
                    entities.app,
                target:
                    entities.target,
                value:
                    entities.value,
                quoted:
                    entities.quoted,
                numbers:
                    entities.numbers
            },

            metadata: {
                source:
                    options.source ||
                    'haldo-context-planner',

                contextAware:
                    true,

                sessionAware:
                    !!session,

                createdBy:
                    'HalDo AI OS'
            }
        };

        state.lastPlan =
            plan;

        state.plans.push(
            clone(plan)
        );

        if (
            state.plans.length >
            state.maxPlans
        ) {
            state.plans.shift();
        }

        emit(
            'ai:context-plan-created',
            {
                plan:
                    clone(plan)
            }
        );

        return plan;
    }

    /* ------------------------------------------------------------
       PLAN RESOLUTION
       ------------------------------------------------------------ */

    function resolvePlan(
        plan,
        options
    ) {
        options = options || {};

        if (!plan) {
            return {
                resolved: false,
                reason:
                    'missing-plan'
            };
        }

        const route =
            plan.route || {};

        const result = {
            resolved:
                route.kind !== 'none' &&
                !!route.target,

            kind:
                route.kind,

            target:
                route.target,

            confidence:
                Number(
                    route.confidence
                ) || 0,

            source:
                route.source || null,

            app:
                route.app
                    ? clone(
                        route.app
                    )
                    : null,

            capability:
                route.capability
                    ? clone(
                        route.capability
                    )
                    : null,

            alternatives: {
                apps:
                    plan.candidates &&
                    plan.candidates.apps
                        ? clone(
                            plan.candidates
                                .apps
                        )
                        : [],

                capabilities:
                    plan.candidates &&
                    plan.candidates
                        .capabilities
                        ? clone(
                            plan.candidates
                                .capabilities
                        )
                        : []
            },

            requiresSelection:
                (
                    route.kind === 'none'
                ) ||
                (
                    Number(
                        route.confidence
                    ) < 0.35
                )
        };

        state.lastResolution =
            result;

        emit(
            'ai:context-plan-resolved',
            {
                resolution:
                    clone(result),
                plan:
                    clone(plan)
            }
        );

        return result;
    }

    /* ------------------------------------------------------------
       EXECUTE THROUGH EXISTING ROUTER
       ------------------------------------------------------------ */

    async function execute(
        plan,
        options
    ) {
        options = options || {};

        const resolved =
            resolvePlan(
                plan,
                options
            );

        if (
            !resolved.resolved
        ) {
            return {
                success: false,
                resolved: false,
                plan:
                    clone(plan),
                resolution:
                    clone(resolved)
            };
        }

        if (
            AI.router &&
            typeof AI.router.executePlan ===
                'function'
        ) {
            /*
             * Convert our context-aware plan
             * into the execution structure
             * expected by Teil 11.
             */
            const executionPlan = {
                ...clone(plan),

                route: {
                    ...clone(
                        plan.route
                    ),

                    kind:
                        resolved.kind,

                    target:
                        resolved.target
                }
            };

            return await AI.router.executePlan(
                executionPlan,
                {
                    ...options,
                    source:
                        options.source ||
                        'haldo-context-planner'
                }
            );
        }

        if (
            AI.router &&
            typeof AI.router.route ===
                'function'
        ) {
            return await AI.router.route(
                plan.text,
                {
                    ...options,
                    source:
                        options.source ||
                        'haldo-context-planner'
                }
            );
        }

        return {
            success: false,
            error:
                'AI Router ist nicht verfügbar.',
            plan:
                clone(plan)
        };
    }

    /* ------------------------------------------------------------
       ONE-CALL HIGH LEVEL API
       ------------------------------------------------------------ */

    planner.plan =
        createPlan;

    planner.createPlan =
        createPlan;

    planner.resolve =
        resolvePlan;

    planner.execute =
        execute;

    planner.run =
        async function (
            text,
            options
        ) {
            const plan =
                createPlan(
                    text,
                    options
                );

            return await execute(
                plan,
                options
            );
        };

    planner.extractEntities =
        extractEntities;

    planner.searchApps =
        searchApps;

    planner.searchCapabilities =
        searchCapabilities;

    planner.rankApps =
        rankApps;

    planner.rankCapabilities =
        rankCapabilities;

    planner.getContext =
        getContext;

    planner.getSession =
        getSession;

    planner.getState =
        function () {
            return {
                ready:
                    state.ready,

                planCount:
                    state.plans.length,

                lastPlan:
                    clone(
                        state.lastPlan
                    ),

                lastResolution:
                    clone(
                        state.lastResolution
                    )
            };
        };

    planner.getHistory =
        function () {
            return clone(
                state.plans
            );
        };

    planner.clearHistory =
        function () {
            state.plans = [];

            emit(
                'ai:context-plan-history-cleared'
            );

            return true;
        };

    planner.diagnostics =
        function () {
            return {
                ready:
                    state.ready,

                planCount:
                    state.plans.length,

                hasContext:
                    !!getContext(),

                hasSession:
                    !!getSession(),

                hasIntentEngine:
                    !!(
                        AI.intent &&
                        typeof AI.intent
                            .classify ===
                            'function'
                    ),

                hasAppRegistry:
                    !!getAppRegistry(),

                hasRouter:
                    !!(
                        AI.router &&
                        typeof AI.router
                            .executePlan ===
                            'function'
                    ),

                lastPlan:
                    clone(
                        state.lastPlan
                    ),

                lastResolution:
                    clone(
                        state.lastResolution
                    )
            };
        };

    /* ------------------------------------------------------------
       PUBLIC AI CONNECTIONS
       ------------------------------------------------------------ */

    AI.planner =
        planner;

    AI.executionPlanner =
        planner;

    AI.contextPlanner =
        planner;

    root.aiPlanner =
        planner;

    OS.aiPlanner =
        planner;

    window.HalDoAIPlanner =
        planner;

    window.HalDoAIContextPlanner =
        planner;

    /* ------------------------------------------------------------
       OPTIONAL ORCHESTRATOR BRIDGE
       ------------------------------------------------------------ */

    if (
        AI.orchestrator &&
        typeof AI.orchestrator.processMessage ===
            'function' &&
        !AI.orchestrator
            .__haldoContextPlannerBridge
    ) {
        const originalProcess =
            AI.orchestrator.processMessage;

        AI.orchestrator.processMessage =
            async function (
                text,
                options
            ) {
                options =
                    options || {};

                if (
                    options.skipPlanner ===
                    true
                ) {
                    return originalProcess.call(
                        this,
                        text,
                        options
                    );
                }

                const plan =
                    createPlan(
                        text,
                        options
                    );

                /*
                 * Only directly execute when
                 * a sufficiently confident
                 * executable route exists.
                 *
                 * Otherwise the existing
                 * orchestrator continues with
                 * normal conversational AI.
                 */
                if (
                    plan.route &&
                    plan.route.kind !==
                        'none' &&
                    Number(
                        plan.route.confidence
                    ) >= 0.35
                ) {
                    const result =
                        await execute(
                            plan,
                            {
                                ...options,
                                skipPlanner:
                                    true
                            }
                        );

                    if (
                        result &&
                        (
                            result.success ||
                            result.confirmationRequired ||
                            result.blocked
                        )
                    ) {
                        return {
                            handledBy:
                                'ai-context-planner',
                            plan:
                                clone(plan),
                            result
                        };
                    }
                }

                return originalProcess.call(
                    this,
                    text,
                    {
                        ...options,
                        skipPlanner:
                            true
                    }
                );
            };

        AI.orchestrator
            .processMessage
            .__haldoContextPlannerBridge =
            true;
    }

    /* ------------------------------------------------------------
       EVENTS FROM APP REGISTRY
       ------------------------------------------------------------ */

    try {
        if (
            window.HalDoKernel &&
            typeof window.HalDoKernel.on ===
                'function'
        ) {
            window.HalDoKernel.on(
                'app:registered',
                function (
                    payload
                ) {
                    emit(
                        'ai:planner-app-updated',
                        payload
                    );
                }
            );

            window.HalDoKernel.on(
                'app:ready',
                function (
                    payload
                ) {
                    emit(
                        'ai:planner-app-ready',
                        payload
                    );
                }
            );
        }
    } catch (_) {}

    /* ------------------------------------------------------------
       READY
       ------------------------------------------------------------ */

    state.ready = true;

    emit(
        'ai:context-planner-ready',
        {
            version:
                '13.0.0',

            features: [
                'context-aware-planning',
                'session-aware-planning',
                'intent-resolution',
                'entity-extraction',
                'app-ranking',
                'capability-ranking',
                'natural-language-actions',
                'execution-plan-generation',
                'route-resolution',
                'router-integration',
                'orchestrator-integration',
                'plan-history',
                'diagnostics'
            ]
        }
    );

    try {
        console.info(
            '[HalDo AI OS] Teil 13/16 — AI Context-Aware App & Capability Planner ready.'
        );
    } catch (_) {}

})();

<script>
(function () {
    'use strict';

    const root = window.HalDo || (window.HalDo = {});
    const OS = window.HalDoOS || (window.HalDoOS = {});
    const AI = root.ai || root.AI || (root.ai = {});
    const events = root.events || {};

    const storage =
        root.storage ||
        OS.storage ||
        AI.storage ||
        null;

    const existingLearning =
        AI.learning ||
        AI.adaptive ||
        {};

    const learning = existingLearning;

    const state = {
        ready: false,

        profile: {
            preferredApps: {},
            preferredCapabilities: {},
            commandPatterns: {},
            languagePatterns: {},
            topics: {},
            actions: {},
            successfulRoutes: {},
            failedRoutes: {}
        },

        interactions: [],

        feedback: [],

        maxInteractions: 300,
        maxFeedback: 200,

        lastInteraction: null,
        lastFeedback: null,

        autoLearn: true,

        storageKey:
            'haldo.ai.adaptive-learning.v1'
    };

    /* ------------------------------------------------------------
       HELPERS
       ------------------------------------------------------------ */

    function emit(name, detail) {
        try {
            if (
                events &&
                typeof events.emit === 'function'
            ) {
                events.emit(
                    name,
                    detail
                );
            }
        } catch (_) {}

        try {
            document.dispatchEvent(
                new CustomEvent(
                    'haldo:' + name,
                    {
                        detail:
                            detail || {}
                    }
                )
            );
        } catch (_) {}
    }

    function str(value, fallback) {
        if (
            value === undefined ||
            value === null
        ) {
            return fallback || '';
        }

        return String(value).trim();
    }

    function norm(value) {
        return str(value)
            .toLowerCase()
            .replace(/[„“”«»]/g, '"')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function clone(value) {
        try {
            return JSON.parse(
                JSON.stringify(value)
            );
        } catch (_) {
            return value;
        }
    }

    function makeId(prefix) {
        return (
            prefix +
            '-' +
            Date.now().toString(36) +
            '-' +
            Math.random()
                .toString(36)
                .slice(2, 8)
        );
    }

    function increment(
        object,
        key,
        amount
    ) {
        const normalized =
            str(key);

        if (!normalized) {
            return 0;
        }

        if (
            typeof object[
                normalized
            ] !== 'number'
        ) {
            object[
                normalized
            ] = 0;
        }

        object[
            normalized
        ] +=
            Number(amount) || 1;

        return object[
            normalized
        ];
    }

    /* ------------------------------------------------------------
       STORAGE BRIDGE
       ------------------------------------------------------------ */

    async function storageSet(
        key,
        value
    ) {
        try {
            if (
                storage &&
                typeof storage.set ===
                    'function'
            ) {
                return await storage.set(
                    key,
                    value
                );
            }
        } catch (_) {}

        try {
            if (
                window.localStorage
            ) {
                localStorage.setItem(
                    key,
                    JSON.stringify(
                        value
                    )
                );

                return true;
            }
        } catch (_) {}

        return false;
    }

    async function storageGet(
        key
    ) {
        try {
            if (
                storage &&
                typeof storage.get ===
                    'function'
            ) {
                return await storage.get(
                    key
                );
            }
        } catch (_) {}

        try {
            if (
                window.localStorage
            ) {
                const raw =
                    localStorage.getItem(
                        key
                    );

                if (!raw) {
                    return null;
                }

                return JSON.parse(
                    raw
                );
            }
        } catch (_) {}

        return null;
    }

    async function persist() {
        const data = {
            version: 1,
            savedAt:
                new Date().toISOString(),

            profile:
                clone(
                    state.profile
                ),

            interactions:
                clone(
                    state.interactions
                ),

            feedback:
                clone(
                    state.feedback
                ),

            autoLearn:
                state.autoLearn
        };

        const result =
            await storageSet(
                state.storageKey,
                data
            );

        emit(
            'ai:learning-persisted',
            {
                success:
                    !!result
            }
        );

        return result;
    }

    async function restore() {
        const data =
            await storageGet(
                state.storageKey
            );

        if (
            !data ||
            typeof data !==
                'object'
        ) {
            return false;
        }

        if (
            data.profile &&
            typeof data.profile ===
                'object'
        ) {
            state.profile = {
                ...state.profile,
                ...clone(
                    data.profile
                )
            };
        }

        if (
            Array.isArray(
                data.interactions
            )
        ) {
            state.interactions =
                data.interactions.slice(
                    -state.maxInteractions
                );
        }

        if (
            Array.isArray(
                data.feedback
            )
        ) {
            state.feedback =
                data.feedback.slice(
                    -state.maxFeedback
                );
        }

        if (
            typeof data.autoLearn ===
                'boolean'
        ) {
            state.autoLearn =
                data.autoLearn;
        }

        emit(
            'ai:learning-restored',
            {
                success: true
            }
        );

        return true;
    }

    /* ------------------------------------------------------------
       ROUTE LEARNING
       ------------------------------------------------------------ */

    function routeKey(
        route
    ) {
        if (!route) {
            return '';
        }

        return [
            route.kind,
            route.target
        ]
            .map(
                value =>
                    norm(value)
            )
            .filter(Boolean)
            .join(':');
    }

    function learnRoute(
        plan,
        success
    ) {
        if (!plan) {
            return;
        }

        const route =
            plan.route || {};

        const key =
            routeKey(route);

        if (!key) {
            return;
        }

        const targetMap =
            success
                ? state.profile
                    .successfulRoutes
                : state.profile
                    .failedRoutes;

        increment(
            targetMap,
            key,
            1
        );

        if (
            route.kind === 'app' &&
            route.target
        ) {
            increment(
                state.profile
                    .preferredApps,
                route.target,
                success ? 2 : 1
            );
        }

        if (
            route.kind ===
                'capability' &&
            route.target
        ) {
            increment(
                state.profile
                    .preferredCapabilities,
                route.target,
                success ? 2 : 1
            );
        }
    }

    /* ------------------------------------------------------------
       LANGUAGE / COMMAND PATTERN LEARNING
       ------------------------------------------------------------ */

    function learnTextPattern(
        text,
        plan
    ) {
        const source =
            norm(text);

        if (!source) {
            return;
        }

        const tokens =
            source
                .split(/\s+/)
                .filter(
                    token =>
                        token.length >= 3
                )
                .slice(0, 12);

        tokens.forEach(
            token => {
                increment(
                    state.profile
                        .commandPatterns,
                    token,
                    1
                );
            }
        );

        if (
            plan &&
            plan.intent &&
            plan.intent.type
        ) {
            increment(
                state.profile
                    .actions,
                plan.intent.type,
                1
            );
        }

        if (
            plan &&
            plan.action
        ) {
            increment(
                state.profile
                    .actions,
                plan.action,
                1
            );
        }
    }

    /* ------------------------------------------------------------
       TOPIC LEARNING
       ------------------------------------------------------------ */

    function learnTopic(
        plan
    ) {
        if (!plan) {
            return;
        }

        const context =
            plan.context || {};

        const topic =
            str(
                context.topic
            );

        if (topic) {
            increment(
                state.profile.topics,
                topic,
                1
            );
        }

        const query =
            plan.entities &&
            plan.entities.query
                ? plan.entities.query
                : '';

        if (query) {
            const words =
                norm(query)
                    .split(/\s+/)
                    .filter(
                        word =>
                            word.length >= 4
                    )
                    .slice(0, 8);

            words.forEach(
                word => {
                    increment(
                        state.profile.topics,
                        word,
                        1
                    );
                }
            );
        }
    }

    /* ------------------------------------------------------------
       INTERACTION RECORDING
       ------------------------------------------------------------ */

    async function recordInteraction(
        data
    ) {
        const entry = {
            id:
                makeId(
                    'interaction'
                ),

            timestamp:
                new Date().toISOString(),

            text:
                str(
                    data &&
                    data.text
                ),

            intent:
                clone(
                    data &&
                    data.intent
                ),

            action:
                str(
                    data &&
                    data.action
                ),

            route:
                clone(
                    data &&
                    data.route
                ),

            success:
                data &&
                data.success === true,

            result:
                clone(
                    data &&
                    data.result
                ),

            source:
                str(
                    data &&
                    data.source
                ) ||
                'unknown'
        };

        state.interactions.push(
            entry
        );

        if (
            state.interactions.length >
            state.maxInteractions
        ) {
            state.interactions.shift();
        }

        state.lastInteraction =
            entry;

        if (
            state.autoLearn
        ) {
            learnRoute(
                data &&
                data.plan,
                entry.success
            );

            learnTextPattern(
                entry.text,
                data &&
                data.plan
            );

            learnTopic(
                data &&
                data.plan
            );
        }

        emit(
            'ai:learning-interaction',
            {
                interaction:
                    clone(entry)
            }
        );

        await persist();

        return clone(entry);
    }

    /* ------------------------------------------------------------
       FEEDBACK
       ------------------------------------------------------------ */

    async function addFeedback(
        feedback
    ) {
        feedback =
            feedback || {};

        const entry = {
            id:
                makeId(
                    'feedback'
                ),

            timestamp:
                new Date().toISOString(),

            type:
                str(
                    feedback.type
                ) ||
                'general',

            rating:
                typeof feedback.rating ===
                    'number'
                    ? Math.max(
                        -1,
                        Math.min(
                            1,
                            feedback.rating
                        )
                    )
                    : null,

            positive:
                feedback.positive ===
                true,

            negative:
                feedback.negative ===
                true,

            text:
                str(
                    feedback.text
                ),

            request:
                str(
                    feedback.request
                ),

            planId:
                str(
                    feedback.planId
                ),

            route:
                clone(
                    feedback.route
                ),

            metadata:
                clone(
                    feedback.metadata
                )
        };

        state.feedback.push(
            entry
        );

        if (
            state.feedback.length >
            state.maxFeedback
        ) {
            state.feedback.shift();
        }

        state.lastFeedback =
            entry;

        /*
         * Positive feedback strengthens
         * the selected route.
         */
        if (
            entry.positive ||
            entry.rating > 0
        ) {
            if (
                entry.route
            ) {
                learnRoute(
                    {
                        route:
                            entry.route
                    },
                    true
                );
            }
        }

        /*
         * Negative feedback weakens
         * the selected route.
         */
        if (
            entry.negative ||
            entry.rating < 0
        ) {
            if (
                entry.route
            ) {
                learnRoute(
                    {
                        route:
                            entry.route
                    },
                    false
                );
            }
        }

        emit(
            'ai:learning-feedback',
            {
                feedback:
                    clone(entry)
            }
        );

        await persist();

        return clone(entry);
    }

    /* ------------------------------------------------------------
       PREFERENCE CALCULATION
       ------------------------------------------------------------ */

    function getScore(
        map,
        key
    ) {
        if (
            !map ||
            !key
        ) {
            return 0;
        }

        return Number(
            map[
                key
            ]
        ) || 0;
    }

    function getPreference(
        category,
        key
    ) {
        const source =
            state.profile[
                category
            ];

        if (!source) {
            return 0;
        }

        return getScore(
            source,
            key
        );
    }

    function rankPreferences(
        category,
        limit
    ) {
        const source =
            state.profile[
                category
            ] || {};

        const amount =
            Number(limit) > 0
                ? Number(limit)
                : 10;

        return Object.entries(
            source
        )
            .map(
                ([key, score]) => ({
                    key,
                    score:
                        Number(score) ||
                        0
                })
            )
            .sort(
                (a, b) =>
                    b.score -
                    a.score
            )
            .slice(
                0,
                amount
            );
    }

    /* ------------------------------------------------------------
       ADAPTIVE ROUTE BOOSTING
       ------------------------------------------------------------ */

    function getRouteBoost(
        route
    ) {
        const key =
            routeKey(route);

        if (!key) {
            return 0;
        }

        const success =
            getScore(
                state.profile
                    .successfulRoutes,
                key
            );

        const failed =
            getScore(
                state.profile
                    .failedRoutes,
                key
            );

        /*
         * Successful executions increase
         * the score; failures decrease it.
         */
        return (
            success * 5 -
            failed * 4
        );
    }

    function applyAdaptiveRanking(
        candidates,
        type
    ) {
        if (
            !Array.isArray(
                candidates
            )
        ) {
            return [];
        }

        return candidates
            .map(
                candidate => {
                    const route =
                        type === 'app'
                            ? {
                                kind: 'app',
                                target:
                                    candidate
                                        .app &&
                                    candidate
                                        .app
                                        .id
                            }
                            : {
                                kind:
                                    'capability',
                                target:
                                    candidate
                                        .capability &&
                                    (
                                        candidate
                                            .capability
                                            .id ||
                                        candidate
                                            .capability
                                            .name
                                    )
                            };

                    const boost =
                        getRouteBoost(
                            route
                        );

                    return {
                        ...candidate,
                        baseScore:
                            Number(
                                candidate.score
                            ) || 0,
                        adaptiveBoost:
                            boost,
                        score:
                            (
                                Number(
                                    candidate.score
                                ) || 0
                            ) + boost
                    };
                }
            )
            .sort(
                (a, b) =>
                    b.score -
                    a.score
            );
    }

    /* ------------------------------------------------------------
       LEARNING FROM PLANNER
       ------------------------------------------------------------ */

    function enhancePlan(
        plan
    ) {
        if (!plan) {
            return plan;
        }

        const enhanced =
            clone(plan);

        if (
            Array.isArray(
                enhanced.candidates &&
                enhanced.candidates.apps
            )
        ) {
            enhanced.candidates.apps =
                enhanced.candidates.apps
                    .map(
                        candidate => {
                            const route = {
                                kind: 'app',
                                target:
                                    candidate.id
                            };

                            return {
                                ...candidate,
                                adaptiveBoost:
                                    getRouteBoost(
                                        route
                                    ),
                                adaptiveScore:
                                    (
                                        Number(
                                            candidate
                                                .score
                                        ) || 0
                                    ) +
                                    getRouteBoost(
                                        route
                                    )
                            };
                        }
                    )
                    .sort(
                        (a, b) =>
                            b.adaptiveScore -
                            a.adaptiveScore
                    );
        }

        if (
            Array.isArray(
                enhanced.candidates &&
                enhanced.candidates
                    .capabilities
            )
        ) {
            enhanced.candidates
                .capabilities =
                enhanced.candidates
                    .capabilities
                    .map(
                        candidate => {
                            const route = {
                                kind:
                                    'capability',
                                target:
                                    candidate.id
                            };

                            return {
                                ...candidate,
                                adaptiveBoost:
                                    getRouteBoost(
                                        route
                                    ),
                                adaptiveScore:
                                    (
                                        Number(
                                            candidate
                                                .score
                                        ) || 0
                                    ) +
                                    getRouteBoost(
                                        route
                                    )
                            };
                        }
                    )
                    .sort(
                        (a, b) =>
                            b.adaptiveScore -
                            a.adaptiveScore
                    );
        }

        if (
            enhanced.route &&
            enhanced.route.target
        ) {
            enhanced.route.adaptiveBoost =
                getRouteBoost(
                    enhanced.route
                );
        }

        enhanced.learning = {
            enabled:
                state.autoLearn,

            preferredApps:
                rankPreferences(
                    'preferredApps',
                    5
                ),

            preferredCapabilities:
                rankPreferences(
                    'preferredCapabilities',
                    5
                ),

            preferredActions:
                rankPreferences(
                    'actions',
                    5
                )
        };

        emit(
            'ai:learning-plan-enhanced',
            {
                plan:
                    clone(enhanced)
            }
        );

        return enhanced;
    }

    /* ------------------------------------------------------------
       SUGGESTIONS
       ------------------------------------------------------------ */

    function suggest(
        options
    ) {
        options =
            options || {};

        const suggestions = [];

        const apps =
            rankPreferences(
                'preferredApps',
                options.appLimit ||
                    5
            );

        const capabilities =
            rankPreferences(
                'preferredCapabilities',
                options.capabilityLimit ||
                    5
            );

        const actions =
            rankPreferences(
                'actions',
                options.actionLimit ||
                    5
            );

        apps.forEach(
            item => {
                suggestions.push({
                    type: 'app',
                    target:
                        item.key,
                    score:
                        item.score
                });
            }
        );

        capabilities.forEach(
            item => {
                suggestions.push({
                    type:
                        'capability',
                    target:
                        item.key,
                    score:
                        item.score
                });
            }
        );

        actions.forEach(
            item => {
                suggestions.push({
                    type: 'action',
                    target:
                        item.key,
                    score:
                        item.score
                });
            }
        );

        suggestions.sort(
            (a, b) =>
                b.score -
                a.score
        );

        return suggestions.slice(
            0,
            options.limit || 10
        );
    }

    /* ------------------------------------------------------------
       SETTINGS
       ------------------------------------------------------------ */

    function setAutoLearn(
        enabled
    ) {
        state.autoLearn =
            enabled === true;

        persist();

        emit(
            'ai:learning-setting-changed',
            {
                autoLearn:
                    state.autoLearn
            }
        );

        return state.autoLearn;
    }

    function resetProfile() {
        state.profile = {
            preferredApps: {},
            preferredCapabilities: {},
            commandPatterns: {},
            languagePatterns: {},
            topics: {},
            actions: {},
            successfulRoutes: {},
            failedRoutes: {}
        };

        state.lastInteraction =
            null;

        state.lastFeedback =
            null;

        emit(
            'ai:learning-profile-reset'
        );

        persist();

        return true;
    }

    function clearAll() {
        resetProfile();

        state.interactions =
            [];

        state.feedback =
            [];

        persist();

        emit(
            'ai:learning-data-cleared'
        );

        return true;
    }

    /* ------------------------------------------------------------
       PUBLIC API
       ------------------------------------------------------------ */

    learning.state =
        state;

    learning.recordInteraction =
        recordInteraction;

    learning.addFeedback =
        addFeedback;

    learning.feedback =
        addFeedback;

    learning.learnRoute =
        learnRoute;

    learning.learnTextPattern =
        learnTextPattern;

    learning.learnTopic =
        learnTopic;

    learning.getPreference =
        getPreference;

    learning.rankPreferences =
        rankPreferences;

    learning.getRouteBoost =
        getRouteBoost;

    learning.applyAdaptiveRanking =
        applyAdaptiveRanking;

    learning.enhancePlan =
        enhancePlan;

    learning.suggest =
        suggest;

    learning.setAutoLearn =
        setAutoLearn;

    learning.isAutoLearnEnabled =
        function () {
            return (
                state.autoLearn ===
                true
            );
        };

    learning.persist =
        persist;

    learning.restore =
        restore;

    learning.resetProfile =
        resetProfile;

    learning.clearAll =
        clearAll;

    learning.getInteractions =
        function (limit) {
            const amount =
                Number(limit) > 0
                    ? Number(limit)
                    : state.interactions
                        .length;

            return clone(
                state.interactions.slice(
                    -amount
                )
            );
        };

    learning.getFeedback =
        function (limit) {
            const amount =
                Number(limit) > 0
                    ? Number(limit)
                    : state.feedback
                        .length;

            return clone(
                state.feedback.slice(
                    -amount
                )
            );
        };

    learning.getProfile =
        function () {
            return clone(
                state.profile
            );
        };

    learning.getState =
        function () {
            return {
                ready:
                    state.ready,

                autoLearn:
                    state.autoLearn,

                interactionCount:
                    state.interactions
                        .length,

                feedbackCount:
                    state.feedback
                        .length,

                lastInteraction:
                    clone(
                        state.lastInteraction
                    ),

                lastFeedback:
                    clone(
                        state.lastFeedback
                    )
            };
        };

    learning.diagnostics =
        function () {
            return {
                ready:
                    state.ready,

                autoLearn:
                    state.autoLearn,

                interactionCount:
                    state.interactions
                        .length,

                feedbackCount:
                    state.feedback
                        .length,

                preferredApps:
                    rankPreferences(
                        'preferredApps',
                        10
                    ),

                preferredCapabilities:
                    rankPreferences(
                        'preferredCapabilities',
                        10
                    ),

                preferredActions:
                    rankPreferences(
                        'actions',
                        10
                    ),

                topics:
                    rankPreferences(
                        'topics',
                        10
                    )
            };
        };

    AI.learning =
        learning;

    AI.adaptive =
        learning;

    AI.feedback =
        learning;

    root.aiLearning =
        learning;

    OS.aiLearning =
        learning;

    window.HalDoAILearning =
        learning;

    window.HalDoAIAdaptive =
        learning;

    /* ------------------------------------------------------------
       EVENT INTEGRATION
       ------------------------------------------------------------ */

    function handleExecutionComplete(
        payload
    ) {
        if (
            !payload
        ) {
            return;
        }

        const result =
            payload.result ||
            payload;

        const plan =
            result.plan ||
            payload.plan ||
            null;

        recordInteraction({
            text:
                plan &&
                plan.text,

            intent:
                plan &&
                plan.intent,

            action:
                plan &&
                plan.action,

            route:
                plan &&
                plan.route,

            plan,

            success:
                result.success ===
                true,

            result,

            source:
                'ai-execution'
        });
    }

    function handleExecutionError(
        payload
    ) {
        if (
            !payload
        ) {
            return;
        }

        const result =
            payload.result ||
            payload;

        const plan =
            result.plan ||
            payload.plan ||
            null;

        recordInteraction({
            text:
                plan &&
                plan.text,

            intent:
                plan &&
                plan.intent,

            action:
                plan &&
                plan.action,

            route:
                plan &&
                plan.route,

            plan,

            success:
                false,

            result,

            source:
                'ai-execution-error'
        });
    }

    try {
        document.addEventListener(
            'haldo:ai:execution-complete',
            event => {
                handleExecutionComplete(
                    event.detail
                );
            }
        );

        document.addEventListener(
            'haldo:ai:execution-error',
            event => {
                handleExecutionError(
                    event.detail
                );
            }
        );
    } catch (_) {}

    try {
        if (
            window.HalDoKernel &&
            typeof window.HalDoKernel.on ===
                'function'
        ) {
            window.HalDoKernel.on(
                'ai:execution-complete',
                handleExecutionComplete
            );

            window.HalDoKernel.on(
                'ai:execution-error',
                handleExecutionError
            );
        }
    } catch (_) {}

    /* ------------------------------------------------------------
       PLANNER BRIDGE
       ------------------------------------------------------------ */

    if (
        AI.planner &&
        typeof AI.planner.createPlan ===
            'function' &&
        !AI.planner
            .__haldoLearningBridge
    ) {
        const originalCreatePlan =
            AI.planner.createPlan;

        AI.planner.createPlan =
            function (
                text,
                options
            ) {
                const plan =
                    originalCreatePlan.call(
                        this,
                        text,
                        options
                    );

                return enhancePlan(
                    plan
                );
            };

        AI.planner
            .createPlan
            .__haldoLearningBridge =
            true;
    }

    /* ------------------------------------------------------------
       INITIAL RESTORE
       ------------------------------------------------------------ */

    restore()
        .catch(
            () => {}
        );

    /* ------------------------------------------------------------
       READY
       ------------------------------------------------------------ */

    state.ready = true;

    emit(
        'ai:adaptive-learning-ready',
        {
            version:
                '14.0.0',

            features: [
                'interaction-learning',
                'feedback-learning',
                'adaptive-routing',
                'route-preferences',
                'app-preferences',
                'capability-preferences',
                'command-pattern-learning',
                'topic-learning',
                'success-failure-scoring',
                'adaptive-plan-ranking',
                'persistent-learning',
                'learning-history',
                'learning-diagnostics',
                'auto-learning-control'
            ]
        }
    );

    try {
        console.info(
            '[HalDo AI OS] Teil 14/16 — AI Learning / Feedback / Adaptive Intelligence Layer ready.'
        );
    } catch (_) {}

})();
