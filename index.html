<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050914"
  >

  <meta
    name="application-name"
    content="HalDo AI OS"
  >

  <meta
    name="description"
    content="HalDo AI OS – Cosmic World, Living HalDo AI und professionelles AI-Betriebssystem."
  >

  <title>HalDo AI OS — Cosmic World</title>

  <link
    rel="icon"
    type="image/png"
    href="assets/logo/logo.png"
  >

  <style>
    /* ============================================================
       HALDO AI OS
       CENTRAL INDEX SHELL
       PART 1 / 10
       ============================================================ */

    :root {
      --hd-bg-0: #02040b;
      --hd-bg-1: #050914;
      --hd-bg-2: #091326;

      --hd-space-blue: #081a3d;
      --hd-space-cyan: #38d9ff;
      --hd-space-blue-light: #67aaff;

      --hd-sun-core: #fff8c7;
      --hd-sun-gold: #ffd84a;
      --hd-sun-orange: #ff9d24;
      --hd-sun-red: #ff5b24;

      --hd-purple: #a66cff;
      --hd-pink: #ff68c9;

      --hd-success: #53f6a1;
      --hd-warning: #ffd35c;
      --hd-danger: #ff647c;

      --hd-text: #f6fbff;
      --hd-text-soft: rgba(246, 251, 255, 0.72);
      --hd-text-muted: rgba(246, 251, 255, 0.48);

      --hd-panel: rgba(4, 11, 28, 0.76);
      --hd-panel-strong: rgba(3, 8, 21, 0.92);

      --hd-border: rgba(92, 214, 255, 0.32);
      --hd-border-strong: rgba(92, 214, 255, 0.72);

      --hd-shadow:
        0 20px 80px rgba(0, 0, 0, 0.55);

      --hd-glow-blue:
        0 0 18px rgba(56, 217, 255, 0.45),
        0 0 55px rgba(56, 217, 255, 0.18);

      --hd-glow-sun:
        0 0 20px rgba(255, 216, 74, 0.8),
        0 0 70px rgba(255, 160, 30, 0.52),
        0 0 150px rgba(255, 102, 24, 0.28);

      --hd-radius-sm: 10px;
      --hd-radius-md: 16px;
      --hd-radius-lg: 24px;
      --hd-radius-xl: 32px;

      --hd-topbar-height: 66px;
      --hd-dock-height: 82px;

      --hd-transition:
        180ms cubic-bezier(.2,.8,.2,1);

      --hd-fast:
        90ms cubic-bezier(.2,.8,.2,1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--hd-bg-0);
      color: var(--hd-text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-width: 320px;
      min-height: 320px;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    .hd-hidden {
      display: none !important;
    }

    .hd-visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    /* ============================================================
       ROOT
       ============================================================ */

    #haldo-os {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255, 153, 36, 0.06),
          transparent 26%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(34, 122, 255, 0.09),
          transparent 55%
        ),
        linear-gradient(
          180deg,
          var(--hd-bg-1),
          var(--hd-bg-0)
        );
    }

    /* ============================================================
       COSMIC BACKGROUND
       ============================================================ */

    #haldo-cosmic-background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% 50%,
          rgba(255, 142, 28, 0.06),
          transparent 28%
        ),
        radial-gradient(
          ellipse at 18% 25%,
          rgba(80, 92, 255, 0.12),
          transparent 34%
        ),
        radial-gradient(
          ellipse at 82% 18%,
          rgba(255, 70, 188, 0.08),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #01030a 0%,
          #050b1c 38%,
          #07152c 62%,
          #02040c 100%
        );
    }

    #haldo-cosmic-background::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(
          ellipse at 25% 42%,
          rgba(56, 217, 255, 0.11),
          transparent 26%
        ),
        radial-gradient(
          ellipse at 75% 48%,
          rgba(166, 108, 255, 0.12),
          transparent 25%
        ),
        radial-gradient(
          ellipse at 50% 78%,
          rgba(255, 120, 32, 0.08),
          transparent 24%
        );
      filter: blur(42px);
      animation: hdNebulaDrift 28s ease-in-out infinite alternate;
    }

    #haldo-cosmic-background::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.26;
      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,0.75) 0 0.7px,
          transparent 0.9px
        );
      background-size: 71px 71px;
      animation: hdStarField 90s linear infinite;
    }

    @keyframes hdNebulaDrift {
      from {
        transform: translate3d(-1%, -1%, 0) scale(1);
      }

      to {
        transform: translate3d(1.5%, 1%, 0) scale(1.04);
      }
    }

    @keyframes hdStarField {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-71px, -71px, 0);
      }
    }

    /* ============================================================
       STAR CONTAINERS
       ============================================================ */

    #haldo-stars-365,
    #haldo-stars-special {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hd-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.45;
      box-shadow:
        0 0 4px rgba(255,255,255,0.9);
      animation:
        hdStarTwinkle var(--star-duration, 3s)
        ease-in-out infinite alternate;
    }

    .hd-star-special {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff6bf;
      opacity: 0.82;
      box-shadow:
        0 0 7px rgba(255,255,255,0.95),
        0 0 18px rgba(255,210,92,0.62);
      animation:
        hdSpecialStarPulse var(--star-duration, 2.4s)
        ease-in-out infinite alternate;
    }

    @keyframes hdStarTwinkle {
      from {
        opacity: 0.18;
        transform: scale(0.7);
      }

      to {
        opacity: 0.78;
        transform: scale(1.35);
      }
    }

    @keyframes hdSpecialStarPulse {
      from {
        opacity: 0.35;
        transform: scale(0.75);
      }

      to {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    /* ============================================================
       TOP SYSTEM BAR
       ============================================================ */

    #haldo-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--hd-topbar-height);
      z-index: 1000;

      display: grid;
      grid-template-columns:
        auto
        minmax(160px, 1fr)
        auto
        auto;

      align-items: center;
      gap: 12px;

      padding:
        env(safe-area-inset-top, 0px)
        14px
        0
        14px;

      background:
        linear-gradient(
          180deg,
          rgba(2, 7, 18, 0.94),
          rgba(2, 7, 18, 0.58)
        );

      border-bottom:
        1px solid rgba(90, 207, 255, 0.18);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hd-brand-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      min-width: 0;
      height: 44px;

      padding: 5px 12px 5px 7px;

      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 15px;

      background:
        rgba(255,255,255,0.035);

      cursor: pointer;

      transition:
        transform var(--hd-transition),
        background var(--hd-transition),
        border-color var(--hd-transition);
    }

    .hd-brand-button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.07);
      border-color: rgba(93,216,255,0.34);
    }

    .hd-brand-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 50%;
      filter:
        drop-shadow(0 0 7px rgba(255,184,50,0.55));
    }

    .hd-brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      line-height: 1.05;
    }

    .hd-brand-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .hd-brand-version {
      font-size: 9px;
      color: var(--hd-text-muted);
      white-space: nowrap;
    }

    #haldo-global-search {
      justify-self: center;
      width: min(580px, 100%);
      height: 42px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 0 13px;

      border:
        1px solid rgba(85, 203, 255, 0.18);

      border-radius: 14px;

      background:
        rgba(3, 12, 28, 0.7);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03);

      color: var(--hd-text-soft);
    }

    #haldo-global-search-icon {
      font-size: 17px;
      opacity: 0.8;
    }

    #haldo-global-search-input {
      width: 100%;
      min-width: 0;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--hd-text);
    }

    #haldo-global-search-input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .hd-topbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .hd-icon-button {
      position: relative;

      width: 42px;
      height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(85, 203, 255, 0.18);

      border-radius: 13px;

      background:
        rgba(3, 12, 28, 0.72);

      cursor: pointer;

      transition:
        transform var(--hd-transition),
        border-color var(--hd-transition),
        background var(--hd-transition),
        box-shadow var(--hd-transition);
    }

    .hd-icon-button:hover {
      transform: translateY(-1px);
      border-color: rgba(85, 203, 255, 0.52);
      background: rgba(15, 38, 69, 0.72);
      box-shadow: var(--hd-glow-blue);
    }

    .hd-icon-button:active {
      transform: scale(0.94);
    }

    .hd-icon-button img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    /* ============================================================
       MAIN COSMIC STAGE
       ============================================================ */

    #haldo-cosmic-stage {
      position: absolute;
      inset:
        var(--hd-topbar-height)
        0
        var(--hd-dock-height)
        0;

      z-index: 10;
      overflow: hidden;
    }

    #haldo-cosmic-camera {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-origin: 50% 50%;

      transition:
        transform 900ms cubic-bezier(.16,.82,.18,1);
    }

    /* ============================================================
       COSMIC SUN SYSTEM
       ============================================================ */

    #haldo-solar-system {
      position: relative;

      width: min(78vw, 78vh, 920px);
      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-origin: center;
    }

    /* ============================================================
       SOLAR RAYS
       ============================================================ */

    #haldo-sun-rays {
      position: absolute;
      width: 56%;
      aspect-ratio: 1;
      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          transparent 0deg 8deg,
          rgba(255,218,94,0.15) 10deg,
          transparent 15deg 25deg,
          rgba(255,165,38,0.16) 28deg,
          transparent 35deg 48deg,
          rgba(255,231,139,0.12) 51deg,
          transparent 57deg 75deg,
          rgba(255,154,34,0.14) 78deg,
          transparent 86deg 100deg,
          rgba(255,239,163,0.15) 104deg,
          transparent 111deg 125deg,
          rgba(255,155,38,0.14) 130deg,
          transparent 138deg 360deg
        );

      filter:
        blur(8px);

      opacity: 0.9;

      animation:
        hdSunRaysRotate 24s linear infinite;
    }

    @keyframes hdSunRaysRotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================================
       INNER SUN
       ============================================================ */

    #haldo-sun {
      position: absolute;

      width: 32%;
      aspect-ratio: 1 / 1;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      background:
        radial-gradient(
          circle at 45% 40%,
          #fffef0 0%,
          #fff8b9 8%,
          #ffe15c 20%,
          #ffb12e 42%,
          #ff721d 67%,
          #d73516 100%
        );

      box-shadow:
        0 0 18px rgba(255,250,180,0.96),
        0 0 42px rgba(255,208,64,0.9),
        0 0 85px rgba(255,137,27,0.72),
        0 0 155px rgba(255,83,25,0.44),
        0 0 230px rgba(255,49,17,0.24);

      animation:
        hdSunBreathing 4.6s ease-in-out infinite;
    }

    #haldo-sun::before {
      content: "";
      position: absolute;
      inset: -12%;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,241,139,0.32),
          transparent 68%
        );

      filter: blur(15px);
      z-index: -1;
    }

    #haldo-sun::after {
      content: "";
      position: absolute;
      inset: 3%;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.46);

      box-shadow:
        inset 0 0 25px rgba(255,255,255,0.3);
    }

    @keyframes hdSunBreathing {
      0%,
      100% {
        transform: scale(0.985);
      }

      50% {
        transform: scale(1.025);
      }
    }

    #haldo-sun-logo {
      position: relative;

      width: 62%;
      height: 62%;

      object-fit: contain;

      border-radius: 50%;

      filter:
        drop-shadow(0 0 7px rgba(255,255,255,0.7))
        drop-shadow(0 0 19px rgba(255,205,61,0.72));

      animation:
        hdLogoFloat 4.8s ease-in-out infinite;
    }

    @keyframes hdLogoFloat {
      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-2px)
          scale(1.018);
      }
    }

    #haldo-sun:hover {
      animation:
        hdSunActivate 1.2s ease-in-out infinite;
    }

    @keyframes hdSunActivate {
      0%,
      100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.07);
        filter: brightness(1.16);
      }
    }

    /* ============================================================
       HALDO AI OS ORBITAL TITLE
       ============================================================ */

    #haldo-orbital-title {
      position: absolute;

      width: 66%;
      aspect-ratio: 1;

      border-radius: 50%;

      pointer-events: none;

      animation:
        hdTitleOrbit 42s linear infinite;
    }

    @keyframes hdTitleOrbit {
      to {
        transform: rotate(360deg);
      }
    }

    .hd-title-letter {
      position: absolute;

      left: 50%;
      top: 2%;

      transform:
        translateX(-50%)
        rotate(0deg);

      transform-origin:
        50%
        calc(
          min(33vw, 33vh, 460px)
          - 0px
        );

      color: #fff2a8;

      font-size:
        clamp(
          17px,
          2.7vw,
          42px
        );

      font-weight: 950;

      letter-spacing: 0.06em;

      text-shadow:
        0 0 6px rgba(255,255,255,0.9),
        0 0 18px rgba(255,205,57,0.95),
        0 0 40px rgba(255,118,28,0.65);

      white-space: nowrap;
    }

    /* ============================================================
       PLANET ORBIT BASE
       ============================================================ */

    .hd-orbit {
      position: absolute;

      left: 50%;
      top: 50%;

      width: var(--orbit-size);
      height: var(--orbit-size);

      transform:
        translate(-50%, -50%)
        rotateX(var(--orbit-tilt, 64deg))
        rotateZ(var(--orbit-angle, 0deg));

      border:
        1px solid
        rgba(
          104,
          208,
          255,
          0.18
        );

      border-radius: 50%;

      box-shadow:
        0 0 9px rgba(56,217,255,0.05);

      pointer-events: none;
    }

    .hd-orbit-inner {
      position: absolute;
      inset: 0;

      border-radius: 50%;

      animation:
        hdOrbitSpin
        var(--orbit-duration, 60s)
        linear infinite;
    }

    @keyframes hdOrbitSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================================
       PLANET OBJECT
       ============================================================ */

    .hd-planet {
      position: absolute;

      left: 50%;
      top: 0;

      width: var(--planet-size, 34px);
      height: var(--planet-size, 34px);

      margin-left:
        calc(
          var(--planet-size, 34px) / -2
        );

      margin-top:
        calc(
          var(--planet-size, 34px) / -2
        );

      border-radius: 50%;

      pointer-events: auto;
      cursor: pointer;

      background:
        radial-gradient(
          circle at 30% 25%,
          rgba(255,255,255,0.92),
          rgba(255,255,255,0.12) 13%,
          transparent 22%
        ),
        var(--planet-gradient);

      box-shadow:
        0 0 8px var(--planet-glow),
        0 0 22px var(--planet-glow);

      transition:
        transform var(--hd-transition),
        filter var(--hd-transition);
    }

    .hd-planet:hover {
      transform:
        scale(1.3);
      filter:
        brightness(1.25);
    }

    .hd-planet-label {
      position: absolute;

      top: calc(
        100% + 7px
      );

      left: 50%;

      transform:
        translateX(-50%);

      padding:
        3px 7px;

      border-radius: 7px;

      background:
        rgba(2,7,17,0.68);

      border:
        1px solid rgba(90,208,255,0.14);

      color:
        rgba(255,255,255,0.78);

      font-size: 9px;
      white-space: nowrap;

      backdrop-filter:
        blur(6px);
    }

    /* ============================================================
       EARTH
       ============================================================ */

    .hd-earth {
      background:
        radial-gradient(
          circle at 30% 26%,
          rgba(255,255,255,0.9),
          transparent 12%
        ),
        radial-gradient(
          ellipse at 58% 56%,
          #38e39d 0 8%,
          transparent 9%
        ),
        radial-gradient(
          ellipse at 35% 70%,
          #28a8ff 0 20%,
          transparent 21%
        ),
        linear-gradient(
          135deg,
          #1254cf,
          #1bb6ec 42%,
          #1748ad 100%
        );

      box-shadow:
        0 0 8px rgba(69,210,255,0.8),
        0 0 28px rgba(42,147,255,0.56);
    }

    /* ============================================================
       MOON
       ============================================================ */

    .hd-moon {
      position: absolute;

      width: 42%;
      height: 42%;

      left: 50%;
      top: 50%;

      margin:
        -21%
        0
        0
        -21%;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,0.14);

      animation:
        hdMoonOrbit 8s linear infinite;

      pointer-events: none;
    }

    .hd-moon::after {
      content: "";

      position: absolute;

      left: 100%;
      top: 50%;

      width: 7px;
      height: 7px;

      margin:
        -3.5px
        0
        0
        -3.5px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 25%,
          #fff,
          #c8c9d1 48%,
          #70727d
        );

      box-shadow:
        0 0 8px rgba(255,255,255,0.35);
    }

    @keyframes hdMoonOrbit {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* ============================================================
       COSMIC INFORMATION CHIP
       ============================================================ */

    #haldo-cosmic-status {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform:
        translateX(-50%);

      display: flex;
      align-items: center;
      gap: 8px;

      padding:
        7px
        12px;

      border:
        1px solid
        rgba(87,208,255,0.16);

      border-radius: 999px;

      background:
        rgba(2,8,20,0.55);

      color:
        var(--hd-text-soft);

      font-size: 10px;

      backdrop-filter:
        blur(12px);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.28);
    }

    .hd-status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--hd-success);

      box-shadow:
        0 0 8px
        rgba(83,246,161,0.9);

      animation:
        hdStatusPulse 2s ease-in-out infinite;
    }

    @keyframes hdStatusPulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */

    @media (max-width: 900px) {
      :root {
        --hd-topbar-height: 58px;
        --hd-dock-height: 68px;
      }

      #haldo-topbar {
        grid-template-columns:
          auto
          1fr
          auto;

        padding-left: 8px;
        padding-right: 8px;

  <script>
    /*
     * HalDo AI OS
     * Central Shell Bootstrap
     *
     * Part 1 / 10
     *
     * Die eigentlichen App-Module werden später über die zentrale
     * Registry / Runtime / Router-Schicht verbunden.
     */

    (function () {
      "use strict";

      const root =
        document.getElementById("haldo-os");

      if (!root) {
        return;
      }

      const logoPath =
        "assets/logo/logo.png";

      window.HalDo =
        window.HalDo ||
        {};

      window.HalDo.config =
        window.HalDo.config ||
        {};

      window.HalDo.config.logo =
        logoPath;

      window.HalDo.config.version =
        "22";

      window.HalDo.config.name =
        "HalDo AI OS";

      window.HalDo.config.mode =
        "cosmic-world";

      window.HalDo.state =
        window.HalDo.state ||
        {};

      window.HalDo.state.boot =
        "shell-ready";

      window.HalDo.state.ai =
        "idle";

      window.HalDo.state.cosmicWorld =
        "ready";

      window.HalDo.state.selectedPlanet =
        null;

      window.HalDo.state.windowCount =
        0;

      window.HalDo.state.activeApp =
        null;

      window.HalDo.events =
        window.HalDo.events ||
        new EventTarget();

      window.HalDo.emit =
        function (name, detail) {
          try {
            window.HalDo.events.dispatchEvent(
              new CustomEvent(
                name,
                {
                  detail:
                    detail || {}
                }
              )
            );
          } catch (error) {
            console.warn(
              "HalDo Event Error:",
              error
            );
          }
        };

      window.HalDo.on =
        function (name, handler) {
          if (
            typeof handler !==
            "function"
          ) {
            return function () {};
          }

          window.HalDo.events.addEventListener(
            name,
            handler
          );

          return function () {
            window.HalDo.events.removeEventListener(
              name,
              handler
            );
          };
        };

      /*
       * ------------------------------------------------------------
       * STAR GENERATOR
       * ------------------------------------------------------------
       */

      const stars365 =
        document.getElementById(
          "haldo-stars-365"
        );

      const specialStars =
        document.getElementById(
          "haldo-stars-special"
        );

      function createStar(
        container,
        special
      ) {
        if (!container) {
          return;
        }

        const star =
          document.createElement("span");

        star.className =
          special
            ? "hd-star-special"
            : "hd-star";

        star.style.left =
          (Math.random() * 100)
          .toFixed(3) + "%";

        star.style.top =
          (Math.random() * 100)
          .toFixed(3) + "%";

        const duration =
          (
            special
              ? 1.7 + Math.random() * 2.8
              : 2.0 + Math.random() * 5.0
          ).toFixed(2);

        star.style.setProperty(
          "--star-duration",
          duration + "s"
        );

        const scale =
          special
            ? 0.75 + Math.random() * 1.35
            : 0.55 + Math.random() * 1.15;

        star.style.transform =
          "scale(" +
          scale.toFixed(2) +
          ")";

        container.appendChild(
          star
        );
      }

      /*
       * Gewünscht:
       * ungefähr 365 Sterne insgesamt.
       */

      for (
        let i = 0;
        i < 365;
        i += 1
      ) {
        createStar(
          stars365,
          false
        );
      }

      /*
       * Gewünscht:
       * ungefähr 30 besonders leuchtende Sterne
       * rund um die zentrale Sonne.
       */

      for (
        let i = 0;
        i < 30;
        i += 1
      ) {
        createStar(
          specialStars,
          true
        );
      }

      /*
       * ------------------------------------------------------------
       * SUN -> HALDO AI
       * ------------------------------------------------------------
       */

      const sun =
        document.getElementById(
          "haldo-sun"
        );

      if (sun) {
        sun.addEventListener(
          "click",
          function () {

            window.HalDo.state.ai =
              "welcome";

            window.HalDo.emit(
              "haldo:ai:open",
              {
                source:
                  "cosmic-sun",
                welcome:
                  true
              }
            );

            const status =
              document.getElementById(
                "haldo-cosmic-status-text"
              );

            if (status) {
              status.textContent =
                "Willkommen bei HalDo AI OS";
            }

          }
        );
      }

      /*
       * ------------------------------------------------------------
       * PLANET EVENTS
       * ------------------------------------------------------------
       */

      const planets =
        document.querySelectorAll(
          ".hd-planet"
        );

      planets.forEach(
        function (planet) {

          planet.addEventListener(
            "click",
            function (event) {

              event.stopPropagation();

              const id =
                planet.getAttribute(
                  "data-planet-id"
                );

              const name =
                planet.getAttribute(
                  "data-planet-name"
                );

              window.HalDo.state.selectedPlanet =
                id;

              window.HalDo.emit(
                "haldo:cosmic:planet:selected",
                {
                  id:
                    id,
                  name:
                    name
                }
              );

              const status =
                document.getElementById(
                  "haldo-cosmic-status-text"
                );

              if (status) {
                status.textContent =
                  name +
                  " ausgewählt";
              }

            }
          );

        }
      );

      /*
       * ------------------------------------------------------------
       * BRAND / TOP AI BUTTON
       * ------------------------------------------------------------
       */

      const aiButton =
        document.getElementById(
          "haldo-ai-top-button"
        );

      if (aiButton) {
        aiButton.addEventListener(
          "click",
          function () {

            window.HalDo.state.ai =
              "open";

            window.HalDo.emit(
              "haldo:ai:open",
              {
                source:
                  "topbar"
              }
            );

          }
        );
      }

      /*
       * ------------------------------------------------------------
       * INITIAL SHELL EVENT
       * ------------------------------------------------------------
       */

      window.HalDo.emit(
        "haldo:shell:ready",
        {
          version:
            window.HalDo.config.version,
          logo:
            window.HalDo.config.logo,
          cosmicWorld:
            true
        }
      );

    })();
  </script>

      rgba(255,255,255,0.025);

    text-align: left;

    cursor: pointer;

    transition:
      background 140ms ease,
      border-color 140ms ease,
      transform 140ms ease;
  }

  .haldo-menu-item:hover {
    background:
      rgba(74,193,255,0.085);

    border-color:
      rgba(74,193,255,0.28);

    transform:
      translateX(2px);
  }

  .haldo-menu-item:active {
    transform:
      scale(.985);
  }

  .haldo-menu-item-icon {
    width: 32px;
    height: 32px;

    flex:
      0 0 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
      rgba(255,255,255,0.045);

    color:
      rgba(231,249,255,0.92);

    font-size: 15px;
  }

  .haldo-menu-item-copy {
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .haldo-menu-item-title {
    font-size: 12px;
    font-weight: 800;
  }

  .haldo-menu-item-description {
    font-size: 9px;
    line-height: 1.25;

    color:
      rgba(236,247,255,0.48);
  }

  .haldo-menu-item-arrow {
    margin-left: auto;

    color:
      rgba(220,245,255,0.35);

    font-size: 14px;
  }

  /* ============================================================
     A–Z APP GRID
     ============================================================ */

  .haldo-app-grid {
    display: grid;

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

    gap: 7px;
  }

  .haldo-app-tile {
    position: relative;

    min-height: 78px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;

    gap: 5px;

    padding: 10px;

    border:
      1px solid
      rgba(255,255,255,0.07);

    border-radius: 15px;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,0.055),
        rgba(255,255,255,0.018)
      );

    cursor: pointer;

    overflow: hidden;

    transition:
      transform 150ms ease,
      border-color 150ms ease,
      background 150ms ease,
      box-shadow 150ms ease;
  }

  .haldo-app-tile::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
      radial-gradient(
        circle at 20% 10%,
        rgba(77,211,255,0.13),
        transparent 52%
      );

    opacity: 0;

    transition:
      opacity 150ms ease;
  }

  .haldo-app-tile:hover {
    transform:
      translateY(-2px);

    border-color:
      rgba(80,208,255,0.36);

    background:
      rgba(49,126,179,0.13);

    box-shadow:
      0 12px 30px
      rgba(0,0,0,0.22);
  }

  .haldo-app-tile:hover::before {
    opacity: 1;
  }

  .haldo-app-tile-icon {
    position: relative;
    z-index: 1;

    width: 31px;
    height: 31px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
      rgba(255,255,255,0.055);

    font-size: 15px;
  }

  .haldo-app-tile-name {
    position: relative;
    z-index: 1;

    font-size: 10px;
    font-weight: 850;

    line-height: 1.1;
  }

  .haldo-app-tile-letter {
    position: absolute;

    right: 8px;
    top: 6px;

    color:
      rgba(105,215,255,0.20);

    font-size: 9px;
    font-weight: 950;
  }

  /* ============================================================
     WINDOW LAYER
     ============================================================ */

  #haldo-window-layer {
    position: fixed;
    inset: 0;

    z-index: 2000;

    pointer-events: none;
  }

  .haldo-window {
    position: absolute;

    left: 50%;
    top: 50%;

    width:
      min(
        760px,
        calc(100vw - 32px)
      );

    height:
      min(
        560px,
        calc(100vh - 120px)
      );

    min-width: 300px;
    min-height: 220px;

    transform:
      translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    overflow: hidden;

    border:
      1px solid
      rgba(104,215,255,0.25);

    border-radius: 20px;

    background:
      rgba(3,9,23,0.94);

    box-shadow:
      0 35px 120px
      rgba(0,0,0,0.68),
      0 0 45px
      rgba(43,172,255,0.08);

    backdrop-filter:
      blur(22px);

    -webkit-backdrop-filter:
      blur(22px);

    pointer-events: auto;

    opacity: 0;

    transition:
      opacity 150ms ease,
      transform 150ms cubic-bezier(.2,.8,.2,1);
  }

  .haldo-window.is-visible {
    opacity: 1;
  }

  .haldo-window.is-maximized {
    left: 8px;
    top: 8px;

    width:
      calc(100vw - 16px);

    height:
      calc(100vh - 16px);

    transform: none !important;

    border-radius: 16px;
  }

  .haldo-window.is-minimized {
    opacity: 0;

    pointer-events: none;

    transform:
      translate(
        -50%,
        calc(
          50% + 180px
        )
      )
      scale(.82);
  }

  /* ============================================================
     WINDOW TITLE BAR
     ============================================================ */

  .haldo-window-titlebar {
    flex:
      0 0 48px;

    display: flex;
    align-items: center;
    gap: 9px;

    padding:
      7px 9px;

    border-bottom:
      1px solid
      rgba(255,255,255,0.07);

    background:
      linear-gradient(
        180deg,
        rgba(255,255,255,0.055),
        rgba(255,255,255,0.018)
      );

    cursor:
      grab;
  }

  .haldo-window-titlebar:active {
    cursor:
      grabbing;
  }

  .haldo-window-app-icon {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background:
      rgba(255,255,255,0.06);

    overflow: hidden;
  }

  .haldo-window-app-icon img {
    width: 25px;
    height: 25px;

    object-fit: contain;
  }

  .haldo-window-title-copy {
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .haldo-window-title {
    overflow: hidden;

    color:
      rgba(247,252,255,0.95);

    font-size: 11px;
    font-weight: 900;

    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .haldo-window-subtitle {
    color:
      rgba(228,245,255,0.42);

    font-size: 8px;

    white-space: nowrap;
  }

  .haldo-window-controls {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 4px;
  }

  .haldo-window-control {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
      1px solid
      rgba(255,255,255,0.06);

    border-radius: 8px;

    background:
      rgba(255,255,255,0.025);

    cursor: pointer;

    color:
      rgba(242,250,255,0.66);

    transition:
      background 130ms ease,
      color 130ms ease,
      transform 130ms ease;
  }

  .haldo-window-control:hover {
    background:
      rgba(255,255,255,0.09);

    color:
      #fff;

    transform:
      scale(1.04);
  }

  .haldo-window-control.close:hover {
    background:
      rgba(255,77,103,0.20);

    color:
      #ff9aaa;
  }

  /* ============================================================
     WINDOW CONTENT
     ============================================================ */

  .haldo-window-content {
    position: relative;

    flex: 1 1 auto;

    min-height: 0;

    overflow: auto;

    padding: 0;

    background:
      radial-gradient(
        circle at 50% 20%,
        rgba(50,170,255,0.045),
        transparent 45%
      );
  }

  /* ============================================================
     WINDOW RESIZE HANDLE
     ============================================================ */

  .haldo-window-resize {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 22px;
    height: 22px;

    cursor:
      nwse-resize;

    opacity: .55;
  }

  .haldo-window-resize::before,
  .haldo-window-resize::after {
    content: "";

    position: absolute;

    right: 5px;
    bottom: 5px;

    width: 10px;
    height: 1px;

    background:
      rgba(177,235,255,0.65);

    transform:
      rotate(-45deg);
  }

  .haldo-window-resize::after {
    right: 4px;
    bottom: 9px;
    width: 7px;
  }

  /* ============================================================
     HALDO AI WINDOW
     ============================================================ */

  .haldo-ai-window {
    width:
      min(
        900px,
        calc(100vw - 24px)
      );

    height:
      min(
        680px,
        calc(100vh - 90px)
      );
  }

  .haldo-ai-shell {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    background:
      radial-gradient(
        circle at 50% 12%,
        rgba(255,185,48,0.10),
        transparent 28%
      ),
      linear-gradient(
        180deg,
        rgba(6,17,39,0.96),
        rgba(2,7,19,0.98)
      );
  }

  /* ============================================================
     LIVING AI HEADER
     ============================================================ */

  .haldo-ai-header {
    flex:
      0 0 auto;

    display: flex;
    align-items: center;

    gap: 13px;

    padding:
      14px 16px;

    border-bottom:
      1px solid
      rgba(255,255,255,0.07);
  }

  .haldo-ai-avatar {
    position: relative;

    width: 70px;
    height: 70px;

    flex:
      0 0 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(255,232,141,0.13),
        rgba(255,164,38,0.05) 52%,
        transparent 72%
      );
  }

  .haldo-ai-avatar::before {
    content: "";

    position: absolute;
    inset: -7px;

    border-radius: 50%;

    border:
      1px solid
      rgba(255,207,74,0.30);

    box-shadow:
      0 0 18px
      rgba(255,187,48,0.22);

    animation:
      haldoAvatarRing 4s ease-in-out infinite;
  }

  @keyframes haldoAvatarRing {
    0%,
    100% {
      transform: scale(.96);
      opacity: .55;
    }

    50% {
      transform: scale(1.04);
      opacity: 1;
    }
  }

  .haldo-ai-avatar img {
    width: 62px;
    height: 62px;

    object-fit: contain;

    border-radius: 50%;

    filter:
      drop-shadow(
        0 0 12px
        rgba(255,215,82,0.64)
      );

    animation:
      haldoAvatarFloat
      4.5s
      ease-in-out
      infinite;
  }

  @keyframes haldoAvatarFloat {
    0%,
    100% {
      transform:
        translateY(0)
        scale(1);
    }

    50% {
      transform:
        translateY(-2px)
        scale(1.025);
    }
  }

  .haldo-ai-header-copy {
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 4px;
  }

  .haldo-ai-name {
    font-size: 18px;
    font-weight: 950;

    letter-spacing:
      .025em;

    text-shadow:
      0 0 12px
      rgba(255,196,62,0.30);
  }

  .haldo-ai-state {
    display: flex;
    align-items: center;
    gap: 6px;

    color:
      rgba(235,247,255,0.54);

    font-size: 10px;
  }

  .haldo-ai-state-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
      #55f2a4;

    box-shadow:
      0 0 8px
      rgba(85,242,164,.85);
  }

  /* ============================================================
     AI CONVERSATION AREA
     ============================================================ */

  .haldo-ai-conversation {
    flex:
      1 1 auto;

    min-height: 0;

    overflow-y: auto;

    padding:
      18px;

    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .haldo-ai-message {
    max-width: min(78%, 680px);

    padding:
      11px 13px;

    border:
      1px solid
      rgba(255,255,255,0.075);

    border-radius: 16px;

    color:
      rgba(244,251,255,0.92);

    font-size: 12px;
    line-height: 1.55;

    white-space: pre-wrap;

    box-shadow:
      0 7px 22px
      rgba(0,0,0,0.14);
  }

  .haldo-ai-message.ai {
    align-self: flex-start;

    border-top-left-radius: 6px;

    background:
      rgba(40,91,132,0.20);
  }

  .haldo-ai-message.user {
    align-self: flex-end;

    border-top-right-radius: 6px;

    background:
      rgba(95,59,147,0.22);
  }

  /* ============================================================
     AI INPUT AREA
     ============================================================ */

  .haldo-ai-input-area {
    flex:
      0 0 auto;

    padding:
      11px;

    border-top:
      1px solid
      rgba(255,255,255,0.07);

    background:
      rgba(2,8,21,0.78);
  }

  .haldo-ai-input-row {
    display: flex;
    align-items: flex-end;
    gap: 7px;
  }

  .haldo-ai-input {
    flex:
      1 1 auto;

    min-height: 44px;
    max-height: 140px;

    resize: none;

    padding:
      11px 12px;

    border:
      1px solid
      rgba(88,205,255,0.18);

    border-radius: 13px;

    outline: none;

    background:
      rgba(255,255,255,0.035);

    color:
      rgba(250,253,255,0.95);

    font-size: 12px;

    transition:
      border-color 140ms ease,
      box-shadow 140ms ease;
  }

  .haldo-ai-input:focus {
    border-color:
      rgba(88,205,255,0.48);

    box-shadow:
      0 0 0 3px
      rgba(88,205,255,0.055);
  }

  .haldo-ai-action {
    width: 44px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
      1px solid
      rgba(88,205,255,0.18);

    border-radius: 13px;

    background:
      rgba(255,255,255,0.035);

    cursor: pointer;

    transition:
      transform 120ms ease,
      background 120ms ease,
      border-color 120ms ease;
  }

  .haldo-ai-action:hover {
    transform:
      translateY(-1px);

    background:
      rgba(65,190,255,0.10);

    border-color:
      rgba(65,190,255,0.42);
  }

  .haldo-ai-action.primary {
    background:
      linear-gradient(
        145deg,
        rgba(255,191,46,0.22),
        rgba(255,119,28,0.14)
      );

    border-color:
      rgba(255,199,71,0.34);
  }

  .haldo-ai-input-tools {
    display: flex;
    align-items: center;
    gap: 5px;

    margin-top: 7px;
  }

  .haldo-ai-tool {
    min-height: 27px;

    padding:
      4px 8px;

    border:
      1px solid
      rgba(255,255,255,0.065);

    border-radius: 8px;

    background:
      rgba(255,255,255,0.025);

    color:
      rgba(239,249,255,0.56);

    font-size: 9px;

    cursor: pointer;
  }

  .haldo-ai-tool:hover {
    color:
      rgba(255,255,255,0.9);

    background:
      rgba(255,255,255,0.07);
  }

  /* ============================================================
     DOCK
     ============================================================ */

  #haldo-dock {
    position: fixed;

    left: 50%;
    bottom: 10px;

    z-index: 1200;

    transform:
      translateX(-50%);

    width:
      min(
        calc(100vw - 18px),
        760px
      );

    height:
      calc(
        var(--hd-dock-height) - 10px
      );

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding:
      8px 10px;

    border:
      1px solid
      rgba(90,207,255,0.20);

    border-radius: 20px;

    background:
      rgba(3,9,22,0.72);

    box-shadow:
      0 20px 65px
      rgba(0,0,0,0.50);

    backdrop-filter:
      blur(22px);

    -webkit-backdrop-filter:
      blur(22px);
  }

  .haldo-dock-button {
    position: relative;

    width: 50px;
    height: 50px;

    flex:
      0 0 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
      1px solid
      rgba(255,255,255,0.07);

    border-radius: 15px;

    background:
      rgba(255,255,255,0.035);

    cursor: pointer;

    transition:
      transform 150ms ease,
      background 150ms ease,
      border-color 150ms ease;
  }

  .haldo-dock-button:hover {
    transform:
      translateY(-5px)
      scale(1.04);

    background:
      rgba(75,192,255,0.11);

    border-color:
      rgba(75,192,255,0.36);
  }

  .haldo-dock-button img {
    width: 31px;
    height: 31px;

    object-fit: contain;

    border-radius: 50%;
  }

  .haldo-dock-button span {
    font-size: 18px;
  }

  .haldo-dock-label {
    position: absolute;

    bottom:
      calc(100% + 7px);

    left: 50%;

    transform:
      translateX(-50%)
      translateY(4px);

    padding:
      4px 7px;

    border-radius: 7px;

    background:
      rgba(2,7,17,0.92);

    border:
      1px solid
      rgba(255,255,255,0.09);

    color:
      rgba(255,255,255,0.82);

    font-size: 8px;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition:
      opacity 120ms ease,
      transform 120ms ease;
  }

  .haldo-dock-button:hover
  .haldo-dock-label {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0);
  }

  /* ============================================================
     NOTIFICATION CENTER
     ============================================================ */

  #haldo-notification-center {
    position: fixed;

    top: 74px;
    right: 12px;

    z-index: 4500;

    width:
      min(
        390px,
        calc(100vw - 24px)
      );

    max-height:
      min(
        600px,
        calc(100vh - 100px)
      );

    overflow: hidden;

    display: flex;
    flex-direction: column;

    border:
      1px solid
      rgba(90,208,255,0.24);

    border-radius: 20px;

    background:
      rgba(3,9,23,0.94);

    box-shadow:
      0 28px 90px
      rgba(0,0,0,0.60);

    backdrop-filter:
      blur(22px);

    -webkit-backdrop-filter:
      blur(22px);

    opacity: 0;

    transform:
      translateY(-8px)
      scale(.97);

    pointer-events: none;

    transition:
      opacity 160ms ease,
      transform 160ms ease;
  }

  #haldo-notification-center.is-open {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);

    pointer-events: auto;
  }

  .haldo-notification-header {
    display: flex;
    align-items: center;

    padding:
      12px 14px;

    border-bottom:
      1px solid
      rgba(255,255,255,0.07);
  }

  .haldo-notification-header strong {
    font-size: 12px;
  }

  .haldo-notification-clear {
    margin-left: auto;

    border: 0;
    background: transparent;

    color:
      rgba(160,225,255,0.65);

    font-size: 9px;

    cursor: pointer;
  }

  .haldo-notification-list {
    overflow-y: auto;

    padding: 9px;
  }

  .haldo-notification {
    display: flex;
    gap: 9px;

    padding: 10px;

    margin-bottom: 6px;

    border:
      1px solid
      rgba(255,255,255,0.055);

    border-radius: 12px;

    background:
      rgba(255,255,255,0.025);
  }

  .haldo-notification-icon {
    width: 30px;
    height: 30px;

    flex:
      0 0 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background:
      rgba(75,193,255,0.08);
  }

  .haldo-notification-copy {
    min-width: 0;
  }

  .haldo-notification-title {
    font-size: 10px;
    font-weight: 850;
  }

  .haldo-notification-text {
    margin-top: 2px;

    font-size: 9px;

    line-height: 1.4;

    color:
      rgba(239,249,255,0.50);
  }

  /* ============================================================
     RESPONSIVE WINDOW / MENU
     ============================================================ */

  @media (max-width: 700px) {
    #haldo-system-menu,
    #haldo-app-menu {
      left: 8px;
      right: 8px;

      top: 62px;

      width:
        auto;

      max-height:
        calc(100vh - 78px);
    }

    .haldo-menu-body {
      max-height:
        calc(100vh - 150px);
    }

    .haldo-app-grid {
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
    }

    .haldo-app-tile {
      min-height: 72px;
    }

    .haldo-window {
      left: 8px;
      top: 8px;

      width:
        calc(100vw - 16px);

      height:
        calc(100vh - 86px);

      transform: none;

      border-radius: 16px;
    }

    .haldo-ai-window {
      height:
        calc(100vh - 86px);
    }

    #haldo-notification-center {
      top: 62px;
      right: 8px;
      left: 8px;

      width: auto;
    }

    #haldo-dock {
      gap: 4px;

      padding:
        6px;

      border-radius: 17px;
    }

    .haldo-dock-button {
      width: 43px;
      height: 43px;

      flex-basis: 43px;
    }

    .haldo-dock-button img {
      width: 27px;
      height: 27px;
    }

    .haldo-ai-header {
      padding: 10px;
    }

    .haldo-ai-avatar {
      width: 54px;
      height: 54px;
      flex-basis: 54px;
    }

    .haldo-ai-avatar img {
      width: 48px;

<script>
(function () {

  "use strict";

  /*
   * ------------------------------------------------------------
   * SAFE REFERENCES
   * ------------------------------------------------------------
   */

  const HD =
    window.HalDo ||
    (window.HalDo = {});

  HD.windows =
    HD.windows ||
    {};

  HD.windows.items =
    HD.windows.items ||
    new Map();

  HD.windows.activeId =
    HD.windows.activeId ||
    null;

  HD.windows.zIndex =
    Number(
      HD.windows.zIndex ||
      2100
    );


  /*
   * ------------------------------------------------------------
   * MENU REFERENCES
   * ------------------------------------------------------------
   */

  const systemMenu =
    document.getElementById(
      "haldo-system-menu"
    );

  const appMenu =
    document.getElementById(
      "haldo-app-menu"
    );

  const menuLayer =
    document.getElementById(
      "haldo-menu-layer"
    );

  const notificationCenter =
    document.getElementById(
      "haldo-notification-center"
    );


  /*
   * ------------------------------------------------------------
   * MENU HELPERS
   * ------------------------------------------------------------
   */

  function closeMenus() {

    if (systemMenu) {
      systemMenu.classList.remove(
        "is-open"
      );
    }

    if (appMenu) {
      appMenu.classList.remove(
        "is-open"
      );
    }

    if (menuLayer) {
      menuLayer.setAttribute(
        "aria-hidden",
        "true"
      );
    }

  }


  function openSystemMenu() {

    if (!systemMenu) {
      return;
    }

    if (appMenu) {
      appMenu.classList.remove(
        "is-open"
      );
    }

    systemMenu.classList.add(
      "is-open"
    );

    if (menuLayer) {
      menuLayer.setAttribute(
        "aria-hidden",
        "false"
      );
    }

    HD.emit(
      "haldo:menu:system:open"
    );

  }


  function openAppMenu() {

    if (!appMenu) {
      return;
    }

    if (systemMenu) {
      systemMenu.classList.remove(
        "is-open"
      );
    }

    appMenu.classList.add(
      "is-open"
    );

    if (menuLayer) {
      menuLayer.setAttribute(
        "aria-hidden",
        "false"
      );
    }

    HD.emit(
      "haldo:menu:apps:open"
    );

  }


  /*
   * ------------------------------------------------------------
   * SYSTEM BUTTON
   * ------------------------------------------------------------
   */

  const systemButton =
    document.getElementById(
      "haldo-system-menu-button"
    );

  if (systemButton) {

    systemButton.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        const isOpen =
          systemMenu &&
          systemMenu.classList.contains(
            "is-open"
          );

        if (isOpen) {
          closeMenus();
        } else {
          openSystemMenu();
        }

      }
    );

  }


  /*
   * ------------------------------------------------------------
   * BRAND BUTTON
   * ------------------------------------------------------------
   */

  const brandButton =
    document.getElementById(
      "haldo-brand-button"
    );

  if (brandButton) {

    brandButton.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        const isOpen =
          systemMenu &&
          systemMenu.classList.contains(
            "is-open"
          );

        if (isOpen) {
          closeMenus();
        } else {
          openSystemMenu();
        }

      }
    );

  }


  /*
   * ------------------------------------------------------------
   * APP MENU OPENERS
   * ------------------------------------------------------------
   */

  document
    .querySelectorAll(
      '[data-dock-action="apps"]'
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {
            openAppMenu();
          }
        );

      }
    );


  /*
   * ------------------------------------------------------------
   * CLOSE BUTTONS
   * ------------------------------------------------------------
   */

  document
    .querySelectorAll(
      "[data-menu-close]"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {
            closeMenus();
          }
        );

      }
    );


  /*
   * ------------------------------------------------------------
   * OUTSIDE MENU CLICK
   * ------------------------------------------------------------
   */

  document.addEventListener(
    "click",
    function (event) {

      const target =
        event.target;

      if (
        systemMenu &&
        systemMenu.classList.contains(
          "is-open"
        ) &&
        !systemMenu.contains(target) &&
        target !== systemButton &&
        target !== brandButton
      ) {
        closeMenus();
      }

      if (
        appMenu &&
        appMenu.classList.contains(
          "is-open"
        ) &&
        !appMenu.contains(target)
      ) {
        const appButton =
          target.closest(
            '[data-dock-action="apps"]'
          );

        if (!appButton) {
          closeMenus();
        }
      }

    }
  );


  /*
   * ------------------------------------------------------------
   * NOTIFICATIONS
   * ------------------------------------------------------------
   */

  const notificationButton =
    document.getElementById(
      "haldo-notifications-button"
    );

  if (notificationButton) {

    notificationButton.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        if (!notificationCenter) {
          return;
        }

        notificationCenter.classList.toggle(
          "is-open"
        );

        HD.emit(
          "haldo:notifications:toggle",
          {
            open:
              notificationCenter.classList.contains(
                "is-open"
              )
          }
        );

      }
    );

  }


  const notificationClear =
    document.getElementById(
      "haldo-notification-clear"
    );

  const notificationList =
    document.getElementById(
      "haldo-notification-list"
    );

  if (notificationClear) {

    notificationClear.addEventListener(
      "click",
      function () {

        if (notificationList) {
          notificationList.innerHTML = "";
        }

        HD.emit(
          "haldo:notifications:clear"
        );

      }
    );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW ID
   * ------------------------------------------------------------
   */

  function createWindowId(
    appId
  ) {

    return (
      "haldo-window-" +
      String(appId || "app") +
      "-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2, 8)
    );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW ACTIVATION
   * ------------------------------------------------------------
   */

  function activateWindow(
    windowElement
  ) {

    if (!windowElement) {
      return;
    }

    HD.windows.zIndex += 1;

    windowElement.style.zIndex =
      String(
        HD.windows.zIndex
      );

    HD.windows.activeId =
      windowElement.id;

    HD.emit(
      "haldo:window:activate",
      {
        id:
          windowElement.id,
        appId:
          windowElement.dataset.appId ||
          null
      }
    );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW CREATION
   * ------------------------------------------------------------
   */

  function createWindow(
    options
  ) {

    const config =
      options ||
      {};

    const appId =
      String(
        config.appId ||
        "app"
      );

    const title =
      String(
        config.title ||
        appId
      );

    const subtitle =
      String(
        config.subtitle ||
        "HalDo AI OS App"
      );

    const content =
      String(
        config.content ||
        ""
      );

    const icon =
      String(
        config.icon ||
        "assets/logo/logo.png"
      );

    const windowId =
      createWindowId(
        appId
      );

    const layer =
      document.getElementById(
        "haldo-window-layer"
      );

    if (!layer) {
      return null;
    }

    const windowElement =
      document.createElement(
        "section"
      );

    windowElement.className =
      "haldo-window is-visible";

    windowElement.id =
      windowId;

    windowElement.dataset.appId =
      appId;

    windowElement.setAttribute(
      "role",
      "dialog"
    );

    windowElement.setAttribute(
      "aria-label",
      title
    );

    windowElement.innerHTML = `
      <header
        class="haldo-window-titlebar"
        data-window-drag-handle
      >

        <div class="haldo-window-app-icon">
          <img
            src="${escapeHtml(icon)}"
            alt=""
          >
        </div>

        <div class="haldo-window-title-copy">

          <div class="haldo-window-title">
            ${escapeHtml(title)}
          </div>

          <div class="haldo-window-subtitle">
            ${escapeHtml(subtitle)}
          </div>

        </div>

        <div class="haldo-window-controls">

          <button
            class="haldo-window-control"
            type="button"
            data-window-action="minimize"
            aria-label="Minimieren"
          >
            −
          </button>

          <button
            class="haldo-window-control"
            type="button"
            data-window-action="maximize"
            aria-label="Maximieren"
          >
            □
          </button>

          <button
            class="haldo-window-control close"
            type="button"
            data-window-action="close"
            aria-label="Schließen"
          >
            ×
          </button>

        </div>

      </header>

      <div
        class="haldo-window-content"
      >
        ${content}
      </div>

      <div
        class="haldo-window-resize"
        data-window-resize
      ></div>
    `;

    layer.appendChild(
      windowElement
    );

    HD.windows.items.set(
      windowId,
      {
        id:
          windowId,
        appId:
          appId,
        element:
          windowElement,
        minimized:
          false,
        maximized:
          false
      }
    );

    activateWindow(
      windowElement
    );

    setupWindowControls(
      windowElement
    );

    setupWindowDragging(
      windowElement
    );

    setupWindowResizing(
      windowElement
    );

    requestAnimationFrame(
      function () {

        windowElement.classList.add(
          "is-visible"
        );

      }
    );

    HD.windows.items.get(
      windowId
    ).openTime =
      Date.now();

    HD.emit(
      "haldo:window:open",
      {
        id:
          windowId,
        appId:
          appId,
        title:
          title
      }
    );

    return windowElement;

  }


  /*
   * ------------------------------------------------------------
   * ESCAPE HTML
   * ------------------------------------------------------------
   */

  function escapeHtml(
    value
  ) {

    return String(
      value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW CONTROLS
   * ------------------------------------------------------------
   */

  function setupWindowControls(
    windowElement
  ) {

    windowElement.addEventListener(
      "pointerdown",
      function () {
        activateWindow(
          windowElement
        );
      }
    );

    windowElement
      .querySelectorAll(
        "[data-window-action]"
      )
      .forEach(
        function (button) {

          button.addEventListener(
            "click",
            function (event) {

              event.stopPropagation();

              const action =
                button.dataset.windowAction;

              const record =
                HD.windows.items.get(
                  windowElement.id
                );

              if (!record) {
                return;
              }

              if (
                action ===
                "close"
              ) {

                HD.emit(
                  "haldo:window:before-close",
                  {
                    id:
                      windowElement.id,
                    appId:
                      record.appId
                  }
                );

                windowElement.remove();

                HD.windows.items.delete(
                  windowElement.id
                );

                if (
                  HD.windows.activeId ===
                  windowElement.id
                ) {
                  HD.windows.activeId =
                    null;
                }

                HD.emit(
                  "haldo:window:close",
                  {
                    id:
                      windowElement.id,
                    appId:
                      record.appId
                  }
                );

                return;
              }

              if (
                action ===
                "minimize"
              ) {

                record.minimized =
                  !record.minimized;

                windowElement.classList.toggle(
                  "is-minimized",
                  record.minimized
                );

                if (
                  record.minimized
                ) {
                  HD.emit(
                    "haldo:window:minimize",
                    {
                      id:
                        windowElement.id
                    }
                  );
                } else {

                  activateWindow(
                    windowElement
                  );

                  HD.emit(
                    "haldo:window:restore",
                    {
                      id:
                        windowElement.id
                    }
                  );

                }

                return;
              }

              if (
                action ===
                "maximize"
              ) {

                record.maximized =
                  !record.maximized;

                windowElement.classList.toggle(
                  "is-maximized",
                  record.maximized
                );

                activateWindow(
                  windowElement
                );

                HD.emit(
                  record.maximized
                    ? "haldo:window:maximize"
                    : "haldo:window:restore",
                  {
                    id:
                      windowElement.id
                  }
                );

              }

            }
          );

        }
      );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW DRAGGING
   * ------------------------------------------------------------
   */

  function setupWindowDragging(
    windowElement
  ) {

    const handle =
      windowElement.querySelector(
        "[data-window-drag-handle]"
      );

    if (!handle) {
      return;
    }

    let dragging =
      false;

    let pointerId =
      null;

    let startX =
      0;

    let startY =
      0;

    let originalLeft =
      0;

    let originalTop =
      0;

    handle.addEventListener(
      "pointerdown",
      function (event) {

        const record =
          HD.windows.items.get(
            windowElement.id
          );

        if (
          !record ||
          record.maximized
        ) {
          return;
        }

        if (
          event.target.closest(
            "button"
          )
        ) {
          return;
        }

        dragging =
          true;

        pointerId =
          event.pointerId;

        startX =
          event.clientX;

        startY =
          event.clientY;

        const rect =
          windowElement.getBoundingClientRect();

        originalLeft =
          rect.left;

        originalTop =
          rect.top;

        windowElement.style.left =
          originalLeft + "px";

        windowElement.style.top =
          originalTop + "px";

        windowElement.style.transform =
          "none";

        activateWindow(
          windowElement
        );

        try {
          handle.setPointerCapture(
            pointerId
          );
        } catch (_) {}

      }
    );

    handle.addEventListener(
      "pointermove",
      function (event) {

        if (
          !dragging ||
          event.pointerId !== pointerId
        ) {
          return;
        }

        const dx =
          event.clientX -
          startX;

        const dy =
          event.clientY -
          startY;

        windowElement.style.left =
          (
            originalLeft +
            dx
          ) + "px";

        windowElement.style.top =
          (
            originalTop +
            dy
          ) + "px";

      }
    );

    handle.addEventListener(
      "pointerup",
      function (event) {

        if (
          event.pointerId !== pointerId
        ) {
          return;
        }

        dragging =
          false;

        pointerId =
          null;

      }
    );

    handle.addEventListener(
      "pointercancel",
      function () {

        dragging =
          false;

        pointerId =
          null;

      }
    );

  }


  /*
   * ------------------------------------------------------------
   * WINDOW RESIZING
   * ------------------------------------------------------------
   */

  function setupWindowResizing(
    windowElement
  ) {

    const handle =
      windowElement.querySelector(
        "[data-window-resize]"
      );

    if (!handle) {
      return;
    }

    let resizing =
      false;

    let pointerId =
      null;

    let startX =
      0;

    let startY =
      0;

    let startWidth =
      0;

    let startHeight =
      0;

    handle.addEventListener(
      "pointerdown",
      function (event) {

        const record =
          HD.windows.items.get(
            windowElement.id
          );

        if (
          !record ||
          record.maximized
        ) {
          return;
        }

        resizing =
          true;

        pointerId =
          event.pointerId;

        const rect =
          windowElement.getBoundingClientRect();

        startX =
          event.clientX;

        startY =
          event.clientY;

        startWidth =
          rect.width;

        startHeight =
          rect.height;

        activateWindow(
          windowElement
        );

        try {
          handle.setPointerCapture(
            pointerId
          );
        } catch (_) {}

      }
    );

    handle.addEventListener(
      "pointermove",
      function (event) {

        if (
          !resizing ||
          event.pointerId !== pointerId
        ) {
          return;
        }

        const width =
          Math.max(
            300,
            startWidth +
            (
              event.clientX -
              startX
            )
          );

        const height =
          Math.max(
            220,
            startHeight +
            (
              event.clientY -
              startY
            )
          );

        windowElement.style.width =
          Math.min(
            width,
            window.innerWidth - 16
          ) + "px";

        windowElement.style.height =
          Math.min(
            height,
            window.innerHeight - 80
          ) + "px";

      }
    );

    handle.addEventListener(
      "pointerup",
      function () {

        resizing =
          false;

        pointerId =
          null;

      }
    );

    handle.addEventListener(
      "pointercancel",
      function () {

        resizing =
          false;

        pointerId =
          null;

      }
    );

  }


  /*
   * ------------------------------------------------------------
   * PUBLIC WINDOW API
   * ------------------------------------------------------------
   */

  HD.windows.create =
    createWindow;

  HD.windows.close =
    function (windowId) {

      const record =
        HD.windows.items.get(
          windowId
        );

      if (!record) {
        return false;
      }

      record.element.remove();

      HD.windows.items.delete(
        windowId
      );

      HD.emit(
        "haldo:window:close",
        {
          id:
            windowId,
          appId:
            record.appId
        }
      );

      return true;

    };


  HD.windows.focus =
    function (windowId) {

      const record =
        HD.windows.items.get(
          windowId
        );

      if (!record) {
        return false;
      }

      record.minimized =
        false;

      record.element.classList.remove(
        "is-minimized"
      );

      activateWindow(
        record.element
      );

      return true;

    };


  /*
   * ------------------------------------------------------------

  function openHalDoAI() {

    closeMenus();

    const existing =
      Array.from(
        HD.windows.items.values()
      ).find(
        function (record) {
          return (
            record.appId ===
            "ai"
          );
        }
      );

    if (existing) {

      HD.windows.focus(
        existing.id
      );

      return existing.element;

    }

    const template =
      document.getElementById(
        "haldo-ai-window-template"
      );

    if (!template) {
      return null;
    }

    const fragment =
      template.content.cloneNode(
        true
      );

    const windowElement =
      fragment.querySelector(
        ".haldo-window"
      );

    if (!windowElement) {
      return null;
    }

    const layer =
      document.getElementById(
        "haldo-window-layer"
      );

    if (!layer) {
      return null;
    }

    const windowId =
      createWindowId(
        "ai"
      );

    windowElement.id =
      windowId;

    windowElement.dataset.appId =
      "ai";

    layer.appendChild(
      fragment
    );

    HD.windows.items.set(
      windowId,
      {
        id:
          windowId,
        appId:
          "ai",
        element:
          windowElement,
        minimized:
          false,
        maximized:
          false,
        openTime:
          Date.now()
      }
    );

    activateWindow(
      windowElement
    );

    setupWindowControls(
      windowElement
    );

    setupWindowDragging(
      windowElement
    );

    setupWindowResizing(
      windowElement
    );

    setupAIWindow(
      windowElement
    );

    HD.state.ai =
      "open";

    HD.emit(
      "haldo:ai:opened",
      {
        windowId:
          windowId,
        source:
          "shell"
      }
    );

    return windowElement;

  }


  /*
   * ------------------------------------------------------------
   * AI WINDOW LOGIC
   * ------------------------------------------------------------
   */

  function setupAIWindow(
    windowElement
  ) {

    const input =
      windowElement.querySelector(
        "[data-ai-input]"
      );

    const conversation =
      windowElement.querySelector(
        "[data-ai-conversation]"
      );

    const sendButton =
      windowElement.querySelector(
        '[data-ai-action="send"]'
      );

    const voiceButton =
      windowElement.querySelector(
        '[data-ai-action="voice"]'
      );

    const stateText =
      windowElement.querySelector(
        "[data-ai-state-text]"
      );

          text:
            text ||
            state
        }
      );

      text
    ) {

      if (!conversation) {
        return;
      }

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "haldo-ai-message " +
        (
          role ===

            : "ai"

      message.textContent =
        String(

        );

      conversation.appendChild(

      HD.emit(
        "haldo:ai:message",
        {
          role:
            role,
          text:
            String(
              text ||
              ""
            )
        }
      );

      if (!input) {
        return;
      }

      const text =

      if (!text) {
        return;
      }

      addMessage(
        "user",
        text
      );

      input.value =
        "";

      setAIState(
        "thinking",
        "HalDo AI denkt …"

          setAIState(

        "input",
