<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Ultimate Professional</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        canvas { display: block; }
        
        /* Cyborg mit lebendiger Animation */
        #cyborg { position: absolute; bottom: 0; right: 5%; height: 80vh; z-index: 10; filter: drop-shadow(0 0 50px #00aaff); animation: floatCyborg 6s infinite ease-in-out; }
        @keyframes floatCyborg { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(-1deg); } }

        /* Verschiebbare Fenster (Glassmorphism) */
        .os-window { position: absolute; background: rgba(0, 15, 40, 0.7); backdrop-filter: blur(15px); border: 1px solid #00aaff; border-radius: 15px; box-shadow: 0 0 40px rgba(0,170,255,0.5); z-index: 50; cursor: grab; user-select: none; }
        .os-window:active { cursor: grabbing; }
        #header { padding: 15px; background: rgba(0, 40, 100, 0.8); border-radius: 15px 15px 0 0; cursor: move; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .btn { width: 25px; height: 25px; border-radius: 50%; border: none; cursor: pointer; color: white; font-size: 14px; }
        #close { background: red; } #min { background: orange; }
        
        #chat { bottom: 30px; left: 30px; width: 400px; height: 350px; }
        #files { top: 30px; left: 30px; width: 280px; }
        #updates { top: 30px; right: 30px; width: 300px; display: none; }
        #sun-window { bottom: 30px; right: 30px; width: 350px; display: none; }
        
        #chat-body { padding: 15px; height: 200px; overflow-y: auto; }
        input { width: 90%; margin: 10px; padding: 10px; background: rgba(0,0,0,0.8); border: 1px solid #00aaff; border-radius: 8px; color: white; }
        
        /* Statusleiste */
        #status { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; background: rgba(0,10,30,0.9); padding: 10px 20px; border-radius: 30px; border: 1px solid #00aaff; }
        .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
    </style>

    <!-- Three.js von CDN (Keine Installation nötig!) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- Dein Cyborg -->
<img id="cyborg" src="cyborg.png" onerror="this.style.display='none'">

<!-- Statusleiste -->
<div id="status">
    <div class="dot" style="background:red;" onclick="closeAll()"></div>
    <div class="dot" style="background:green;" onclick="startMic()"></div>
    <div class="dot" style="background:blue;" onclick="startSpeech()"></div>
    <div class="dot" style="background:magenta;" onclick="toggle('files')"></div>
    <div class="dot" style="background:orange;" onclick="toggle('sun-window')"></div>
    <div class="dot" style="background:yellow;" onclick="toggle('updates')"></div>
</div>

<!-- Chat Fenster -->
<div id="chat" class="os-window">
    <div id="header">💬 HalDo AI Chat <div><button class="btn" id="close" onclick="close('chat')">X</button></div></div>
    <div id="chat-body"><img src="logo.png" style="width:40px; border-radius:50%; margin-right:10px; vertical-align:middle;" onerror="this.style.display='none'"> Willkommen Bruder! Das lebendige 3D System läuft.</div>
    <input id="chat-input" placeholder="Sag was..." onkeydown="if(event.key==='Enter') sendMsg()">
</div>

<!-- Dateien Fenster -->
<div id="files" class="os-window">
    <div id="header">🗂️ Dateien & Daten <div><button class="btn" id="close" onclick="close('files')">X</button></div></div>
    <div style="padding:15px;">
        <div onclick="alert('Dokumente geöffnet')">📁 Dokumente</div><br>
        <div onclick="alert('Musik läuft')">🎵 Musik</div><br>
        <div onclick="alert('Video startet')">🎬 Videos</div><br>
        <div onclick="alert('Datenbank online')">📊 Datenbank</div>
    </div>
</div>

<!-- Updates Fenster -->
<div id="updates" class="os-window">
    <div id="header">⬆️ Software Update <div><button class="btn" id="close" onclick="close('updates')">X</button></div></div>
    <div style="padding:15px;">
        <p>Version: HalDo AI OS v6.0</p>
        <p>Status: <span style="color:green;">Lebendig & Bereit</span></p>
        <button onclick="alert('Update läuft... System neu starten!')" style="background:yellow; border:none; padding:10px; cursor:pointer;">Update Starten</button>
    </div>
</div>

<!-- Sonnen Fenster -->
<div id="sun-window" class="os-window">
    <div id="header">☀️ Sonnenkern <div><button class="btn" id="close" onclick="close('sun-window')">X</button></div></div>
    <div style="padding:15px; text-align:center;">
        <h2 style="color:orange; text-shadow: 0 0 20px orange;">ENERGIE AKTIV</h2>
        <p>Die Sonne pulsiert im 3D-Raum.</p>
        <button onclick="alert('Energie freigesetzt!')" style="background:orange; border:none; padding:10px; cursor:pointer;">Energie</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 3D SZENE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Kamera Position
    camera.position.z = 5;

    // --- STERNE & GALAXIE ---
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 2000;
    const posArray = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 100;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starsMat = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
    scene.add(new THREE.Points(starsGeo, starsMat));

    // --- DIE SONNE (Mit Bloom Effekt) ---
    const sunGeo = new THREE.SphereGeometry(1, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, emissive: 0xff5500 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // --- DIE ERDE (Wenn earth.png vorhanden, sonst einfarbig) ---
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    let earthMaterial = new THREE.MeshStandardMaterial({ color: 0x2244aa, roughness: 0.5 });
    
    // Versuche das eigene Bild zu laden
    const texLoader = new THREE.TextureLoader();
    texLoader.load('earth.png', (texture) => {
        earthMaterial = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
    });
    
    const earth = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), earthMaterial);
    earth.position.x = 2;
    earthGroup.add(earth);

    // --- LOGO (Schwebend) ---
    const logoTex = texLoader.load('logo.png');
    const logoMat = new THREE.SpriteMaterial({ map: logoTex, depthTest: false });
    const logoSprite = new THREE.Sprite(logoMat);
    logoSprite.scale.set(1, 1, 1);
    logoSprite.position.set(-2, 0, 0);
    scene.add(logoSprite);

    // --- PLANETEN (Andere Farben) ---
    const planetGroup = new THREE.Group();
    scene.add(planetGroup);
    const planets = [];
    for(let i=0; i<8; i++) {
        const geo = new THREE.SphereGeometry(0.1, 32, 32);
        const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.x = 3 + (i * 0.4);
        planets.push(mesh);
        planetGroup.add(mesh);
    }

    // --- BLUM EFFEKT (Strahlende Sonne) ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0;
    bloomPass.strength = 1.2;
    bloomPass.radius = 0.5;
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- ANIMATION ---
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);

        // Sonne dreht sich langsam
        sun.rotation.y += 0.001;
        
        // Erde dreht sich um sich selbst und bewegt sich um die Sonne
        earth.rotation.y += 0.01;
        const time = clock.getElapsedTime();
        earthGroup.position.x = Math.cos(time * 0.5) * 2;
        earthGroup.position.z = Math.sin(time * 0.5) * 2;

        // Logo schwebt
        logoSprite.position.y = Math.sin(time * 2) * 0.2;

        // Planeten kreisen
        planetGroup.rotation.y -= 0.001;

        composer.render();
    }
    animate();

    // Fenster Größe anpassen
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- UI FUNKTIONEN ---
    window.close = (id) => document.getElementById(id).style.display = 'none';
    window.closeAll = () => { document.querySelectorAll('.os-window').forEach(w => w.style.display = 'none'); };
    window.toggle = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display === 'none') ? 'block' : 'none'; };
    
    // Drag & Drop
    document.querySelectorAll('#header').forEach(h => {
        h.addEventListener('mousedown', (e) => {
            const win = h.parentElement;
            let x = e.clientX - win.getBoundingClientRect().left;
            let y = e.clientY - win.getBoundingClientRect().top;
            function move(e) { win.style.left = (e.clientX - x) + 'px'; win.style.top = (e.clientY - y) + 'px'; }
            function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
        });
    });

    // Sprache & Mikrofon
    window.startSpeech = () => { const u = new SpeechSynthesisUtterance('System ist online, Bruder!'); u.lang = 'de-DE'; speechSynthesis.speak(u); };
    window.startMic = () => { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'de-DE'; rec.start(); rec.onresult = (e) => { document.getElementById('chat-input').value = e.results[0][0].transcript; sendMsg(); }; };
    window.sendMsg = () => { const input = document.getElementById('chat-input'); const msg = input.value; if(!msg) return; document.getElementById('chat-body').innerHTML += `<br><b>Bruder:</b> ${msg}`; input.value=""; setTimeout(() => { document.getElementById('chat-body').innerHTML += `<br><b>HalDo:</b> Befehl ausgeführt!`; }, 1000); };
</script>
</body>
</html>
