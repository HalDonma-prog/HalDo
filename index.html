<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Cosmisches System</title>
    <style>
        /* 1. Der echte Weltraum-Himmel mit Sternen und Nebel */
        body { 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 50% 50%, #0a1a3a 0%, #050a15 60%, #000000 100%);
        }

        /* 2. Die funkelnden Sterne (Hintergrund-Ebene) */
        #stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, transparent),
                radial-gradient(1px 1px at 40px 70px, #ffffff, transparent),
                radial-gradient(1px 1px at 90px 40px, #ffffff, transparent),
                radial-gradient(1px 1px at 130px 80px, #ffffff, transparent),
                radial-gradient(2px 2px at 160px 50px, #ffffff, transparent),
                radial-gradient(1px 1px at 220px 120px, #ffffff, transparent),
                radial-gradient(1px 1px at 300px 20px, #ffffff, transparent),
                radial-gradient(2px 2px at 350px 100px, #ffffff, transparent),
                radial-gradient(1px 1px at 450px 30px, #ffffff, transparent),
                radial-gradient(1px 1px at 500px 90px, #ffffff, transparent),
                radial-gradient(2px 2px at 600px 60px, #ffffff, transparent),
                radial-gradient(1px 1px at 700px 150px, #ffffff, transparent);
            background-repeat: repeat;
            background-size: 800px 200px;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* 3. Die leuchtende Sonne im Zentrum (Rund und strahlend) */
        #sun { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: radial-gradient(circle, #fff 0%, #fffc00 40%, #ff9a00 80%, #ff0000 100%); 
            box-shadow: 0 0 80px #ff9a00, 0 0 200px #ff3300, 0 0 400px #ff0000, 0 0 600px rgba(255, 51, 0, 0.5); 
            animation: pulse 4s infinite; 
            z-index: 5; 
        }

        @keyframes pulse { 
            0% { transform: translate(-50%, -50%) scale(1); } 
            50% { transform: translate(-50%, -50%) scale(1.05); } 
            100% { transform: translate(-50%, -50%) scale(1); } 
        }

        /* 4. Die 12 Planeten mit echten, professionellen Farben */
        .planet { 
            position: absolute; 
            z-index: 3; 
            border-radius: 50%; 
            box-shadow: 0 0 15px rgba(255,255,255,0.4); 
        }

        #p1 { width: 20px; height: 20px; background: radial-gradient(circle at 30% 30%, #b0b0b0, #696969); } /* Merkur */
        #p2 { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #FFD700, #B8860B); } /* Venus */
        #p3 { width: 38px; height: 38px; background: radial-gradient(circle at 30% 30%, #4B90C2, #1b3f5e, #556B2F); } /* Erde */
        #p4 { width: 28px; height: 28px; background: radial-gradient(circle at 30% 30%, #E97451, #A52A2A); } /* Mars */
        #p5 { width: 80px; height: 80px; background: linear-gradient(90deg, #D8CA9D 20%, #A67B5B 40%, #D8CA9D 60%, #C49A6C 80%); } /* Jupiter */
        #p6 { width: 70px; height: 70px; background: radial-gradient(circle at 30% 30%, #EEDC82, #8B6508); box-shadow: 0 0 0 12px rgba(210,180,140,0.3); } /* Saturn */
        #p7 { width: 45px; height: 45px; background: radial-gradient(circle at 30% 30%, #00FFFF, #008B8B); } /* Uranus */
        #p8 { width: 45px; height: 45px; background: radial-gradient(circle at 30% 30%, #4169E1, #00008B); } /* Neptun */
        #p9 { width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #F5F5DC, #A9A9A9); } /* Pluto */
        #p10 { width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #8A2BE2, #4B0082); } /* Ceres */
        #p11 { width: 10px; height: 10px; background: radial-gradient(circle at 30% 30%, #FFFFFF, #D3D3D3); } /* Eris */
        #p12 { width: 15px; height: 15px; background: radial-gradient(circle at 30% 30%, #FFB6C1, #8B4513); } /* Haumea */

        /* 5. Die Zeit-Orbs (Sekunde, Minute, Stunde) */
        .time-orb { position: absolute; z-index: 4; border-radius: 50%; box-shadow: 0 0 20px currentColor; }
        #sec-orb { width: 12px; height: 12px; background: #00ff00; color: #00ff00; animation: glow-green 1s infinite; } /* Sekunde - Grün */
        #min-orb { width: 16px; height: 16px; background: #00aaff; color: #00aaff; animation: glow-blue 2s infinite; } /* Minute - Blau */
        #hr-orb { width: 20px; height: 20px; background: #ffaa00; color: #ffaa00; animation: glow-orange 3s infinite; } /* Stunde - Orange */

        /* 6. Der Cyborg */
        #cyborg { position: absolute; bottom: 20px; left: 40px; font-size: 90px; z-index: 10; filter: drop-shadow(0 0 20px #00aaff); }

        /* 7. Chat Interface */
        #chat { position: absolute; bottom: 20px; right: 20px; width: 350px; background: rgba(0, 10, 30, 0.85); border: 1px solid #00aaff; border-radius: 12px; z-index: 20; backdrop-filter: blur(5px); }
        #chat-header { padding: 10px; background: rgba(0, 30, 60, 0.9); border-radius: 12px 12px 0 0; color: #00aaff; font-weight: bold; }
        #chat-body { padding: 15px; height: 120px; font-size: 14px; }
        #chat-input { width: 90%; margin: 10px; padding: 8px; background: rgba(0,0,0,0.5); border: 1px solid #00aaff; border-radius: 5px; color: #fff; }

        /* 8. Kontrollleiste */
        #controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 30; }
        .dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1px solid #fff; }
        #btn-close { background: #ff0000; } 
        #btn-mic { background: #00ff00; }  
        #btn-spk { background: #00aaff; }  
    </style>
</head>
<body>

<!-- Sterne Hintergrund -->
<div id="stars"></div>

<!-- Die strahlende Sonne -->
<div id="sun"></div>

<!-- Die 12 Planeten -->
<div id="p1" class="planet"></div>
<div id="p2" class="planet"></div>
<div id="p3" class="planet"></div>
<div id="p4" class="planet"></div>
<div id="p5" class="planet"></div>
<div id="p6" class="planet"></div>
<div id="p7" class="planet"></div>
<div id="p8" class="planet"></div>
<div id="p9" class="planet"></div>
<div id="p10" class="planet"></div>
<div id="p11" class="planet"></div>
<div id="p12" class="planet"></div>

<!-- Die Zeit-Orbs -->
<div id="sec-orb" class="time-orb"></div>
<div id="min-orb" class="time-orb"></div>
<div id="hr-orb" class="time-orb"></div>

<!-- Cyborg -->
<div id="cyborg">🤖</div>

<!-- UI -->
<div id="controls">
    <div class="dot" id="btn-close" title="Schließen"></div>
    <div class="dot" id="btn-mic" title="Mikrofon"></div>
    <div class="dot" id="btn-spk" title="Lautsprecher"></div>
</div>

<div id="chat">
    <div id="chat-header">HalDo AI Chat</div>
    <div id="chat-body">Willkommen, Bruder! Ich habe die Sterne hinzugefügt. Das ist das volle Cosmic System.</div>
    <input id="chat-input" type="text" placeholder="Nachricht an HalDo...">
</div>

<script>
    // Buttons funktionieren
    document.getElementById('btn-close').onclick = () => document.getElementById('chat').style.display = 'none';

    document.getElementById('btn-spk').onclick = () => {
        const u = new SpeechSynthesisUtterance("Willkommen im HalDo AI OS. Das komplette System mit zwölf Planeten und Sternen ist aktiv.");
        u.lang = 'de-DE';
        speechSynthesis.speak(u);
    };

    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'de-DE';
    document.getElementById('btn-mic').onclick = () => rec.start();
    rec.onresult = (e) => {
        document.getElementById('chat-input').value = e.results[0][0].transcript;
        document.getElementById('chat-body').innerHTML += "<br>Du: " + e.results[0][0].transcript;
        document.getElementById('chat-body').innerHTML += "<br>HalDo: Verstanden. Ich schaue in meinen Plan.";
    };

    // DIE UMLAUFBAHNEN (Physikalische Bewegung, KEIN Uhrzeiger!)
    const planets = [
        { el: document.getElementById('p1'), speed: 0.8, radius: 15, offset: 0 },   
        { el: document.getElementById('p2'), speed: 0.7, radius: 20, offset: 20 },  
        { el: document.getElementById('p3'), speed: 0.6, radius: 25, offset: 40 },  
        { el: document.getElementById('p4'), speed: 0.5, radius: 30, offset: 60 },  
        { el: document.getElementById('p5'), speed: 0.4, radius: 35, offset: 80 },  
        { el: document.getElementById('p6'), speed: 0.35, radius: 40, offset: 100 }, 
        { el: document.getElementById('p7'), speed: 0.3, radius: 45, offset: 120 }, 
        { el: document.getElementById('p8'), speed: 0.25, radius: 50, offset: 140 }, 
        { el: document.getElementById('p9'), speed: 0.2, radius: 55, offset: 160 },  
        { el: document.getElementById('p10'), speed: 0.18, radius: 60, offset: 180 },
        { el: document.getElementById('p11'), speed: 0.15, radius: 65, offset: 200 },
        { el: document.getElementById('p12'), speed: 0.12, radius: 70, offset: 220 } 
    ];

    // DIE ZEIT-ORBS (Drehen sich wie echte Uhrzeiger um die Sonne)
    const secOrb = document.getElementById('sec-orb');
    const minOrb = document.getElementById('min-orb');
    const hrOrb = document.getElementById('hr-orb');

    function animate() {
        let time = Date.now() / 1000; 

        // Planeten-Bewegung (Von links nach rechts in einer Bahn)
        planets.forEach(p => {
            let t = time * p.speed + p.offset; 
            let x = 50 + p.radius * Math.cos(t * 0.05); 
            let y = 50 + p.radius * Math.sin(t * 0.05); 
            p.el.style.left = x + '%';
            p.el.style.top = y + '%';
        });

        // Uhr-Bewegung (Sekunden, Minuten, Stunden)
        let secAngle = time * (Math.PI * 2 / 60); 
        secOrb.style.left = (50 + 30 * Math.cos(secAngle)) + '%';
        secOrb.style.top = (50 + 30 * Math.sin(secAngle)) + '%';

        let minAngle = time * (Math.PI * 2 / 3600);
        minOrb.style.left = (50 + 40 * Math.cos(minAngle)) + '%';
        minOrb.style.top = (50 + 40 * Math.sin(minAngle)) + '%';

        let hrAngle = time * (Math.PI * 2 / 43200);
        hrOrb.style.left = (50 + 50 * Math.cos(hrAngle)) + '%';
        hrOrb.style.top = (50 + 50 * Math.sin(hrAngle)) + '%';

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
