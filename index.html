<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050814">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="HalDo AI OS">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HalDo AI OS">
    <meta name="description" content="HalDo AI OS – Cosmic World, Living HalDo AI, Cyborg Assistant und vollständige A–Z App-Landschaft.">

    <title>HalDo AI OS — Cosmic World</title>

    <style>
        :root {
            --hd-bg: #03050c;
            --hd-bg-deep: #010207;
            --hd-panel: rgba(7, 12, 27, 0.82);
            --hd-panel-strong: rgba(5, 9, 21, 0.95);
            --hd-panel-soft: rgba(16, 23, 48, 0.64);
            --hd-border: rgba(139, 183, 255, 0.18);
            --hd-border-strong: rgba(122, 177, 255, 0.38);
            --hd-text: #f4f7ff;
            --hd-text-soft: rgba(229, 236, 255, 0.72);
            --hd-text-muted: rgba(207, 218, 245, 0.48);
            --hd-accent: #73a7ff;
            --hd-accent-2: #b78cff;
            --hd-cyan: #63e8ff;
            --hd-pink: #ff76d9;
            --hd-green: #64f0ae;
            --hd-warning: #ffd166;
            --hd-danger: #ff667d;
            --hd-shadow:
                0 24px 80px rgba(0, 0, 0, 0.52),
                0 0 60px rgba(75, 130, 255, 0.10);
            --hd-radius: 18px;
            --hd-radius-small: 12px;
            --hd-titlebar-height: 44px;
            --hd-safe-top: env(safe-area-inset-top, 0px);
            --hd-safe-bottom: env(safe-area-inset-bottom, 0px);
            --hd-safe-left: env(safe-area-inset-left, 0px);
            --hd-safe-right: env(safe-area-inset-right, 0px);
            --hd-font:
                Inter,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--hd-bg);
            color: var(--hd-text);
            font-family: var(--hd-font);
        }

        body {
            position: relative;
            isolation: isolate;
            user-select: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        input,
        textarea {
            user-select: text;
        }

        #haldo-os {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 44%,
                    rgba(67, 102, 193, 0.13),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 18% 18%,
                    rgba(111, 77, 198, 0.08),
                    transparent 24%
                ),
                radial-gradient(
                    circle at 82% 76%,
                    rgba(34, 151, 191, 0.07),
                    transparent 26%
                ),
                var(--hd-bg-deep);
        }

        /* =========================================================
           COSMIC BACKGROUND
           ========================================================= */

        .cosmic-background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(
                    ellipse at 50% 50%,
                    rgba(11, 21, 54, 0.30),
                    transparent 55%
                ),
                linear-gradient(
                    180deg,
                    #01030a 0%,
                    #030714 48%,
                    #02030a 100%
                );
        }

        .cosmic-nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(42px);
            opacity: 0.28;
            transform: translate3d(0, 0, 0);
            animation: nebulaFloat 24s ease-in-out infinite alternate;
        }

        .cosmic-nebula.one {
            width: 44vw;
            height: 34vw;
            min-width: 360px;
            min-height: 280px;
            left: -8vw;
            top: 5vh;
            background:
                radial-gradient(
                    circle,
                    rgba(91, 79, 208, 0.44),
                    rgba(34, 48, 119, 0.10) 48%,
                    transparent 72%
                );
        }

        .cosmic-nebula.two {
            width: 42vw;
            height: 38vw;
            right: -10vw;
            bottom: -4vh;
            background:
                radial-gradient(
                    circle,
                    rgba(28, 135, 184, 0.34),
                    rgba(42, 70, 143, 0.08) 48%,
                    transparent 74%
                );
            animation-delay: -8s;
        }

        .cosmic-nebula.three {
            width: 32vw;
            height: 32vw;
            left: 34vw;
            top: -14vh;
            background:
                radial-gradient(
                    circle,
                    rgba(184, 87, 195, 0.22),
                    rgba(77, 56, 150, 0.06) 46%,
                    transparent 75%
                );
            animation-delay: -13s;
        }

        @keyframes nebulaFloat {
            0% {
                transform: translate3d(-2%, -1%, 0) scale(1);
            }

            100% {
                transform: translate3d(2%, 2%, 0) scale(1.08);
            }
        }

        .star-field {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: var(--size, 2px);
            height: var(--size, 2px);
            border-radius: 50%;
            background: #ffffff;
            opacity: var(--opacity, 0.75);
            box-shadow:
                0 0 calc(var(--glow, 5px))
                rgba(255, 255, 255, 0.72);
            animation:
                starTwinkle
                var(--duration, 3s)
                ease-in-out
                infinite alternate;
        }

        @keyframes starTwinkle {
            from {
                opacity: calc(var(--opacity, 0.75) * 0.45);
                transform: scale(0.72);
            }

            to {
                opacity: var(--opacity, 0.75);
                transform: scale(1.24);
            }
        }

        /* =========================================================
           COSMIC WORLD
           ========================================================= */

        #cosmic-world {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            perspective: 1400px;
            pointer-events: auto;
        }

        .cosmic-world-inner {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(92vmin, 1120px);
            height: min(92vmin, 1120px);
            transform:
                translate(-50%, -50%)
                rotateX(8deg);
            transform-style: preserve-3d;
            transition:
                transform 0.8s ease,
                filter 0.8s ease;
        }

        .cosmic-world-inner.cosmic-zoomed {
            transform:
                translate(-50%, -50%)
                rotateX(4deg)
                scale(1.08);
        }

        /* =========================================================
           ORBITS
           ========================================================= */

        .orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--orbit-size);
            height: var(--orbit-size);
            margin-left: calc(var(--orbit-size) / -2);
            margin-top: calc(var(--orbit-size) / -2);
            border:
                1px solid
                rgba(147, 188, 255, var(--orbit-opacity, 0.15));
            border-radius: 50%;
            transform-style: preserve-3d;
            pointer-events: none;
            box-shadow:
                0 0 22px
                rgba(105, 153, 255, 0.035);
        }

        .orbit.orbit-dashed {
            border-style: dashed;
        }

        .orbit.orbit-glow {
            box-shadow:
                0 0 28px
                rgba(105, 170, 255, 0.09);
        }

        .orbit-plane {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        /* =========================================================
           HALDO SUN
           ========================================================= */

        .haldo-sun-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 230px;
            height: 230px;
            margin-left: -115px;
            margin-top: -115px;
            transform-style: preserve-3d;
            z-index: 80;
        }

        .haldo-sun {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 142px;
            height: 142px;
            margin-left: -71px;
            margin-top: -71px;
            border-radius: 50%;
            cursor: pointer;
            transform-style: preserve-3d;
            background:
                radial-gradient(
                    circle at 38% 34%,
                    rgba(255, 255, 255, 0.98) 0 4%,
                    rgba(255, 247, 198, 0.98) 10%,
                    rgba(255, 211, 83, 0.96) 32%,
                    rgba(255, 139, 35, 0.94) 61%,
                    rgba(214, 67, 24, 0.92) 84%,
                    rgba(121, 30, 17, 0.98) 100%
                );
            box-shadow:
                0 0 12px rgba(255, 229, 120, 0.95),
                0 0 34px rgba(255, 184, 58, 0.82),
                0 0 72px rgba(255, 137, 42, 0.62),
                0 0 140px rgba(255, 104, 28, 0.35);
            animation:
                sunPulse
                4.8s
                ease-in-out
                infinite;
        }

        .haldo-sun::before {
            content: "";
            position: absolute;
            inset: -24px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(255, 226, 115, 0.22),
                    rgba(255, 163, 42, 0.10) 42%,
                    transparent 70%
                );
            filter: blur(8px);
            animation:
                sunCorona
                5.5s
                ease-in-out
                infinite alternate;
            pointer-events: none;
        }

        .haldo-sun::after {
            content: "";
            position: absolute;
            inset: -46px;
            border-radius: 50%;
            border:
                1px solid
                rgba(255, 224, 116, 0.10);
            box-shadow:
                0 0 34px rgba(255, 198, 79, 0.10);
            animation:
                sunHalo
                9s
                linear
                infinite;
            pointer-events: none;
        }

        @keyframes sunPulse {
            0%,
            100% {
                transform: scale(0.98);
            }

            50% {
                transform: scale(1.045);
            }
        }

        @keyframes sunCorona {
            from {
                transform: scale(0.94);
                opacity: 0.62;
            }

            to {
                transform: scale(1.10);
                opacity: 1;
            }
        }

        @keyframes sunHalo {
            from {
                transform: rotate(0deg) scale(0.98);
                opacity: 0.48;
            }

            50% {
                opacity: 0.90;
            }

            to {
                transform: rotate(360deg) scale(1.04);
                opacity: 0.48;
            }
        }

        .sun-surface {
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0.70;
            mix-blend-mode: screen;
        }

        .sun-spot {
            position: absolute;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(126, 39, 17, 0.78),
                    rgba(180, 62, 19, 0.35) 62%,
                    transparent 76%
                );
            filter: blur(1px);
        }

        .sun-spot.a {
            width: 27px;
            height: 19px;
            left: 20%;
            top: 33%;
            transform: rotate(-22deg);
        }

        .sun-spot.b {
            width: 20px;
            height: 14px;
            right: 21%;
            top: 24%;
            transform: rotate(18deg);
        }

        .sun-spot.c {
            width: 31px;
            height: 16px;
            right: 17%;
            bottom: 29%;
            transform: rotate(-28deg);
        }

        /* =========================================================
           HALDO CORE LOGO
           ========================================================= */

        .haldo-core-portal {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 64px;
            height: 64px;
            margin-left: -32px;
            margin-top: -32px;
            border-radius: 50%;
            z-index: 3;
            overflow: hidden;
            border:
                1px solid
                rgba(255, 255, 255, 0.44);
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.96),
                    rgba(255, 220, 111, 0.66) 24%,
                    rgba(255, 165, 48, 0.34) 48%,
                    rgba(0, 0, 0, 0) 72%
                );
            box-shadow:
                0 0 18px rgba(255, 242, 173, 0.88),
                0 0 38px rgba(255, 178, 50, 0.62);
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .haldo-core-portal img {
            width: 76%;
            height: 76%;
            object-fit: contain;
            object-position: center;
            filter:
                brightness(1.32)
                contrast(1.06)
                drop-shadow(0 0 8px rgba(255, 255, 255, 0.88));
            opacity: 0.96;
        }

        .haldo-sun-label {
            position: absolute;
            left: 50%;
            top: calc(50% + 94px);
            transform: translateX(-50%);
            width: 330px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .haldo-sun-label-main {
            font-size: clamp(17px, 2.1vmin, 27px);
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #fffdf3;
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.92),
                0 0 22px rgba(255, 209, 84, 0.78),
                0 0 42px rgba(255, 128, 30, 0.42);
        }

        .haldo-sun-label-sub {
            margin-top: 5px;
            font-size: clamp(11px, 1.35vmin, 15px);
            font-weight: 600;
            letter-spacing: 0.22em;
            color: rgba(255, 238, 193, 0.92);
            text-shadow:
                0 0 10px rgba(255, 190, 70, 0.68);
        }

        /* =========================================================
           SPECIAL TIME RINGS
           ========================================================= */

        .time-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            transform-style: preserve-3d;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .time-ring.seconds {
            width: 280px;
            height: 280px;
            margin-left: -140px;
            margin-top: -140px;
            border-color: rgba(99, 232, 255, 0.22);
        }

        .time-ring.minutes {
            width: 330px;
            height: 330px;
            margin-left: -165px;
            margin-top: -165px;
            border-color: rgba(183, 140, 255, 0.18);
        }

        .time-ring.hours {
            width: 390px;
            height: 390px;
            margin-left: -195px;
            margin-top: -195px;
            border-color: rgba(255, 118, 217, 0.15);
        }

        .time-marker {
            position: absolute;
            left: 50%;
            top: -4px;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            border-radius: 50%;
            transform-origin:
                50%
                calc(
                    var(--ring-radius) + 4px
                );
            box-shadow:
                0 0 12px currentColor;
        }

        .time-ring.seconds .time-marker {
            color: var(--hd-cyan);
            background: var(--hd-cyan);
            --ring-radius: 140px;
        }

        .time-ring.minutes .time-marker {
            color: var(--hd-accent-2);
            background: var(--hd-accent-2);
            --ring-radius: 165px;
        }

        .time-ring.hours .time-marker {
            color: var(--hd-pink);
            background: var(--hd-pink);
            --ring-radius: 195px;
        }

        /* =========================================================
           PLANET SYSTEM
           ========================================================= */

        .planet-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--orbit-size);
            height: var(--orbit-size);
            margin-left: calc(var(--orbit-size) / -2);
            margin-top: calc(var(--orbit-size) / -2);
            border-radius: 50%;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .planet-track {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform-style: preserve-3d;
            animation:
                orbitTravel
                var(--orbit-duration)
                linear
                infinite;
            animation-direction: var(--orbit-direction, normal);
        }

        @keyframes orbitTravel {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .planet {
            position: absolute;
            left: 50%;
            top: 0;
            width: var(--planet-size);
            height: var(--planet-size);
            margin-left: calc(var(--planet-size) / -2);
            margin-top: calc(var(--planet-size) / -2);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            transform-style: preserve-3d;
            background: var(--planet-background);
            box-shadow:
                inset
                calc(var(--planet-size) * -0.20)
                calc(var(--planet-size) * 0.10)
                calc(var(--planet-size) * 0.26)
                rgba(0, 0, 0, 0.56),
                inset
                calc(var(--planet-size) * 0.12)
                calc(var(--planet-size) * -0.10)
                calc(var(--planet-size) * 0.16)
                rgba(255, 255, 255, 0.12),
                0 0 12px var(--planet-glow);
            animation:
                planetSpin
                var(--rotation-duration)
                linear
                infinite;
        }

        @keyframes planetSpin {
            from {
                transform: rotateY(0deg) rotateX(var(--tilt, 0deg));
            }

            to {
                transform: rotateY(360deg) rotateX(var(--tilt, 0deg));
            }
        }

        .planet::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 30% 24%,
                    rgba(255, 255, 255, 0.34),
                    transparent 24%
                ),
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 46%,
                    rgba(0, 0, 0, 0.16)
                );
            pointer-events: none;
        }

        .planet::after {
            content: "";
            position: absolute;
            inset: 8%;
            border-radius: 50%;
            opacity: 0.36;
            background:
                repeating-linear-gradient(
                    8deg,
                    transparent 0 7px,
                    rgba(255, 255, 255, 0.07) 8px 10px
                );
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .planet.mercury {
            --planet-size: 25px;
            --planet-background:
                radial-gradient(
                    circle at 34% 28%,
                    #d8d5c9,
                    #8c8b85 48%,
                    #454744 100%
                );
            --planet-glow: rgba(202, 205, 198, 0.42);
            --orbit-size: 230px;
            --orbit-duration: 12s;
            --rotation-duration: 7s;
            --tilt: 4deg;
        }

        .planet.venus {
            --planet-size: 34px;
            --planet-background:
                radial-gradient(
                    circle at 34% 28%,
                    #fff0b0,
                    #d69b43 48%,
                    #79502a 100%
                );
            --planet-glow: rgba(255, 211, 115, 0.54);
            --orbit-size: 290px;
            --orbit-duration: 18s;
            --rotation-duration: 11s;
            --tilt: -3deg;
        }

        .planet.earth {
            --planet-size: 39px;
            --planet-background:
                radial-gradient(
                    circle at 36% 30%,
                    #a9efff 0 9%,
                    #2d9de0 24%,
                    #1d5ea9 48%,
                    #12345f 100%
                );
            --planet-glow: rgba(71, 196, 255, 0.80);
            --orbit-size: 350px;
            --orbit-duration: 24s;
            --rotation-duration: 8s;
            --tilt: 23.4deg;
        }

        .planet.mars {
            --planet-size: 31px;
            --planet-background:
                radial-gradient(
                    circle at 32% 28%,
                    #ffb17c,
                    #bf5538 44%,
                    #67291f 100%
                );
            --planet-glow: rgba(255, 102, 67, 0.52);
            --orbit-size: 410px;
            --orbit-duration: 31s;
            --rotation-duration: 9.2s;
            --tilt: 25deg;
        }

        .planet.jupiter {
            --planet-size: 65px;
            --planet-background:
                linear-gradient(
                    8deg,
                    #6d4834 0 9%,
                    #c89c78 10% 18%,
                    #f1d1aa 19% 27%,
                    #a56e4d 28% 36%,
                    #efd6b6 37% 46%,
                    #b7835f 47% 54%,
                    #d8ad89 55% 64%,
                    #7f5039 65% 72%,
                    #d5a981 73% 84%,
                    #68402e 85% 100%
                );
            --planet-glow: rgba(238, 186, 139, 0.46);
            --orbit-size: 490px;
            --orbit-duration: 42s;
            --rotation-duration: 5.4s;
            --tilt: 3deg;
        }

        .planet.saturn {
            --planet-size: 55px;
            --planet-background:
                radial-gradient(
                    circle at 32% 28%,
                    #fff0bb,
                    #d5b77b 45%,
                    #846b43 100%
                );
            --planet-glow: rgba(255, 222, 143, 0.48);
            --orbit-size: 590px;
            --orbit-duration: 53s;
            --rotation-duration: 6.2s;
            --tilt: 26.7deg;
        }

        .planet.uranus {
            --planet-size: 43px;
            --planet-background:
                radial-gradient(
                    circle at 34% 26%,
                    #d8ffff,
                    #70d1dc 48%,
                    #367f8c 100%
                );
            --planet-glow: rgba(110, 235, 245, 0.52);
            --orbit-size: 680px;
            --orbit-duration: 67s;
            --rotation-duration: 8.8s;
            --tilt: 98deg;
        }

        .planet.neptune {
            --planet-size: 42px;
            --planet-background:
                radial-gradient(
                    circle at 34% 26%,
                    #7bbcff,
                    #315db9 48%,
                    #13295d 100%
                );
            --planet-glow: rgba(75, 139, 255, 0.62);
            --orbit-size: 770px;
            --orbit-duration: 79s;
            --rotation-duration: 8.1s;
            --tilt: 28deg;
        }

        .planet.pluto {
            --planet-size: 20px;
            --planet-background:
                radial-gradient(
                    circle at 32% 27%,
                    #f1d7c0,
                    #b58c76 48%,
                    #59443b 100%
                );
            --planet-glow: rgba(220, 190, 165, 0.32);
            --orbit-size: 835px;
            --orbit-duration: 94s;
            --rotation-duration: 14s;
            --tilt: 17deg;
        }

        .planet.ceres {
            --planet-size: 19px;
            --planet-background:
                radial-gradient(
                    circle at 32% 28%,
                    #c9c9c4,
                    #73746e 50%,
                    #383a38 100%
                );
            --planet-glow: rgba(201, 204, 194, 0.28);
            --orbit-size: 900px;
            --orbit-duration: 108s;
            --rotation-duration: 10s;
            --tilt: 4deg;
        }

        .planet.eris {
            --planet-size: 17px;
            --planet-background:
                radial-gradient(
                    circle at 32% 28%,
                    #e8e9ef,
                    #a4a8b4 46%,
                    #565b68 100%
                );
            --planet-glow: rgba(220, 225, 255, 0.34);
            --orbit-size: 965px;
            --orbit-duration: 121s;
            --rotation-duration: 12s;
            --tilt: 44deg;
        }

        .planet.haumea {
            --planet-size: 24px;
            --planet-background:
                linear-gradient(
                    115deg,
                    #f5f5f1,
                    #bcbcb4 46%,
                    #777871 100%
                );
            --planet-glow: rgba(234, 236, 227, 0.32);
            --orbit-size: 1020px;
            --orbit-duration: 136s;
            --rotation-duration: 3.9s;
            --tilt: 28deg;
        }

        /* =========================================================
           SATURN RINGS
           ========================================================= */

        .planet-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 180%;
            height: 56%;
            margin-left: -90%;
            margin-top: -28%;
            border-radius: 50%;
            border:
                3px solid
                rgba(226, 198, 139, 0.62);
            transform:
                rotateX(70deg)
                rotateZ(12deg);
            box-shadow:
                0 0 8px rgba(238, 211, 156, 0.30),
                inset 0 0 8px rgba(255, 231, 180, 0.12);
            pointer-events: none;
        }

        .planet-ring.inner {
            width: 138%;
            height: 42%;
            margin-left: -69%;
            margin-top: -21%;
            border-width: 1px;
            opacity: 0.62;
        }

        /* =========================================================
           EARTH + MOON
           ========================================================= */

        .earth-moon-system {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1px;
            height: 1px;
            transform-style: preserve-3d;
        }

        .moon-orbit {
            position: absolute;
            width: 86px;
            height: 86px;
            left: 50%;
            top: 50%;
            margin-left: -43px;
            margin-top: -43px;
            border:
                1px solid
                rgba(211, 223, 255, 0.16);
            border-radius: 50%;
            animation:
                moonOrbit
                7.8s
                linear
                infinite;
        }

        @keyframes moonOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .moon {
            position: absolute;
            left: 50%;
            top: -6px;
            width: 13px;
            height: 13px;
            margin-left: -6.5px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 34% 27%,
                    #ffffff,
                    #c9cbd0 52%,
                    #777b82 100%
                );
            box-shadow:
                0 0 10px rgba(220, 227, 239, 0.52);
        }

        /* =========================================================
           PLANET LABEL
           ========================================================= */

        .planet-label {
            position: absolute;
            left: 50%;
            top: calc(100% + 9px);
            transform: translateX(-50%);
            padding: 3px 7px;
            border-radius: 999px;
            white-space: nowrap;
            font-size: 9px;
            line-height: 1;
            letter-spacing: 0.04em;
            color: rgba(241, 246, 255, 0.78);
            background: rgba(3, 7, 18, 0.62);
            border:
                1px solid
                rgba(145, 180, 245, 0.14);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        /* =========================================================
           COSMIC ROTATING HALDO TEXT
           ========================================================= */

        .haldo-orbital-brand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 560px;
            height: 560px;
            margin-left: -280px;
            margin-top: -280px;
            border-radius: 50%;
            transform-style: preserve-3d;
            animation:
                brandOrbit
                38s
                linear
                infinite;
            pointer-events: none;
            z-index: 40;
        }

        @keyframes brandOrbit {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .haldo-orbital-brand-text {
            position: absolute;
            left: 50%;
            top: -12px;
            transform:
                translateX(-50%)
                rotateX(18deg);
            white-space: nowrap;
            font-size: clamp(16px, 2.15vmin, 27px);
            font-weight: 900;
            letter-spacing: 0.22em;
            color: rgba(255, 255, 255, 0.94);
            text-shadow:
                0 0 7px rgba(255, 255, 255, 0.92),
                0 0 18px rgba(104, 179, 255, 0.80),
                0 0 38px rgba(173, 112, 255, 0.62),
                0 0 60px rgba(255, 116, 211, 0.28);
        }

        .haldo-orbital-brand-sub {
            position: absolute;
            left: 50%;
            top: 22px;
            transform:
                translateX(-50%)
                rotateX(18deg);
            white-space: nowrap;
            font-size: clamp(9px, 1.05vmin, 13px);
            font-weight: 700;
            letter-spacing: 0.30em;
            color: rgba(232, 240, 255, 0.72);
            text-shadow:
                0 0 12px rgba(104, 177, 255, 0.55);
        }

        /* =========================================================
           COSMIC HUD
           ========================================================= */

        .cosmic-hud {
            position: absolute;
            left: 20px;
            top: calc(20px + var(--hd-safe-top));
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .cosmic-status {
            min-width: 188px;
            padding: 9px 12px;
            border:
                1px solid
                rgba(132, 171, 245, 0.14);
            border-radius: 12px;
            background:
                rgba(4, 8, 19, 0.54);
            backdrop-filter: blur(12px);
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.22);
        }

        .cosmic-status-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(221, 232, 255, 0.52);
        }

        .cosmic-status-value {
            margin-top: 3px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(246, 249, 255, 0.92);
        }

        /* =========================================================
           MAIN TOP BAR
           ========================================================= */

        .haldo-topbar {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: calc(68px + var(--hd-safe-top));
            padding:
                calc(10px + var(--hd-safe-top))
                calc(16px + var(--hd-safe-right))
                10px
                calc(16px + var(--hd-safe-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 500;
            pointer-events: none;
        }

        .haldo-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .haldo-brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            object-fit: contain;
            padding: 5px;
            background:
                rgba(7, 12, 27, 0.62);
            border:
                1px solid
                rgba(148, 186, 255, 0.18);
            box-shadow:
                0 0 26px rgba(87, 146, 255, 0.14);
        }

        .haldo-brand-copy {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .haldo-brand-name {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .haldo-brand-version {
            font-size: 10px;
            font-weight: 600;
            color: var(--hd-text-muted);
            letter-spacing: 0.08em;
        }

        .haldo-top-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            pointer-events: auto;
        }

        .top-action {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: rgba(238, 245, 255, 0.86);
            background:
                rgba(7, 12, 27, 0.62);
            border:
                1px solid
                rgba(140, 178, 245, 0.16);
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;
            backdrop-filter: blur(10px);
        }

        .top-action:hover {
            transform: translateY(-1px);
            background:
                rgba(22, 32, 64, 0.78);
            border-color:
                rgba(128, 180, 255, 0.38);
        }

        .top-action:active {
            transform: scale(0.95);
        }

        .top-action.active {
            border-color:
                rgba(99, 232, 255, 0.52);
            box-shadow:
                0 0 18px rgba(99, 232, 255, 0.14);
        }

        /* =========================================================
           UNIVERSAL OVERLAY LAYER
           ========================================================= */

        #haldo-overlay-layer {
            position: absolute;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
        }

        /* =========================================================
           APP / WINDOW ROOT
           ========================================================= */

        #haldo-window-layer {
            position: absolute;
            inset: 0;
            z-index: 1200;
            pointer-events: none;
            overflow: hidden;
        }

        .haldo-window {
            position: absolute;
            min-width: 300px;
            min-height: 220px;
            width: min(720px, 78vw);
            height: min(560px, 72vh);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            border:
                1px solid
                var(--hd-border-strong);
            border-radius: var(--hd-radius);
            background:
                var(--hd-panel-strong);
            box-shadow:
                var(--hd-shadow);
            backdrop-filter:
                blur(22px)
                saturate(125%);
            -webkit-backdrop-filter:
                blur(22px)
                saturate(125%);
            resize: both;
        }

        .haldo-window.hidden {
            display: none;
        }

        .haldo-window.maximized {
            left: 12px !important;
            top: calc(78px + var(--hd-safe-top)) !important;
            width: calc(
                100% - 24px
            ) !important;
            height: calc(
                100% - 92px - var(--hd-safe-top) - var(--hd-safe-bottom)
            ) !important;
            transform: none !important;
            resize: none;
            border-radius: 16px;
        }

        .haldo-window.minimized {
            width: 300px !important;
            height: 44px !important;
            min-height: 44px;
            resize: none;
            overflow: hidden;
        }

        .haldo-window.dragging {
            transition: none;
            cursor: grabbing;
        }

        .haldo-window-header {
            flex: 0 0 var(--hd-titlebar-height);
            height: var(--hd-titlebar-height);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px 0 13px;
            background:
                linear-gradient(
                    180deg,
                    rgba(30, 43, 78, 0.70),
                    rgba(10, 16, 33, 0.72)
                );
            border-bottom:
                1px solid
                rgba(142, 181, 247, 0.12);
            cursor: grab;
        }

        .haldo-window-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: rgba(245, 249, 255, 0.90);
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .window-control {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: rgba(233, 241, 255, 0.72);
            background: transparent;
            cursor: pointer;
            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .window-control:hover {
            background:
                rgba(117, 151, 218, 0.14);
            color: #ffffff;
        }

        .window-control.close:hover {
            background:
                rgba(255, 76, 102, 0.20);
            color: #ff9dac;
        }

        .haldo-window-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
            position: relative;
        }

        /* =========================================================
           APP CONTENT BASE
           ========================================================= */

        .app-page {
            width: 100%;
            min-height: 100%;
            padding: 18px;
            color: var(--hd-text);
        }

        .app-page h1,
        .app-page h2,
        .app-page h3 {
            margin-top: 0;
        }

        .app-card {
            padding: 15px;
            border:
                1px solid
                rgba(135, 174, 242, 0.14);
            border-radius: 14px;
            background:
                rgba(17, 26, 51, 0.54);
        }

        .app-button {
            min-height: 40px;
            padding: 8px 13px;
            border-radius: 10px;
            color: #f6f9ff;
            background:
                linear-gradient(
                    180deg,
                    rgba(91, 135, 219, 0.34),
                    rgba(42, 67, 124, 0.34)
                );
            border:
                1px solid
                rgba(125, 170, 245, 0.22);
            cursor: pointer;
            transition:
                transform 0.16s ease,
                background 0.16s ease;
        }

        .app-button:hover {
            background:
                linear-gradient(
                    180deg,
                    rgba(109, 158, 255, 0.44),
                    rgba(49, 81, 149, 0.44)
                );
        }

        .app-button:active {
            transform: scale(0.97);
        }

        .app-button.danger {
            background:
                rgba(185, 50, 72, 0.24);
            border-color:
                rgba(255, 102, 125, 0.28);
        }

        .app-input,
        .app-textarea,
        .app-select {
            width: 100%;
            border:
                1px solid
                rgba(135, 174, 242, 0.18);
            border-radius: 10px;
            padding: 10px 12px;
            color: #f5f8ff;
            outline: none;
            background:
                rgba(2, 7, 18, 0.72);
        }

        .app-input:focus,
        .app-textarea:focus,
        .app-select:focus {
            border-color:
                rgba(104, 177, 255, 0.55);
            box-shadow:
                0 0 0 3px
                rgba(89, 155, 255, 0.10);
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 900px) {
            .cosmic-world-inner {
                width: 112vmin;
                height: 112vmin;
            }

            .haldo-window {
                width: calc(100vw - 26px);
                height: calc(100vh - 116px);
                min-width: 260px;
                min-height: 200px;
            }

            .haldo-window.maximized {
                left: 7px !important;
                top: calc(74px + var(--hd-safe-top)) !important;
                width: calc(100% - 14px) !important;
                height: calc(
                    100% - 84px - var(--hd-safe-top) - var(--hd-safe-bottom)
                ) !important;
            }

            .cosmic-hud {
                left: 10px;
                top: calc(74px + var(--hd-safe-top));
            }

            .cosmic-status {
                min-width: 150px;
            }
        }

        @media (max-width: 620px) {
            .haldo-topbar {
                height: calc(60px + var(--hd-safe-top));
                padding-left:
                    calc(9px + var(--hd-safe-left));
                padding-right:
                    calc(9px + var(--hd-safe-right));
            }

            .haldo-brand-copy {
                display: none;
            }

            .haldo-brand-logo {
                width: 38px;
                height: 38px;
            }

            .top-action {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }

            .cosmic-hud {
                display: none;
            }

            .haldo-sun {
                width: 118px;
                height: 118px;
                margin-left: -59px;
                margin-top: -59px;
            }

            .haldo-sun-system {
                width: 190px;
                height: 190px;
                margin-left: -95px;
                margin-top: -95px;
            }

            .haldo-sun-label {
                top: calc(50% + 82px);
                width: 280px;
            }

            .haldo-orbital-brand {
                width: 430px;
                height: 430px;
                margin-left: -215px;
                margin-top: -215px;
            }

            .time-ring.seconds {
                width: 230px;
                height: 230px;
                margin-left: -115px;
                margin-top: -115px;
            }

            .time-ring.minutes {
                width: 270px;
                height: 270px;
                margin-left: -135px;
                margin-top: -135px;
            }

            .time-ring.hours {
                width: 315px;
                height: 315px;
                margin-left: -157.5px;
                margin-top: -157.5px;
            }

            .planet-label {
                display: none;
            }

            .haldo-window {
                left: 7px;
                top: calc(68px + var(--hd-safe-top));
                width: calc(100vw - 14px);
                height: calc(
                    100vh - 82px - var(--hd-safe-top) - var(--hd-safe-bottom)
                );
                transform: none;
                border-radius: 14px;
            }

            .haldo-window.maximized {
                left: 4px !important;
                top: calc(64px + var(--hd-safe-top)) !important;
                width: calc(100% - 8px) !important;
                height: calc(
                    100% - 72px - var(--hd-safe-top) - var(--hd-safe-bottom)
                ) !important;
            }

            .haldo-window-header {
                height: 42px;
                flex-basis: 42px;
            }

            .window-control {
                width: 28px;
                height: 28px;
            }

            .app-page {
                padding: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="haldo-os">

                        "

    <script>
        (function () {

            /*
             * HalDo AI OS — Central Shell

             * - global namespace
             * - configuration
             * - event bus
             * - shared state
             * - safe storage
             * - DOM references
             * - utility functions
             *
             * Later parts connect:
             * Cosmic Runtime
             * Living HalDo AI
             * Voice
             * AI Chat
             * Window Manager
             * Menus
             * A–Z Apps
             * System integrations
             */

            const root =
                document.getElementById("haldo-os");

            if (!root) {
                console.error(
                    "[HalDo AI OS] Root element missing."
                );
                return;
            }

            /*
             * -----------------------------------------------------

             * -----------------------------------------------------
             */

            const existingHalDo =
                window.HalDo &&
                typeof window.HalDo === "object"
                    ? window.HalDo

            const HD = existingHalDo;

            HD.codename = "Cosmic World";
            HD.platform = "Web / PWA";
            HD.shell = "index.html";

            window.HalDo = HD;

            if (
                !window.HalDoOS ||
                typeof window.HalDoOS !== "object"
            ) {
                window.HalDoOS = {};
            }

            window.HalDoOS.shell = HD;

            /*
             * -----------------------------------------------------
             * CONFIGURATION
             * -----------------------------------------------------
             */

            HD.config = HD.config || {};

            HD.config.display = {
                cosmicWorld: true,
                responsive: true,
                animations: true,
                reducedMotion:
                    window.matchMedia &&
                    window.matchMedia(
                        "(prefers-reduced-motion: reduce)"
                    ).matches
            };

            HD.config.ai = {
                provider: "local",
                model: "",
                language: "de",
                voiceEnabled: true,
                microphoneEnabled: true,
                memoryEnabled: true,
                contextEnabled: true,
                privacyMode: false,
                apiKeyConfigured: false
            };

            HD.config.security = {
                automationAllowed: false,
                microphoneAllowed: false,
                speechOutputAllowed: true,
                fileAccessAllowed: false,
                screenAwarenessAllowed: false
            };

            HD.config.storage = {
                namespace: "haldo-ai-os",
                version: 1
            };

            /*
             * -----------------------------------------------------
             * EVENT BUS
             * -----------------------------------------------------
             */

            const eventListeners = new Map();

            HD.events = HD.events || {};

            HD.events.on = function (eventName, handler) {
                if (
                    typeof eventName !== "string" ||
                    typeof handler !== "function"
                ) {
                    return function () {};
                }

                if (!eventListeners.has(eventName)) {
                    eventListeners.set(
                        eventName,
                        new Set()
                    );
                }

                eventListeners
                    .get(eventName)
                    .add(handler);

                return function unsubscribe() {
                    HD.events.off(
                        eventName,
                        handler
                    );
                };
            };

            HD.events.off = function (
                eventName,
                handler
            ) {
                const set =
                    eventListeners.get(eventName);

                if (!set) {
                    return;
                }

                set.delete(handler);

                if (set.size === 0) {
                    eventListeners.delete(eventName);
                }
            };

            HD.events.emit = function (
                eventName,
                detail
            ) {
                const set =
                    eventListeners.get(eventName);

                if (!set) {
                    return;
                }

                for (const handler of Array.from(set)) {
                    try {
                        handler(detail);
                    } catch (error) {
                        console.error(
                            "[HalDo Event]",
                            eventName,
                            error
                        );
                    }
                }
            };

            /*
             * -----------------------------------------------------
             * STATE
             * -----------------------------------------------------
             */

            HD.state = HD.state || {};

            HD.state.system = {
                ready: false,
                online:
                    navigator.onLine !== false,
                booted: false,
                bootStage: "shell"
            };

            HD.state.ai = {
                open: false,
                state: "idle",
                listening: false,
                speaking: false,
                thinking: false,
                currentText: "",
                currentWindowId: null
            };

            HD.state.windows = {
                zIndex: 1200,
                activeWindowId: null,
                windows: new Map()
            };

            HD.state.menus = {
                appsOpen: false,
                systemOpen: false
            };

            HD.state.time = {
                now: new Date(),
                second: 0,
                minute: 0,
                hour: 0
            };

            /*
             * -----------------------------------------------------
             * SAFE STORAGE
             * -----------------------------------------------------
             */

            HD.storage = HD.storage || {};

            HD.storage.prefix =
                "haldo-ai-os:";

            HD.storage.key = function (key) {
                return (
                    HD.storage.prefix +
                    String(key)
                );
            };

            HD.storage.get = function (
                key,
                fallback
            ) {
                try {
                    const raw =
                        localStorage.getItem(
                            HD.storage.key(key)
                        );

                    if (raw === null) {
                        return fallback;
                    }

                    return JSON.parse(raw);
                } catch (error) {
                    console.warn(
                        "[HalDo Storage] Read failed:",
                        key,
                        error
                    );

                    return fallback;
                }
            };

            HD.storage.set = function (
                key,
                value
            ) {
                try {
                    localStorage.setItem(
                        HD.storage.key(key),
                        JSON.stringify(value)
                    );

                    return true;
                } catch (error) {
                    console.warn(
                        "[HalDo Storage] Write failed:",
                        key,
                        error
                    );

                    return false;
                }
            };

            HD.storage.remove = function (key) {
                try {
                    localStorage.removeItem(
                        HD.storage.key(key)
                    );

                    return true;
                } catch (error) {
                    return false;
                }
            };

            /*
             * -----------------------------------------------------
             * DOM REFERENCES
             * -----------------------------------------------------
             */

            HD.dom = {
                root,
                cosmicWorld:
                    document.getElementById(
                        "cosmic-world"
                    ),
                cosmicWorldInner:
                    document.getElementById(
                        "cosmic-world-inner"
                    ),
                sun:
                    document.getElementById(
                        "haldo-sun"
                    ),
                aiState:
                    document.getElementById(
                        "haldo-ai-state"
                    ),
                timeDisplay:
                    document.getElementById(
                        "cosmic-time-display"
                    ),
                windowLayer:
                    document.getElementById(

                    ),
                overlayLayer:
                    document.getElementById(

                appsMenuButton:
                    document.getElementById(
                        "haldo-main-menu-button"
                    ),
                systemMenuButton:
                    document.getElementById(
                        "haldo-system-menu-button"
                    ),
                aiTopButton:
                    document.getElementById(

                    ),
                starField:

                    ),
                secondMarker:
                    document.getElementById(

                    ),
                minuteMarker:
                    document.getElementById(
                        "haldo-minute-marker"
                    ),
                hourMarker:
                    document.getElementById(
                        "haldo-hour-marker"
                    )
            };

            /*
             * -----------------------------------------------------
             * UTILITIES
             * -----------------------------------------------------
             */

            HD.utils = HD.utils || {};

            HD.utils.clamp = function (
                value,
                min,
                max
            ) {
                return Math.min(
                    max,
                    Math.max(min, value)
                );
            };

            HD.utils.debounce = function (
                fn,
                wait
            ) {
                let timer = null;

                return function (...args) {
                    clearTimeout(timer);

                    timer = setTimeout(
                        function () {
                            fn.apply(
                                this,
                                args
                            );
                        },
                        wait
                    );
                };
            };

            HD.utils.uid = function (
                prefix
            ) {
                return (
                    String(prefix || "haldo") +
                    "-" +
                    Date.now().toString(36) +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2, 9)
                );
            };

            HD.utils.escapeHTML =
                function (value) {
                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );
                };

            HD.utils.isReducedMotion =
                function () {
                    return Boolean(
                        HD.config.display
                            .reducedMotion
                    );
                };

            /*
             * -----------------------------------------------------
             * AI STATE HELPER
             * -----------------------------------------------------
             */

            HD.ai = HD.ai || {};

            HD.ai.setState =
                function (state) {
                    const allowed = new Set([
                        "idle",
                        "listening",
                        "thinking",
                        "speaking",
                        "answering",
                        "happy",
                        "concerned",
                        "working"
                    ]);

                    const next =
                        allowed.has(state)
                            ? state
                            : "idle";

                    HD.state.ai.state = next;

                    if (HD.dom.aiState) {
                        const labels = {
                            idle: "Bereit",
                            listening: "Hört zu",
                            thinking: "Denkt nach",
                            speaking: "Spricht",
                            answering: "Antwortet",
                            happy: "Freude",
                            concerned: "Aufmerksam",
                            working: "Arbeitet"
                        };

                        HD.dom.aiState.textContent =
                            labels[next] ||
                            next;
                    }

                    HD.events.emit(
                        "ai:state",
                        {
                            state: next
                        }
                    );
                };

            /*
             * -----------------------------------------------------
             * INITIAL SHELL EVENTS
             * -----------------------------------------------------
             */

            window.addEventListener(
                "online",
                function () {
                    HD.state.system.online = true;

                    HD.events.emit(
                        "system:online",
                        {
                            online: true
                        }
                    );
                }
            );

            window.addEventListener(
                "offline",
                function () {
                    HD.state.system.online = false;

                    HD.events.emit(
                        "system:offline",
                        {
                            online: false
                        }
                    );
                }
            );

            /*
             * -----------------------------------------------------
             * BASIC TIME DISPLAY
             * -----------------------------------------------------
             */

            function updateBasicTime() {
                const now = new Date();

                HD.state.time.now = now;
                HD.state.time.second =
                    now.getSeconds();
                HD.state.time.minute =
                    now.getMinutes();
                HD.state.time.hour =
                    now.getHours();

                if (HD.dom.timeDisplay) {
                    HD.dom.timeDisplay.textContent =
                        now.toLocaleTimeString(
                            "de-DE",
                            {
                                hour: "2-digit",
                                minute: "2-digit",
                                second: "2-digit"
                            }
                        );
                }
            }

            updateBasicTime();

            setInterval(
                updateBasicTime,
                250
            );

            /*
             * -----------------------------------------------------
             * SHELL READY
             * -----------------------------------------------------
             */

            HD.state.system.ready = true;
            HD.state.system.bootStage =
                "central-shell";

            HD.events.emit(
                "shell:ready",
                {
                    version: HD.version
                }
            );

            HD.events.emit(
                "display:ready",
                {
                    cosmicWorld: true
                }
            );

            console.info(
                "[HalDo AI OS] Central shell initialized.",
                HD.version
            );
        })();

<script>

            handle

            let dragging = false;

            let pointerId = null;

            let startPointerX = 0;
            let startPointerY = 0;

            let startLeft = 0;
            let startTop = 0;

            handle.addEventListener(
                "pointerdown",
                event => {

                    if (
                        record.maximized ||
                        record.minimized
                    ) {
                        return;
                    }

                    if (
                        event.button !== 0 &&
                        event.pointerType !== "touch"
                    ) {
                        return;
                    }

                    dragging = true;

                    pointerId =
                        event.pointerId;

                    startPointerX =
                        event.clientX;

                    startPointerY =
                        event.clientY;

                    startLeft =
                        parseFloat(
                            record.element.style.left

                    startTop =
                        parseFloat(
                            record.element.style.top
                        ) || 0;

                    handle.setPointerCapture(
                        pointerId
                    );

                    windows.focus(
                        record.id
                    );

                    record.element.classList.add(
                        "is-dragging"

                    event.preventDefault();

                "pointermove",
                event => {

                    if (
                        !dragging ||
                        event.pointerId !== pointerId

                        return;

                    const deltaX =
                        event.clientX -
                        startPointerX;

                    const deltaY =
                        event.clientY -
                        startPointerY;

                    const rect =
                        record.element.getBoundingClientRect();

                    const maxLeft =
                        Math.max(
                            0,
                            window.innerWidth -
                            rect.width
                        );

                    const maxTop =
                        Math.max(
                            55,
                            window.innerHeight -
                            rect.height
                        );

                    const nextLeft =
                        Math.min(
                            maxLeft,
                            Math.max(
                                0,
                                startLeft + deltaX
                            )
                        );

                    const nextTop =
                        Math.min(
                            maxTop,
                            Math.max(
                                45,
                                startTop + deltaY
                            )
                        );

                    record.element.style.left =
                        `${nextLeft}px`;

                    record.element.style.top =
                        `${nextTop}px`;
                }
            );

            const stopDragging =
                event => {

                    if (
                        !dragging ||
                        event.pointerId !== pointerId
                    ) {
                        return;
                    }

                    dragging = false;

                    try {
                        handle.releasePointerCapture(
                            pointerId
                        );
                    } catch (_) {
                        /* pointer already released */
                    }

                    pointerId = null;

                    record.element.classList.remove(
                        "is-dragging"
                    );

                    HD.events?.emit(
                        "window:moved",
                        record
                    );
                };

            handle.addEventListener(
                "pointerup",
                stopDragging
            );

            handle.addEventListener(
                "pointercancel",
                stopDragging

    windows.makeResizable =

                        event.clientY -
                        startY;

                        startWidth;

                    let height =
                        startHeight;

                    let left =
                        startLeft;

                        startTop;

                        direction.includes("e")

                        direction.includes("s")

                            deltaX;

                            )

                    record.element.style.height =
                        `${height}px`;

                    record.element.style.left =
                        `${left}px`;

                    record.element.style.top =
                        `${top}px`;

    function keepWindowsInsideViewport() {

        for (const record of windows.registry.values()) {

            if (
                record.maximized ||
                record.minimized
            ) {
                continue;
            }

            const rect =
                record.element.getBoundingClientRect();

            const width =
                Math.min(
                    rect.width,
                    window.innerWidth - 10
                );

            const height =
                Math.min(
                    rect.height,
                    window.innerHeight - 55
                );

            const left =
                Math.max(
                    0,
                    Math.min(
                        rect.left,
                        window.innerWidth -
                        width
                    )
                );

            const top =
                Math.max(
                    45,
                    Math.min(
                        rect.top,
                        window.innerHeight -
                        height
                    )
                );

            record.element.style.width =
                `${width}px`;

            record.element.style.height =
                `${height}px`;

            record.element.style.left =
                `${left}px`;

            record.element.style.top =
                `${top}px`;
        }
    }
